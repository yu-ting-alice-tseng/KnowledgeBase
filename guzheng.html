<style>
  body {
    background-color: #0b0806;
    background-image:
      radial-gradient(at 0% 0%,   rgba(217,119,6,0.08) 0px, transparent 42%),
      radial-gradient(at 100% 0%, rgba(16,185,129,0.05) 0px, transparent 42%),
      radial-gradient(at 50% 100%,rgba(190,60,50,0.05) 0px, transparent 50%);
    background-attachment: fixed;
  }
  .gradient-border { position: relative; }
  .gradient-border::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(to bottom right, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .table-scroll::-webkit-scrollbar { height: 8px; }
  .table-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 8px; }

  /* ── Diagrams ──
     Drawn rather than photographed. The string map and the fingering
     marks are what a student actually reads off a score, so they are
     the honest illustration. */
  .dg { background: #130e0a; border-radius: 1rem; border: 1px solid rgba(148,163,184,0.16); }
  .dg .body   { fill: #5a4028; stroke: #8a6a3c; stroke-width: 3; }
  .dg .top    { fill: #6b4d30; stroke: #a07a44; stroke-width: 2.5; }
  .dg .str    { stroke: #d9c9a3; stroke-width: 2; }
  .dg .str-g  { stroke: #34d399; stroke-width: 3; }
  .dg .bridge { fill: #e8dcc0; stroke: #8a6a3c; stroke-width: 2; }
  .dg .nut    { fill: #c9a85c; stroke: #7a5c20; stroke-width: 2; }
  .dg .hole   { fill: #1a120c; stroke: #8a6a3c; stroke-width: 2; }
  .dg .call   { fill: none; stroke: #38bdf8; stroke-width: 2.5; stroke-dasharray: 6 5; }
  .dg .lab    { fill: #7dd3fc; font-size: 21px; font-weight: 700; font-family: Nunito, sans-serif; }
  .dg .num    { fill: #94a3b8; font-size: 17px; font-family: Nunito, sans-serif; }
  .dg .note   { fill: #fcd34d; font-size: 17px; font-weight: 700; font-family: Nunito, sans-serif; }
  .dg .jp     { fill: #f1f5f9; font-size: 22px; font-weight: 800; font-family: Nunito, sans-serif; }
  .dg .zone   { fill: rgba(148,163,184,0.06); }
  .dg .zlab   { fill: #64748b; font-size: 16px; font-family: Nunito, sans-serif; }

  /* fingering marks */
  .fx { display: block; }
  .fx .k { fill: none; stroke: #fcd34d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .fx .kf{ fill: #fcd34d; }

  .lvl-pill { display:inline-block; padding:.15rem .6rem; border-radius:9999px;
              font-size:.6rem; font-weight:900; letter-spacing:.1em; }
  .reveal { opacity: 0; transform: translateY(12px); }
  .reveal.in { opacity: 1; transform: none;
               transition: opacity .5s ease, transform .5s cubic-bezier(.16,1,.3,1); }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal.in { opacity:1; transform:none; transition:none; }
  }
</style>

<script>
let LANG = 'zh';
function t(o){ if(o==null) return ''; if(typeof o==='string') return o; return o[LANG]||o.en||o.zh||''; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* ═══════════════════════════════════════════════════════════
   The 21 strings of a standard modern guzheng.
   Tuned to the D pentatonic scale, D E F# A B, which is
   1 2 3 5 6 in numbered notation. Lowest string is 21 (D in
   the great octave), highest is 1 (d3). Strings 3, 8, 13 and
   18 are dyed, and they all carry the same degree, 5, an
   octave apart, which is how a player finds their place.
   ═══════════════════════════════════════════════════════════ */
const STRINGS = (function () {
  const cycle = [ {jp:'1', semis:0}, {jp:'2', semis:2}, {jp:'3', semis:4},
                  {jp:'5', semis:7}, {jp:'6', semis:9} ];
  const names = ['D','E','F♯','A','B'];
  const out = [];
  /* built from the low end upward, then numbered downward */
  const octaves = [
    { oct:'D',  dots:-2, zone:'z1' },   /* 大字組    */
    { oct:'d',  dots:-1, zone:'z2' },   /* 小字組    */
    { oct:'d1', dots: 0, zone:'z3' },   /* 小字一組  */
    { oct:'d2', dots: 1, zone:'z4' },   /* 小字二組  */
  ];
  const sup = { 'D':'', 'd':'', 'd1':'1', 'd2':'2' };
  const low = { 'D':true, 'd':false, 'd1':false, 'd2':false };
  octaves.forEach(o => {
    for (let i = 0; i < 5; i++) {
      const nm = low[o.oct] ? names[i] : names[i].toLowerCase().replace('f♯','f♯');
      out.push({ note: (low[o.oct] ? names[i] : names[i].toLowerCase()) + sup[o.oct],
                 jp: cycle[i].jp, dots: o.dots, zone: o.zone });
    }
  });
  out.push({ note:'d3', jp:'1', dots:2, zone:'z5' });
  /* number them: 21 at the bottom of the pile, 1 at the top */
  return out.map((s, i) => {
    const num = out.length - i;
    return Object.assign({ n: num, green: [3,8,13,18].indexOf(num) !== -1 }, s);
  });
})();

const ZONES = {
  z1:{zh:'倍低音區', en:'lowest register', fr:'registre le plus grave'},
  z2:{zh:'低音區',   en:'low register',    fr:'registre grave'},
  z3:{zh:'中音區',   en:'middle register', fr:'registre médium'},
  z4:{zh:'高音區',   en:'high register',   fr:'registre aigu'},
  z5:{zh:'倍高音',   en:'top',             fr:'suraigu'},
};

/* A number in jianpu, with the dots that place it in an octave */
function jpMark(jp, dots, x, y, cls) {
  let g = `<text class="${cls || 'jp'}" x="${x}" y="${y}" text-anchor="middle">${jp}</text>`;
  const r = 3.2;
  if (dots > 0) for (let i = 0; i < dots; i++)
    g += `<circle cx="${x}" cy="${y - 26 - i * 9}" r="${r}" fill="#f1f5f9"/>`;
  if (dots < 0) for (let i = 0; i < -dots; i++)
    g += `<circle cx="${x}" cy="${y + 10 + i * 9}" r="${r}" fill="#f1f5f9"/>`;
  return g;
}

/* ── The string map: the single most useful reference here ── */
function stringMap() {
  const n = STRINGS.length, cw = 47, padL = 74, padR = 26;
  const W = padL + n * cw + padR, H = 330;
  const yTop = 92, yBot = 236;
  const ordered = STRINGS.slice().sort((a, b) => b.n - a.n);   /* low pitch on the left */
  let g = '';
  /* register bands behind the strings */
  let i = 0;
  while (i < ordered.length) {
    let j = i; while (j < ordered.length && ordered[j].zone === ordered[i].zone) j++;
    const x0 = padL + i * cw - cw * 0.45, w = (j - i) * cw;
    g += `<rect class="zone" x="${x0}" y="${yTop - 34}" width="${w}" height="${yBot - yTop + 74}" rx="8"/>`;
    g += `<text class="zlab" x="${x0 + w / 2}" y="${yTop - 44}" text-anchor="middle">${t(ZONES[ordered[i].zone])}</text>`;
    i = j;
  }
  ordered.forEach((s, k) => {
    const x = padL + k * cw;
    g += `<line class="${s.green ? 'str-g' : 'str'}" x1="${x}" y1="${yTop}" x2="${x}" y2="${yBot}"/>`;
    g += `<text class="note" x="${x}" y="${yTop - 12}" text-anchor="middle"`
       + `${s.green ? ' fill="#34d399"' : ''}>${s.note}</text>`;
    g += jpMark(s.jp, s.dots, x, (yTop + yBot) / 2 + 8);
    g += `<text class="num" x="${x}" y="${yBot + 26}" text-anchor="middle"`
       + `${s.green ? ' fill="#34d399"' : ''}>${s.n}</text>`;
  });
  g += `<text class="zlab" x="${padL - 16}" y="${yTop - 12}" text-anchor="end">${t({zh:'音名',en:'pitch',fr:'note'})}</text>`;
  g += `<text class="zlab" x="${padL - 16}" y="${(yTop + yBot) / 2 + 8}" text-anchor="end">${t({zh:'簡譜',en:'jianpu',fr:'chiffré'})}</text>`;
  g += `<text class="zlab" x="${padL - 16}" y="${yBot + 26}" text-anchor="end">${t({zh:'弦序',en:'string',fr:'corde'})}</text>`;
  g += `<text class="zlab" x="${padL}" y="${H - 14}" text-anchor="start">${t({zh:'← 低音（遠離身體）',en:'← low (far side)',fr:'← grave (côté opposé)'})}</text>`;
  g += `<text class="zlab" x="${W - padR}" y="${H - 14}" text-anchor="end">${t({zh:'高音（靠近身體）→',en:'high (near side) →',fr:'aigu (côté joueur) →'})}</text>`;
  return `<svg class="dg w-full" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"`
       + ` aria-label="${esc(t({zh:'古箏二十一弦音位圖',en:'The 21 strings of a guzheng',fr:'Les 21 cordes du guzheng'}))}">${g}</svg>`;
}

/* ── Top view of the instrument, with the parts every lesson names ── */
function anatomy() {
  const L = 118, R = 826, T = 74, B = 246;
  let g = '';
  g += `<path class="body" d="M56 ${T - 16} H880 q26 0 26 26 V${B + 6} q0 26 -26 26 H56 q-22 0 -22 -22 V${T + 6} q0 -22 22 -22 Z"/>`;
  g += `<rect class="top" x="72" y="${T - 4}" width="796" height="${B - T + 8}" rx="10"/>`;
  /* sound holes */
  g += `<ellipse class="hole" cx="200" cy="${(T + B) / 2}" rx="34" ry="13"/>`;
  g += `<ellipse class="hole" cx="700" cy="${(T + B) / 2}" rx="30" ry="12"/>`;
  /* the two fixed nuts */
  g += `<rect class="nut" x="${L - 7}" y="${T - 10}" width="13" height="${B - T + 20}" rx="4"/>`;
  g += `<rect class="nut" x="${R - 6}" y="${T - 10}" width="13" height="${B - T + 20}" rx="4"/>`;
  /* strings and the movable bridges under them, set in the usual curve */
  for (let i = 0; i < 21; i++) {
    const y = T + i * ((B - T) / 20);
    const green = [3, 8, 13, 18].indexOf(21 - i) !== -1;
    g += `<line class="${green ? 'str-g' : 'str'}" x1="${L}" y1="${y}" x2="${R}" y2="${y}"/>`;
    const bx = 300 + Math.pow(i / 20, 0.75) * 250;
    g += `<path class="bridge" d="M${bx} ${y + 9} L${bx + 7} ${y - 9} L${bx + 14} ${y + 9} Z"/>`;
  }
  const call = (x1, y1, x2, y2, tx, ty, label, anchor) =>
      `<path class="call" d="M${x1} ${y1} L${x2} ${y2}"/>`
    + `<text class="lab" x="${tx}" y="${ty}" text-anchor="${anchor || 'middle'}">${label}</text>`;
  g += call(R, T - 12, R + 40, 36, R + 44, 30, t({zh:'前岳山',en:'front nut',fr:'chevalet avant'}), 'start');
  g += call(L, T - 12, L - 40, 36, L - 44, 30, t({zh:'後岳山',en:'back nut',fr:'chevalet arrière'}), 'end');
  g += call(430, 168, 430, 300, 430, 320, t({zh:'箏碼（雁柱），可移動',en:'movable bridges',fr:'chevalets mobiles'}));
  g += call(200, 150, 150, 300, 150, 320, t({zh:'出音孔（實際開在底板）',en:'sound hole (actually on the underside)',fr:'ouïe (en réalité sous la caisse)'}));
  g += call(760, 190, 800, 300, 800, 320, t({zh:'彈弦區（右手）',en:'plucking side (right hand)',fr:'côté pincé (main droite)'}));
  g += call(230, 96, 250, 30, 250, 24, t({zh:'按弦區（左手）',en:'pressing side (left hand)',fr:'côté pressé (main gauche)'}));
  return `<svg class="dg w-full" viewBox="0 0 960 350" preserveAspectRatio="xMidYMid meet" role="img"`

}

/* ── Where 4 and 7 come from: there are no strings for them ── */
function pressDiagram() {
  const rows = [
    { open:'3', openN:'F♯', got:'4', gotN:'G',  d:{zh:'按下三弦，升半音得到 4',   en:'press the 3 string a semitone to get 4', fr:'pressez la corde 3 d’un demi-ton pour obtenir 4'} },
    { open:'6', openN:'B',  got:'7', gotN:'C♯', d:{zh:'按下六弦，升半音得到 7',   en:'press the 6 string a semitone to get 7', fr:'pressez la corde 6 d’un demi-ton pour obtenir 7'} },
  ];
  let g = '';
  rows.forEach((r, i) => {
    const y = 62 + i * 96;
    g += `<line class="str" x1="120" y1="${y}" x2="820" y2="${y}" stroke-width="3"/>`;
    g += `<path class="bridge" d="M470 ${y + 12} L479 ${y - 14} L488 ${y + 12} Z"/>`;
    g += `<text class="note" x="104" y="${y + 6}" text-anchor="end">${r.openN}</text>`;
    g += jpMark(r.open, 0, 560, y - 14);
    /* the press, left of the bridge */
    g += `<path class="call" d="M330 ${y - 34} V${y - 8}"/>`;
    g += `<circle cx="330" cy="${y}" r="9" fill="#38bdf8" opacity="0.85"/>`;
    g += `<text class="lab" x="330" y="${y - 42}" text-anchor="middle">${t({zh:'左手按此處',en:'press here',fr:'presser ici'})}</text>`;
    g += `<path class="call" d="M600 ${y - 10} h60"/>`;
    g += `<text class="note" x="672" y="${y - 4}" fill="#34d399">${r.got} = ${r.gotN}</text>`;
    g += `<text class="zlab" x="120" y="${y + 30}">${t(r.d)}</text>`;
  });
  g += `<text class="zlab" x="479" y="252" text-anchor="middle">${t({zh:'箏碼：右邊彈弦，左邊按弦',en:'the bridge: pluck to its right, press to its left',fr:'le chevalet : on pince à droite, on presse à gauche'})}</text>`;
  return `<svg class="dg w-full" viewBox="0 0 900 268" preserveAspectRatio="xMidYMid meet" role="img"`
       + ` aria-label="${esc(t({zh:'按弦取得 4 與 7 的原理',en:'How pressing produces 4 and 7',fr:'Comment la pression produit 4 et 7'}))}">${g}</svg>`;
}

         en:'The tuning gives only 1 2 3 5 6. There is no string for 4 or 7. Those two notes are made by the left hand pressing the string down on the far side of the bridge, raising its tension: press 3 to get 4, press 6 to get 7. This is not an ornament, it is basic equipment.',
         fr:'L’accord ne donne que 1 2 3 5 6 : aucune corde pour le 4 ni le 7. Ces deux notes s’obtiennent en pressant la corde de l’autre côté du chevalet pour en augmenter la tension : presser 3 donne 4, presser 6 donne 7. Ce n’est pas un ornement, c’est un fondamental.'},
      tip:{zh:'按的深度決定音準，而且每根弦、每台琴都不一樣。唯一的辦法是用耳朵反覆對，不能靠手感記位置。',
           en:'How far you press decides the pitch, and it differs by string and by instrument. The only way is to check it by ear, over and over. Muscle memory for the position will not transfer.',
           fr:'La profondeur de pression décide de la justesse, et elle varie selon la corde et l’instrument. Seule l’oreille peut la régler, encore et encore : la mémoire du geste ne se transpose pas.'} },
    { fx:'up', t:{zh:'上滑音與下滑音', en:'Slides up and down', fr:'Glissés ascendant et descendant'},
      p:{zh:'兩者的差別在順序。上滑音是<strong class="text-white">先彈後按</strong>，聽起來音從本位往上走；下滑音是<strong class="text-white">先按後放</strong>，右手彈的時候弦已經被按住，放開後音往下掉。',
         en:'The difference is the order. A slide up is <strong class="text-white">pluck first, then press</strong>, so the tone climbs from where it started. A slide down is <strong class="text-white">press first, then release</strong>: the string is already pressed when the right hand plucks, and letting go drops the pitch.',
         fr:'La différence tient à l’ordre. Le glissé ascendant, c’est <strong class="text-white">pincer puis presser</strong> : le son monte depuis sa hauteur de départ. Le glissé descendant, c’est <strong class="text-white">presser puis relâcher</strong> : la corde est déjà pressée quand la main droite pince, et le relâchement fait tomber la hauteur.'},
      tip:{zh:'下滑音最容易被忽略，因為譜上看起來只是一個音。漏掉它，河南與潮州的曲子會完全失去味道。',
           en:'The downward slide is the one most often skipped, because on the page it looks like a single note. Leave it out and the Henan and Chaozhou repertoire loses its accent entirely.',
           fr:'Le glissé descendant est le plus souvent omis, car sur la page il ressemble à une simple note. Sans lui, le répertoire du Henan et du Chaozhou perd tout son accent.'} },
    { fx:'chan', t:{zh:'顫音與揉弦', en:'Vibrato', fr:'Vibrato'},
      p:{zh:'左手在弦上輕輕上下按放，讓音產生波動。幅度小而密的是顫音，幅度大而慢的接近揉弦，兩者在不同流派裡輕重差很多。',
         en:'The left hand rocks lightly on the string so the tone waves. Small and fast is a shimmer, wide and slow approaches a true vibrato, and the schools differ sharply in how heavily they use each.',
         fr:'La main gauche oscille légèrement sur la corde pour faire onduler le son. Petit et rapide, c’est un miroitement ; large et lent, cela approche le vrai vibrato. Les écoles en usent très différemment.'},
      tip:{zh:'顫音不是裝飾，是語氣。河南箏的重顫幾乎是另一種音高，用浙江的輕顫去彈河南曲子會顯得很平。',
           en:'Vibrato is not decoration, it is inflection. The heavy Henan shake is almost a different pitch, and playing Henan repertoire with a light Zhejiang shimmer sounds flat.',
           fr:'Le vibrato n’est pas un ornement mais une inflexion. Le tremblement appuyé du Henan est presque une autre hauteur ; jouer ce répertoire avec le miroitement léger du Zhejiang sonne plat.'} },
    { fx:'yao', t:{zh:'搖指', en:'Tremolo', fr:'Trémolo'},
      p:{zh:'拇指在同一根弦上極快來回，把點狀的撥弦變成連續的長音。古箏沒有弓，所有的長音都靠它。',
         en:'The thumb travels back and forth on one string very fast, turning a plucked point into a sustained line. The guzheng has no bow, so every long note is made this way.',
         fr:'Le pouce va et vient très vite sur une même corde, transformant un point pincé en ligne tenue. Le guzheng n’a pas d’archet : toutes les notes longues se font ainsi.'},
      tip:{zh:'搖指要練的是<strong class="text-white">放鬆</strong>，不是速度。手腕僵硬時速度會卡在一個上限，而且撐不過八拍。先求勻，再求久，最後才求快。',
           en:'What tremolo trains is <strong class="text-white">release</strong>, not speed. A stiff wrist hits a ceiling and cannot hold eight beats. Aim first for evenness, then for endurance, and only then for speed.',
           fr:'Le trémolo entraîne le <strong class="text-white">relâchement</strong>, pas la vitesse. Un poignet raide plafonne et ne tient pas huit temps. Cherchez d’abord l’égalité, puis l’endurance, la vitesse en dernier.'} },
    { fx:'gua', t:{zh:'刮奏與花指', en:'Glissando', fr:'Glissando'},
      p:{zh:'順著弦一路刮過去。因為定弦是五聲音階，怎麼刮都不會有不和諧的音，這是古箏最具識別度的聲音。花指是短促的裝飾性刮奏，通常掛在一個主音前面。',
         en:'Sweep along the strings. Because the tuning is pentatonic, no sweep can produce a wrong note, which is why this is the instrument’s signature sound. Huazhi is the brief ornamental version, usually tucked in front of a main note.',
         fr:'Un balayage le long des cordes. L’accord étant pentatonique, aucun balayage ne peut produire de fausse note : c’est la signature sonore de l’instrument. Le huazhi en est la version brève et ornementale, placée juste avant une note principale.'},
      tip:{zh:'刮奏的終點要準確落在目標音上，不能刮過頭再退回來。新手往往只顧著刮得響，忘了它其實是有目的地的。',
           en:'A sweep has to land exactly on its target note, not overshoot and come back. Beginners concentrate on making it loud and forget it has a destination.',
           fr:'Le balayage doit s’arrêter exactement sur sa note cible, sans la dépasser puis revenir. Les débutants s’attachent au volume et oublient qu’il a une destination.'} },
  ] },

{ id:'adv', tone:'red', icon:'fa-fire', n:3,
  t:{zh:'第三部・高階', en:'Part 3 · Advanced', fr:'Partie 3 · Avancé'},
  lead:{zh:'高階的難處不在單一技巧，而在<strong class="text-white">兩隻手要同時做不同的事</strong>，以及在演奏中途改變樂器本身的調。這一部也介紹流派，因為到了這個階段，「彈對音」已經不夠，得知道自己在彈誰的語言。',
        en:'What is hard at this level is not any single technique but <strong class="text-white">making the two hands do different things at once</strong>, and changing the instrument’s own tuning in the middle of a piece. This part also introduces the regional schools, because by now playing the right notes is not enough: you need to know whose language you are speaking.',
        fr:'La difficulté, à ce stade, n’est aucune technique isolée mais <strong class="text-white">faire faire deux choses différentes aux deux mains</strong>, et changer l’accord de l’instrument en pleine pièce. Cette partie présente aussi les écoles régionales : jouer les bonnes notes ne suffit plus, il faut savoir dans quelle langue on parle.'},
  items:[
    { fx:'tiao', t:{zh:'快速指序', en:'Fast finger sequences', fr:'Séquences rapides'},
      p:{zh:'浙江派發展出的固定指法組合，例如「勾托抹托」四音一組循環。把音階拆成固定的手指模式，速度就不再靠反應，而靠肌肉記憶。',
         en:'Fixed finger patterns developed by the Zhejiang school, such as the four-note cycle gou tuo mo tuo. Once a scale is broken into a fixed pattern, speed stops depending on reaction and starts depending on muscle memory.',
         fr:'Des motifs de doigts fixes développés par l’école du Zhejiang, tel le cycle de quatre notes gou tuo mo tuo. Une fois la gamme découpée en motif fixe, la vitesse ne dépend plus du réflexe mais de la mémoire musculaire.'},
      tip:{zh:'練指序要用節拍器，而且要慢到「不可能出錯」的速度起步。快速指序最怕的是把錯誤練熟。',
           en:'Practise these with a metronome, starting slow enough that a mistake is impossible. The real danger with fast patterns is making an error fluent.',
           fr:'Travaillez-les au métronome, en partant assez lentement pour que l’erreur soit impossible. Le vrai danger des motifs rapides est de rendre une faute fluide.'} },
    { fx:'cuo', t:{zh:'雙手配合', en:'The two hands together', fr:'Les deux mains ensemble'},
      p:{zh:'傳統箏曲的左手負責按滑，現代曲目則讓左手也彈旋律或伴奏音型。難處在於左手同時要記住「按弦的位置感」與「撥弦的動作」，兩者用的是完全不同的肌肉習慣。',
         en:'In traditional repertoire the left hand presses and slides; in modern writing it also plays melody or accompaniment figures. The difficulty is that the left hand must then hold both a sense of pressing position and a plucking action, which are quite different physical habits.',
         fr:'Dans le répertoire traditionnel, la main gauche presse et glisse ; dans l’écriture moderne, elle joue aussi mélodie ou accompagnement. La difficulté : elle doit alors tenir à la fois le sens de la pression et le geste du pincement, deux habitudes physiques très différentes.'},
      tip:{zh:'分手練到滾瓜爛熟再合，而且合的時候速度要降到單手的一半以下。急著合手是進度停滯最常見的原因。',
           en:'Get each hand thoroughly secure alone, then put them together at less than half the speed either could manage. Rushing to combine them is the commonest reason progress stalls.',
           fr:'Assurez chaque main séparément, puis réunissez-les à moins de la moitié de la vitesse dont chacune est capable. Vouloir les réunir trop tôt est la première cause de stagnation.'} },
    { fx:'down', t:{zh:'移碼轉調', en:'Changing key by moving bridges', fr:'Changer de tonalité en déplaçant les chevalets'},
      p:{zh:'古箏沒有半音階，換調就得移動箏碼、重新定弦。從 D 調轉 G 調要移動所有的 3（升 F）變成 4（G）那一組弦。有些現代曲目要求在演奏中途移碼，那是另一個層次的挑戰。',
         en:'There is no chromatic scale on a guzheng, so changing key means moving bridges and retuning. Going from D to G means shifting the whole group of strings that were 3 (F♯) so they become 4 (G). Some modern pieces call for moving a bridge mid-performance, which is a challenge of another order.',
         fr:'Le guzheng n’a pas de gamme chromatique : changer de tonalité oblige à déplacer les chevalets et à réaccorder. Passer de ré à sol suppose de décaler tout le groupe de cordes qui faisaient 3 (fa♯) pour qu’elles fassent 4 (sol). Certaines pièces modernes exigent de déplacer un chevalet en cours de jeu, ce qui relève d’un autre ordre de difficulté.'},
      tip:{zh:'移碼之後整台琴的張力會改變，其他弦也會跑音。轉調不是移幾個碼就好，要重新全面檢查。',
           en:'Moving bridges changes the tension across the whole instrument, so other strings drift too. Changing key is not a matter of shifting a few bridges; the whole tuning needs rechecking.',

    { fx:'yao', t:{zh:'長搖與音樂性', en:'Long tremolo and musical line', fr:'Trémolo long et ligne musicale'},
      p:{zh:'到了這裡，搖指不再是「能不能搖得久」，而是要在一個長音裡做出漸強漸弱、音色變化與呼吸。技術層面已經解決，剩下的是音樂。',
         en:'By this point tremolo is no longer about whether you can sustain it, but about shaping a long note with dynamics, changing colour and breath. The technical problem is solved; what remains is music.',
         fr:'À ce stade, le trémolo ne consiste plus à tenir, mais à modeler une note longue par les nuances, le changement de couleur et la respiration. Le problème technique est résolu ; reste la musique.'},
      tip:{zh:'錄下自己的長搖再聽一次。幾乎所有人都會發現自己的搖指是平的，而在演奏當下完全感覺不到。',

           fr:'Enregistrez votre trémolo long et réécoutez-le. Presque tout le monde le découvre plat, et presque personne ne s’en rend compte en jouant.'} },
  ] },

let revealObserver = null;
function armReveals(root) {
  const els = root.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window) ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    els.forEach(e => e.classList.add('in')); return;
  }
  if (!revealObserver) {
    revealObserver = new IntersectionObserver((es, obs) => {
      es.forEach(e => { if (!e.isIntersecting) return;
        setTimeout(() => e.target.classList.add('in'), (+e.target.dataset.i || 0) * 70);
        obs.unobserve(e.target); });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });
  }
  els.forEach((e, i) => { if (!e.classList.contains('in')) { e.dataset.i = i % 5; revealObserver.observe(e); } });
}

 'str.h.press':'So where are 4 and 7?','str.p.press':'There is no string for 4 or for 7. Both are produced entirely by the left hand pressing the string down on the far side of the bridge to raise its tension. This is the most fundamental fact about the instrument, and the first real threshold a beginner meets.',

 'ref.h.school':'The regional schools','ref.p.school':'The Shandong and Zhejiang versions of High Mountains and Flowing Water are two different pieces. What separates the schools is mostly the use of the left hand.',

function ui(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || ''; }

const BTN_ON  = 'px-2.5 py-1 text-xs font-bold rounded-lg transition-all bg-amber-500/15 text-amber-300 border border-amber-500/25';
const BTN_OFF = 'px-2.5 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200';
function setLanguage(lang) {
  if (!I18N[lang]) return;
  LANG = lang;
  try { localStorage.setItem('kb_lang', lang); } catch (e) {}
  ['zh','en','fr'].forEach(l => {
    const b = document.getElementById('lang-' + l);
    if (b) b.className = (l === lang) ? BTN_ON : BTN_OFF;
  });
  document.title = ui('doc.title');
  document.documentElement.lang = (lang === 'zh') ? 'zh-Hant' : lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = ui(el.dataset.i18n); if (v) el.innerHTML = v;
  });
  renderInstrument();
  renderStrings();
  renderLevels();
  renderRef();
  armReveals(document.querySelector('main'));
}
let _l = 'zh';
try { const st = localStorage.getItem('kb_lang'); if (['zh','en','fr'].includes(st)) _l = st; } catch (e) {}
