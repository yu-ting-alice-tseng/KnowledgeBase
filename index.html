<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliotheca · Knowledge Library</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Cormorant+SC:wght@300;400;500;600&family=Nunito:wght@300;400;500;600;700;800&family=Noto+Serif+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens ── */
:root {
  --bg:         #0b0806;
  --bg2:        #100d09;
  --gold:       #c9a85c;
  --gold-hi:    #e8cc84;
  --gold-lo:    rgba(201,168,92,0.40);
  --gold-faint: rgba(201,168,92,0.12);
  --cream:      #ede2cc;
  --cream2:     #b8a48a;
  --muted:      #5e4e38;
  --muted2:     #3a2e20;

  /* glass layers */
  --gl-base:    rgba(255,243,210,0.055);
  --gl-hover:   rgba(255,243,210,0.095);
  --gl-border:  rgba(201,168,92,0.18);
  --gl-border-h:rgba(201,168,92,0.42);
  --gl-shine:   rgba(255,248,220,0.90);
  --gl-fresnel: rgba(255,246,215,0.08);
}

html, body { height: 100%; }

body {
  background: var(--bg);
  font-family: 'Nunito', 'Noto Serif TC', sans-serif;
  color: var(--cream);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ─── Fixed layer stack (z 0-9) ─── */

/* Vignette */
#vignette {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background:
    radial-gradient(ellipse 90% 80% at 50% 40%, transparent 35%, rgba(0,0,0,0.62) 100%),
    radial-gradient(ellipse 60% 50% at 50% 100%, rgba(0,0,0,0.5) 0%, transparent 100%);
}

/* Shelf lines */
#shelves {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    linear-gradient(0deg,
      transparent 0%,
      transparent calc(32vh - 1px),
      rgba(90,62,28,0.13) calc(32vh - 1px),
      rgba(90,62,28,0.13) calc(32vh),
      rgba(50,35,15,0.07) calc(32vh),
      rgba(50,35,15,0.07) calc(32vh + 2px),
      transparent calc(32vh + 2px),
      transparent calc(65vh - 1px),
      rgba(90,62,28,0.10) calc(65vh - 1px),
      rgba(90,62,28,0.10) calc(65vh),
      rgba(50,35,15,0.05) calc(65vh),
      rgba(50,35,15,0.05) calc(65vh + 2px),
      transparent calc(65vh + 2px),
      transparent 100%
    );
}

/* Ambient reading-lamp orbs */
.orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
.o1 { width:900px;height:900px;top:-320px;left:-250px;
      background:radial-gradient(circle,rgba(215,148,35,0.22) 0%,transparent 62%);filter:blur(115px); }
.o2 { width:600px;height:600px;top:-120px;right:-180px;
      background:radial-gradient(circle,rgba(185,112,28,0.14) 0%,transparent 62%);filter:blur(95px); }
.o3 { width:700px;height:700px;bottom:-220px;left:18%;
      background:radial-gradient(circle,rgba(28,72,95,0.16) 0%,transparent 62%);filter:blur(105px); }
.o4 { width:450px;height:450px;bottom:60px;right:-100px;
      background:radial-gradient(circle,rgba(100,50,120,0.09) 0%,transparent 62%);filter:blur(85px); }
.o5 { width:1000px;height:1000px;top:30%;left:42%;transform:translate(-50%,-50%);
      background:radial-gradient(circle,rgba(168,108,22,0.052) 0%,transparent 65%);filter:blur(140px); }

/* Dust motes */
#dust { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
.mote {
  position: absolute;
  width: 2px; height: 2px;
  border-radius: 50%;
  background: rgba(255,235,165,0.55);
  animation: float-up linear infinite;
  will-change: transform, opacity;
}
@keyframes float-up {
  0%   { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
  8%   { opacity: 1; }
  88%  { opacity: 0.6; }
  100% { transform: translateY(-105vh) translateX(var(--dx,20px)) scale(1.2); opacity: 0; }
}

/* ─── Layout ─── */
#wrap { position: relative; z-index: 10; max-width: 1280px; margin: 0 auto; padding: 52px 48px 80px; }
@media(max-width:680px){ #wrap { padding: 36px 20px 60px; } }

/* ─── Header ─── */
#header { text-align: center; margin-bottom: 80px; position: relative; }

/* Monogram seal */
#seal {
  width: 58px; height: 58px; border-radius: 50%;
  background: linear-gradient(145deg, rgba(201,168,92,0.22), rgba(140,100,40,0.12));
  border: 1px solid rgba(201,168,92,0.30);
  box-shadow:
    0 0 0 4px rgba(201,168,92,0.07),
    0 0 0 8px rgba(201,168,92,0.03),
    inset 0 1px 0 rgba(255,238,165,0.28),
    inset 0 -1px 0 rgba(0,0,0,0.25);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 26px;
  font-family: 'Cormorant SC', serif;
  font-size: 20px; font-weight: 500;
  color: var(--gold);
  letter-spacing: 0.05em;
  backdrop-filter: blur(12px);
}

/* Eyebrow */
#eyebrow {
  display: inline-flex; align-items: center; gap: 12px;
  margin-bottom: 22px;
}
#eyebrow span.rule { display: block; width: 32px; height: 1px; background: var(--gold-lo); }
#badge-text {
  font-family: 'Cormorant SC', serif;
  font-size: 11px; font-weight: 400; letter-spacing: 0.25em;
  color: var(--gold-lo);
}

/* Main title */
#main-title {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-style: italic;
  font-size: clamp(62px, 9vw, 108px);
  font-weight: 400;
  line-height: 0.95;
  color: #f2e6ce;
  letter-spacing: -2px;
  margin-bottom: 8px;
}
#main-title .gold-word {
  color: var(--gold);
  font-weight: 300;
  display: block;
  padding-left: 0.12em; /* slight indent for second word */
}

/* Ornamental divider */
.orn-div {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin: 24px auto 20px; max-width: 280px;
}
.orn-div .lr { flex: 1; height: 1px; }
.orn-div .lr-l { background: linear-gradient(to right, transparent, rgba(201,168,92,0.45)); }
.orn-div .lr-r { background: linear-gradient(to left,  transparent, rgba(201,168,92,0.45)); }
.orn-div .gem { color: var(--gold); font-size: 9px; opacity: 0.6; letter-spacing: 0.4em; }

/* Subtitle */
#page-subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; font-style: italic; font-weight: 300;
  color: var(--cream2); line-height: 1.75; letter-spacing: 0.02em;
  max-width: 420px; margin: 0 auto;
}

/* Viewer-bar lang switcher */
#viewer-lang {
  margin-left: auto;
  display: flex; gap: 3px; padding: 4px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(var(--va), 0.2);
  border-radius: 11px;
}
#viewer-lang button {
  padding: 5px 13px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
  border-radius: 7px; border: none; cursor: pointer;
  font-family: 'Nunito', sans-serif; transition: all .22s;
  background: transparent; color: var(--muted);
}
#viewer-lang button:hover { color: var(--cream); }
#viewer-lang button.active { background: rgba(var(--va), 0.22); color: var(--vac); }

/* Lang switcher */
#lang-switch {
  position: absolute; top: 0; right: 0;
  display: flex; gap: 3px; padding: 4px;
  background: rgba(255,242,200,0.038);
  border: 1px solid rgba(201,168,92,0.12);
  border-radius: 11px;
  backdrop-filter: blur(16px);
}
#lang-switch button {
  padding: 5px 13px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
  border-radius: 7px; border: none; cursor: pointer;
  font-family: 'Nunito', sans-serif; transition: all .22s;
  background: transparent; color: var(--muted);
}
#lang-switch button.active { background: rgba(201,168,92,0.18); color: var(--gold); }

/* ─── Collection heading ─── */
#collection-header {
  display: flex; align-items: center; gap: 18px;
  margin-bottom: 32px;
}
#collection-header .col-label {
  font-family: 'Cormorant SC', serif;
  font-size: 11px; font-weight: 400; letter-spacing: 0.30em;
  color: var(--muted); white-space: nowrap;
}
#collection-header .col-rule {
  flex: 1; height: 1px;
  background: linear-gradient(to right, rgba(201,168,92,0.20), transparent);
}
#collection-header .col-count {
  font-size: 10px; font-weight: 700; color: var(--muted2);
  font-family: 'Nunito', sans-serif; letter-spacing: 0.08em;
}

/* ─── Category filter ─── */
#cat-filter {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 7px; margin-bottom: 46px;
}
.cat-chip {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 15px; border-radius: 999px;
  font-family: 'Nunito', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: 0.09em;
  cursor: pointer; transition: all 0.22s;
  background: rgba(255,242,200,0.030);
  border: 1px solid rgba(201,168,92,0.11);
  color: var(--muted);
  backdrop-filter: blur(14px);
}
.cat-chip i { font-size: 9px; opacity: .72; }
.cat-chip:hover { color: var(--cream); border-color: rgba(201,168,92,0.26); background: rgba(255,242,200,0.07); }
.cat-chip.active {
  color: var(--gold); border-color: rgba(201,168,92,0.40);
  background: linear-gradient(135deg, rgba(201,168,92,0.16), rgba(160,125,50,0.10));
  box-shadow: inset 0 1px 0 rgba(255,238,155,0.16), 0 4px 16px rgba(0,0,0,0.28);
}
.cat-chip .chip-n {
  font-size: 9px; font-weight: 800; opacity: .55;
  font-variant-numeric: tabular-nums;
}
.cat-chip.empty { opacity: .34; }
.cat-chip.empty:hover { opacity: .6; }

/* ─── Bookcase ───────────────────────────────────────────────
   One wooden case. Every category is a bay: a dark back panel, the
   volumes standing on the plank below it, and a brass plaque on the
   plank's front edge naming the shelf. */
#shelf-stack { position: relative; padding: 0 24px; }
#shelf-stack::before, #shelf-stack::after {       /* the uprights */
  content: ''; position: absolute; top: -14px; bottom: -4px; width: 24px; z-index: 4;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.35), transparent 30%, rgba(255,220,160,0.06) 50%, transparent 70%, rgba(0,0,0,0.45)),
    repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 7px, rgba(0,0,0,0.08) 7px 9px),
    linear-gradient(90deg, #3a2512, #563719 50%, #2e1c0c);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.55), 0 0 36px rgba(0,0,0,0.65);
  border-radius: 3px;
}
#shelf-stack::before { left: 0; }
#shelf-stack::after  { right: 0; }

.shelf { position: relative; margin: 0; display: grid; grid-template-columns: 1fr 1fr; }
.shelf.single { grid-template-columns: 1fr; }
.bay-unit { position: relative; min-width: 0; }
/* the upright between two bays on the same row */
.bay-unit + .bay-unit .bay::after {
  content: ''; position: absolute; left: -11px; top: 0; bottom: -7px; width: 22px; z-index: 4;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.40), transparent 32%, rgba(255,220,160,0.05) 50%, transparent 68%, rgba(0,0,0,0.45)),
    linear-gradient(90deg, #3a2512, #563719 50%, #2e1c0c);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.55), 0 0 22px rgba(0,0,0,0.6);
}
@media (max-width: 1000px) {
  .shelf { grid-template-columns: 1fr; }
  .bay-unit + .bay-unit .bay::after { display: none; }
}
.bay {
  position: relative; height: 312px; display: flex; align-items: flex-end;
  padding: 0 28px;
  background:
    radial-gradient(ellipse 70% 60% at 50% 100%, rgba(120,80,30,0.10), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 118px, rgba(0,0,0,0.16) 118px 120px),
    linear-gradient(180deg, #070503 0%, #110b07 55%, #1a1109 100%);
  box-shadow:
    inset 0 34px 44px -22px rgba(0,0,0,0.92),     /* the plank above casts down */
    inset 0 -14px 30px -16px rgba(0,0,0,0.75);
}
.books { display: flex; align-items: flex-end; gap: 4px; height: 100%; padding-top: 44px; min-width: 0; }

/* The plank, seen slightly from above: a lit top surface and a shaded front edge */
.plank {
  position: relative; height: 26px; z-index: 3;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px 0 14px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 31px, rgba(0,0,0,0.10) 31px 33px, rgba(0,0,0,0) 33px 67px),
    linear-gradient(180deg, #7a5330 0%, #5c3b1d 22%, #432a12 60%, #2a190a 100%);
  box-shadow:
    0 22px 34px -10px rgba(0,0,0,0.9),
    inset 0 1px 0 rgba(255,222,165,0.28),
    inset 0 -1px 0 rgba(0,0,0,0.65);
  border-radius: 2px;
}
.plank::before {
  content: ''; position: absolute; left: 0; right: 0; top: -7px; height: 7px;
  background: linear-gradient(180deg, #9a6b3e, #7a5330);
  border-radius: 2px 2px 0 0;
  box-shadow: inset 0 1px 0 rgba(255,232,190,0.30);
}
.plank.top { height: 16px; padding: 0; }
.plank.top::before { display: none; }

/* brass plaque on the plank's edge */
.plaque {
  display: flex; align-items: center; gap: 8px; height: 18px; padding: 0 10px;
  border-radius: 3px;
  background: linear-gradient(180deg, #e6c37a 0%, #b08d47 48%, #d2ad63 100%);
  color: #2a1a06;
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-weight: 700; font-size: 12px; letter-spacing: 0.05em; white-space: nowrap;
  box-shadow:
    inset 0 1px 0 rgba(255,246,214,0.75),
    inset 0 -1px 0 rgba(0,0,0,0.40),
    0 1px 3px rgba(0,0,0,0.70);
  text-shadow: 0 1px 0 rgba(255,240,200,0.45);
}
.plaque i { font-size: 9px; opacity: .78; }
.plaque::before, .plaque::after {        /* the two screws */
  content: ''; width: 4px; height: 4px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #6b4d18, #3b2908);
  box-shadow: 0 0 0 1px rgba(255,236,190,0.35);
}
.sh-count {
  font-family: 'Nunito', sans-serif;
  font-size: 9px; font-weight: 800; letter-spacing: 0.12em;
  color: rgba(232,204,132,0.42); white-space: nowrap;
}

/* ─── Search ─── */
#search-wrap { position: relative; max-width: 520px; margin: 0 auto 28px; }
#search-input {
  width: 100%;
  background: rgba(255,242,200,0.042);
  backdrop-filter: blur(32px) saturate(160%);
  border: 1px solid rgba(201,168,92,0.17);
  border-radius: 14px;
  padding: 13px 48px 13px 46px;
  color: var(--cream);
  font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 500;
  outline: none; transition: all 0.25s;
  box-shadow: inset 0 1px 0 rgba(255,235,160,0.10), 0 6px 22px rgba(0,0,0,0.25);
}
#search-input::placeholder { color: var(--muted); font-style: italic; }
#search-input:focus {
  border-color: rgba(201,168,92,0.40);
  background: rgba(255,242,200,0.072);
  box-shadow: 0 0 0 3px rgba(201,168,92,0.09),
              inset 0 1px 0 rgba(255,235,160,0.15),
              0 6px 22px rgba(0,0,0,0.25);
}
#search-icon { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; pointer-events: none; }
#search-clear { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; cursor: pointer; display: none; transition: color .2s; }
#search-clear:hover { color: var(--cream); }

/* ─── Toolbar ─── */
#toolbar { display: flex; justify-content: center; gap: 8px; margin-bottom: 52px; }
.tool-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 18px; border-radius: 11px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase;
  cursor: pointer; transition: all 0.22s;
  font-family: 'Nunito', sans-serif;
  background: rgba(255,242,200,0.036);
  border: 1px solid rgba(201,168,92,0.12);
  color: var(--muted);
  backdrop-filter: blur(14px);
  box-shadow: inset 0 1px 0 rgba(255,235,160,0.06);
}
.tool-btn:hover { color: var(--cream); border-color: rgba(201,168,92,0.28); background: rgba(255,242,200,0.08); }
.tool-btn.active { background: rgba(239,68,68,0.09); border-color: rgba(239,68,68,0.26); color: #f87171; }
#upload-btn { color: var(--gold-lo); border-color: rgba(201,168,92,0.16); }
#upload-btn:hover { color: var(--gold); border-color: rgba(201,168,92,0.38); background: rgba(201,168,92,0.07); }

/* ─── A volume on the shelf: the spine ─── */
.book {
  --w: 68px; --h: 240px; --lean: 0deg; --k: 1;
  position: relative; flex: 0 1 auto; min-width: 0;   /* a crowded shelf squeezes its spines rather than spilling */
  width: calc(var(--w) * var(--k)); height: calc(var(--h) * var(--k));
  border-radius: 2px 5px 5px 2px;
  cursor: pointer; outline: none;
  transform-origin: bottom center;
  transform: rotate(var(--lean));
  background:
    /* rounded spine: shadow in the hinge, a highlight down the middle */
    linear-gradient(90deg,
      rgba(0,0,0,0.46) 0%, rgba(0,0,0,0.12) 9%, rgba(255,255,255,0.12) 20%,
      rgba(255,255,255,0.00) 38%, rgba(0,0,0,0.04) 68%, rgba(0,0,0,0.40) 100%),
    /* cloth grain */
    repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, rgba(0,0,0,0.03) 1px 3px),
    var(--spine);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,0.28),
    inset 0 2px 0 rgba(255,255,255,0.18),
    inset 0 -2px 0 rgba(0,0,0,0.40),
    2px 0 0 rgba(0,0,0,0.35),
    0 12px 18px -8px rgba(0,0,0,0.85);
  transition:
    transform 0.42s cubic-bezier(0.34,1.3,0.64,1),
    box-shadow 0.35s ease, filter 0.35s ease;
  animation: book-in 0.55s cubic-bezier(0.22,1,0.36,1) backwards;
}
@keyframes book-in {
  from { opacity: 0; transform: translateY(28px) rotate(var(--lean)); }
  to   { opacity: 1; transform: translateY(0)    rotate(var(--lean)); }
}
/* gilt bands near the head and tail */
.book::before, .book::after {
  content: ''; position: absolute; left: 7px; right: 7px; height: 4px;
  border-top: 1px solid rgba(240,214,140,0.62);
  border-bottom: 1px solid rgba(240,214,140,0.62);
  pointer-events: none;
}
.book::before { top: 9px; }
.book::after  { bottom: 30px; }
.book-ico {
  position: absolute; top: 21px; left: 50%; transform: translateX(-50%);
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: rgba(255,246,222,0.92);
  background: rgba(0,0,0,0.30);
  box-shadow: inset 0 0 0 1px rgba(240,214,140,0.50);
}
.book-title {
  position: absolute; top: 50px; bottom: 42px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.book-title span {
  writing-mode: vertical-rl; text-orientation: mixed;
  max-height: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-weight: 600; font-size: 15px; letter-spacing: 0.08em;
  color: #f8efd9;
  text-shadow: 0 1px 1px rgba(0,0,0,0.65), 0 0 8px rgba(0,0,0,0.35);
}
.book-num {
  position: absolute; bottom: 11px; left: 0; right: 0; text-align: center;
  font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.12em;
  color: rgba(246,228,176,0.88);
}
.book:hover, .book:focus-visible {
  transform: translateY(-20px) rotate(var(--lean)) scale(1.02);
  z-index: 6; filter: brightness(1.12) saturate(1.05);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,0.28),
    inset 0 2px 0 rgba(255,255,255,0.22),
    inset 0 -2px 0 rgba(0,0,0,0.40),
    2px 0 0 rgba(0,0,0,0.35),
    0 30px 40px -12px rgba(0,0,0,0.95),
    0 0 44px var(--glow);
}
@media (max-width: 640px) { .book { --k: 0.76; } .bay { padding: 0 18px; } }
@media (max-width: 480px) { .book { --k: 0.66; } .book-title span { font-size: 12px; } .book-ico { width: 18px; height: 18px; top: 16px; font-size: 8px; } .book-title { top: 40px; bottom: 36px; } .bay { padding: 0 12px; height: 270px; } .books { gap: 3px; } }

/* ─── Detail slip: floats above the book under the pointer ─── */
#book-tip {
  position: fixed; z-index: 60; width: 300px; max-width: calc(100vw - 24px);
  pointer-events: none; opacity: 0; transform: translateY(8px);
  transition: opacity 0.22s ease, transform 0.22s ease;
  background: rgba(16,12,8,0.93);
  backdrop-filter: blur(26px) saturate(160%);
  border: 1px solid rgba(201,168,92,0.30);
  border-radius: 14px; padding: 18px 20px 16px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.72), inset 0 1px 0 rgba(255,242,170,0.26);
}
#book-tip.on { opacity: 1; transform: translateY(0); }
#book-tip .tip-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
#book-tip .icon-box { width: 38px; height: 38px; border-radius: 11px; font-size: 15px; }

/* Icon box */
.icon-box {
  position: relative;
  width: 50px; height: 50px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; color: #fff;
  box-shadow: 0 8px 28px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.24);
  flex-shrink: 0;
}
.icon-box::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(145deg, rgba(255,255,255,0.28) 0%, transparent 55%);
  pointer-events: none;
}

/* Roman numeral chapter marker */
.chapter-num {
  font-family: 'Cormorant SC', serif;
  font-size: 11px; font-weight: 400; letter-spacing: 0.15em;
  color: var(--gold-lo);
}

/* Card title */
.card-title {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-size: 22px; font-weight: 600;
  color: #f3e9d6; letter-spacing: -0.3px; line-height: 1.18;
  margin-bottom: 5px;
}

/* Card subtitle tag */
.card-tag {
  font-size: 9px; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; color: rgba(201,168,92,0.52);
  font-family: 'Nunito', sans-serif;
}

/* Ruled separator */
.ruled-sep {
  height: 1px;
  background: linear-gradient(90deg, rgba(201,168,92,0.30), rgba(201,168,92,0.10), transparent);
  margin: 14px 0;
}

/* Description */
.card-desc {
  color: var(--muted); font-size: 13px; line-height: 1.70; font-weight: 500;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

/* Status pill */
.status-pill { display: flex; align-items: center; gap: 6px; margin-top: 20px;
  font-size: 9px; font-weight: 800; letter-spacing: 0.10em;
  text-transform: uppercase; color: var(--muted2); }
.pulse-dot { width: 5px; height: 5px; border-radius: 50%; animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.42;transform:scale(0.78);} }

/* Delete btn (edit mode): sits on the head of the book */
.delete-btn {
  display: none; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(239,68,68,0.11); border: 1px solid rgba(239,68,68,0.28);
  color: #f87171; font-size: 10px;
  align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.18s; z-index: 20;
}
.delete-btn:hover { background: rgba(239,68,68,0.35); color: #fff; transform: translateX(-50%) scale(1.1); }
body.edit-mode .delete-btn { display: flex; }
body.edit-mode .book { cursor: default; }
body.edit-mode .book:hover { transform: rotate(var(--lean)) !important; filter: none; }

/* ─── No results ─── */
#no-results {
  display: none; grid-column: 1/-1; text-align: center;
  color: var(--muted); padding: 72px 0;
}

/* ─── Add modal ─── */
#add-modal {
  display: none; position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.74); backdrop-filter: blur(16px);
  align-items: center; justify-content: center;
}
#add-modal.open { display: flex; }
#modal-box {
  background: rgba(13,10,7,0.93);
  backdrop-filter: blur(52px) saturate(180%);
  border: 1px solid rgba(201,168,92,0.18);
  border-radius: 22px; padding: 40px;
  width: 100%; max-width: 460px; position: relative;
  box-shadow: 0 70px 160px rgba(0,0,0,0.80),
              inset 0 1.5px 0 rgba(255,238,160,0.20);
}
#modal-box::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,242,185,0.04) 0%, transparent 50%);
  pointer-events: none;
}
#modal-box::after {
  content: ''; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,238,155,0.52) 50%, transparent);
}
.modal-label {
  display: block; font-size: 9px; font-weight: 800;
  letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px;
}
.modal-input {
  width: 100%; background: rgba(255,242,200,0.038); border: 1px solid rgba(201,168,92,0.13);
  border-radius: 10px; padding: 10px 14px; color: var(--cream);
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 500;
  outline: none; transition: all .2s; margin-bottom: 16px;
  box-shadow: inset 0 1px 0 rgba(255,235,160,0.06);
}
.modal-input:focus { border-color: rgba(201,168,92,0.38); background: rgba(255,242,200,0.07); }
#drop-zone {
  border: 1.5px dashed rgba(201,168,92,0.24); border-radius: 14px;
  padding: 28px; text-align: center; color: var(--muted);
  cursor: pointer; transition: all 0.22s; margin-bottom: 20px;
  font-size: 13px; font-weight: 500; background: rgba(201,168,92,0.022);
}
#drop-zone:hover, #drop-zone.dragging {
  border-color: rgba(201,168,92,0.50); color: var(--cream); background: rgba(201,168,92,0.06);
}
#drop-zone .file-chosen { color: var(--gold); font-weight: 700; }
.color-opts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.color-opt {
  width: 28px; height: 28px; border-radius: 8px;
  cursor: pointer; border: 2px solid transparent; transition: all .16s;
}
.color-opt.selected { border-color: rgba(255,255,255,0.78); transform: scale(1.18); box-shadow: 0 0 10px rgba(255,255,255,0.18); }

/* ─── Book-opening transition ───────────────────────────────
   An old tome raised out of a dark room: the shelf dims, a warm
   light gathers, the volume turns from spine to front board, a cloth cover tooled in
   leather, and the cover swings fully open onto aged parchment.
   Only transform and opacity are animated: everything textural
   is painted once and composited. */
#book-fx {
  position: fixed; inset: 0; z-index: 99;
  pointer-events: none; display: none;
  overflow: hidden;          /* cover swings past the edge: never spawn scrollbars */
  perspective: 2200px;
}
#book-fx.on { display: block; }

/* the room recedes */
.bk-veil {
  position: fixed; inset: 0; opacity: 0; will-change: opacity;
  background:
    radial-gradient(ellipse 46% 46% at 50% 50%, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.80) 62%, rgba(0,0,0,0.93) 100%);
}
/* candle-light gathering behind the book */
.bk-halo {
  position: fixed; left: 50%; top: 50%; width: 78vmin; height: 78vmin;
  margin: -39vmin 0 0 -39vmin; opacity: 0; will-change: opacity, transform;
  background: radial-gradient(circle, rgba(226,176,74,0.19) 0%, rgba(180,120,40,0.07) 42%, transparent 70%);
  filter: blur(28px);
}

.bk { position: fixed; transform-style: preserve-3d; will-change: transform, opacity; }
.bk-inner { position: absolute; inset: 0; transform-style: preserve-3d; }

/* ── the page block: aged parchment, dimly lit ── */
.bk-pages {
  position: absolute; inset: 0; border-radius: 4px 14px 14px 4px; overflow: hidden;
  background:
    /* foxing and age spots */
    radial-gradient(ellipse 13% 8% at 74% 22%, rgba(96,62,24,0.34), transparent 68%),
    radial-gradient(ellipse 9% 6% at 57% 70%, rgba(104,68,28,0.30), transparent 68%),
    radial-gradient(ellipse 17% 10% at 88% 61%, rgba(88,56,20,0.30), transparent 70%),
    radial-gradient(ellipse 11% 7% at 66% 43%, rgba(110,74,32,0.22), transparent 68%),
    radial-gradient(ellipse 20% 13% at 34% 82%, rgba(84,54,20,0.26), transparent 72%),
    /* candle falling on the open page: a pool, not a wash */
    radial-gradient(ellipse 48% 40% at 65% 31%, rgba(255,226,164,0.26), transparent 72%),
    /* the page darkens hard toward its edges */
    radial-gradient(ellipse 88% 88% at 63% 42%, transparent 22%, rgba(30,17,5,0.78) 100%),
    linear-gradient(101deg, #3f341f 0%, #7d6c48 15%, #9c8a60 40%, #8d7c54 68%, #5b4c30 100%);
  box-shadow:
    inset 52px 0 66px -38px rgba(24,14,4,0.92),   /* gutter shadow at the spine */
    inset -10px 0 26px -14px rgba(60,40,16,0.55),
    0 52px 110px rgba(0,0,0,0.78);
}
/* gilded fore-edge */
.bk-pages::after {
  content: ''; position: absolute; top: 3%; bottom: 3%; right: 0; width: 7px;
  background: linear-gradient(90deg, rgba(201,168,92,0) 0%, rgba(206,172,96,0.62) 45%, rgba(112,82,32,0.92) 100%);
}
/* stacked page edges, so the block has thickness rather than reading as a panel */
.bk-pages::before {
  content: ''; position: absolute; left: 4%; right: 0; bottom: 0; height: 9px; z-index: 2;
  background:
    linear-gradient(180deg, rgba(30,17,5,0.55), transparent 40%),
    repeating-linear-gradient(180deg,
      rgba(196,176,132,0.85) 0 1.5px, rgba(74,54,26,0.55) 1.5px 3px);
}
.bk-lines {
  position: absolute; inset: 17% 13% 20% 20%;
  opacity: 0.34;
  background: repeating-linear-gradient(
    180deg, transparent 0 10px, rgba(74,50,20,0.85) 10px 11px);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 84%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 12%, #000 84%, transparent);
}
/* an illuminated initial and a rule, so it reads as a manuscript at a glance */
.bk-illum {
  position: absolute; left: 21%; top: 15%; width: 13%; height: 13%;
  border: 1px solid rgba(150,112,42,0.65); border-radius: 2px;
  background: linear-gradient(150deg, rgba(190,54,44,0.42), rgba(120,32,26,0.30));
  box-shadow: inset 0 0 0 2px rgba(214,182,104,0.40);
}
.bk-rule {
  position: absolute; left: 21%; right: 15%; top: 32%; height: 1px;
  background: linear-gradient(90deg, rgba(150,112,42,0.7), rgba(150,112,42,0.15) 70%, transparent);
}
.bk-glow {
  position: absolute; inset: 0; opacity: 0; will-change: opacity;
  background: radial-gradient(ellipse 54% 44% at 64% 32%, rgba(255,238,196,0.22), transparent 72%);
}

/* a single leaf that turns after the cover, for the riffle */
.bk-leaf {
  position: absolute; inset: 0; border-radius: 3px 12px 12px 3px;
  transform-origin: left center; transform-style: preserve-3d;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  will-change: transform;
  background:
    radial-gradient(ellipse 60% 50% at 62% 36%, rgba(255,236,186,0.22), transparent 70%),
    linear-gradient(101deg, #7a6845 0%, #c0ad84 30%, #d3c29c 62%, #a89168 100%);
  box-shadow: inset 40px 0 50px -34px rgba(24,14,4,0.85), 6px 0 18px rgba(0,0,0,0.35);
}

/* ── the cover: two-sided, hinged on its left edge ── */
.bk-cover {
  position: absolute; inset: 0;
  transform-origin: left center;
  transform-style: preserve-3d;
  will-change: transform;
}
/* the spine, standing at the hinge and reaching back into the book's thickness;
   it is what faces the reader while the volume is still on the shelf */
.bk-spine3d {
  position: absolute; left: 0; top: 0; height: 100%;
  transform-origin: left center;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.bk-face {
  position: absolute; inset: 0;
  border-radius: 18px; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
/* the front board: cloth in the volume's colour, a tooled gilt frame, the title */
.bk-art {
  position: absolute; inset: 0; border-radius: 3px 14px 14px 3px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 14% 12% 18% 16%; text-align: center; color: #f7eed8;
  background:
    radial-gradient(ellipse 70% 55% at 50% 28%, rgba(255,255,255,0.16), transparent 70%),
    linear-gradient(90deg, rgba(0,0,0,0.58) 0%, rgba(0,0,0,0.18) 8%, transparent 15%),
    linear-gradient(135deg, rgba(0,0,0,0.22), transparent 45%, rgba(0,0,0,0.50)),
    repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, rgba(0,0,0,0.03) 1px 3px),
    var(--spine);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
}
.bk-art::before {                 /* gilt double rule tooled into the board */
  content: ''; position: absolute; inset: 6% 7% 6% 13%;
  border: 1px solid rgba(240,214,140,0.62); border-radius: 3px;
  box-shadow: inset 0 0 0 3px rgba(0,0,0,0.26), inset 0 0 0 4px rgba(240,214,140,0.30);
}
.bk-art-ico {
  width: 34px; height: 34px; border-radius: 50%; margin-bottom: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #f3e4bf; background: rgba(0,0,0,0.28);
  border: 1px solid rgba(240,214,140,0.62);
}
.bk-art-title {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-size: 16px; font-weight: 700; line-height: 1.22; color: #f8efd9;
  text-shadow: 0 1px 2px rgba(0,0,0,0.65);
}
.bk-art-sub {
  margin-top: 5px; font-size: 6.5px; font-weight: 800; letter-spacing: 0.16em;
  text-transform: uppercase; color: rgba(246,228,176,0.82);
}
.bk-art-num {
  position: absolute; bottom: 10%; left: 13%; right: 7%; text-align: center;
  font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.22em;
  color: rgba(246,228,176,0.88);
}
.bk-back {
  transform: rotateY(180deg);
  background:
    radial-gradient(ellipse 66% 56% at 46% 32%, rgba(196,148,68,0.20), transparent 72%),
    linear-gradient(100deg, #2b2118 0%, #453422 52%, #221a11 100%);
  box-shadow: inset 0 0 70px rgba(0,0,0,0.62);
}
.bk-back::after {              /* marbled endpaper on the inside of the cover */
  content: ''; position: absolute; inset: 11%;
  border: 1px solid rgba(201,168,92,0.20); border-radius: 4px;
  background:
    repeating-linear-gradient(114deg,
      rgba(186,140,64,0.22) 0 5px, rgba(58,38,16,0.26) 5px 11px, rgba(140,98,44,0.16) 11px 19px),
    radial-gradient(ellipse 70% 60% at 40% 34%, rgba(214,176,104,0.16), transparent 70%),
    linear-gradient(160deg, rgba(201,168,92,0.12), transparent 62%);
}

/* ─── Module viewer ─── */
#module-viewer {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: var(--bg); animation: slide-up 0.42s cubic-bezier(0.4,0,0.2,1);
}
#module-viewer.from-book { animation: viewer-fade 0.36s cubic-bezier(0.4,0,0.6,1); }
@keyframes viewer-fade { from{opacity:0;} to{opacity:1;} }
#viewer-bar {
  --va: 201,168,92;           /* 依模組主色調整（JS 設定） */
  --vac: #e8cc84;
  position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 101;
  display: flex; align-items: center; padding: 0 18px;
  background:
    linear-gradient(180deg, rgba(var(--va), 0.13), rgba(var(--va), 0.04)),
    rgba(8,7,9,0.94);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(var(--va), 0.24);
  transition: border-color .4s;
}
.vback {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 18px 9px 13px; border-radius: 22px;
  border: 1px solid rgba(var(--va), 0.26);
  background: rgba(255,255,255,0.03);
  color: var(--cream2);
  font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: all .2s; font-family: 'Nunito', sans-serif;
}
.vback:hover { color: var(--cream); border-color: rgba(var(--va), 0.55); }
@keyframes slide-up { from{transform:translateY(8%);opacity:0;} to{transform:translateY(0);opacity:1;} }

/* ─── Footer ─── */
#footer {
  margin-top: 96px; padding-top: 26px;
  border-top: 1px solid rgba(201,168,92,0.09);
  text-align: center;
}
.footer-orn { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
.footer-orn .fl { width: 44px; height: 1px; background: linear-gradient(to right,transparent,rgba(201,168,92,0.28)); }
.footer-orn .fr { width: 44px; height: 1px; background: linear-gradient(to left,transparent,rgba(201,168,92,0.28)); }
.footer-orn .fg { color: var(--gold); font-size: 8px; opacity: 0.38; }
#footer-text { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(201,168,92,0.15); border-radius: 10px; }

/* ─── Focus ─── */
:focus-visible { outline: 2px solid rgba(201,168,92,0.58); outline-offset: 2px; border-radius: 6px; }
button:focus-visible { outline: 2px solid rgba(201,168,92,0.58); outline-offset: 3px; border-radius: 10px; }

/* ─── Reduced motion ─── */
@media(prefers-reduced-motion:reduce) {
  .book, .tool-btn { transition: none !important; animation: none !important; }
  .book:hover { transform: rotate(var(--lean)) !important; }
  .mote { animation: none !important; }
  @keyframes pulse{0%,100%{opacity:1;}}
}
</style>
</head>
<body>

<!-- Fixed ambient layers -->
<div id="vignette"></div>
<div id="shelves"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="orb o4"></div>
<div class="orb o5"></div>

<!-- Dust mote container (populated by JS) -->
<div id="dust"></div>

<!-- ── Main content ── -->
<div id="wrap">

  <!-- Header -->
  <header id="header">

    <!-- Language switcher -->
    <div id="lang-switch">
      <button onclick="switchLang('zh')" id="idx-zh" class="active">繁中</button>
      <button onclick="switchLang('en')" id="idx-en">EN</button>
      <button onclick="switchLang('fr')" id="idx-fr">FR</button>
    </div>

    <!-- Monogram seal -->
    <div id="seal">B</div>

    <!-- Eyebrow -->
    <div id="eyebrow">
      <span class="rule"></span>
      <span id="badge-text">個人知識庫</span>
      <span class="rule"></span>
    </div>

    <!-- Title -->
    <h1 id="main-title">
      Knowledge
      <span class="gold-word">Library</span>
    </h1>

    <!-- Ornamental rule -->
    <div class="orn-div">
      <div class="lr lr-l"></div>
      <span class="gem">✦</span>
      <div class="lr lr-r"></div>
    </div>

    <!-- Subtitle -->
    <p id="page-subtitle">跨領域研究、心智圖與互動工具的精選庫</p>
  </header>

  <!-- Search -->
  <div id="search-wrap">
    <i class="fa-solid fa-magnifying-glass" id="search-icon"></i>
    <input id="search-input" type="text" placeholder="Search the collection…"
           oninput="handleSearch(this.value)">
    <i class="fa-solid fa-xmark" id="search-clear" onclick="clearSearch()"
       role="button" tabindex="0"
       onkeydown="if(event.key==='Enter'||event.key===' ')clearSearch()"></i>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tool-btn" id="upload-btn" onclick="openAddModal()">
      <i class="fa-solid fa-plus"></i> <span id="add-btn-text">新增模組</span>
    </button>
    <button class="tool-btn" id="edit-toggle" onclick="toggleEditMode()">
      <i class="fa-solid fa-pen-to-square"></i> <span id="edit-btn-text">編輯</span>
    </button>
  </div>

  <!-- Collection heading -->
  <div id="collection-header">
    <span class="col-label">Collection</span>
    <div class="col-rule"></div>
    <span class="col-count" id="col-count">,  5 volumes</span>
  </div>

  <!-- Category filter -->
  <div id="cat-filter"></div>

  <!-- Shelves (one grid per category): note: #shelves is taken by the
       fixed decorative shelf-line layer, so this container uses its own id -->
  <div id="shelf-stack"></div>
  <div id="book-tip" role="tooltip" aria-hidden="true"></div>

  <div id="no-results">
    <i class="fa-solid fa-book-open-reader"
       style="font-size:36px;margin-bottom:16px;display:block;opacity:.18;"></i>
    <span id="no-results-text"
          style="font-size:14px;font-style:italic;font-family:'Cormorant Garamond',serif;">
      找不到符合的館藏。
    </span>
  </div>

  <!-- Footer -->
  <footer id="footer">
    <div class="footer-orn">
      <div class="fl"></div>
      <span class="fg">✦</span>
      <div class="fr"></div>
    </div>
    <span id="footer-text">© 2026 個人知識庫 · 互動智識架構</span>
  </footer>
</div><!-- /#wrap -->

<!-- Book-opening animation layer -->
<div id="book-fx" aria-hidden="true"></div>

<!-- Full-screen Viewer -->
<div id="module-viewer">
  <div id="viewer-bar">
    <button class="vback" onclick="closeViewer()" aria-label="Back to library">
      <i class="fa-solid fa-chevron-left" style="font-size:9px;"></i> Back

(function() {

const REMOVED_KEY = 'knowledge_galaxy_removed_builtins';
function loadModules() {
  // Built-in modules always come fresh from DEFAULT_MODULES (so renames/updates in code
  // take effect immediately): only user-uploaded custom modules are read from storage.
  // Built-ins the user explicitly deleted stay hidden via REMOVED_KEY.
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    const stored = s ? JSON.parse(s) : [];
    const customOnly = stored.filter(m => m.custom);
    const removedIds = JSON.parse(localStorage.getItem(REMOVED_KEY) || '[]');
    const builtins = DEFAULT_MODULES.filter(m => !removedIds.includes(m.id));
    return [...builtins, ...customOnly];
  } catch { return DEFAULT_MODULES; }
}
function saveModules() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(modules));
  const removedIds = DEFAULT_MODULES.filter(d => !modules.some(m => m.id===d.id)).map(d => d.id);
  localStorage.setItem(REMOVED_KEY, JSON.stringify(removedIds));
}

const CAT_KEY = 'knowledge_galaxy_category';

let modules     = loadModules();
let searchQuery = '';
let editMode    = false;
let pendingURL  = null;
let selColor    = 'from-violet-400 to-indigo-600';
let selCat      = 'humanities';
let activeCat   = localStorage.getItem(CAT_KEY) || 'all';
if (activeCat !== 'all' && !CATEGORIES.some(c => c.id === activeCat)) activeCat = 'all';

/* ─── Render shelves ─── */
function matchesSearch(m) {
  const q = searchQuery.toLowerCase();
  return !q ||
    [m.title, m.subtitle, m.description].some(v =>
      (v && typeof v === 'object' ? Object.values(v).join(' ') : (v || '')).toLowerCase().includes(q));
}
/* A volume keeps its numeral wherever it is shelved, filtered or searched. */
function romanOf(mod) {
  const i = modules.findIndex(m => m.id === mod.id);
  return ROMAN[i] || String(i+1);
}
function catOf(mod) {
  return CATEGORIES.some(c => c.id === mod.cat) ? mod.cat : 'custom';
}

function renderGrid() {
  const shelves = document.getElementById('shelf-stack');
  const noRes   = document.getElementById('no-results');
  const shown   = modules.filter(matchesSearch);

  /* update total count */
  const cnt = document.getElementById('col-count');
  if (cnt) cnt.textContent = `,  ${shown.length} ${UI[currentLang].volumes}`;

  renderCatFilter(shown);

  shelves.innerHTML = '';
  hideTip();
  let visible = 0, animIdx = 0;

  /* the bays that have something on them, two to a row */
  const bays = CATEGORIES
    .filter(cat => activeCat === 'all' || activeCat === cat.id)
    .map(cat => ({ cat, inCat: shown.filter(m => catOf(m) === cat.id) }))
    .filter(b => b.inCat.length);

  if (bays.length) {                      /* the top board of the case */
    const top = document.createElement('div');
    top.className = 'plank top';
    shelves.appendChild(top);
  }

  for (let i = 0; i < bays.length; i += 2) {
    const pair = bays.slice(i, i + 2);
    const shelf = document.createElement('section');
    shelf.className = 'shelf' + (pair.length === 1 ? ' single' : '');
    pair.forEach(({ cat, inCat }) => {
      visible += inCat.length;
      const unit = document.createElement('div');
      unit.className = 'bay-unit';
      unit.dataset.cat = cat.id;
      unit.innerHTML = `
        <div class="bay"><div class="books"></div></div>
        <div class="plank">
          <span class="plaque"><i class="fa-solid ${cat.icon}"></i><span>${catLabel(cat)}</span></span>
          <span class="sh-count">${inCat.length} ${UI[currentLang].volumes}</span>
        </div>`;
      const row = unit.querySelector('.books');
      inCat.forEach((mod, k) => {
        /* the last volume on a fuller shelf leans against its neighbour */
        const lean = (inCat.length >= 3 && k === inCat.length - 1) ? -6 : 0;
        row.appendChild(buildBook(mod, animIdx++, lean));
      });
      shelf.appendChild(unit);
    });
    shelves.appendChild(shelf);
  }

  noRes.style.display = visible ? 'none' : 'block';
}

/* ─── Category filter chips ─── */
function renderCatFilter(shown) {
  const bar = document.getElementById('cat-filter');
  if (!bar) return;
  const used = CATEGORIES.filter(c => modules.some(m => catOf(m) === c.id));

  const chip = (id, icon, label, n, active) =>
    `<button class="cat-chip${active?' active':''}${n?'':' empty'}" onclick="setCategory('${id}')"
             aria-pressed="${active}">
       <i class="fa-solid ${icon}"></i><span>${label}</span><span class="chip-n">${n}</span>
     </button>`;

  bar.innerHTML =
    chip('all', 'fa-layer-group', UI[currentLang].allCat, shown.length, activeCat === 'all') +
    used.map(c => chip(c.id, c.icon, catLabel(c),
                       shown.filter(m => catOf(m) === c.id).length,
                       activeCat === c.id)).join('');
}

function setCategory(id) {
  activeCat = (activeCat === id && id !== 'all') ? 'all' : id;
  localStorage.setItem(CAT_KEY, activeCat);

}

/* ─── A volume on the shelf ─── */
function hashOf(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h;
}
function buildBook(mod, animIdx, lean) {
  const book = document.createElement('div');
  book.className = 'book';
  book.dataset.id = mod.id;
  const h = hashOf(String(mod.id));
  book.style.setProperty('--w', (66 + h % 27) + 'px');
  book.style.setProperty('--h', (224 + (h >>> 5) % 40) + 'px');
  book.style.setProperty('--lean', lean + 'deg');
  book.style.setProperty('--spine', SPINE[mod.color] || SPINE['from-violet-400 to-indigo-600']);
  book.style.setProperty('--glow',  GLOW[mod.color]  || 'rgba(139,92,246,0.18)');
  book.style.animationDelay = (animIdx * 0.05) + 's';
  if (lean) book.style.marginLeft = '10px';

  book.innerHTML = `
    <button class="delete-btn" onclick="deleteModule('${mod.id}',event)" aria-label="Remove">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="book-ico"><i class="fa-solid ${mod.icon}"></i></div>
    <div class="book-title"><span>${loc(mod.title)}</span></div>
    <div class="book-num">${romanOf(mod)}</div>`;

  if (!editMode) {
    book.onclick = () => openModule(mod, book);
    book.setAttribute('tabindex','0');
    book.setAttribute('role','button');
    book.setAttribute('aria-label','Open '+loc(mod.title));
    book.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openModule(mod, book); } };
    book.addEventListener('mouseenter', () => showTip(mod, book));
    book.addEventListener('focus',      () => showTip(mod, book));
    book.addEventListener('mouseleave', hideTip);
    book.addEventListener('blur',       hideTip);
  }
  return book;
}

/* the slip of paper that rises above the book under the pointer */
function showTip(mod, book) {
  if (bookBusy) return;
  const tip = document.getElementById('book-tip');
  tip.innerHTML = `
    <div class="tip-head">
      <div class="icon-box" style="background:${SPINE[mod.color] || SPINE['from-violet-400 to-indigo-600']}"><i class="fa-solid ${mod.icon}"></i></div>
      <div>
        <div class="chapter-num">${romanOf(mod)}</div>
        <h3 class="card-title" style="font-size:19px;margin:0;">${loc(mod.title)}</h3>
      </div>
    </div>
    <p class="card-tag">${loc(mod.subtitle)}</p>
    <div class="ruled-sep" style="margin:10px 0;"></div>
    <p class="card-desc" style="-webkit-line-clamp:4;">${loc(mod.description)}</p>
    <div class="status-pill" style="margin-top:12px;">
      <div class="pulse-dot"
           style="background:${mod.custom?'#60a5fa':'#a07838'};
                  box-shadow:0 0 6px ${mod.custom?'rgba(96,165,250,.42)':'rgba(160,120,56,.48)'}"></div>
      <span>${mod.custom ? UI[currentLang].customStatus : UI[currentLang].readyStatus}</span>
    </div>`;
  const r = book.getBoundingClientRect();
  tip.style.left = '0px'; tip.style.top = '0px';
  tip.classList.add('on');
  tip.setAttribute('aria-hidden', 'false');
  const w = tip.offsetWidth, hgt = tip.offsetHeight;
  let x = r.left + r.width / 2 - w / 2;
  x = Math.max(12, Math.min(innerWidth - w - 12, x));
  let y = r.top - 20 - hgt - 16;            /* above the lifted book */
  if (y < 8) y = r.bottom + 14;             /* no room: below the shelf */
  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
}
function hideTip() {
  const tip = document.getElementById('book-tip');
  if (!tip) return;
  tip.classList.remove('on');
  tip.setAttribute('aria-hidden', 'true');
}
addEventListener('scroll', hideTip, { passive: true });

const OPEN_KEY = 'kb_open_module';
let currentModId = null;

/* ─── Book-opening transition ───────────────────────────────
   Builds a tome in a fixed overlay whose spine lies over the clicked
   one, turns it on its hinge to show the front board, swings the cover
   open on the left edge to reveal the leaves, then expands into the
   viewer. Skipped entirely when the reader prefers less motion. */
const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE_BOOK = 'cubic-bezier(0.22,1,0.36,1)';
let bookBusy = false;

/* Motion constants. The cover opens past flat and settles, the way a
   heavy board does; nothing uses a symmetric ease, which is what made
   the old version feel mechanical. */
const EASE_LIFT  = 'cubic-bezier(0.16,1,0.30,1)';   /* expo-out: fast away, long glide */
const EASE_BOARD = 'cubic-bezier(0.34,0.02,0.16,1)'; /* weight, then a long settle */
const OPEN_DEG   = -172;                             /* essentially flat, not stopped short */

function buildTome(bookEl, mod) {
  const r = bookEl.getBoundingClientRect();
  const H = r.height, D = Math.max(r.width, 36), W = Math.round(H * 0.70);
  const layer = document.getElementById('book-fx');
  layer.innerHTML = '';
  layer.classList.add('on');

  const veil = document.createElement('div'); veil.className = 'bk-veil';
  const halo = document.createElement('div'); halo.className = 'bk-halo';
  layer.appendChild(veil); layer.appendChild(halo);

  /* The tome is the size of the front board. Its hinge sits at the right
     edge of the shelved spine, so that, turned 90° on its hinge, the spine
     face lies exactly over the one the reader just clicked. */
  const bk = document.createElement('div');
  bk.className = 'bk';
  bk.style.cssText =
    `left:${r.right - W / 2}px;top:${r.top}px;width:${W}px;height:${H}px;`;

  const spineGrad = SPINE[mod.color] || SPINE['from-violet-400 to-indigo-600'];
  bk.innerHTML =
    `<div class="bk-inner">
       <div class="bk-pages">
         <div class="bk-lines"></div>
         <div class="bk-illum"></div>
         <div class="bk-rule"></div>
         <div class="bk-glow"></div>
       </div>
       <div class="bk-leaf"></div>
       <div class="bk-cover">
         <div class="bk-face bk-front">
           <div class="bk-art" style="--spine:${spineGrad}">
             <div class="bk-art-ico"><i class="fa-solid ${mod.icon}"></i></div>
             <div class="bk-art-title">${loc(mod.title)}</div>
             <div class="bk-art-sub">${loc(mod.subtitle)}</div>
             <div class="bk-art-num">${romanOf(mod)}</div>
           </div>
         </div>
         <div class="bk-face bk-back"></div>
       </div>
       <div class="bk-spine3d" style="width:${D}px;transform:translateZ(${-D}px) rotateY(-90deg);"></div>
     </div>`;

  /* the clicked spine becomes the spine of the tome */
  const clone = bookEl.cloneNode(true);
  clone.querySelectorAll('.delete-btn').forEach(n => n.remove());
  clone.style.cssText +=
    ';position:absolute;inset:0;width:100%;height:100%;margin:0;animation:none;transition:none;transform:none;filter:none;';
  bk.querySelector('.bk-spine3d').appendChild(clone);
  layer.appendChild(bk);

  const vw = innerWidth, vh = innerHeight;
  return {
    layer, bk, veil, halo,
    cover: bk.querySelector('.bk-cover'),
    pages: bk.querySelector('.bk-pages'),
    leaf:  bk.querySelector('.bk-leaf'),
    /* lift the book to the middle of the screen, comfortably enlarged */
    scale: Math.min(vw * 0.40 / W, vh * 0.60 / H, 2.4),
    tx: vw / 2 - r.right,
    ty: vh / 2 - (r.top + H / 2)
  };
}
function clearBook() {
  const layer = document.getElementById('book-fx');
  layer.classList.remove('on');
  layer.innerHTML = '';
}

function playBookOpen(bookEl, mod, onDissolve) {
  hideTip();
  const b = buildTome(bookEl, mod);
  /* settle into a slight three-quarter view: dead-on reads flat */
  const tilt = 'rotateY(7deg) rotateX(-3deg)';
  const at   = k => `translate(${b.tx}px,${b.ty}px) scale(${b.scale * k}) ${tilt}`;

  /* Timing. The hand-off to the document starts while the cover is still
     settling, so the motion never comes to rest before the page appears;
     waiting for every animation to finish first is what made it stall. */
  const LIFT = 760, FLIP = 520, FLIP_AT = 330, LEAF = 400, LEAF_AT = 440;
  const HANDOFF = 700, DISSOLVE = 360;

  b.veil.animate([{ opacity: 0 }, { opacity: 1 }],
    { duration: 380, easing: 'ease-out', fill: 'forwards' });
  b.halo.animate([{ opacity: 0, transform: 'scale(0.72)' }, { opacity: 1, transform: 'scale(1)' }],
    { duration: 520, delay: 30, easing: EASE_LIFT, fill: 'forwards' });

  /* One continuous motion: the volume slides off the shelf, turns on its
     hinge from spine to front board, and keeps drifting while the cover swings */
  b.bk.animate([
      { transform: `translate(0,0) scale(1) rotateY(90deg) rotateX(0deg)`, offset: 0 },
      { transform: at(1), offset: 0.62 },
      { transform: at(1.04), offset: 1 },
    ], { duration: LIFT, easing: EASE_LIFT, fill: 'forwards' });

  /* the cover: heavy at the start, opens past flat, settles */
  b.cover.animate([
      { transform: 'translateZ(2px) rotateY(0deg)', offset: 0 },
      { transform: `translateZ(2px) rotateY(${OPEN_DEG - 5}deg)`, offset: 0.88 },
      { transform: `translateZ(2px) rotateY(${OPEN_DEG}deg)`, offset: 1 },
    ], { duration: FLIP, delay: FLIP_AT, easing: EASE_BOARD, fill: 'forwards' });

  b.bk.querySelector('.bk-glow').animate([{ opacity: 0 }, { opacity: 1 }],
    { duration: 360, delay: 150, easing: 'ease-out', fill: 'forwards' });

  /* one leaf follows the cover over, so the block reads as paper */
  b.leaf.animate([
      { transform: 'translateZ(1px) rotateY(0deg)', opacity: 1, offset: 0 },
      { transform: 'translateZ(1px) rotateY(-150deg)', opacity: 1, offset: 0.82 },
      { transform: `translateZ(1px) rotateY(${OPEN_DEG}deg)`, opacity: 0, offset: 1 },
    ], { duration: LEAF, delay: LEAF_AT, easing: EASE_BOARD, fill: 'forwards' });

  /* Drift toward the page and raise the document underneath at the same
     moment, so the two cross-fade. It starts from exactly where the lift
     is heading, so there is no jump backwards at the seam. */
  const dissolve = b.bk.animate(
    [{ transform: at(1.04), opacity: 1 }, { transform: at(1.5), opacity: 0 }],
    { duration: DISSOLVE, delay: HANDOFF, easing: 'cubic-bezier(0.4,0,0.6,1)', fill: 'forwards' });
  setTimeout(() => { if (onDissolve) onDissolve(); }, HANDOFF);

  return dissolve.finished.catch(() => {});
}

function playBookClose(bookEl, mod) {
  hideTip();
  const b = buildTome(bookEl, mod);
  const mid  = `translate(${b.tx}px,${b.ty}px) scale(${b.scale}) rotateY(7deg) rotateX(-3deg)`;
  const near = `translate(${b.tx}px,${b.ty}px) scale(${b.scale * 1.5}) rotateY(7deg) rotateX(-3deg)`;
  b.cover.style.transform = `translateZ(2px) rotateY(${OPEN_DEG}deg)`;
  b.leaf.style.opacity = '0';
  b.veil.style.opacity = '1';
  b.halo.style.opacity = '1';

  /* the book comes back, shuts, turns spine-out and slides home on the shelf */
  const settle = b.bk.animate([
      { transform: near, opacity: 0, offset: 0 },
      { transform: mid, opacity: 1, offset: 0.26 },
      { transform: mid, opacity: 1, offset: 0.48 },
      { transform: 'translate(0,0) scale(1) rotateY(90deg) rotateX(0deg)', opacity: 1, offset: 1 },
    ], { duration: 720, easing: 'cubic-bezier(0.36,0,0.24,1)', fill: 'forwards' });

  const shut = b.cover.animate(
    [{ transform: `translateZ(2px) rotateY(${OPEN_DEG}deg)` }, { transform: 'translateZ(2px) rotateY(0deg)' }],
    { duration: 360, delay: 60, easing: 'cubic-bezier(0.42,0,0.22,1)', fill: 'forwards' });

  b.veil.animate([{ opacity: 1 }, { opacity: 0 }],
    { duration: 520, delay: 180, easing: 'ease-in', fill: 'forwards' });
  b.halo.animate([{ opacity: 1 }, { opacity: 0 }],
    { duration: 420, delay: 180, easing: 'ease-in', fill: 'forwards' });

  return Promise.all([settle.finished, shut.finished]).catch(() => {});
}

/* the spine a given module currently stands on, if it is still rendered and on screen */
function cardOf(id) {
  const el = document.querySelector(`.book[data-id="${id}"]`);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return (r.bottom > 0 && r.top < innerHeight) ? el : null;
}

function openModule(mod, cardEl) {
  if (editMode || bookBusy) return;
  currentModId = mod.id;

  /* Back 列配色 */
  const acc = BAR_ACCENT_OVERRIDE[mod.id] || BAR_ACCENTS[mod.color] || ['201,168,92', '#e8cc84'];
  const bar = document.getElementById('viewer-bar');
  bar.style.setProperty('--va', acc[0]);
  bar.style.setProperty('--vac', acc[1]);

  /* 只有支援多語的模組才顯示語言鈕 */
  const adapter = MODULE_I18N[mod.id];
  document.getElementById('viewer-lang').style.display = adapter ? 'flex' : 'none';

  const frame = document.getElementById('viewer-frame');
  frame.onload = () => {
    if (!adapter) return;
    try {
      const fw = frame.contentWindow;
      /* 隱藏內頁自己的語言切換鈕（由 Back 列代管） */
      const b = fw.document.getElementById(adapter.btn);
      if (b && b.parentElement) b.parentElement.style.display = 'none';
      /* 同步目前語言 */
      if (typeof fw[adapter.fn] === 'function') fw[adapter.fn](currentLang);
    } catch (e) { /* ignore */ }
  };
  document.body.style.overflow = 'hidden';
  updateViewerLangButtons();

  /* 記住開啟中的筆記（自訂上傳的 blob 無法跨刷新還原，略過） */
  if (!mod.custom) localStorage.setItem(OPEN_KEY, mod.id);
  else localStorage.removeItem(OPEN_KEY);

  const viewer = document.getElementById('module-viewer');
  if (!cardEl || REDUCE_MOTION) {          /* 還原開啟中的筆記、或使用者偏好減少動態 */
    frame.src = mod.file;
    viewer.classList.remove('from-book');
    viewer.style.display = 'block';
    return;
  }

  bookBusy = true;
  viewer.classList.add('from-book');
  /* the document is raised the instant the book begins to dissolve,
     so the two cross-fade instead of showing the shelf in between */
  const opening = playBookOpen(cardEl, mod, () => { viewer.style.display = 'block'; });

  /* 讓封面先動起來，再開始載入 iframe, , 否則載入的同步成本會卡住開場那一刻 */
  requestAnimationFrame(() => requestAnimationFrame(() => { frame.src = mod.file; }));

  opening.then(() => {
    clearBook();
    bookBusy = false;
  });
}
function updateViewerLangButtons() {
  document.querySelectorAll('#viewer-lang button').forEach(b =>
    b.classList.toggle('active', b.dataset.l === currentLang));
}
function viewerSwitchLang(l) {
  switchLang(l);
  updateViewerLangButtons();
  const adapter = MODULE_I18N[currentModId];
  if (!adapter) return;
  try {
    const fw = document.getElementById('viewer-frame').contentWindow;
    if (fw && typeof fw[adapter.fn] === 'function') fw[adapter.fn](l);
  } catch (e) { /* ignore */ }
}
function closeViewer() {
  if (bookBusy) return;
  const card = currentModId ? cardOf(currentModId) : null;
  const mod  = currentModId ? modules.find(m => m.id === currentModId) : null;

  document.getElementById('module-viewer').style.display = 'none';
  document.getElementById('viewer-frame').src = '';
  document.body.style.overflow = 'auto';
  currentModId = null;
  localStorage.removeItem(OPEN_KEY);

  if (!card || REDUCE_MOTION) return;      /* 卡片已被篩掉或不在畫面上就不播 */
  bookBusy = true;
  playBookClose(card, mod).then(() => { clearBook(); bookBusy = false; });
}

function handleDrop(e) {

function handleFileSelect(i) { if (i.files[0]) processFile(i.files[0]); }
function processFile(file) {
  if (!file.name.endsWith('.html')) { showModalError('Please select an .html file.'); return; }
  if (pendingURL) URL.revokeObjectURL(pendingURL);
  pendingURL = URL.createObjectURL(file);
  document.getElementById('drop-label').innerHTML =
    `<span class="file-chosen"><i class="fa-solid fa-check" style="margin-right:5px;"></i>${file.name}</span>`;
  if (!document.getElementById('new-title').value)
    document.getElementById('new-title').value =
      file.name.replace('.html','').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}
function confirmAddModule() {
  const title = document.getElementById('new-title').value.trim();
  if (!pendingURL) { showModalError('Please upload an HTML file first.'); return; }
  if (!title)      { showModalError('Please enter a title.'); return; }
  modules.push({
    id: 'custom_'+Date.now(), title,
    subtitle:    document.getElementById('new-subtitle').value.trim() || 'Custom Volume',
    description: document.getElementById('new-desc').value.trim() || '',
    icon:        document.getElementById('new-icon').value.trim()  || 'fa-file',
    color:       selColor, cat: selCat, file: pendingURL, custom: true
  });
  if (activeCat !== 'all' && activeCat !== selCat) activeCat = selCat;
  saveModules(); renderGrid(); closeAddModal();
}
function showModalError(msg) {
  const el=document.getElementById('modal-error'); el.textContent=msg; el.style.display='block';
}

/* ─── Color picker ─── */
document.getElementById('color-opts').addEventListener('click', e => {
  const o = e.target.closest('.color-opt'); if(o) selectColor(o.dataset.grad);
});
function selectColor(g) {
  selColor = g;
  document.querySelectorAll('.color-opt').forEach(o=>o.classList.toggle('selected',o.dataset.grad===g));
}

/* ─── Keyboard ─── */
document.addEventListener('keydown', e => {
  if (e.key==='Escape') {
    if (document.getElementById('module-viewer').style.display==='block') closeViewer();
    else closeAddModal();
  }
});

/* ─── Boot ─── */
/* Tailwind cdn for icon-box gradient classes */
const tw = document.createElement('script');
tw.src = 'https://cdn.tailwindcss.com';
document.head.appendChild(tw);

const saved = localStorage.getItem('kb_lang');
switchLang(['zh','en','fr'].includes(saved) ? saved : 'zh');

/* 重新整理後回到上次開啟的筆記 */
(function restoreOpenModule() {
  const oid = localStorage.getItem(OPEN_KEY);
  if (!oid) return;
  const m = modules.find(x => x.id === oid && !String(x.file).startsWith('blob:'));
  if (m) openModule(m);
  else localStorage.removeItem(OPEN_KEY);
})();
</script>
<script src="assets/edit-mode.js" defer></script>
</body>
