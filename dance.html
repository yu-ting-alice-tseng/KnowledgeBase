/* Typical tempo of each style in beats per minute. Ballroom tempos are the
   WDSF bars-per-minute figures multiplied by the beats in a bar. */
function diaTempo() {
  const L = {
    title:{zh:'各舞種音樂的常見速度（BPM，每分鐘拍數）', en:'Typical music tempo by style (BPM)', fr:'Tempo musical typique par style (BPM)'},
    note:{zh:'國標舞依 WDSF 規定的每分鐘小節數 × 每小節拍數換算。', en:'Ballroom: WDSF bars per minute × beats per bar.', fr:'Danses de salon : mesures par minute WDSF × temps par mesure.'},
  };
  const S = [
    [{zh:'倫巴', en:'Rumba', fr:'Rumba'}, 96, 104, '#f59e0b'],
    [{zh:'Hip-hop', en:'Hip-hop', fr:'Hip-hop'}, 85, 105, '#facc15'],
    [{zh:'Popping', en:'Popping', fr:'Popping'}, 95, 112, '#facc15'],
    [{zh:'Breaking', en:'Breaking', fr:'Breaking'}, 105, 125, '#facc15'],
    [{zh:'K-pop', en:'K-pop', fr:'K-pop'}, 100, 130, '#facc15'],
    [{zh:'華爾滋', en:'Waltz', fr:'Valse lente'}, 84, 90, '#f59e0b'],
    [{zh:'House', en:'House', fr:'House'}, 118, 128, '#facc15'],
    [{zh:'恰恰', en:'Cha-cha', fr:'Cha-cha'}, 120, 128, '#f59e0b'],
    [{zh:'Bachata', en:'Bachata', fr:'Bachata'}, 120, 140, '#f59e0b'],
    [{zh:'Salsa', en:'Salsa', fr:'Salsa'}, 160, 210, '#f59e0b'],
    [{zh:'捷舞', en:'Jive', fr:'Jive'}, 168, 176, '#f59e0b'],
    [{zh:'維也納華爾滋', en:'Viennese waltz', fr:'Valse viennoise'}, 174, 180, '#f59e0b'],
    [{zh:'快步舞', en:'Quickstep', fr:'Quickstep'}, 200, 208, '#f59e0b'],
  ];
  S.sort((a, b) => a[1] - b[1]);
  const X0 = 150, W = 720, lo = 60, hi = 220, x = b => X0 + (b - lo) / (hi - lo) * W;
  let s = `<text x="0" y="22" class="lab">${t(L.title)}</text>`;
  for (let b = 60; b <= 220; b += 20) s += `<line x1="${x(b)}" y1="40" x2="${x(b)}" y2="${48 + S.length * 24}" class="grid"/><text x="${x(b)}" y="${66 + S.length * 24}" text-anchor="middle" class="sub">${b}</text>`;
  S.forEach((r, i) => {
    const y = 46 + i * 24;
    s += `<text x="${X0 - 10}" y="${y + 14}" text-anchor="end" class="val">${t(r[0])}</text>`;
    s += `<rect x="${x(r[1])}" y="${y + 2}" width="${Math.max(6, x(r[2]) - x(r[1]))}" height="16" rx="5" fill="${r[3]}" fill-opacity="0.7"/>`;
    s += `<text x="${x(r[2]) + 8}" y="${y + 14}" class="sub">${r[1]}–${r[2]}</text>`;
  });
  s += `<text x="0" y="${92 + S.length * 24}" class="sub">${t(L.note)}</text>`;
  return `<svg class="dg" viewBox="0 0 900 ${104 + S.length * 24}" role="img" aria-label="${t(L.title)}">${s}</svg>`;
}

    { i:'fa-shoe-prints', t:{zh:'踢踏舞', en:'Tap', fr:'Claquettes'}, tag:{zh:'美國・19 世紀', en:'USA · 19th century', fr:'États-Unis · XIXᵉ siècle'},
      p:{zh:'鞋底裝金屬片，腳就是打擊樂器。融合愛爾蘭踢踏與非洲節奏，分成重節奏的 Rhythm tap 與百老匯的 Broadway tap。', en:'Metal plates on the shoes turn the feet into percussion. Blends Irish step dance with African rhythm; split into rhythm tap and Broadway tap.', fr:'Des fers sous les chaussures font des pieds un instrument. Mélange de gigue irlandaise et de rythmes africains : rhythm tap et Broadway tap.'} },
    { i:'fa-fan', t:{zh:'佛朗明哥', en:'Flamenco', fr:'Flamenco'}, tag:{zh:'西班牙安達魯西亞', en:'Andalusia, Spain', fr:'Andalousie, Espagne'},
      p:{zh:'吉普賽人（Gitano）文化，由歌、吉他與舞組成。腳下的 zapateado、手的 palmas 與 12 拍的 compás 是靈魂。2010 年列入聯合國教科文組織非物質文化遺產。', en:'From Gitano culture: song, guitar and dance. Footwork (zapateado), clapping (palmas) and the 12-beat compás are its soul. UNESCO intangible heritage since 2010.', fr:'Culture gitane : chant, guitare et danse. Le zapateado, les palmas et le compás à 12 temps en sont l’âme. Patrimoine immatériel de l’UNESCO depuis 2010.'} },
    { i:'fa-moon', t:{zh:'肚皮舞', en:'Belly dance', fr:'Danse orientale'}, tag:{zh:'中東與北非', en:'Middle East & North Africa', fr:'Moyen-Orient & Afrique du Nord'},
      p:{zh:'以骨盆與軀幹的分離、shimmy 抖動、8 字與波浪為主，非常鍛鍊核心。分成埃及、土耳其與美式部落風等。', en:'Built on isolations of hips and torso, shimmies, figure-eights and undulations; a strong core workout. Egyptian, Turkish and American tribal styles.', fr:'Isolations du bassin et du buste, shimmies, huit et ondulations ; excellent pour la sangle abdominale. Styles égyptien, turc et tribal américain.'} },
    { i:'fa-dragon', t:{zh:'中國古典舞', en:'Chinese classical dance', fr:'Danse classique chinoise'}, tag:{zh:'中國・20 世紀整理成形', en:'China · systematised in the 20th c.', fr:'Chine · codifiée au XXᵉ siècle'},
      p:{zh:'吸收戲曲「身韻」與武術，講究「形、神、勁、律」與圓、擰、傾、曲的身體線條；身段、水袖、翻身、技巧跳躍是特色。', en:'Draws on opera movement (shenyun) and martial arts; prizes form, spirit, force and rhythm, with round, twisting, leaning lines; water sleeves, turns and leaps.', fr:'Puise dans le théâtre chinois (shenyun) et les arts martiaux ; cherche forme, esprit, force et rythme, avec des lignes rondes et torsadées ; manches d’eau, tours et sauts.'} },
    { i:'fa-people-group', t:{zh:'民族舞', en:'Ethnic folk dance', fr:'Danses folkloriques'}, tag:{zh:'各地區', en:'Every region', fr:'Toutes régions'},
      p:{zh:'例如台灣原住民的歌舞、蒙古舞、傣族舞、新疆舞、韓國扇子舞、愛爾蘭舞，各自反映生活與信仰。', en:'Taiwanese Indigenous song-dance, Mongolian, Dai and Uyghur dance, Korean fan dance, Irish dance: each reflects a way of life and belief.', fr:'Chants-danses autochtones de Taïwan, danses mongole, dai et ouïghoure, danse coréenne de l’éventail, danse irlandaise : chacune reflète un mode de vie et des croyances.'} },
    { i:'fa-music', t:{zh:'Swing／Lindy Hop', en:'Swing / Lindy Hop', fr:'Swing / Lindy Hop'}, tag:{zh:'紐約哈林區・1920–30 年代', en:'Harlem · 1920s–30s', fr:'Harlem · années 1920–30'},
      p:{zh:'搖擺樂時代的雙人社交舞，有 swing out、8 拍與 6 拍步法，氣氛歡樂，全球都有 swing 舞會。', en:'The partner dance of the swing era, with the swing-out and 6- and 8-count patterns; joyful, with social dances worldwide.', fr:'La danse de couple de l’ère swing, avec le swing-out et des passes en 6 et 8 temps ; joyeuse, avec des soirées partout dans le monde.'} },
    { i:'fa-heart', t:{zh:'阿根廷探戈', en:'Argentine tango', fr:'Tango argentin'}, tag:{zh:'布宜諾斯艾利斯・19 世紀末', en:'Buenos Aires · late 19th c.', fr:'Buenos Aires · fin XIXᵉ'},
      p:{zh:'與國標探戈不同，阿根廷探戈是即興的擁抱之舞，重在走路、連結與音樂性，在 milonga 舞會中跳。2009 年列入非物質文化遺產。', en:'Unlike ballroom tango, Argentine tango is an improvised dance in an embrace, all about walking, connection and musicality, danced at milongas. UNESCO heritage since 2009.', fr:'Différent du tango de salon, le tango argentin est une danse improvisée dans l’abrazo, faite de marche, de connexion et de musicalité, dansée en milonga. Patrimoine UNESCO depuis 2009.'} },
    { i:'fa-sun', t:{zh:'Afro 與 Dancehall', en:'Afro & dancehall', fr:'Afro & dancehall'}, tag:{zh:'西非・牙買加', en:'West Africa · Jamaica', fr:'Afrique de l’Ouest · Jamaïque'},
      p:{zh:'Afrobeats 舞蹈重律動與胸、髖的彈動；Dancehall 來自牙買加，每個動作都有名字與創作者，與音樂同步誕生。', en:'Afrobeats dance is about groove and bounce through chest and hips; dancehall from Jamaica names every step after its creator and grows with the music.', fr:'L’afro danse mise sur le groove et le rebond du buste et des hanches ; le dancehall jamaïcain donne à chaque pas un nom et un créateur, au rythme de la musique.'} },
    { i:'fa-shoe-prints', t:{zh:'Heels', en:'Heels', fr:'Heels'}, tag:{zh:'商業舞蹈', en:'Commercial', fr:'Commercial'},
      p:{zh:'穿高跟鞋跳的爵士與街舞融合，強調自信、性感與線條。先在平底鞋練好技巧再換高跟，並選擇鞋跟穩定的舞鞋。', en:'Jazz and street fusion danced in heels, all confidence, sensuality and line. Learn the technique in flats first, then move to stable-heeled dance shoes.', fr:'Fusion jazz-urbain en talons : assurance, sensualité et lignes. Apprenez d’abord en chaussures plates, puis passez à des talons stables.'} },
    { i:'fa-grip-lines-vertical', t:{zh:'鋼管舞', en:'Pole dance', fr:'Pole dance'}, tag:{zh:'舞蹈＋體操', en:'Dance + gymnastics', fr:'Danse + gymnastique'},
      p:{zh:'需要大量上肢與核心肌力，有 spins、climbs、inverts 等技巧，已發展出國際競賽。', en:'Demands serious upper-body and core strength, with spins, climbs and inverts; now has international competitions.', fr:'Exige beaucoup de force dans le haut du corps et le tronc : spins, montées, inversions ; il existe des compétitions internationales.'} },
    { i:'fa-film', t:{zh:'寶萊塢', en:'Bollywood', fr:'Bollywood'}, tag:{zh:'印度電影', en:'Indian cinema', fr:'Cinéma indien'},
      p:{zh:'融合印度古典舞手勢（mudra）、民間舞與流行舞的電影舞蹈，表情豐富、節奏歡快。', en:'Film dance mixing Indian classical hand gestures (mudras), folk and pop; expressive faces and upbeat rhythms.', fr:'Danse de cinéma mêlant gestes classiques indiens (mudras), folklore et pop ; visages expressifs et rythmes joyeux.'} },
    { i:'fa-dumbbell', t:{zh:'Zumba 與有氧舞蹈', en:'Zumba & dance fitness', fr:'Zumba & fitness dansé'}, tag:{zh:'健身課', en:'Fitness class', fr:'Cours de fitness'},
      p:{zh:'以拉丁與流行音樂帶動的有氧課，動作簡單重複，適合想流汗又想跳舞的人。', en:'Cardio classes to Latin and pop music, with simple repeated moves, for people who want to sweat and dance.', fr:'Cours cardio sur musiques latines et pop, mouvements simples et répétés, pour transpirer en dansant.'} },
  ]},
]},

/* ── 5. Fundamentals ── */
{ id:'basics', i:'fa-wave-square', c:T,
  nav:{zh:'共通基礎', en:'Fundamentals', fr:'Fondamentaux'},
  eyebrow:{zh:'第五章・教學', en:'Chapter 5 · Lessons', fr:'Chapitre 5 · Leçons'},
  h2:{zh:'所有舞種共通的基礎', en:'Fundamentals every style shares', fr:'Les fondamentaux communs à tous les styles'},
  blocks:[
  { type:'h3', t:{zh:'一、數拍：舞者的共同語言', en:'1. Counting: the dancer’s shared language', fr:'1. Compter : la langue commune des danseurs'} },
  { type:'lead', p:{
    zh:'流行音樂多是 4/4 拍，舞蹈老師把兩小節合成一個「八拍」來數：<strong class="text-white">1、2、3、4、5、6、7、8</strong>。拍與拍中間的半拍叫做「and」（寫成 &），再細分的四分之一拍叫「e」與「a」：1 e & a 2 e & a…。華爾滋是 3/4 拍，數成 1 2 3、4 5 6。',
    en:'Most popular music is in 4/4, and teachers count two bars together as an “eight”: <strong class="text-white">1, 2, 3, 4, 5, 6, 7, 8</strong>. The half-beat between counts is “and” (&); quarter-beats are “e” and “a”: 1 e & a 2 e & a… Waltz is in 3/4 and is counted 1 2 3, 4 5 6.',
    fr:'La plupart des musiques actuelles sont en 4/4, et les professeurs comptent deux mesures ensemble, un « huit » : <strong class="text-white">1, 2, 3, 4, 5, 6, 7, 8</strong>. Le demi-temps entre deux comptes est le « et » (&) ; les quarts sont « e » et « a » : 1 e & a 2 e & a… La valse est en 3/4 : 1 2 3, 4 5 6.'} },
  { type:'counts', t:{zh:'練習：找到「1」', en:'Exercise: find the “1”', fr:'Exercice : trouver le « 1 »'},
    p:{zh:'放一首中速流行歌（約 100 BPM）。鼓的大鼓（kick）通常落在 1 和 3，小鼓（snare）落在 2 和 4。歌詞段落與旋律的開頭幾乎都在 1。', en:'Put on a mid-tempo pop song (about 100 BPM). The kick drum usually lands on 1 and 3 and the snare on 2 and 4. Verses and melodic phrases almost always start on 1.', fr:'Mettez un morceau pop modéré (environ 100 BPM). La grosse caisse tombe en général sur 1 et 3, la caisse claire sur 2 et 4. Couplets et phrases mélodiques commencent presque toujours sur 1.'},
    items:[
      {n:'1', p:{zh:'大鼓・樂句開始，拍手', en:'Kick · phrase starts, clap', fr:'Grosse caisse · début de phrase, frappez'}},
      {n:'2', p:{zh:'小鼓・點頭', en:'Snare · nod', fr:'Caisse claire · hochez la tête'}},
      {n:'3', p:{zh:'大鼓・踏右腳', en:'Kick · step right', fr:'Grosse caisse · pied droit'}},
      {n:'4', p:{zh:'小鼓・點頭', en:'Snare · nod', fr:'Caisse claire · hochez'}},
      {n:'5', p:{zh:'大鼓・踏左腳', en:'Kick · step left', fr:'Grosse caisse · pied gauche'}},
      {n:'6', p:{zh:'小鼓・點頭', en:'Snare · nod', fr:'Caisse claire · hochez'}},
      {n:'7', p:{zh:'大鼓・踏右腳', en:'Kick · step right', fr:'Grosse caisse · pied droit'}},
      {n:'8', p:{zh:'小鼓・準備下一個 1', en:'Snare · get ready for the next 1', fr:'Caisse claire · préparez le 1 suivant'}},
    ]},
  { type:'h3', t:{zh:'二、律動：讓身體跟著拍子活起來', en:'2. Groove: letting the body ride the beat', fr:'2. Le groove : faire vivre le corps sur le temps'} },
  { type:'steps', items:[
    { t:{zh:'Down（往下律動）', en:'Down groove', fr:'Groove « down »'}, p:{zh:'雙腳與肩同寬、膝蓋微彎。每一拍膝蓋往下壓一下、胸口跟著微微往下，在「&」回來。Hip-hop 最基本的律動。', en:'Feet shoulder-width, knees soft. On each beat bend the knees and let the chest drop slightly; come back up on the “&”. The most basic hip-hop groove.', fr:'Pieds largeur d’épaules, genoux souples. À chaque temps, fléchissez et laissez la poitrine descendre légèrement ; remontez sur le « et ». Le groove hip-hop le plus basique.'} },
    { t:{zh:'Up（往上律動）', en:'Up groove', fr:'Groove « up »'}, p:{zh:'相反：每一拍往上彈，「&」往下。House 與 Locking 常用。兩種各做 4 個八拍，交替練習。', en:'The opposite: spring up on each beat and down on the “&”. Common in house and locking. Do four eights of each, alternating.', fr:'L’inverse : on monte sur le temps, on descend sur le « et ». Fréquent en house et en locking. Quatre huit de chaque, en alternance.'} },
    { t:{zh:'Rock（前後搖）', en:'Rock', fr:'Le rock'}, p:{zh:'上半身以胸口帶動，前後擺動，像在點頭但用整個軀幹。和 Down 一起做，就是很多舞步的底。', en:'Rock the upper body forward and back, led by the chest, like nodding with the whole torso. Combined with the down groove, it underlies many steps.', fr:'Balancez le buste d’avant en arrière, mené par la poitrine, comme un hochement de tout le tronc. Avec le « down », c’est la base de nombreux pas.'} },
    { t:{zh:'加上步伐', en:'Add a step', fr:'Ajouter un pas'}, p:{zh:'維持律動，在 1 往右踏、2 左腳併攏、3 往左踏、4 右腳併攏（step touch）。律動不能因為走步而停掉。', en:'Keep the groove and step right on 1, close the left on 2, step left on 3, close the right on 4 (step-touch). The groove must not stop because you are stepping.', fr:'Gardez le groove : pas à droite sur 1, joignez le gauche sur 2, pas à gauche sur 3, joignez le droit sur 4 (step-touch). Le groove ne s’arrête pas pendant les pas.'} },
  ]},
  { type:'h3', t:{zh:'三、身體分離（Isolation）', en:'3. Isolations', fr:'3. Les isolations'} },
  { type:'lead', p:{
    zh:'讓一個部位動、其他部位不動，是爵士、街舞、肚皮舞與 K-pop 的共同基本功。對著鏡子練，每個方向各做一個八拍：',
    en:'Moving one part while the rest stays still is basic to jazz, street, belly dance and K-pop. Practise facing a mirror, one eight per direction:',
    fr:'Bouger une partie du corps en gardant le reste immobile est un fondamental du jazz, de l’urbain, de l’oriental et de la K-pop. Face au miroir, un huit par direction :'} },
  { type:'cards', cols:4, items:[
    { i:'fa-face-smile', t:{zh:'頭', en:'Head', fr:'Tête'}, p:{zh:'前後、左右平移（不轉頭）、左右傾、繞圈。肩膀保持不動。', en:'Forward-back, side to side (slide, do not turn), tilt, circle. Shoulders stay still.', fr:'Avant-arrière, glissés latéraux (sans tourner), inclinaisons, cercles. Épaules immobiles.'} },
    { i:'fa-up-down', t:{zh:'肩', en:'Shoulders', fr:'Épaules'}, p:{zh:'上下、前後、單邊交替、繞圈。', en:'Up-down, forward-back, alternating, circles.', fr:'Haut-bas, avant-arrière, en alternance, cercles.'} },
    { i:'fa-heart', t:{zh:'胸', en:'Chest', fr:'Poitrine'}, p:{zh:'前推後收（pop 與 wave 的基礎）、左右平移、繞圈。骨盆不跟著動。', en:'Push forward and pull back (the root of pops and waves), slide side to side, circle. The pelvis stays still.', fr:'Pousser et rentrer (base des pops et des ondulations), glissés latéraux, cercles. Le bassin ne bouge pas.'} },
    { i:'fa-circle-notch', t:{zh:'髖', en:'Hips', fr:'Hanches'}, p:{zh:'左右推、前後、繞圈、8 字。胸口保持不動。', en:'Side to side, forward-back, circles, figure-eights. The chest stays still.', fr:'Côté, avant-arrière, cercles, huit. La poitrine reste immobile.'} },
  ]},
  { type:'h3', t:{zh:'四、怎麼記舞與練舞', en:'4. How to learn and practise choreography', fr:'4. Apprendre et travailler une chorégraphie'} },
  { type:'steps', items:[
    { t:{zh:'先聽音樂', en:'Listen first', fr:'Écouter d’abord'}, p:{zh:'把歌聽到能哼出來，標出每個段落從哪個八拍開始。', en:'Listen until you can hum it, and mark which eight each section starts on.', fr:'Écoutez jusqu’à pouvoir fredonner, et repérez sur quel huit commence chaque partie.'} },
    { t:{zh:'一次學一個八拍', en:'One eight at a time', fr:'Un huit à la fois'}, p:{zh:'先學腳、再加手、最後加頭與表情。每學會一個八拍，就和前面串起來重做一次。', en:'Feet first, then arms, then head and face. Each time you learn an eight, chain it to the previous ones.', fr:'Les pieds d’abord, puis les bras, puis la tête et le visage. Chaque nouveau huit s’enchaîne aux précédents.'} },
    { t:{zh:'幫動作取名字', en:'Name the moves', fr:'Nommer les mouvements'}, p:{zh:'用自己記得住的名字（「擦玻璃」「開門」「踢一下」）配上拍數唸出來，記憶會快很多。', en:'Give each move a name you will remember (“wipe the window”, “open the door”, “kick”) and say it with the counts; memory gets much faster.', fr:'Donnez à chaque geste un nom parlant (« essuyer la vitre », « ouvrir la porte », « coup de pied ») et dites-le avec les comptes : on retient bien plus vite.'} },
    { t:{zh:'放慢速度', en:'Slow it down', fr:'Ralentir'}, p:{zh:'用 0.5–0.75 倍速練到乾淨，再慢慢回到原速。慢的時候做不好，快的時候只會更亂。', en:'Practise at 0.5–0.75× until it is clean, then build back to full speed. What is messy slow is messier fast.', fr:'Travaillez à 0,5–0,75× jusqu’à la propreté, puis revenez à la vitesse normale. Ce qui est brouillon lentement l’est encore plus vite.'} },
    { t:{zh:'鏡子與錄影交替', en:'Alternate mirror and video', fr:'Alterner miroir et vidéo'}, p:{zh:'鏡子用來修正位置，錄影用來看整體感覺。最後要練到不看鏡子也能跳。', en:'The mirror corrects positions; video shows the overall feel. Finish by dancing without the mirror.', fr:'Le miroir corrige les positions ; la vidéo montre l’ensemble. Terminez sans miroir.'} },
    { t:{zh:'每天短時間重複', en:'Short daily repetition', fr:'Répéter un peu chaque jour'}, p:{zh:'每天 15 分鐘比週末練三小時更容易記住。睡眠會幫你鞏固動作記憶。', en:'Fifteen minutes a day sticks better than three hours at the weekend. Sleep consolidates movement memory.', fr:'Quinze minutes par jour valent mieux que trois heures le week-end. Le sommeil consolide la mémoire du mouvement.'} },
  ]},
]},
