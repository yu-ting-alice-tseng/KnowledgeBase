  m:{zh:'遠近物體在畫面中的大小比例。望遠讓背景顯得「貼近」主體，叫壓縮感。', en:'The relative size of near and far things. A telephoto makes the background look pressed up against the subject: compression.', fr:'La taille relative des objets proches et lointains. Le téléobjectif semble coller l’arrière-plan au sujet : c’est l’écrasement.'},
  p:{zh:'透視只由「相機位置」決定，與焦距無關。望遠有壓縮感，是因為要框住同樣大小的主體你得站很遠；從遠處看，主體到背景的距離比例變小了。用廣角站在同一點拍、再裁中央，透視完全相同。', en:'Perspective depends only on where the camera stands, not on focal length. Telephotos compress because framing the same subject means standing far back, and from there subject and background are proportionally closer. A wide lens from the same spot, cropped, gives identical perspective.', fr:'La perspective ne dépend que de la position de l’appareil, pas de la focale. Le téléobjectif écrase parce que cadrer le même sujet oblige à reculer, et de loin sujet et fond sont proportionnellement plus proches. Un grand-angle au même endroit, recadré, donne la même perspective.'},
  e:{zh:'想改變前後景的大小關係要移動腳步，不只是轉變焦環。', en:'To change how foreground and background relate, move your feet, not just the zoom ring.', fr:'Pour changer le rapport entre premier plan et fond, déplacez-vous, ne tournez pas seulement la bague de zoom.'} },
{ c:'opt', id:'dr', k:{zh:'動態範圍', en:'Dynamic range', fr:'Plage dynamique'},
  m:{zh:'同一張照片能同時保留細節的最亮到最暗範圍，以「級」表示。', en:'The span from brightest to darkest that one frame can hold with detail, in stops.', fr:'L’écart entre le plus clair et le plus sombre qu’une image peut garder avec du détail, en IL.'},
  p:{zh:'上限是每個像素能裝下的電荷量，裝滿就是死白；下限是讀取雜訊，太暗的訊號會被淹沒。現代機身在基礎 ISO 約 12 到 14 級；ISO 每高一級，動態範圍約少一級。', en:'The top is how much charge a pixel can hold before it is full, which is pure white; the bottom is read noise, which drowns signals that are too faint. Modern bodies give about 12 to 14 stops at base ISO, losing about one for each stop of ISO.', fr:'Le haut est la charge maximale d’un photosite, saturé c’est le blanc pur ; le bas est le bruit de lecture qui noie les signaux trop faibles. Les boîtiers récents offrent 12 à 14 IL à ISO de base, et en perdent environ un par IL d’ISO.'},
  e:{zh:'場景超過動態範圍時，靠包圍曝光、漸層減光鏡或補光。', en:'When a scene exceeds it, use bracketing, a graduated ND filter, or added light.', fr:'Si la scène la dépasse : bracketing, filtre dégradé ou éclairage d’appoint.'} },
{ c:'opt', id:'noise', k:{zh:'雜訊', en:'Noise', fr:'Bruit'},
  m:{zh:'照片中不規則的顆粒或彩色斑點。', en:'Irregular grain or coloured speckles in a picture.', fr:'Le grain irrégulier ou les taches colorées d’une image.'},
  p:{zh:'主要來源有二：光子本身的隨機起伏（散粒雜訊，光越少越明顯），以及電路讀取時加入的讀取雜訊。看起來分成亮度雜訊（像底片顆粒）與色彩雜訊（紅綠斑點）。', en:'Two main sources: the random arrival of photons (shot noise, worse the less light there is) and read noise added by the electronics. It shows as luminance noise, like film grain, and colour noise, red and green blotches.', fr:'Deux sources : l’arrivée aléatoire des photons (bruit photonique, pire avec peu de lumière) et le bruit de lecture de l’électronique. Il apparaît en bruit de luminance, comme un grain de film, et en bruit chromatique, des taches rouges et vertes.'},
  e:{zh:'曝光充足是最有效的降噪。色彩雜訊可以大幅降低，亮度雜訊降太多會讓細節像塑膠。', en:'Generous exposure is the best noise reduction. Colour noise can be removed heavily; too much luminance reduction turns detail to plastic.', fr:'Une exposition généreuse est le meilleur débruitage. Le bruit chromatique se retire largement ; trop réduire la luminance rend les détails plastiques.'} },
{ c:'opt', id:'diff', k:{zh:'繞射', en:'Diffraction', fr:'Diffraction'},
  m:{zh:'光圈縮得很小時，整張照片反而變軟的現象。', en:'The overall softening that sets in at very small apertures.', fr:'L’adoucissement général qui apparaît aux très petites ouvertures.'},
  p:{zh:'光通過小孔時會向外散開，一個點會變成帶光環的小圓（艾里斑）。開口越小，圓越大；當它大過像素，細節就被抹平。', en:'Light spreads as it passes a small opening, so a point becomes a small disc with rings, the Airy disc. The smaller the opening, the bigger the disc; once it outgrows a pixel, fine detail is smeared.', fr:'La lumière s’étale en traversant une petite ouverture : un point devient un petit disque cerclé d’anneaux, la tache d’Airy. Plus l’ouverture est petite, plus elle grandit ; dès qu’elle dépasse un photosite, le détail fin s’efface.'},
  e:{zh:'多數鏡頭在 f/5.6 到 f/11 最銳利；高畫素機身更早受影響。', en:'Most lenses peak between f/5.6 and f/11; high-resolution bodies show it sooner.', fr:'La plupart des objectifs culminent entre f/5,6 et f/11 ; les capteurs très définis la montrent plus tôt.'} },
{ c:'opt', id:'bokeh', k:{zh:'散景', en:'Bokeh', fr:'Bokeh'},
  m:{zh:'焦外模糊區域的「質感」，不是模糊的多寡。', en:'The quality of the out-of-focus areas, not their quantity.', fr:'La qualité des zones floues, non leur quantité.'},
  p:{zh:'每個焦外光點都會變成光圈形狀的圓盤。葉片數量與形狀決定它圓不圓；鏡片設計決定圓盤邊緣柔和還是有亮邊，以及有沒有洋蔥紋。', en:'Every out-of-focus point becomes a disc in the shape of the aperture. Blade count and shape decide how round it is; the optical design decides whether its edge is soft or bright-rimmed, and whether it shows onion rings.', fr:'Chaque point flou devient un disque de la forme du diaphragme. Le nombre et la forme des lamelles décident de sa rondeur ; la formule optique, d’un bord doux ou cerclé et des « pelures d’oignon ».'},
  e:{zh:'背景有點狀光源時最明顯，例如夜晚的燈、樹葉間的陽光。', en:'Most visible with point lights behind the subject: night lights, sun through leaves.', fr:'Plus visible avec des sources ponctuelles derrière le sujet : lumières de nuit, soleil dans le feuillage.'} },
{ c:'opt', id:'meter', k:{zh:'測光與 18% 灰', en:'Metering and 18% grey', fr:'Mesure et gris à 18 %'},
  m:{zh:'相機量測場景亮度、決定曝光的方式。', en:'How the camera measures the scene and chooses an exposure.', fr:'La manière dont l’appareil mesure la scène et choisit l’exposition.'},
  p:{zh:'反射式測光分不出「白色物體」和「被照得很亮的灰色物體」，只好假設整個場景平均反射約 18%（中灰），這是一般場景的統計平均。模式有評價／矩陣（全畫面分區）、中央重點、點測光（只量很小一塊）。', en:'A reflected-light meter cannot tell a white object from a brightly lit grey one, so it assumes the scene averages about 18% reflectance, mid grey, which is the statistical average of ordinary scenes. Modes include evaluative or matrix (the whole frame in zones), centre-weighted, and spot (a tiny area).', fr:'Une cellule en lumière réfléchie ne distingue pas un objet blanc d’un objet gris très éclairé ; elle suppose donc que la scène réfléchit en moyenne 18 %, un gris moyen, la moyenne statistique des scènes courantes. Modes : évaluative ou matricielle (toute l’image par zones), pondérée centrale, spot (une petite zone).'},
  e:{zh:'主體明顯比中灰亮或暗時要做曝光補償；點測光適合舞台與逆光人像。', en:'Compensate when the subject is clearly lighter or darker than mid grey; spot metering suits stages and backlit portraits.', fr:'Corrigez quand le sujet est nettement plus clair ou plus sombre que le gris moyen ; la mesure spot convient aux scènes de spectacle et aux portraits à contre-jour.'} },
{ c:'opt', id:'aberr', k:{zh:'像差：色差、暗角、變形', en:'Aberrations: fringing, vignetting, distortion', fr:'Aberrations : franges, vignetage, distorsion'},
  m:{zh:'鏡頭不完美造成的影像缺陷。', en:'Image faults caused by imperfect lenses.', fr:'Les défauts d’image dus à l’imperfection des objectifs.'},
  p:{zh:'不同波長折射率不同，焦點位置略有差異，高反差邊緣就出現紫綠邊（色差）；斜射到角落的光比較少，四角變暗（暗角）；直線在邊緣彎成桶形或枕形（變形）。', en:'Different wavelengths bend by different amounts and focus at slightly different points, giving purple and green fringes on contrasty edges (chromatic aberration); less light reaches the corners at an angle (vignetting); straight lines bow into barrel or pincushion shapes near the edges (distortion).', fr:'Les longueurs d’onde se réfractent différemment et convergent en des points légèrement distincts : franges violettes et vertes sur les contours contrastés (aberration chromatique) ; moins de lumière atteint les coins en biais (vignetage) ; les droites se courbent en barillet ou en coussinet au bord (distorsion).'},
  e:{zh:'三者都可以在修圖第一步用鏡頭描述檔修正。', en:'All three are corrected by the lens profile at the first step of editing.', fr:'Les trois se corrigent par le profil d’objectif, dès la première étape.'} },
{ c:'opt', id:'af', k:{zh:'自動對焦：相位與反差', en:'Autofocus: phase and contrast', fr:'Autofocus : phase et contraste'},
  m:{zh:'相機自己判斷對焦環要轉多少。', en:'The camera working out how far to turn the focus.', fr:'L’appareil qui calcule de combien tourner la mise au point.'},
  p:{zh:'相位偵測把從鏡頭兩側進來的光分開比較，兩個影像錯開的方向與距離直接告訴相機往哪轉、轉多少，所以快。反差偵測則邊轉邊找對比最高的位置，準但要來回搜尋。現代無反把相位偵測像素做在感光元件上，兩者並用。', en:'Phase detection compares light arriving from opposite sides of the lens; the direction and size of the offset between the two images tell the camera which way to go and how far, which is why it is fast. Contrast detection turns the focus looking for maximum contrast: accurate, but it has to hunt. Modern mirrorless sensors carry phase pixels and use both.', fr:'La détection de phase compare la lumière venant des deux côtés de l’objectif ; le sens et l’ampleur du décalage entre les deux images indiquent où aller et de combien, d’où sa rapidité. La détection de contraste cherche le contraste maximal en tournant : précise, mais elle pompe. Les hybrides récents intègrent des pixels de phase au capteur et combinent les deux.'},
  e:{zh:'低光或低反差（白牆、天空）容易失焦，找有邊緣的地方對焦。', en:'Low light and low contrast (a white wall, a sky) make it fail; focus on an edge.', fr:'Basse lumière et faible contraste (mur blanc, ciel) le mettent en échec ; visez un contour.'} },
{ c:'opt', id:'is', k:{zh:'防手震', en:'Image stabilisation', fr:'Stabilisation'},
  m:{zh:'抵銷手持晃動的機制。', en:'A mechanism that cancels hand-held movement.', fr:'Un mécanisme qui compense le bougé à main levée.'},
  p:{zh:'陀螺儀量測晃動，再朝反方向移動鏡片組（鏡頭防震）或感光元件（機身防震），讓影像停在原位。', en:'Gyroscopes measure the movement, and a lens group (optical) or the sensor itself (in-body) moves the opposite way so the image stays put.', fr:'Des gyroscopes mesurent le mouvement, et un groupe de lentilles (optique) ou le capteur lui-même (dans le boîtier) se déplace en sens inverse pour que l’image reste en place.'},
  e:{zh:'多給 3 到 5 級手持餘裕，但只對相機晃動有效，對移動的主體無效。', en:'Buys three to five stops hand-held, but only against camera shake, never against a moving subject.', fr:'Offre trois à cinq IL à main levée, mais seulement contre le bougé, jamais contre un sujet qui bouge.'} },

/* ── Colour ── */
{ c:'col', id:'tri', k:{zh:'三色視覺', en:'Trichromacy', fr:'Trichromie'},
  m:{zh:'顏色是大腦對不同波長光線的解讀。', en:'Colour is the brain’s reading of different wavelengths of light.', fr:'La couleur est la lecture par le cerveau des différentes longueurs d’onde.'},
  p:{zh:'視網膜有三種錐狀細胞，分別對長、中、短波長（大致紅、綠、藍）最敏感。大腦比較三者的反應強度得出顏色，所以只要用紅綠藍三種光以不同比例混合，就能讓眼睛看到大多數顏色。', en:'The retina has three kinds of cone, most sensitive to long, medium and short wavelengths, roughly red, green and blue. The brain compares their responses to arrive at a colour, which is why mixing just red, green and blue light in different proportions can show the eye most colours.', fr:'La rétine possède trois types de cônes, sensibles surtout aux grandes, moyennes et courtes longueurs d’onde, à peu près rouge, vert et bleu. Le cerveau compare leurs réponses pour former une couleur : c’est pourquoi mélanger du rouge, du vert et du bleu en proportions variables suffit à montrer la plupart des couleurs.'},
  e:{zh:'這是所有螢幕與相機的基礎；感光元件也用紅綠藍濾鏡模仿這三種細胞。', en:'It underlies every screen and camera; the sensor’s red, green and blue filters imitate the three cones.', fr:'C’est la base de tout écran et de tout appareil ; les filtres rouge, vert et bleu du capteur imitent les trois cônes.'} },
{ c:'col', id:'rgb', k:{zh:'加色法（RGB）', en:'Additive colour (RGB)', fr:'Synthèse additive (RVB)'},
  m:{zh:'用光混色：紅＋綠＋藍＝白。', en:'Mixing with light: red + green + blue = white.', fr:'Mélanger avec la lumière : rouge + vert + bleu = blanc.'},
  p:{zh:'光疊加時能量相加，越混越亮。紅＋綠＝黃、綠＋藍＝青、紅＋藍＝洋紅。每個像素存三個數字，代表三色光的強度。', en:'Overlapping light adds energy, so mixtures get brighter. Red + green = yellow, green + blue = cyan, red + blue = magenta. Each pixel stores three numbers, the strength of each light.', fr:'Les lumières superposées additionnent leur énergie : les mélanges s’éclaircissent. Rouge + vert = jaune, vert + bleu = cyan, rouge + bleu = magenta. Chaque pixel stocke trois nombres, l’intensité de chaque lumière.'},
  e:{zh:'螢幕、相機與所有數位檔案都是 RGB。', en:'Screens, cameras and every digital file are RGB.', fr:'Écrans, appareils et fichiers numériques sont en RVB.'} },
{ c:'col', id:'cmyk', k:{zh:'減色法（CMYK）', en:'Subtractive colour (CMYK)', fr:'Synthèse soustractive (CMJN)'},
  m:{zh:'用油墨混色：越混越暗。', en:'Mixing with ink: mixtures get darker.', fr:'Mélanger avec l’encre : les mélanges s’assombrissent.'},
  p:{zh:'油墨吸收部分光、反射其餘。青吸收紅、洋紅吸收綠、黃吸收藍。三者疊加理論上是黑，實際上是混濁的深棕，所以另外加黑墨（K）。', en:'Ink absorbs part of the light and reflects the rest. Cyan absorbs red, magenta absorbs green, yellow absorbs blue. Together they should make black but in practice give a muddy brown, so a black ink (K) is added.', fr:'L’encre absorbe une partie de la lumière et renvoie le reste. Le cyan absorbe le rouge, le magenta le vert, le jaune le bleu. Ensemble, ils devraient donner du noir mais donnent un brun boueux, d’où l’ajout d’une encre noire (K).'},
  e:{zh:'印刷能呈現的顏色比螢幕少，鮮豔的藍綠色印出來常會變暗。', en:'Print shows fewer colours than a screen; vivid blues and greens often print duller.', fr:'L’impression rend moins de couleurs qu’un écran ; bleus et verts vifs sortent souvent plus ternes.'} },
{ c:'col', id:'hsl', k:{zh:'色相、飽和度、明度（HSL）', en:'Hue, saturation, luminance (HSL)', fr:'Teinte, saturation, luminance (TSL)'},
  m:{zh:'用比較直覺的三個維度描述顏色。', en:'Describing colour along three more intuitive dimensions.', fr:'Décrire la couleur selon trois dimensions plus intuitives.'},
  p:{zh:'色相是色環上的角度（紅 0°、綠 120°、藍 240°）；飽和度是離灰色多遠，也就是濃淡；明度是亮暗。同一組 RGB 數字可以直接換算成 HSL。', en:'Hue is the angle on the colour wheel (red 0°, green 120°, blue 240°); saturation is the distance from grey, how intense it is; luminance is how light or dark. Any RGB triple converts directly to HSL.', fr:'La teinte est l’angle sur le cercle (rouge 0°, vert 120°, bleu 240°) ; la saturation, l’éloignement du gris, donc l’intensité ; la luminance, clair ou sombre. Tout triplet RVB se convertit en TSL.'},
  e:{zh:'HSL 面板讓你只動某一種顏色，例如只壓暗天空的藍、只降皮膚的橘。', en:'The HSL panel lets you touch one colour only: darken the blue of the sky, calm the orange of skin.', fr:'Le panneau TSL agit sur une seule couleur : assombrir le bleu du ciel, calmer l’orangé de la peau.'} },
{ c:'col', id:'vib', k:{zh:'飽和度與鮮豔度', en:'Saturation and vibrance', fr:'Saturation et vibrance'},
  m:{zh:'兩者都讓顏色更濃，但作用方式不同。', en:'Both intensify colour, in different ways.', fr:'Les deux intensifient la couleur, différemment.'},
  p:{zh:'飽和度對所有顏色等量增加，原本就很鮮豔的部分會先爆掉。鮮豔度（自然飽和度）優先加強原本偏灰的顏色，並保護膚色範圍。', en:'Saturation raises every colour equally, so the already vivid ones clip first. Vibrance raises the duller colours most and protects the skin-tone range.', fr:'La saturation augmente toutes les couleurs également, et les plus vives saturent d’abord. La vibrance renforce surtout les couleurs ternes et protège les tons chair.'},
  e:{zh:'加強用鮮豔度；飽和度比較適合往下拉。', en:'Use vibrance to add; saturation is better for taking away.', fr:'Ajoutez avec la vibrance ; la saturation sert mieux à retirer.'} },
{ c:'col', id:'kelvin', k:{zh:'色溫（K）', en:'Colour temperature (K)', fr:'Température de couleur (K)'},
  m:{zh:'用溫度描述光源偏紅還是偏藍。', en:'A temperature describing whether light leans red or blue.', fr:'Une température qui dit si la lumière tire vers le rouge ou le bleu.'},
  p:{zh:'來自黑體輻射：物體加熱到某個溫度會發出特定顏色的光，約 1900K 是燭光的橘、5500K 接近正午日光、更高則偏藍。所以數字越低越暖、越高越冷，和「高溫＝暖」的直覺相反。', en:'It comes from black-body radiation: an object heated to a given temperature glows a given colour, about 1900K for candle orange, 5500K near midday sun, bluer above. So lower numbers are warmer and higher ones cooler, the reverse of the everyday intuition.', fr:'Elle vient du rayonnement du corps noir : un objet chauffé à une température donnée émet une couleur donnée, environ 1900K pour l’orangé d’une bougie, 5500K pour le soleil de midi, plus bleu au-delà. Les petits nombres sont donc chauds et les grands froids, à l’inverse de l’intuition.'},
  e:{zh:'見上方色彩章節的色溫刻度。', en:'See the colour-temperature scale in the colour section.', fr:'Voir l’échelle dans la section couleur.'} },
{ c:'col', id:'tint', k:{zh:'色調偏移（綠／洋紅）', en:'Tint (green–magenta)', fr:'Teinte (vert–magenta)'},
  m:{zh:'與色溫垂直的另一個軸，修正偏綠或偏洋紅。', en:'A second axis, at right angles to temperature, for green or magenta casts.', fr:'Un second axe, perpendiculaire à la température, pour les dominantes vertes ou magenta.'},
  p:{zh:'色溫只描述黑體從橘到藍的變化。螢光燈、LED 的光譜不連續，常帶有黑體沒有的綠色偏移，所以需要另一個軸。', en:'Temperature only covers the black body’s orange-to-blue path. Fluorescent and LED light have gappy spectra that often add a green cast no black body has, hence the second axis.', fr:'La température ne couvre que le trajet orangé-bleu du corps noir. Les tubes fluorescents et LED, au spectre discontinu, ajoutent souvent une dominante verte qu’aucun corps noir n’a ; d’où le second axe.'},
  e:{zh:'室內燈下皮膚發綠時，往洋紅方向推。', en:'When skin goes green under indoor light, push toward magenta.', fr:'Quand la peau verdit sous l’éclairage intérieur, poussez vers le magenta.'} },
{ c:'col', id:'wb', k:{zh:'白平衡', en:'White balance', fr:'Balance des blancs'},
  m:{zh:'告訴相機什麼是白色，讓中性色不偏色。', en:'Telling the camera what white is, so neutrals carry no cast.', fr:'Dire à l’appareil ce qu’est le blanc, pour que les neutres n’aient pas de dominante.'},
  p:{zh:'人腦會自動適應光源顏色（白紙在燈下看起來仍是白的），相機不會。白平衡把紅、綠、藍三個通道各乘上不同倍數，讓中性物體的 R、G、B 相等。設定 3200K 的意思是「光源是 3200K，請補償」，相機就會加藍。', en:'The brain adapts to the colour of light (white paper still looks white under a lamp); the camera does not. White balance multiplies the red, green and blue channels by different factors so that a neutral object has equal R, G and B. Setting 3200K means “the light is 3200K, compensate”, and the camera adds blue.', fr:'Le cerveau s’adapte à la couleur de la lumière (le papier blanc reste blanc sous une lampe) ; l’appareil, non. La balance multiplie les canaux rouge, vert et bleu par des facteurs différents pour qu’un objet neutre ait R, V et B égaux. Régler 3200K signifie « la source est à 3200K, compense », et l’appareil ajoute du bleu.'},
  e:{zh:'所以設得比實際光源高，畫面變暖；設得低，畫面變冷。RAW 可以事後任意改。', en:'So setting it above the real light warms the picture, below it cools it. In RAW it can be changed freely later.', fr:'Régler au-dessus de la source réchauffe l’image, en dessous la refroidit. En RAW, on la change librement après coup.'} },
{ c:'col', id:'wheel', k:{zh:'色環與配色', en:'Colour wheel and harmony', fr:'Cercle chromatique et harmonies'},
  m:{zh:'把色相排成一圈，用相對位置設計配色。', en:'Hues arranged in a circle, so that their positions can guide a palette.', fr:'Les teintes disposées en cercle, pour que leur position guide la palette.'},
  p:{zh:'互補色在正對面（橘對青藍、黃對藍紫），並排時對比最強；類比色彼此相鄰，和諧安靜；三角配色彼此相隔 120°。電影常見的「橘青調」，是因為膚色偏橘，把陰影推向互補的青色，人物就會跳出來。', en:'Complements sit opposite (orange and azure, yellow and violet) and contrast most side by side; analogous colours sit together and feel calm; a triad is spaced 120° apart. Cinema’s orange-and-teal look exists because skin is orange: pushing shadows to its complement makes people stand out.', fr:'Les complémentaires sont opposées (orangé et azur, jaune et violet) et contrastent le plus côte à côte ; les analogues sont voisines et apaisées ; une triade est espacée de 120°. Le look orange et bleu-vert du cinéma vient de ce que la peau est orangée : pousser les ombres vers sa complémentaire détache les personnages.'},
  e:{zh:'把畫面收斂到兩三個主色，比整體加飽和更有質感。', en:'Narrowing a frame to two or three dominant colours looks richer than adding saturation everywhere.', fr:'Réduire l’image à deux ou trois couleurs dominantes paraît plus riche que saturer partout.'} },
{ c:'col', id:'warm', k:{zh:'冷暖色', en:'Warm and cool colours', fr:'Couleurs chaudes et froides'},
  m:{zh:'紅橘黃是暖色，藍青是冷色。', en:'Reds, oranges and yellows are warm; blues and cyans are cool.', fr:'Rouges, orangés et jaunes sont chauds ; bleus et cyans sont froids.'},
  p:{zh:'暖色看起來往前、有能量；冷色往後退、安靜。視線也會先被暖色與高飽和吸引。', en:'Warm colours seem to advance and carry energy; cool ones recede and quieten. The eye also goes first to warm and saturated colour.', fr:'Les couleurs chaudes semblent avancer et portent de l’énergie ; les froides reculent et apaisent. L’œil va aussi d’abord aux couleurs chaudes et saturées.'},
  e:{zh:'主體暖、背景冷，能自然拉出空間層次。', en:'A warm subject against a cool background builds depth on its own.', fr:'Un sujet chaud sur un fond froid crée naturellement de la profondeur.'} },
{ c:'col', id:'space', k:{zh:'色彩空間與色域', en:'Colour space and gamut', fr:'Espace colorimétrique et gamut'},
  m:{zh:'色彩空間定義「RGB 數字代表哪個真實顏色」，它能涵蓋的範圍叫色域。', en:'A colour space defines which real colour each RGB number means; the range it covers is its gamut.', fr:'Un espace colorimétrique définit quelle couleur réelle désigne chaque valeur RVB ; l’étendue couverte est son gamut.'},
  p:{zh:'同樣是 (255, 0, 0)，在 sRGB 和 Display P3 是不同的紅，P3 的更飽和。sRGB 是網路標準；Adobe RGB 綠青較寬；Display P3 用於新款手機與螢幕；ProPhoto RGB 最寬，甚至包含肉眼看不到的顏色，多用於編輯過程。', en:'(255, 0, 0) is a different red in sRGB and in Display P3; the P3 one is more saturated. sRGB is the web standard; Adobe RGB is wider in greens and cyans; Display P3 is used by recent phones and screens; ProPhoto RGB is widest, even including colours no eye can see, and is used while editing.', fr:'(255, 0, 0) est un rouge différent en sRGB et en Display P3, plus saturé en P3. Le sRGB est le standard du web ; l’Adobe RGB est plus large en verts et cyans ; le Display P3 équipe les smartphones et écrans récents ; le ProPhoto RGB est le plus large, avec même des couleurs invisibles, et sert pendant l’édition.'},
  e:{zh:'編輯用寬色域，輸出到網路一律轉成 sRGB。', en:'Edit wide; always convert to sRGB for the web.', fr:'Éditez en large gamut ; convertissez toujours en sRGB pour le web.'} },
{ c:'col', id:'icc', k:{zh:'色彩描述檔與色彩管理', en:'ICC profiles and colour management', fr:'Profils ICC et gestion des couleurs'},
  m:{zh:'讓同一張照片在不同螢幕與印表機上看起來一致的機制。', en:'The machinery that makes one picture look the same on different screens and printers.', fr:'Le mécanisme qui fait qu’une image paraît identique sur différents écrans et imprimantes.'},
  p:{zh:'每個裝置都有描述檔，說明它的數字對應到什麼真實顏色。軟體把照片從它的色彩空間轉換到螢幕的描述檔再顯示。沒有附描述檔的圖片，多數軟體假設它是 sRGB。', en:'Each device has a profile stating what real colour its numbers produce. Software converts the picture from its own space into the screen’s profile before showing it. Untagged images are assumed by most software to be sRGB.', fr:'Chaque appareil a un profil indiquant la couleur réelle produite par ses valeurs. Le logiciel convertit l’image de son espace vers le profil de l’écran avant l’affichage. Une image sans profil est supposée sRGB par la plupart des logiciels.'},
  e:{zh:'輸出時勾選「嵌入色彩描述檔」；不支援色彩管理的平台會讓寬色域照片變灰。', en:'Tick “embed colour profile” on export; platforms without colour management make wide-gamut pictures look washed out.', fr:'Cochez « incorporer le profil » à l’export ; les plateformes sans gestion des couleurs rendent ternes les images en large gamut.'} },
{ c:'col', id:'calib', k:{zh:'螢幕校色', en:'Monitor calibration', fr:'Étalonnage de l’écran'},
  m:{zh:'量測並修正螢幕本身的偏色與亮度。', en:'Measuring and correcting the screen’s own colour cast and brightness.', fr:'Mesurer et corriger la dominante et la luminosité propres à l’écran.'},
  p:{zh:'用校色器貼在螢幕上量測色塊，產生這台螢幕的描述檔。常見目標：白點 6500K（D65）、Gamma 2.2；要對照印刷時亮度約 100 到 120 cd/m²。', en:'A colorimeter on the screen measures test patches and builds a profile for that display. Usual targets: white point 6500K (D65), gamma 2.2, and about 100 to 120 cd/m² when matching print.', fr:'Une sonde posée sur l’écran mesure des plages et crée le profil de cet écran. Cibles courantes : point blanc 6500K (D65), gamma 2,2, et 100 à 120 cd/m² pour comparer à l’impression.'},
  e:{zh:'照片印出來「比螢幕暗」，多半是螢幕太亮，不是印刷出錯。', en:'If prints look darker than the screen, the screen is usually too bright, not the print wrong.', fr:'Si le tirage paraît plus sombre que l’écran, c’est en général l’écran qui est trop lumineux.'} },
{ c:'col', id:'bit', k:{zh:'位元深度與色階斷層', en:'Bit depth and banding', fr:'Profondeur de bits et postérisation'},
  m:{zh:'每個色彩通道能分成幾階。', en:'How many steps each colour channel is divided into.', fr:'Le nombre de niveaux de chaque canal de couleur.'},
  p:{zh:'8 位元每通道 256 階（三通道約 1670 萬色）；RAW 多為 12 或 14 位元（4096 或 16384 階）；16 位元有 65536 階。大幅拉曲線時，原本的階被拉開，間距變大，平滑的天空就出現一條一條的斷層。', en:'8 bits give 256 levels per channel (about 16.7 million colours); RAW is usually 12 or 14 bits (4096 or 16384 levels); 16 bits give 65536. A strong curve stretches the levels apart, and a smooth sky breaks into visible bands.', fr:'8 bits donnent 256 niveaux par canal (environ 16,7 millions de couleurs) ; le RAW en a 12 ou 14 (4096 ou 16384 niveaux) ; 16 bits, 65536. Une courbe forte écarte les niveaux, et un ciel lisse se découpe en bandes.'},
  e:{zh:'拍 RAW、用 16 位元編輯，最後才輸出 8 位元 JPEG。', en:'Shoot RAW, edit in 16 bits, and only export to 8-bit JPEG at the end.', fr:'Photographiez en RAW, éditez en 16 bits, et n’exportez en JPEG 8 bits qu’à la fin.'} },
{ c:'col', id:'gamma', k:{zh:'伽瑪與線性資料', en:'Gamma and linear data', fr:'Gamma et données linéaires'},
  m:{zh:'檔案儲存的亮度數值，並不等於光量本身。', en:'The brightness values a file stores are not the light quantities themselves.', fr:'Les valeurs de luminosité stockées ne sont pas les quantités de lumière elles-mêmes.'},
  p:{zh:'感光元件記錄的是線性光量，但人眼對暗部變化比亮部敏感。若直接線性儲存，大半的階數會浪費在眼睛分不出的亮部。所以 JPEG 等檔案以伽瑪曲線編碼，把更多階數留給暗部。RAW 是線性資料，所以軟體要先套一條曲線才看起來正常。', en:'The sensor records light linearly, but the eye is more sensitive to changes in the shadows than in the highlights. Stored linearly, most of the levels would be spent on highlight steps no one can see. So JPEG and similar files are gamma-encoded, giving more levels to the shadows. RAW is linear, which is why software applies a curve before it looks normal.', fr:'Le capteur enregistre la lumière linéairement, mais l’œil est plus sensible aux variations dans les ombres. En linéaire, la plupart des niveaux seraient gaspillés dans des hautes lumières indiscernables. Le JPEG est donc codé en gamma, qui réserve plus de niveaux aux ombres. Le RAW est linéaire : le logiciel lui applique une courbe avant qu’il paraisse normal.'},
  e:{zh:'這也解釋了為何拉亮 8 位元 JPEG 的暗部特別容易出現雜訊與斷層。', en:'It also explains why lifting the shadows of an 8-bit JPEG so readily brings out noise and banding.', fr:'Cela explique aussi pourquoi remonter les ombres d’un JPEG 8 bits fait si vite apparaître bruit et postérisation.'} },
{ c:'col', id:'grade', k:{zh:'校色與調色', en:'Colour correction and grading', fr:'Correction et étalonnage'},
  m:{zh:'校色是把顏色修「對」，調色是修成「想要的樣子」。', en:'Correction makes colour right; grading makes it what you want.', fr:'La correction rend la couleur juste ; l’étalonnage la rend telle qu’on la veut.'},
  p:{zh:'先修正白平衡與偏色，讓中性色真的中性、膚色自然，再在這個基礎上做風格化。順序反過來，風格會建立在錯誤的顏色上。', en:'First correct white balance and casts so neutrals are neutral and skin natural, then stylise on that base. Reverse the order and the style is built on wrong colour.', fr:'Corrigez d’abord balance et dominantes, pour des neutres neutres et une peau naturelle, puis stylisez sur cette base. Dans l’autre ordre, le style repose sur une couleur fausse.'},
  e:{zh:'色彩分級、分割色調與 LUT 都屬於調色。', en:'Colour grading wheels, split toning and LUTs are all grading tools.', fr:'Roues d’étalonnage, virage partiel et LUT sont des outils d’étalonnage.'} },
{ c:'col', id:'lut', k:{zh:'色彩對照表（LUT）', en:'LUT (look-up table)', fr:'LUT (table de correspondance)'},
  m:{zh:'「輸入哪個顏色，就輸出哪個顏色」的對照表。', en:'A table saying which colour goes out for each colour that comes in.', fr:'Une table qui indique quelle couleur sort pour chaque couleur entrante.'},
  p:{zh:'3D LUT 把整個 RGB 立方體切成格點（例如 33×33×33），每點記錄對應的輸出色，中間用內插計算。它把一整套調色固定下來，可在不同軟體間共用。', en:'A 3D LUT divides the RGB cube into a grid (33×33×33, say), records an output colour at each node and interpolates between them. It freezes a whole grade so it can be shared between programs.', fr:'Une LUT 3D découpe le cube RVB en grille (33×33×33 par exemple), enregistre une couleur de sortie à chaque nœud et interpole entre eux. Elle fige un étalonnage entier, partageable entre logiciels.'},
  e:{zh:'套用前先把曝光與白平衡修正好，否則結果會差很多。', en:'Fix exposure and white balance before applying one, or the result will be far off.', fr:'Corrigez exposition et balance avant de l’appliquer, sinon le résultat sera loin du compte.'} },

/* ── Retouching ── */
{ c:'edit', id:'raw', k:{zh:'RAW 與去馬賽克', en:'RAW and demosaicing', fr:'RAW et dématriçage'},
  m:{zh:'RAW 是感光元件的原始讀數，還不是一張照片。', en:'A RAW file is the sensor’s raw readings, not yet a picture.', fr:'Un RAW est la lecture brute du capteur, pas encore une image.'},
  p:{zh:'每個像素上方只有一種顏色的濾鏡（拜耳陣列：紅、綠、綠、藍），所以每個像素只記錄一種顏色。軟體依周圍像素推算另外兩種顏色，叫去馬賽克；之後再套白平衡、伽瑪與色彩空間，才成為可看的影像。', en:'Each pixel sits under a filter of one colour (the Bayer pattern: red, green, green, blue), so each records one colour only. Software estimates the other two from neighbouring pixels, which is demosaicing; then white balance, gamma and a colour space are applied to make a viewable image.', fr:'Chaque photosite est sous un filtre d’une seule couleur (matrice de Bayer : rouge, vert, vert, bleu) et n’enregistre qu’une couleur. Le logiciel estime les deux autres à partir des voisins : c’est le dématriçage ; puis balance des blancs, gamma et espace colorimétrique donnent une image visible.'},
  e:{zh:'不同軟體的演算法不同，同一個 RAW 的細節與顏色會略有差異。', en:'Each program uses its own algorithm, so the same RAW looks slightly different in detail and colour.', fr:'Chaque logiciel a son algorithme : le même RAW diffère légèrement en détail et en couleur.'} },
{ c:'edit', id:'nondest', k:{zh:'非破壞性編輯', en:'Non-destructive editing', fr:'Retouche non destructive'},
  m:{zh:'編輯時不改動原始檔案。', en:'Editing without altering the original file.', fr:'Retoucher sans modifier le fichier original.'},
  p:{zh:'Lightroom 一類的軟體只記錄一串調整指令，顯示時即時套用；Photoshop 則用調整圖層、智慧型物件與遮色片達到同樣效果。', en:'Programs like Lightroom store only a list of instructions, applied live on display; Photoshop gets the same with adjustment layers, smart objects and masks.', fr:'Les logiciels comme Lightroom ne stockent qu’une liste d’instructions appliquées à l’affichage ; Photoshop obtient le même résultat avec calques de réglage, objets dynamiques et masques.'},
  e:{zh:'隨時可以回頭改任何一步，也能從同一張照片做出多個版本。', en:'Any step can be revisited, and one photograph can yield several versions.', fr:'Chaque étape reste modifiable, et une photo peut donner plusieurs versions.'} },
{ c:'edit', id:'hist', k:{zh:'直方圖', en:'Histogram', fr:'Histogramme'},
  m:{zh:'統計每個亮度有多少像素的圖。', en:'A chart counting how many pixels sit at each brightness.', fr:'Un graphique qui compte les pixels à chaque luminosité.'},
  p:{zh:'橫軸由純黑（0）到純白（255），縱軸是像素數。也可以分紅、綠、藍三個通道看，單一通道撞到右牆，表示那個顏色已經飽和到爆。', en:'The horizontal axis runs from pure black (0) to pure white (255), the vertical counts pixels. It can be split into red, green and blue; one channel hitting the right wall means that colour has clipped.', fr:'L’axe horizontal va du noir pur (0) au blanc pur (255), l’axe vertical compte les pixels. On peut le séparer en rouge, vert et bleu ; un canal collé à droite signale une couleur écrêtée.'},
  e:{zh:'判斷曝光與裁切最可靠的工具，比看螢幕準。', en:'The most reliable judge of exposure and clipping, better than the screen.', fr:'Le juge le plus sûr de l’exposition et de l’écrêtage, meilleur que l’écran.'} },
{ c:'edit', id:'clip', k:{zh:'裁切（死白、死黑）', en:'Clipping', fr:'Écrêtage'},
  m:{zh:'亮度超出可記錄範圍，被截成純白或純黑。', en:'Brightness beyond the recordable range, cut off to pure white or pure black.', fr:'Une luminosité hors de la plage enregistrable, tronquée en blanc ou noir pur.'},
  p:{zh:'像素已達最大值，任何更亮的細節都被記成同一個數字，資訊永久消失。RAW 的亮部常比相機螢幕顯示的多保留一點，但真正爆掉的仍救不回。', en:'The pixel has reached its maximum, so every brighter detail is recorded as the same number and the information is gone for good. RAW often holds a little more than the camera screen suggests, but truly clipped areas cannot be recovered.', fr:'Le pixel a atteint son maximum : tout détail plus clair est noté par le même nombre, l’information est perdue. Le RAW garde souvent un peu plus que ne le montre l’écran, mais une zone vraiment écrêtée est irrécupérable.'},
  e:{zh:'按住 Alt／Option 拖曳白色或黑色滑桿，就能看到從哪裡開始裁切。', en:'Hold Alt/Option while dragging the whites or blacks slider to see where clipping starts.', fr:'Maintenez Alt/Option en glissant le curseur blancs ou noirs pour voir où commence l’écrêtage.'} },
{ c:'edit', id:'levels', k:{zh:'色階', en:'Levels', fr:'Niveaux'},
  m:{zh:'用黑點、白點與中間調三個控制點調整亮度分布。', en:'Adjusting tonal distribution with three controls: black point, white point, midtone.', fr:'Régler la répartition des tons avec trois commandes : point noir, point blanc, tons moyens.'},
  p:{zh:'黑點往右移，原本那個亮度以下都變純黑；白點往左移同理；中間的灰點改變中間調亮度而不動兩端。它其實是只有三個控制點的曲線。', en:'Moving the black point right turns everything below it pure black; the white point works the same way; the grey point changes the midtones while the ends stay put. It is really a curve with three handles.', fr:'Déplacer le point noir vers la droite rend noir tout ce qui est en dessous ; même chose pour le point blanc ; le point gris modifie les tons moyens sans toucher aux extrêmes. C’est en fait une courbe à trois poignées.'},
  e:{zh:'快速設定對比、修正灰濛濛的照片。', en:'A quick way to set contrast and fix a flat, grey picture.', fr:'Un moyen rapide de régler le contraste d’une image terne.'} },
{ c:'edit', id:'curve', k:{zh:'色調曲線', en:'Tone curve', fr:'Courbe de tonalité'},
  m:{zh:'把每個輸入亮度對應到輸出亮度的曲線。', en:'A curve mapping each input brightness to an output brightness.', fr:'Une courbe qui associe chaque luminosité d’entrée à une luminosité de sortie.'},
  p:{zh:'曲線某段變陡，那一段的明暗差被拉大，對比增加；變平則對比降低。總範圍固定，所以某處加對比，另一處必然減少。也可以分通道調，例如在藍色通道把暗部往上拉，陰影就偏藍。', en:'Where the curve gets steeper, that range is stretched and gains contrast; where it flattens, contrast drops. The total range is fixed, so contrast added in one place is taken from another. It can work per channel: lifting the shadows in the blue channel turns them blue.', fr:'Là où la courbe se raidit, la plage s’étire et gagne du contraste ; là où elle s’aplatit, il baisse. La plage totale est fixe : le contraste gagné ici est pris ailleurs. On peut agir par canal : relever les ombres du canal bleu les bleuit.'},
  e:{zh:'見修圖章節的三種曲線圖。', en:'See the three curves in the retouching part.', fr:'Voir les trois courbes dans la partie retouche.'} },
{ c:'edit', id:'clarity', k:{zh:'對比、清晰度、紋理、去朦朧', en:'Contrast, clarity, texture, dehaze', fr:'Contraste, clarté, texture, correction de la brume'},
  m:{zh:'四個讓照片更有力的滑桿，作用的尺度不同。', en:'Four sliders that add punch, each at a different scale.', fr:'Quatre curseurs qui donnent du peps, chacun à une échelle différente.'},
  p:{zh:'對比作用於整張照片的明暗範圍。清晰度是「局部對比」，以較大半徑增加中間調邊緣的明暗差，讓物體更立體。紋理針對中等大小的細節，如皮膚、樹葉、布料。去朦朧會估算霧氣並扣除，同時提高對比與飽和度。', en:'Contrast works on the tonal range of the whole picture. Clarity is local contrast: at a large radius it deepens the light-dark difference along midtone edges, making forms more solid. Texture targets medium-sized detail such as skin, leaves and fabric. Dehaze estimates the haze and subtracts it, raising contrast and saturation too.', fr:'Le contraste agit sur toute la plage tonale. La clarté est un contraste local : à grand rayon, elle creuse l’écart clair-sombre le long des contours des tons moyens et donne du volume. La texture vise le détail moyen : peau, feuillage, tissu. La correction de la brume estime le voile et le retire, en augmentant contraste et saturation.'},
  e:{zh:'人像常把紋理略降以柔膚；清晰度與去朦朧拉太多會出現光暈與髒色。', en:'Portraits often take texture down a little to soften skin; too much clarity or dehaze brings halos and dirty colour.', fr:'En portrait, on baisse souvent un peu la texture pour adoucir la peau ; trop de clarté ou de correction de brume donne halos et couleurs sales.'} },
{ c:'edit', id:'hs', k:{zh:'亮部、陰影、白色、黑色', en:'Highlights, shadows, whites, blacks', fr:'Hautes lumières, ombres, blancs, noirs'},
  m:{zh:'分別調整不同亮度區段的滑桿。', en:'Sliders that each work on a band of brightness.', fr:'Des curseurs qui agissent chacun sur une bande de luminosité.'},
  p:{zh:'亮部與陰影作用於較寬的中高與中低範圍，並帶有局部適應，會參考周圍亮度，避免整片變平；白色與黑色則設定兩端的位置。', en:'Highlights and shadows cover the broad upper and lower middle, with local adaptation that looks at the surroundings to avoid flattening everything; whites and blacks set the two ends.', fr:'Hautes lumières et ombres couvrent les larges zones claires et sombres, avec une adaptation locale qui tient compte du voisinage pour ne pas tout aplatir ; blancs et noirs fixent les extrémités.'},
  e:{zh:'先用亮部、陰影找回細節，再用白色、黑色把兩端拉到剛好不裁切。', en:'Recover detail with highlights and shadows first, then set whites and blacks just short of clipping.', fr:'Récupérez le détail avec hautes lumières et ombres, puis placez blancs et noirs juste avant l’écrêtage.'} },
{ c:'edit', id:'sharp', dia:'sharp', k:{zh:'銳利化（USM）', en:'Sharpening (unsharp mask)', fr:'Accentuation (masque flou)'},
  m:{zh:'讓邊緣看起來更清楚的處理。', en:'Processing that makes edges look crisper.', fr:'Un traitement qui rend les contours plus nets.'},
  p:{zh:'把照片模糊一份，用原圖減去模糊版本得到「邊緣」，再把邊緣加回原圖。結果是邊緣暗的一側更暗、亮的一側更亮，看起來就更銳利（見下圖）。它沒有增加任何細節。「總量」是加多少，「半徑」是邊緣多寬，「細節／臨界值」決定小差異要不要處理。', en:'Blur a copy of the picture, subtract it from the original to isolate the edges, and add those edges back. The dark side of each edge gets darker and the light side lighter, which reads as sharpness (see the diagram). No detail is created. Amount is how much, radius how wide the edge, detail or threshold whether small differences are touched.', fr:'On floute une copie, on la soustrait de l’original pour isoler les contours, puis on les rajoute. Le côté sombre de chaque contour s’assombrit et le côté clair s’éclaircit, ce qui se lit comme de la netteté (voir le schéma). Aucun détail n’est créé. Gain : combien ; rayon : largeur du contour ; détail ou seuil : traiter ou non les petites différences.'},
  e:{zh:'半徑太大會出現白邊光暈；用遮色片只加在邊緣，不要加到天空與皮膚。', en:'Too large a radius gives white halos; mask it to edges only, keeping it off sky and skin.', fr:'Un rayon trop grand donne des halos blancs ; masquez pour ne toucher que les contours, pas le ciel ni la peau.'} },
{ c:'edit', id:'nr', k:{zh:'降噪', en:'Noise reduction', fr:'Réduction du bruit'},
  m:{zh:'減少雜訊的處理。', en:'Processing that reduces noise.', fr:'Un traitement qui réduit le bruit.'},
  p:{zh:'傳統降噪把相近的像素平均，雜訊少了，細節也被抹平。色彩雜訊可大幅降而不太傷細節，因為眼睛對顏色細節不敏感。新的 AI 降噪在去馬賽克階段就學會分辨雜訊與紋理，效果好得多。', en:'Classic noise reduction averages similar pixels, removing noise and detail together. Colour noise can be removed heavily with little loss, because the eye is insensitive to fine colour detail. Newer AI denoising learns to tell noise from texture at the demosaicing stage and does far better.', fr:'Le débruitage classique moyenne les pixels voisins : il retire le bruit et le détail ensemble. Le bruit chromatique se retire fortement sans grande perte, l’œil étant peu sensible au détail de couleur. Le débruitage par IA apprend à distinguer bruit et texture dès le dématriçage, avec de bien meilleurs résultats.'},
  e:{zh:'先降噪再銳利化；降太多皮膚會像蠟。', en:'Reduce noise before sharpening; overdo it and skin turns to wax.', fr:'Débruitez avant d’accentuer ; trop, et la peau devient cireuse.'} },
{ c:'edit', id:'mask', k:{zh:'圖層與遮色片', en:'Layers and masks', fr:'Calques et masques'},
  m:{zh:'把調整分層疊放，再用遮色片決定每層作用在哪裡。', en:'Stacking adjustments in layers and using masks to decide where each applies.', fr:'Empiler les réglages en calques et décider par des masques où chacun agit.'},
  p:{zh:'遮色片是一張灰階圖：白色＝顯示這層效果、黑色＝隱藏、灰色＝部分顯示，口訣是「白顯黑隱」。用柔邊筆刷或漸層畫遮色片，就能做出自然的局部調整。', en:'A mask is a greyscale image: white shows the layer’s effect, black hides it, grey shows it partly. “White reveals, black conceals.” Painting masks with soft brushes or gradients gives natural local adjustments.', fr:'Un masque est une image en niveaux de gris : le blanc montre l’effet, le noir le cache, le gris le montre en partie. « Le blanc révèle, le noir masque. » Peindre au pinceau doux ou en dégradé donne des retouches locales naturelles.'},
  e:{zh:'所有局部修飾的基礎；AI 選取天空或人物，本質上也是自動產生遮色片。', en:'The basis of all local work; AI selection of a sky or a person simply generates a mask automatically.', fr:'La base de tout travail local ; la sélection d’un ciel ou d’une personne par IA ne fait que générer un masque.'} },
{ c:'edit', id:'blend', k:{zh:'混合模式', en:'Blend modes', fr:'Modes de fusion'},
  m:{zh:'決定上層像素如何與下層合成的規則。', en:'The rule for how an upper layer combines with the one below.', fr:'La règle qui dit comment un calque se combine avec celui du dessous.'},
  p:{zh:'色彩增值（Multiply）把兩層數值相乘，只會變暗；濾色（Screen）反過來，只會變亮；柔光與覆蓋以 50% 灰為中性，比灰亮的地方變亮、比灰暗的地方變暗。', en:'Multiply multiplies the two layers and can only darken; Screen is its inverse and can only lighten; Soft Light and Overlay treat 50% grey as neutral, lightening where the layer is lighter than grey and darkening where it is darker.', fr:'Produit multiplie les deux calques et ne peut qu’assombrir ; Superposition (Screen) en est l’inverse et ne peut qu’éclaircir ; Lumière douce et Incrustation prennent le gris 50 % comme neutre, éclaircissant au-dessus et assombrissant en dessous.'},
  e:{zh:'加亮加深常用「柔光」圖層填 50% 灰再用黑白筆刷畫；「明度」模式可以只改亮度不動顏色。', en:'Dodge and burn is often a Soft Light layer filled with 50% grey, painted in black and white; Luminosity mode changes brightness without touching colour.', fr:'Le dodge & burn se fait souvent sur un calque Lumière douce rempli de gris 50 %, peint en noir et blanc ; le mode Luminosité change la luminosité sans toucher à la couleur.'} },
{ c:'edit', id:'heal', k:{zh:'修復筆與仿製印章', en:'Healing brush and clone stamp', fr:'Correcteur et tampon de duplication'},
  m:{zh:'兩種把瑕疵蓋掉的工具。', en:'Two tools for covering blemishes.', fr:'Deux outils pour masquer les défauts.'},
  p:{zh:'仿製印章把來源區像素原封不動複製過去。修復筆只複製紋理，再依目標周圍的顏色與亮度自動融合，所以接縫較不明顯。內容感知填色更進一步，由軟體推測該補上什麼。', en:'The clone stamp copies source pixels exactly. The healing brush copies only the texture and blends it into the colour and brightness around the target, so seams show less. Content-aware fill goes further, letting the software infer what belongs there.', fr:'Le tampon copie les pixels source à l’identique. Le correcteur ne copie que la texture et la fond dans la couleur et la luminosité autour de la cible, d’où des raccords plus discrets. Le remplissage selon le contenu va plus loin : le logiciel déduit ce qui doit s’y trouver.'},
  e:{zh:'大面積平滑區用修復，邊緣與直線附近用仿製。', en:'Heal in broad smooth areas; clone near edges and straight lines.', fr:'Corrigez dans les zones lisses ; dupliquez près des bords et des lignes droites.'} },
{ c:'edit', id:'ppi', k:{zh:'解析度、PPI 與 DPI', en:'Resolution, PPI and DPI', fr:'Résolution, PPI et DPI'},
  m:{zh:'照片有多少像素，以及印出時每英吋放幾個像素。', en:'How many pixels a picture has, and how many are placed per inch when printed.', fr:'Le nombre de pixels d’une image, et combien on en place par pouce à l’impression.'},
  p:{zh:'像素數（如 6000×4000）是檔案本身的資訊量。PPI 是輸出時每英吋放多少像素，決定印出尺寸；DPI 是印表機每英吋噴幾個墨點，屬於印表機規格。檔案裡寫的 72 或 300 對網路顯示沒有任何影響。', en:'The pixel count (6000×4000, say) is the file’s actual information. PPI is how many pixels go into each inch on output, which sets print size; DPI is how many ink dots a printer lays per inch, a printer specification. The 72 or 300 written in a file makes no difference at all on the web.', fr:'Le nombre de pixels (6000×4000 par exemple) est l’information réelle du fichier. Le PPI est le nombre de pixels par pouce à la sortie, qui fixe la taille du tirage ; le DPI est le nombre de points d’encre par pouce, une caractéristique de l’imprimante. Le 72 ou 300 inscrit dans un fichier ne change rien sur le web.'},
  e:{zh:'近看的印刷品約需 300 PPI：6000 像素寬可印約 50 公分；海報看得遠，150 PPI 就夠。', en:'Prints seen up close need about 300 PPI: 6000 pixels wide prints about 50 cm; posters seen from afar are fine at 150 PPI.', fr:'Un tirage vu de près demande environ 300 PPI : 6000 pixels de large donnent environ 50 cm ; une affiche vue de loin se contente de 150 PPI.'} },
{ c:'edit', id:'jpeg', k:{zh:'壓縮與檔案格式', en:'Compression and file formats', fr:'Compression et formats'},
  m:{zh:'檔案如何儲存照片。', en:'How a file stores a picture.', fr:'La manière dont un fichier stocke une image.'},
  p:{zh:'JPEG 是有損壓縮：把影像切成 8×8 小塊，捨棄眼睛不敏感的細微變化；品質越低丟越多，會出現方塊與邊緣雜點，每次重新存檔都再損失一次。HEIF 壓縮效率更好。TIFF、PNG 是無損，檔案大。DNG 是開放的 RAW 格式。', en:'JPEG is lossy: it cuts the image into 8×8 blocks and discards fine variation the eye barely notices; lower quality discards more, bringing blocks and edge artefacts, and every re-save loses again. HEIF compresses more efficiently. TIFF and PNG are lossless and large. DNG is an open RAW format.', fr:'Le JPEG est avec pertes : il découpe l’image en blocs de 8×8 et supprime les variations fines peu visibles ; plus la qualité baisse, plus il supprime, d’où blocs et artefacts, et chaque réenregistrement perd encore. Le HEIF compresse mieux. TIFF et PNG sont sans perte et lourds. Le DNG est un format RAW ouvert.'},
  e:{zh:'編輯中存 TIFF 或 PSD，最後才輸出 JPEG；不要反覆打開 JPEG 修改後覆蓋存檔。', en:'Keep work in progress as TIFF or PSD and export JPEG last; never repeatedly open, edit and overwrite a JPEG.', fr:'Gardez le travail en cours en TIFF ou PSD et exportez le JPEG en dernier ; ne rouvrez et n’écrasez jamais un JPEG à répétition.'} },
{ c:'edit', id:'profile', k:{zh:'鏡頭描述檔校正', en:'Lens profile correction', fr:'Correction de profil d’objectif'},
  m:{zh:'依鏡頭型號自動修正變形、暗角與色差。', en:'Automatic correction of distortion, vignetting and fringing for a given lens.', fr:'Correction automatique de distorsion, vignetage et franges selon l’objectif.'},
  p:{zh:'廠商或軟體事先量測每顆鏡頭在各焦距與光圈的缺陷，修圖時反向套用。許多無反鏡頭刻意保留變形，預期由軟體修正，以換取更小的體積。', en:'The maker or software vendor measures each lens’s faults at every focal length and aperture, and the correction is applied in reverse. Many mirrorless lenses deliberately leave distortion for software to fix, in exchange for a smaller lens.', fr:'Le fabricant ou l’éditeur mesure les défauts de chaque objectif à chaque focale et ouverture, puis les corrige à l’inverse. Beaucoup d’objectifs hybrides laissent volontairement la distorsion au logiciel, en échange d’un encombrement réduit.'},

];

let termTab = 'opt', termQ = '';
function pickTermTab(id) { termTab = id; termQ = ''; const q = document.getElementById('term-q'); if (q) q.value = ''; renderTerms(); }
function renderTerms() {
  const q = termQ.trim().toLowerCase();
  document.getElementById('term-tabs').innerHTML = TERM_CATS.map(c => {
    const on = !q && termTab === c.id, n = TERMS.filter(x => x.c === c.id).length;
    return '<button onclick="pickTermTab(\'' + c.id + '\')" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors '
      + (on ? 'bg-sky-500/15 text-sky-200 border-sky-500/40' : 'bg-slate-900/70 text-slate-400 border-slate-800 hover:text-slate-200') + '">'
      + '<i class="fa-solid ' + c.i + ' mr-1.5"></i>' + t(c.t) + ' <span class="opacity-60">' + n + '</span></button>';
  }).join('');
  const hay = x => [x.k.zh, x.k.en, x.k.fr, t(x.m)].join(' ').toLowerCase();
  const list = q ? TERMS.filter(x => hay(x).includes(q)) : TERMS.filter(x => x.c === termTab);
  const others = x => ['zh','en','fr'].filter(l => l !== LANG).map(l => x.k[l]).join(' · ');
  const row = (lab, txt, col) =>
      '<div class="flex gap-3 mt-2.5">'
    +   '<span class="shrink-0 text-[0.62rem] font-black tracking-wider px-2 py-0.5 rounded h-fit ' + col + '">' + lab + '</span>'
    +   '<p class="text-xs text-slate-300 leading-relaxed">' + txt + '</p>'
    + '</div>';
  document.getElementById('term-grid').innerHTML = list.length ? list.map(x =>
      '<div id="term-' + x.id + '" class="bg-slate-900/40 rounded-2xl border border-slate-800 p-5 scroll-mt-28' + (x.dia ? ' md:col-span-2' : '') + '">'
    +   '<div class="flex items-baseline flex-wrap gap-x-2">'
    +     '<h3 class="text-base font-black text-white">' + t(x.k) + '</h3>'
    +     '<span class="text-[0.7rem] text-slate-500">' + esc(others(x)) + '</span>'
    +     (q ? '<span class="ml-auto text-[0.6rem] text-sky-300">' + t(TERM_CATS.find(c => c.id === x.c).t) + '</span>' : '')
    +   '</div>'
    +   row(ui('term.m'), t(x.m), 'bg-sky-500/15 text-sky-300')
    +   row(ui('term.p'), t(x.p), 'bg-violet-500/15 text-violet-300')
    +   row(ui('term.e'), t(x.e), 'bg-amber-500/15 text-amber-300')
    +   (x.dia === 'dof' ? dofDiagram() : x.dia === 'sharp' ? sharpDiagram() : '')
    + '</div>').join('')
    : '<p class="text-sm text-slate-500">' + ui('terms.none') + '</p>';
}

function renderColor() {

  document.getElementById('wheel-dia').innerHTML = wheelDiagram();

    +   '<h4 class="text-sm font-black text-white">' + t(x.t) + '</h4>'

}

let revealObserver = null;
function armReveals(root) {
  const els = root.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window) ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    els.forEach(e => e.classList.add('in')); return;
  }
  if (!revealObserver) {
    revealObserver = new IntersectionObserver((es, obs) => {
      es.forEach(e => { if (!e.isIntersecting) return;
        setTimeout(() => e.target.classList.add('in'), (+e.target.dataset.i || 0) * 70);
        obs.unobserve(e.target); });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });
  }
  els.forEach((e, i) => { if (!e.classList.contains('in')) { e.dataset.i = i % 5; revealObserver.observe(e); } });
}

 'nav.cam':'Camera','nav.exp':'Exposure','nav.p1':'1 · Beginner','nav.p2':'2 · Intermediate','nav.p3':'3 · Advanced','nav.edit':'Retouching','nav.ref':'Reference',
 'intro':'A photograph is the result of three things: how the camera gathers light, how you control it, and how you treat it afterwards. Equipment sets the ceiling, but most pictures are nowhere near it. What separates them is judgement of exposure, attention to light, and restraint in editing.',
 'intro2':'This volume first takes apart the camera and the principle of exposure, then goes in three parts from getting a sharp picture to controlling light and time, then explains colour and the retouching workflow. The meaning and principle of every technical term are collected, searchable, under Terms and principles. Every diagram is computed from the optics and colour science.',
 'cam.eyebrow':'Know the tool first','cam.h2':'How a camera is built',
 'cam.lead':'Every camera, from a phone to medium format, works the same way: the lens focuses the light, the aperture sets the size of the opening, the shutter sets the time, the sensor records the result. Read this cross-section and every setting that follows is simply an adjustment to one of these four parts.',
 'cam.h.sensor':'Sensor size','cam.p.sensor':'A larger sensor collects more light in total, giving less noise and easier background blur. The crop factor is full frame’s diagonal divided by the sensor’s own, and is used to convert angles of view.',
 'exp.eyebrow':'The one diagram that matters most','exp.h2':'The three controls, and the stop',
 'exp.lead':'Brightness is set jointly by three controls: aperture (how wide the opening), shutter (how long it stays open) and ISO (how much the signal is amplified). All three move in stops, each a doubling or halving of light, so they trade against one another. What you are really choosing is the side effect.',
 'exp.h.ap':'Aperture: a smaller number, a bigger hole','exp.p.ap':'The openings below are drawn for one focal length. The f-number is focal length ÷ opening diameter, so f/2 is twice as wide as f/4 and four times the area: two stops apart.',
 'edit.h2':'Part 4 · Retouching: from RAW to finished picture',
 'edit.lead':'Retouching does not turn a photograph into a different one. It brings out what the camera recorded but has not yet shown. The workflow below follows the order common to RAW editors such as Lightroom, Capture One and Darktable; local work is done in a layer editor such as Photoshop.',
 'edit.h.hist':'Learn to read the histogram first','edit.p.hist':'The histogram counts how many pixels sit at each brightness, black on the left, white on the right. There is no correct shape, only one principle: important detail must not hit a wall.',
 'edit.h.flow':'The order of global adjustments','edit.p.flow':'Order matters: each step changes how you judge every step after it. Work from large to small, from the whole to the part.',
 'edit.h.curve':'The tone curve: where a look comes from','edit.p.curve':'The horizontal axis is the original brightness, the vertical axis the adjusted one. Bend the curve up to brighten, down to darken; wherever it gets steeper, contrast in that range increases.',
 'edit.h.local':'Local work','edit.h.over':'Signs of overediting',
 'nav.col':'Colour',
 'nav.terms':'Glossary',
 'col.eyebrow':'How colour works',
 'col.h2':'Colour: from light to file',
 'col.lead':'Colour is not a property of objects but the outcome of light, the eye and a device acting together. Follow that chain and it becomes clear why one picture looks different on a phone, a computer and a print, and what each colour slider in an editor is actually moving.',
 'col.h.rgb':'Additive and subtractive: why screen and print differ',
 'col.p.rgb':'The overlaps below are produced by the browser’s real blending arithmetic, not painted in. Light gets brighter as it stacks and ink gets darker, which is why screens use RGB and print uses CMYK.',
 'col.h.wheel':'The colour wheel and HSL: three ways to describe a colour',
 'col.p.wheel':'An editor’s HSL panel and colour-grading wheels are all built on this picture. Hue is the angle, saturation the radius, luminance a separate axis.',
 'col.h.k':'Colour temperature and white balance',
 'col.p.k':'The band is computed from an approximation of black-body radiation. The lower half addresses the most confusing point: the white-balance setting is you telling the camera the temperature of the light, and the camera then compensates in the opposite direction.',
 'col.h.gamut':'Colour spaces: one number, different colours',
 'col.p.gamut':'The horseshoe is the CIE 1931 chromaticity diagram, its rim the pure colours of single wavelengths. Each triangle’s corners are the red, green and blue primaries in that space’s specification. Colours outside a triangle cannot be represented in that space.',
 'col.h.bit':'Bit depth: a gradient needs enough steps',
 'col.p.bit':'The same ramp from black to white, shown with only 8, 32 and 256 levels. Too few levels show as bands, and skies in heavily edited 8-bit files are where it happens most.',
 'col.h.flow':'Colour management in four steps',
 'terms.eyebrow':'Look it up',
 'terms.h2':'Terms and principles',
 'terms.lead':'Every term is explained in three parts: <b class="text-sky-300">meaning</b> (what it is), <b class="text-violet-300">principle</b> (why it behaves that way) and <b class="text-amber-300">in practice</b> (what it means when shooting or editing). Switch category or search directly, in Chinese, English or French.',
 'terms.ph':'Search terms, e.g. depth of field, gamut',
 'terms.none':'No matching term.',
 'term.m':'MEANING',
 'term.p':'PRINCIPLE',
 'term.e':'IN PRACTICE',
 'tipLabel':'The usual mistake',
 'ref.eyebrow':'Reference','ref.h2':'Tables',
 'ref.h.eq':'Equivalent exposures','ref.p.eq':'Every row lets in exactly the same amount of light; only the side effects differ. Each stop the aperture closes, the shutter opens one stop longer.',
 'ref.eq.th0':'Aperture','ref.eq.th1':'Shutter (s)','ref.eq.th2':'ISO','ref.eq.th3':'Effect on the picture',
 'ref.h.fl':'Focal length and angle of view','ref.p.fl':'Angles are computed for a 36 mm-wide full-frame sensor. The APS-C column gives the focal length that produces the same angle on an APS-C (×1.5) body.',
 'ref.fl.th0':'Focal length (full frame)','ref.fl.th1':'Horizontal angle','ref.fl.th2':'APS-C equivalent','ref.fl.th3':'Typical use',
 'ref.h.scene':'Starting settings by scene','ref.p.scene':'A starting point, not an answer. Take one frame with these, look at the histogram and the picture, then correct.',
 'ref.sc.th0':'Scene','ref.sc.th1':'Mode','ref.sc.th2':'Aperture','ref.sc.th3':'Shutter','ref.sc.th4':'Notes',
 'ref.h.wb':'Colour temperature of light sources','ref.p.wb':'Approximate values. Real sources vary widely, and LED and fluorescent light often add a green or magenta cast as well.',
 'ref.h.rule':'Rules of thumb','ref.p.rule':'A few rules you can work out in your head on location.',
 'footer':'A photography reference from first shots to retouching. Aperture, angle of view and sensor figures are computed from optical formulas; button names and software layouts differ between brands, and your camera manual and your own software take precedence.'
},
fr:{
 'doc.title':'Photographie : appareil, exposition et retouche',
 'hdr.badge':'TUTORIEL DE PHOTOGRAPHIE','hdr.title':'Photographie : appareil, exposition et retouche',
 'nav.cam':'Appareil','nav.exp':'Exposition','nav.p1':'1 · Débutant','nav.p2':'2 · Intermédiaire','nav.p3':'3 · Avancé','nav.edit':'Retouche','nav.ref':'Références',
 'intro':'Une photographie résulte de trois choses : la manière dont l’appareil recueille la lumière, celle dont vous la maîtrisez, et ce que vous en faites ensuite. Le matériel fixe le plafond, mais la plupart des images en sont très loin. Ce qui les distingue, c’est le jugement de l’exposition, l’attention à la lumière et la retenue au développement.',
 'intro2':'Ce volume démonte d’abord l’appareil et le principe de l’exposition, va en trois parties de l’image nette à la maîtrise de la lumière et du temps, puis explique la couleur et le flux de retouche. Le sens et le principe de chaque terme technique sont réunis, avec recherche, dans Termes et principes. Chaque schéma est calculé à partir de l’optique et de la science des couleurs.',
 'cam.eyebrow':'D’abord l’outil','cam.h2':'L’anatomie d’un appareil photo',
 'cam.lead':'Tout appareil, du smartphone au moyen format, fonctionne de la même manière : l’objectif fait converger la lumière, le diaphragme règle la taille de l’ouverture, l’obturateur la durée, le capteur enregistre le résultat. Lisez cette coupe, et chaque réglage qui suit n’est qu’une action sur l’une de ces quatre pièces.',
 'cam.h.sensor':'La taille du capteur','cam.p.sensor':'Un capteur plus grand reçoit plus de lumière au total : moins de bruit, flou d’arrière-plan plus facile. Le coefficient de recadrage est la diagonale du plein format divisée par celle du capteur ; il sert à convertir les angles de champ.',
 'exp.eyebrow':'Le schéma le plus important','exp.h2':'Les trois réglages, et l’IL',
 'exp.lead':'La luminosité dépend conjointement de trois réglages : l’ouverture (la taille du trou), la vitesse (la durée) et les ISO (l’amplification du signal). Tous trois se comptent en IL, chacun doublant ou divisant la lumière par deux, et se compensent donc. Ce que l’on choisit vraiment, c’est l’effet secondaire.',
 'exp.h.ap':'L’ouverture : petit nombre, grand trou','exp.p.ap':'Les ouvertures ci-dessous sont dessinées pour une même focale. Le nombre f vaut focale ÷ diamètre de l’ouverture : f/2 est deux fois plus large que f/4 et quatre fois plus grand en surface, soit deux IL d’écart.',
 'edit.h2':'Partie 4 · Retouche : du RAW à l’image finie',
 'edit.lead':'Retoucher ne transforme pas une photographie en une autre. Cela révèle ce que l’appareil a enregistré sans encore le montrer. Le flux ci-dessous suit l’ordre commun aux dérawtiseurs comme Lightroom, Capture One ou Darktable ; le travail local se fait dans un éditeur à calques comme Photoshop.',
 'edit.h.hist':'Apprendre d’abord à lire l’histogramme','edit.p.hist':'L’histogramme compte les pixels à chaque niveau de luminosité, le noir à gauche, le blanc à droite. Il n’y a pas de bonne forme, seulement un principe : le détail important ne doit pas toucher les bords.',
 'edit.h.flow':'L’ordre des réglages globaux','edit.p.flow':'L’ordre compte : chaque étape change le jugement de toutes les suivantes. Du général au particulier, de l’ensemble au détail.',
 'edit.h.curve':'La courbe de tonalité : d’où vient le rendu','edit.p.curve':'L’axe horizontal est la luminosité d’origine, l’axe vertical la luminosité corrigée. Courber vers le haut éclaircit, vers le bas assombrit ; là où la pente s’accentue, le contraste de cette plage augmente.',
 'edit.h.local':'Le travail local','edit.h.over':'Les signes d’une retouche excessive',
 'nav.col':'Couleur',
 'nav.terms':'Glossaire',
 'col.eyebrow':'Comprendre la couleur',
 'col.h2':'La couleur : de la lumière au fichier',
 'col.lead':'La couleur n’est pas une propriété des objets, mais le résultat de la lumière, de l’œil et d’un appareil qui agissent ensemble. En suivant cette chaîne, on comprend pourquoi une même image diffère sur un smartphone, un ordinateur et un tirage, et ce que déplace réellement chaque curseur de couleur.',
 'col.h.rgb':'Additive et soustractive : pourquoi écran et impression diffèrent',
 'col.p.rgb':'Les recouvrements ci-dessous sont produits par le vrai calcul de fusion du navigateur, pas peints. La lumière s’éclaircit en s’additionnant, l’encre s’assombrit : d’où le RVB des écrans et le CMJN de l’impression.',
 'col.h.wheel':'Le cercle chromatique et la TSL : trois façons de décrire une couleur',
 'col.p.wheel':'Le panneau TSL et les roues d’étalonnage d’un logiciel reposent tous sur cette image. La teinte est l’angle, la saturation le rayon, la luminance un axe à part.',
 'col.h.k':'Température de couleur et balance des blancs',
 'col.p.k':'La bande est calculée à partir d’une approximation du rayonnement du corps noir. La moitié inférieure traite le point le plus déroutant : le réglage de balance, c’est vous qui indiquez à l’appareil la température de la source, et il compense en sens inverse.',
 'col.h.gamut':'Les espaces colorimétriques : un même nombre, des couleurs différentes',
 'col.p.gamut':'Le fer à cheval est le diagramme de chromaticité CIE 1931, son bord les couleurs pures d’une seule longueur d’onde. Les sommets de chaque triangle sont les primaires rouge, vert et bleu de la norme. Une couleur hors du triangle ne peut pas être représentée dans cet espace.',
 'col.h.bit':'Profondeur de bits : un dégradé a besoin d’assez de niveaux',
 'col.p.bit':'Le même dégradé du noir au blanc, avec seulement 8, 32 et 256 niveaux. Trop peu de niveaux se voient en bandes, surtout dans les ciels de fichiers 8 bits fortement retouchés.',
 'col.h.flow':'La gestion des couleurs en quatre étapes',
 'terms.eyebrow':'Chercher',
 'terms.h2':'Termes et principes',
 'terms.lead':'Chaque terme est expliqué en trois parties : <b class="text-sky-300">sens</b> (ce que c’est), <b class="text-violet-300">principe</b> (pourquoi il se comporte ainsi) et <b class="text-amber-300">en pratique</b> (ce que cela signifie à la prise de vue ou en retouche). Changez de catégorie ou cherchez directement, en chinois, anglais ou français.',
 'terms.ph':'Chercher, ex. profondeur de champ, gamut',
 'terms.none':'Aucun terme correspondant.',
 'term.m':'SENS',
 'term.p':'PRINCIPE',
 'term.e':'EN PRATIQUE',
 'tipLabel':'L’erreur habituelle',
 'ref.eyebrow':'Références','ref.h2':'Tableaux',
 'ref.h.eq':'Expositions équivalentes','ref.p.eq':'Chaque ligne laisse passer exactement la même quantité de lumière ; seuls les effets secondaires diffèrent. Chaque IL de fermeture est compensé par une vitesse plus lente d’un IL.',
 'ref.eq.th0':'Ouverture','ref.eq.th1':'Vitesse (s)','ref.eq.th2':'ISO','ref.eq.th3':'Effet sur l’image',
 'ref.h.fl':'Focale et angle de champ','ref.p.fl':'Angles calculés pour un capteur plein format de 36 mm de large. La colonne APS-C donne la focale qui produit le même angle sur un boîtier APS-C (×1,5).',
 'ref.fl.th0':'Focale (plein format)','ref.fl.th1':'Angle horizontal','ref.fl.th2':'Équivalent APS-C','ref.fl.th3':'Usage courant',
 'ref.h.scene':'Réglages de départ par situation','ref.p.scene':'Un point de départ, pas une réponse. Faites une image avec ces réglages, regardez l’histogramme et l’image, puis corrigez.',
 'ref.sc.th0':'Situation','ref.sc.th1':'Mode','ref.sc.th2':'Ouverture','ref.sc.th3':'Vitesse','ref.sc.th4':'Points clés',
 'ref.h.wb':'Température de couleur des sources','ref.p.wb':'Valeurs approximatives. Les sources réelles varient beaucoup, et les LED comme les tubes fluorescents ajoutent souvent une dominante verte ou magenta.',
 'ref.h.rule':'Règles pratiques','ref.p.rule':'Quelques règles à calculer de tête sur le terrain.',
 'footer':'Un guide de la photographie, des premières images à la retouche. Les valeurs d’ouverture, d’angle de champ et de capteur sont calculées par les formules optiques ; les noms des boutons et l’interface des logiciels varient selon les marques, et le manuel de votre appareil comme votre logiciel font autorité.'
}};
function ui(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || ''; }

const BTN_ON  = 'px-2.5 py-1 text-xs font-bold rounded-lg transition-all bg-cyan-500/15 text-cyan-300 border border-cyan-500/25';
const BTN_OFF = 'px-2.5 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200';
function setLanguage(lang) {
  if (!I18N[lang]) return;
  LANG = lang;
  try { localStorage.setItem('kb_lang', lang); } catch (e) {}
  ['zh','en','fr'].forEach(l => {
    const b = document.getElementById('lang-' + l);
    if (b) b.className = (l === lang) ? BTN_ON : BTN_OFF;
  });
  document.title = ui('doc.title');
  document.documentElement.lang = (lang === 'zh') ? 'zh-Hant' : lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = ui(el.dataset.i18n); if (v) el.innerHTML = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = ui(el.dataset.i18nPh); });
  renderCamera();
  renderExposure();
  renderLevels();
  renderColor();
  renderEdit();
  renderTerms();
  renderRef();
  armReveals(document.querySelector('main'));
}
let _l = 'zh';
try { const st = localStorage.getItem('kb_lang'); if (['zh','en','fr'].includes(st)) _l = st; } catch (e) {}
setLanguage(_l);
