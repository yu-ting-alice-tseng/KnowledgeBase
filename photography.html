<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>攝影圖譜 | 相機、曝光與修圖</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Noto+Serif+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Nunito', 'Noto Serif TC', 'sans-serif'] },
    boxShadow: {
      'glow-cyan':   '0 0 20px rgba(34,211,238,0.30)',
      'glow-amber':  '0 0 20px rgba(245,158,11,0.30)',
      'glow-sky':    '0 0 20px rgba(2,132,199,0.30)',
      'glow-red':    '0 0 20px rgba(239,68,68,0.30)',
      'glow-violet': '0 0 20px rgba(167,139,250,0.30)',
    } } } }
</script>
<style>
  body {
    background-color: #07090b;
    background-image:
      radial-gradient(at 0% 0%,   rgba(34,211,238,0.07) 0px, transparent 42%),
      radial-gradient(at 100% 0%, rgba(245,158,11,0.05) 0px, transparent 42%),
      radial-gradient(at 50% 100%,rgba(167,139,250,0.05) 0px, transparent 50%);
    background-attachment: fixed;
  }
  .gradient-border { position: relative; }
  .gradient-border::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(to bottom right, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .table-scroll::-webkit-scrollbar { height: 8px; }
  .table-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 8px; }

  /* ── Diagrams ──
     Drawn rather than photographed. Every scale here is computed from
     the optics (stops, field of view, sensor size), so the picture is
     the number, not an impression of it. */
  .dg { display: block; width: 100%; height: auto;
        background: #0b0f13; border-radius: 1rem; border: 1px solid rgba(148,163,184,0.16); }
  .dg .body  { fill: #1e293b; stroke: #475569; stroke-width: 3; }
  .dg .barrel{ fill: #172030; stroke: #475569; stroke-width: 3; }
  .dg .glass { fill: rgba(103,232,249,0.16); stroke: #67e8f9; stroke-width: 2.5; }
  .dg .blade { stroke: #fbbf24; stroke-width: 6; stroke-linecap: round; }
  .dg .sensor{ fill: #a78bfa; }
  .dg .shut  { stroke: #f87171; stroke-width: 4; }
  .dg .ray   { stroke: rgba(253,230,138,0.55); stroke-width: 1.6; fill: none; }
  .dg .call  { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 5 5; }
  .dg .lab   { fill: #7dd3fc; font-size: 19px; font-weight: 700; font-family: Nunito, 'Noto Serif TC', sans-serif; }
  .dg .sub   { fill: #94a3b8; font-size: 15px; font-family: Nunito, 'Noto Serif TC', sans-serif; }
  .dg .val   { fill: #f1f5f9; font-size: 17px; font-weight: 800; font-family: Nunito, sans-serif; }
  .dg .grid  { stroke: rgba(148,163,184,0.18); stroke-width: 1.5; fill: none; }
  .dg .axis  { stroke: rgba(148,163,184,0.45); stroke-width: 2; fill: none; }

  .lvl-pill { display:inline-block; padding:.15rem .6rem; border-radius:9999px;
              font-size:.6rem; font-weight:900; letter-spacing:.1em; }
  .reveal { opacity: 0; transform: translateY(12px); }
  .reveal.in { opacity: 1; transform: none;
               transition: opacity .5s ease, transform .5s cubic-bezier(.16,1,.3,1); }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal.in { opacity:1; transform:none; transition:none; }
  }
</style>
</head>
<body class="text-slate-200 font-sans min-h-screen pb-16 overflow-x-hidden antialiased selection:bg-cyan-400 selection:text-black">

<div style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;">
  <div style="position:absolute;width:620px;height:620px;top:-220px;left:-160px;background:radial-gradient(circle,rgba(34,211,238,0.12) 0%,transparent 70%);border-radius:50%;filter:blur(100px);"></div>
  <div style="position:absolute;width:520px;height:520px;top:-120px;right:-110px;background:radial-gradient(circle,rgba(245,158,11,0.08) 0%,transparent 70%);border-radius:50%;filter:blur(100px);"></div>
</div>

        </div>
      </div>
      <div>
        <span data-i18n="hdr.badge" class="px-2 py-0.5 text-[9px] font-bold tracking-widest text-cyan-300 uppercase bg-cyan-500/10 rounded-full border border-cyan-500/20"></span>
        <h1 data-i18n="hdr.title" class="text-xl md:text-2xl font-black bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent tracking-tight"></h1>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex p-1 bg-slate-900 border border-slate-800 rounded-xl gap-1 shrink-0">
        <button onclick="setLanguage('zh')" id="lang-zh" class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200">繁中</button>
        <button onclick="setLanguage('en')" id="lang-en" class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200">EN</button>
        <button onclick="setLanguage('fr')" id="lang-fr" class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200">FR</button>
      </div>
      <nav class="flex flex-wrap gap-2 text-xs">
        <a href="#camera"   data-i18n="nav.cam"  class="px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 hover:border-cyan-500/50 hover:text-cyan-300 transition-colors"></a>
        <a href="#exposure" data-i18n="nav.exp"  class="px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 hover:border-cyan-500/50 hover:text-cyan-300 transition-colors"></a>
        <a href="#basics"   data-i18n="nav.p1"   class="px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 hover:border-amber-500/50 hover:text-amber-300 transition-colors"></a>
        <a href="#inter"    data-i18n="nav.p2"   class="px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 hover:border-sky-500/50 hover:text-sky-300 transition-colors"></a>
        <a href="#adv"      data-i18n="nav.p3"   class="px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 hover:border-red-500/50 hover:text-red-300 transition-colors"></a>
        <a href="#color" data-i18n="nav.col" class="px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 hover:border-pink-500/50 hover:text-pink-300 transition-colors"></a>
        <a href="#edit"     data-i18n="nav.edit" class="px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 hover:border-violet-500/50 hover:text-violet-300 transition-colors"></a>
        <a href="#terms" data-i18n="nav.terms" class="px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 hover:border-sky-500/50 hover:text-sky-300 transition-colors"></a>
        <a href="#ref"      data-i18n="nav.ref"  class="px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 hover:border-emerald-500/50 hover:text-emerald-300 transition-colors"></a>
      </nav>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 md:px-8 mt-10 space-y-12 relative z-10">

    <div class="gradient-border bg-slate-950/40 rounded-3xl p-6 md:p-8 border border-slate-900 space-y-6">

      <div class="rounded-2xl border border-slate-800 bg-slate-900/30 p-5">
        <h3 data-i18n="col.h.rgb" class="text-base font-black text-white mb-2"></h3>

  <section id="edit" class="scroll-mt-24">

        <h2 data-i18n="terms.h2" class="text-2xl font-black text-white"></h2>

    </div>

</main>
<script>
let LANG = 'zh';
function t(o){ if(o==null) return ''; if(typeof o==='string') return o; return o[LANG]||o.en||o.zh||''; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function f1(x){ return (Math.round(x * 10) / 10).toString(); }

/* ═══════════════════════════════════════════════════════════
   Camera anatomy: a mirrorless body and lens in cross-section.
   Light enters at the left, passes the glass and the aperture,
   waits behind the shutter, and lands on the sensor.
   ═══════════════════════════════════════════════════════════ */
const PARTS = [
  { k:'lens', t:{zh:'鏡頭與鏡片組', en:'Lens and its elements', fr:'L’objectif et ses lentilles'},
    p:{zh:'一組玻璃鏡片把光線聚焦到感光元件上。焦距（例如 50mm）決定視角，鏡片品質決定銳利度與色散。對畫質的影響常常比機身還大。',
       en:'A group of glass elements that brings light to a focus on the sensor. The focal length (50mm, say) fixes the angle of view; the quality of the glass decides sharpness and colour fringing. It often matters more to image quality than the body does.',
       fr:'Un groupe de lentilles qui fait converger la lumière sur le capteur. La focale (50 mm par exemple) fixe l’angle de champ ; la qualité du verre décide du piqué et des franges colorées. Elle compte souvent plus que le boîtier pour la qualité d’image.'} },
  { k:'ap', t:{zh:'光圈葉片', en:'Aperture blades', fr:'Les lamelles du diaphragme'},
    p:{zh:'位於鏡頭內，一圈可以開合的金屬葉片。開大進光多、景深淺；縮小進光少、景深深。以 f 值表示，數字越小開口越大。',
       en:'A ring of metal blades inside the lens that opens and closes. Wide open lets in more light and gives shallow depth of field; stopped down gives less light and more depth. It is written as an f-number, and the smaller the number, the bigger the hole.',
       fr:'Une couronne de lamelles métalliques, dans l’objectif, qui s’ouvre et se ferme. Grand ouvert : plus de lumière, profondeur de champ réduite ; fermé : moins de lumière, plus de profondeur. On l’écrit en nombre f, et plus le nombre est petit, plus l’ouverture est grande.'} },
  { k:'mount', t:{zh:'卡口', en:'Lens mount', fr:'La monture'},
    p:{zh:'鏡頭與機身接合的位置。各品牌卡口不通用（Sony E、Canon RF、Nikon Z、Fujifilm X 等），買鏡頭前先確認卡口，轉接環能解決一部分但會犧牲對焦速度或功能。',
       en:'Where lens and body lock together. Mounts are brand-specific (Sony E, Canon RF, Nikon Z, Fujifilm X and so on), so check the mount before buying glass. Adapters solve some cases, usually at the cost of focusing speed or features.',
       fr:'Là où objectif et boîtier se verrouillent. Les montures sont propres à chaque marque (Sony E, Canon RF, Nikon Z, Fujifilm X…), vérifiez-la avant d’acheter un objectif. Les bagues d’adaptation dépannent, souvent au prix de la vitesse d’autofocus ou de certaines fonctions.'} },
  { k:'shut', t:{zh:'快門', en:'Shutter', fr:'L’obturateur'},
    p:{zh:'在感光元件前面的簾幕，決定光線照射多久。很多無反相機另有電子快門，完全無聲，但拍快速移動物體或在部分燈光下會出現變形與條紋。',
       en:'A curtain in front of the sensor that decides how long light falls on it. Many mirrorless bodies also offer an electronic shutter, which is silent but can bend fast-moving subjects and band under some artificial lights.',
       fr:'Un rideau devant le capteur qui décide combien de temps la lumière l’atteint. Beaucoup d’hybrides proposent aussi un obturateur électronique, silencieux, mais qui peut déformer les sujets rapides et produire des bandes sous certains éclairages.'} },
  { k:'sensor', t:{zh:'感光元件', en:'Sensor', fr:'Le capteur'},
    p:{zh:'把光轉成數位訊號的晶片，相當於底片。尺寸越大，同樣條件下雜訊越少、越容易拍出淺景深。這是機身最昂貴也最關鍵的部分。',
       en:'The chip that turns light into a digital signal, the equivalent of film. A larger sensor gives less noise under the same conditions and makes shallow depth of field easier. It is the most expensive and most decisive part of the body.',
       fr:'La puce qui convertit la lumière en signal numérique, l’équivalent du film. Plus il est grand, moins il y a de bruit à conditions égales et plus le flou d’arrière-plan est facile. C’est la pièce la plus chère et la plus déterminante du boîtier.'} },
  { k:'evf', t:{zh:'觀景窗與螢幕', en:'Viewfinder and screen', fr:'Viseur et écran'},
    p:{zh:'無反相機的電子觀景窗（EVF）會直接顯示曝光結果，所見即所得。單眼相機（DSLR）則是透過反光鏡與五稜鏡看到光學影像，看不到曝光預覽。',
       en:'A mirrorless electronic viewfinder (EVF) shows the exposure as it will be recorded. A DSLR shows an optical image through its mirror and prism, which is lag-free but gives no exposure preview.',
       fr:'Le viseur électronique (EVF) d’un hybride montre l’exposition telle qu’elle sera enregistrée. Un reflex montre une image optique via son miroir et son prisme, sans latence mais sans aperçu de l’exposition.'} },
];

function anatomy() {
  const lab = k => t(PARTS.find(p => p.k === k).t);
  const rays = [150, 175, 200, 225, 250].map(y =>
    '<path class="ray" d="M20 ' + y + ' L170 ' + y + ' L300 ' + (200 + (y - 200) * 0.45) + ' L612 200"/>').join('');
  return '<svg class="dg" viewBox="0 0 900 380" role="img" aria-label="' + esc(t({zh:'相機剖面圖', en:'Camera cross-section', fr:'Coupe d’un appareil photo'})) + '">'
    /* body, viewfinder hump, grip */
    + '<rect class="body" x="390" y="110" width="270" height="200" rx="18"/>'
    + '<path class="body" d="M470 110 L490 62 L590 62 L610 110 Z"/>'
    + '<rect class="body" x="660" y="130" width="46" height="180" rx="16"/>'
    /* lens barrel and mount */
    + '<rect class="barrel" x="140" y="120" width="245" height="160" rx="14"/>'
    + '<rect x="380" y="128" width="16" height="144" fill="#94a3b8"/>'
    + rays
    /* glass elements */
    + '<ellipse class="glass" cx="170" cy="200" rx="16" ry="72"/>'
    + '<ellipse class="glass" cx="235" cy="200" rx="11" ry="60"/>'
    + '<ellipse class="glass" cx="345" cy="200" rx="10" ry="52"/>'
    /* aperture blades leave a gap in the middle */
    + '<line class="blade" x1="295" y1="126" x2="295" y2="172"/>'
    + '<line class="blade" x1="295" y1="228" x2="295" y2="274"/>'
    /* shutter and sensor */
    + '<line class="shut" x1="596" y1="140" x2="596" y2="260"/>'
    + '<rect class="sensor" x="608" y="146" width="10" height="108" rx="2"/>'
    /* EVF eyepiece */
    + '<rect x="560" y="76" width="44" height="22" rx="4" fill="#0b0f13" stroke="#64748b" stroke-width="2"/>'
    /* callouts */
    + '<path class="call" d="M170 128 L170 44"/><text class="lab" x="170" y="34" text-anchor="middle">' + esc(lab('lens')) + '</text>'
    + '<path class="call" d="M295 280 L295 344"/><text class="lab" x="295" y="368" text-anchor="middle">' + esc(lab('ap')) + '</text>'
    + '<path class="call" d="M388 272 L440 344"/><text class="lab" x="450" y="368" text-anchor="middle">' + esc(lab('mount')) + '</text>'
    + '<path class="call" d="M596 262 L596 344"/><text class="lab" x="600" y="368" text-anchor="middle">' + esc(lab('shut')) + '</text>'
    + '<path class="call" d="M618 200 L760 200"/><text class="lab" x="770" y="206">' + esc(lab('sensor')) + '</text>'
    + '<path class="call" d="M582 76 L582 40 L640 40"/><text class="lab" x="648" y="46">EVF</text>'
    + '<text class="sub" x="22" y="134">' + esc(t({zh:'光線', en:'light', fr:'lumière'})) + ' →</text>'
    + '</svg>';
}

/* Sensor formats, drawn to the same scale (mm). The crop factor is
   computed from the diagonal against full frame's 43.27 mm. */
const SENSORS = [
  { n:{zh:'全片幅', en:'Full frame', fr:'Plein format'},  w:36,   h:24,  c:'#a78bfa' },
  { n:'APS-C',                                             w:23.5, h:15.6,c:'#22d3ee' },
  { n:'Micro 4/3',                                         w:17.3, h:13,  c:'#fbbf24' },
  { n:'1″',                                                w:13.2, h:8.8, c:'#34d399' },
  { n:{zh:'手機主鏡頭（約 1/1.3″）', en:'Phone main camera (≈1/1.3″)', fr:'Module principal de smartphone (≈1/1,3″)'}, w:9.6, h:7.2, c:'#f87171' },
];
const FF_DIAG = Math.hypot(36, 24);
function sensorDiagram() {
  const S = 9, x0 = 40, y0 = 30, H = 24 * S + 140;
  const rects = SENSORS.map(s =>
    '<rect x="' + x0 + '" y="' + (y0 + (24 - s.h) * S) + '" width="' + (s.w * S) + '" height="' + (s.h * S)
    + '" fill="none" stroke="' + s.c + '" stroke-width="3"/>').join('');
  const keys = SENSORS.map((s, i) => {
    const crop = FF_DIAG / Math.hypot(s.w, s.h);
    const y = y0 + 22 + i * 44;
    return '<rect x="400" y="' + (y - 14) + '" width="18" height="18" rx="3" fill="' + s.c + '"/>'
      + '<text class="val" x="430" y="' + y + '">' + esc(t(s.n)) + '</text>'
      + '<text class="sub" x="430" y="' + (y + 20) + '">' + s.w + ' × ' + s.h + ' mm · '
      + esc(t({zh:'等效係數', en:'crop', fr:'coefficient'})) + ' ×' + f1(crop) + '</text>';
  }).join('');
  return '<svg class="dg" viewBox="0 0 900 ' + H + '" role="img" aria-label="' + esc(t({zh:'感光元件尺寸比較', en:'Sensor sizes compared', fr:'Tailles de capteur comparées'})) + '">'
    + rects + keys
    + '<text class="sub" x="' + x0 + '" y="' + (y0 + 24 * S + 40) + '">'
    + esc(t({zh:'以相同比例繪製，左下角對齊。', en:'Drawn to one scale, aligned at the lower-left corner.', fr:'Dessinés à la même échelle, alignés sur le coin inférieur gauche.'}))
    + '</text></svg>';
}

const TYPES = [
  { i:'fa-mobile-screen', t:{zh:'手機', en:'Phone', fr:'Smartphone'},
    p:{zh:'感光元件最小，靠運算攝影（多張合成、AI 降噪）補足。日光下幾乎無敵，弱光、動態與真正的光學淺景深是極限。',
       en:'The smallest sensor, made up for by computational photography (multi-frame stacking, AI noise reduction). Nearly unbeatable in daylight; its limits are low light, motion and true optical background blur.',
       fr:'Le plus petit capteur, compensé par la photographie computationnelle (empilement d’images, débruitage par IA). Presque imbattable de jour ; ses limites sont la basse lumière, le mouvement et le vrai flou optique.'} },
  { i:'fa-camera', t:{zh:'類單眼／隨身機', en:'Compact', fr:'Compact'},
    p:{zh:'1 吋左右的元件加上固定鏡頭，體積小，手感與操控比手機完整。適合旅行與想學手動又不想換鏡頭的人。',
       en:'Around a 1-inch sensor and a fixed lens. Small, but with real dials and handling. Good for travel, and for learning manual control without a bag of lenses.',
       fr:'Un capteur d’environ 1 pouce et un objectif fixe. Petit, mais avec de vraies molettes. Idéal en voyage, et pour apprendre le manuel sans sac d’objectifs.'} },
  { i:'fa-camera-retro', t:{zh:'無反光鏡相機', en:'Mirrorless', fr:'Hybride'},
    p:{zh:'目前的主流。可換鏡頭、電子觀景窗所見即所得、對焦追蹤強。新手入門與專業工作都以這類為主。',
       en:'Today’s mainstream. Interchangeable lenses, an electronic viewfinder that shows the real exposure, strong subject tracking. The default for both beginners and professionals.',
       fr:'Le standard actuel. Objectifs interchangeables, viseur électronique montrant l’exposition réelle, suivi du sujet performant. Le choix par défaut, du débutant au professionnel.'} },
  { i:'fa-camera', t:{zh:'數位單眼（DSLR）', en:'DSLR', fr:'Reflex'},
    p:{zh:'有反光鏡與光學觀景窗，電池續航長。各品牌已停止開發新機，但二手鏡頭便宜，仍是預算有限時的好選擇。',
       en:'Mirror and optical viewfinder, long battery life. The makers have stopped developing new models, but used lenses are cheap, which keeps it a sensible budget route.',
       fr:'Miroir et viseur optique, grande autonomie. Les marques ne développent plus de nouveaux modèles, mais les objectifs d’occasion sont bon marché, ce qui en fait une voie raisonnable à petit budget.'} },
];

/* ═══════════════════════════════════════════════════════════
   Exposure. One "stop" is a doubling or halving of light, and
   each of the three controls is laid out in whole stops, with
   the brighter end on the left.
   ═══════════════════════════════════════════════════════════ */
const SCALES = [
  { k:{zh:'光圈', en:'Aperture', fr:'Ouverture'}, c:'#fbbf24',
    v:['f/1.4','f/2','f/2.8','f/4','f/5.6','f/8','f/11','f/16','f/22'],
    l:{zh:'景深淺、背景模糊', en:'shallow focus, blurred background', fr:'peu de profondeur, fond flou'},
    r:{zh:'景深深、前後都清楚', en:'deep focus, front to back sharp', fr:'grande profondeur, tout est net'} },
  { k:{zh:'快門', en:'Shutter', fr:'Vitesse'}, c:'#f87171',
    v:['1/15','1/30','1/60','1/125','1/250','1/500','1/1000','1/2000','1/4000'],
    l:{zh:'動態模糊、容易手震', en:'motion blur, camera shake', fr:'flou de bougé'},
    r:{zh:'凍結動作', en:'frozen motion', fr:'mouvement figé'} },
  { k:'ISO', c:'#a78bfa',
    v:['25600','12800','6400','3200','1600','800','400','200','100'],
    l:{zh:'雜訊多、細節少', en:'more noise, less detail', fr:'plus de bruit, moins de détail'},
    r:{zh:'乾淨、動態範圍大', en:'clean, widest dynamic range', fr:'propre, dynamique maximale'} },
];
function scalesDiagram() {
  const x0 = 170, dx = 82, rowH = 120, H = SCALES.length * rowH + 70;
  let s = '<svg class="dg" viewBox="0 0 900 ' + H + '" role="img" aria-label="' + esc(t({zh:'曝光三要素刻度', en:'The three exposure scales', fr:'Les trois échelles d’exposition'})) + '">';
  s += '<defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>';
  s += '<rect x="' + x0 + '" y="22" width="' + (dx * 8) + '" height="10" rx="5" fill="url(#lg)"/>';
  s += '<text class="sub" x="' + x0 + '" y="54">← ' + esc(t({zh:'更亮', en:'brighter', fr:'plus clair'})) + '</text>';
  s += '<text class="sub" x="' + (x0 + dx * 8) + '" y="54" text-anchor="end">' + esc(t({zh:'更暗', en:'darker', fr:'plus sombre'})) + ' →</text>';
  SCALES.forEach((r, i) => {
    const y = 100 + i * rowH;
    s += '<text class="lab" x="24" y="' + (y + 6) + '" style="fill:' + r.c + '">' + esc(t(r.k)) + '</text>';
    s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + (x0 + dx * 8) + '" y2="' + y + '" stroke="' + r.c + '" stroke-opacity=".4" stroke-width="3"/>';
    r.v.forEach((v, j) => {
      const x = x0 + j * dx;
      s += '<circle cx="' + x + '" cy="' + y + '" r="6" fill="' + r.c + '"/>';
      s += '<text class="val" x="' + x + '" y="' + (y - 16) + '" text-anchor="middle" style="font-size:15px">' + v + '</text>';
    });
    s += '<text class="sub" x="' + x0 + '" y="' + (y + 34) + '">' + esc(t(r.l)) + '</text>';
    s += '<text class="sub" x="' + (x0 + dx * 8) + '" y="' + (y + 34) + '" text-anchor="end">' + esc(t(r.r)) + '</text>';
  });
  s += '<text class="sub" x="24" y="' + (H - 18) + '">' + esc(t({
    zh:'每一格都是一級（1 stop）：進光量差一倍。三條刻度可以互相抵換。',
    en:'Each step is one stop: twice or half the light. The three scales trade against each other.',
    fr:'Chaque pas vaut un diaphragme (1 IL) : deux fois plus ou moins de lumière. Les trois échelles se compensent.'})) + '</text>';
  return s + '</svg>';
}

/* The opening's diameter is focal length ÷ N, so its area goes as 1/N².
   Each full stop multiplies N by √2 and halves the area. */
function apertureDiagram() {
  const Ns = [2, 2.8, 4, 5.6, 8, 11, 16], K = 150, cy = 110;
  let x = 30, s = '';
  Ns.forEach(N => {
    const r = K / N / 2 * 2.2;
    x += Math.max(r, 14) + 16;
    s += '<circle cx="' + x + '" cy="' + cy + '" r="' + r + '" fill="rgba(253,230,138,0.85)"/>'
      +  '<circle cx="' + x + '" cy="' + cy + '" r="' + (r + 6) + '" fill="none" stroke="#475569" stroke-width="3"/>'
      +  '<text class="val" x="' + x + '" y="' + (cy + 112) + '" text-anchor="middle">f/' + N + '</text>';
    x += Math.max(r, 14) + 16;
  });
  const sc = 900 / Math.max(900, x + 20);
  return '<svg class="dg" viewBox="0 0 900 260" role="img" aria-label="' + esc(t({zh:'光圈大小比較', en:'Aperture sizes compared', fr:'Ouvertures comparées'})) + '">'
    + '<g transform="scale(' + sc + ')">' + s + '</g>'
    + '<text class="sub" x="30" y="248">' + esc(t({
      zh:'由左到右，每一格進光量減半。f 值是分母，所以數字越大，開口越小。',
      en:'Left to right, each step lets in half the light. The f-number is a divisor, so a bigger number means a smaller opening.',
      fr:'De gauche à droite, chaque pas laisse passer moitié moins de lumière. Le nombre f est un diviseur : plus il est grand, plus l’ouverture est petite.'})) + '</text></svg>';
}

/* ═══════════════════════════════════════════════════════════
   Composition: the thirds grid, with the horizon on a line and
   the subject on an intersection.
   ═══════════════════════════════════════════════════════════ */
function compDiagram() {
  const X = 60, Y = 20, W = 480, H = 320;
  return '<svg class="dg mt-4" viewBox="0 0 900 360" role="img" aria-label="' + esc(t({zh:'三分法構圖', en:'Rule of thirds', fr:'Règle des tiers'})) + '">'
    + '<rect x="' + X + '" y="' + Y + '" width="' + W + '" height="' + H + '" fill="#0f1a24" stroke="#475569" stroke-width="3"/>'
    + '<rect x="' + X + '" y="' + (Y + H * 2 / 3) + '" width="' + W + '" height="' + (H / 3) + '" fill="#13261d"/>'
    + '<path d="M' + (X + 40) + ' ' + (Y + H) + ' L' + (X + W * 2 / 3) + ' ' + (Y + H * 2 / 3) + ' M' + (X + W - 10) + ' ' + (Y + H) + ' L' + (X + W * 2 / 3) + ' ' + (Y + H * 2 / 3) + '" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6" fill="none"/>'
    + '<path class="grid" d="M' + (X + W / 3) + ' ' + Y + ' V' + (Y + H) + ' M' + (X + W * 2 / 3) + ' ' + Y + ' V' + (Y + H)
    + ' M' + X + ' ' + (Y + H / 3) + ' H' + (X + W) + ' M' + X + ' ' + (Y + H * 2 / 3) + ' H' + (X + W) + '" style="stroke:rgba(148,163,184,0.45)"/>'
    + '<circle cx="' + (X + W * 2 / 3) + '" cy="' + (Y + H / 3) + '" r="26" fill="#fde68a"/>'
    + [[1,1],[2,1],[1,2],[2,2]].map(p => '<circle cx="' + (X + W * p[0] / 3) + '" cy="' + (Y + H * p[1] / 3) + '" r="6" fill="none" stroke="#22d3ee" stroke-width="2.5"/>').join('')
    + '<text class="lab" x="580" y="70">' + esc(t({zh:'主體放在交點', en:'Subject on an intersection', fr:'Sujet sur une intersection'})) + '</text>'
    + '<text class="sub" x="580" y="94">' + esc(t({zh:'不放正中央，畫面才有方向', en:'off-centre gives the frame direction', fr:'décentré, le cadre prend une direction'})) + '</text>'
    + '<text class="lab" x="580" y="160" style="fill:#86efac">' + esc(t({zh:'地平線放在三分線', en:'Horizon on a third', fr:'Horizon sur un tiers'})) + '</text>'
    + '<text class="sub" x="580" y="184">' + esc(t({zh:'天空多或地面多，二選一', en:'choose: more sky or more ground', fr:'choisir : plus de ciel ou plus de sol'})) + '</text>'
    + '<text class="lab" x="580" y="250" style="fill:#fbbf24">' + esc(t({zh:'引導線', en:'Leading lines', fr:'Lignes directrices'})) + '</text>'
    + '<text class="sub" x="580" y="274">' + esc(t({zh:'道路、河流把視線帶向主體', en:'roads and rivers lead the eye in', fr:'routes et rivières guident le regard'})) + '</text>'
    + '</svg>';
}

/* ═══════════════════════════════════════════════════════════
   The three levels of shooting
   ═══════════════════════════════════════════════════════════ */
const LEVELS = [
{ id:'basics', tone:'amber', icon:'fa-seedling', n:1,
  t:{zh:'第一部・入門：先拍到清楚的照片', en:'Part 1 · Beginner: getting a sharp picture', fr:'Partie 1 · Débutant : obtenir une image nette'},
  lead:{zh:'入門階段的目標不是藝術，而是可靠：每一張都對到焦、不手震、亮度大致正確。做到這三件事，比任何器材升級都有效。這一部也帶入最基本的構圖與看光。',
        en:'At the start the aim is reliability, not art: every frame in focus, free of shake, roughly well exposed. Getting those three right does more than any equipment upgrade. This part also introduces basic composition and how to look at light.',
        fr:'Au début, le but est la fiabilité, pas l’art : chaque image nette, sans bougé, à peu près bien exposée. Réussir ces trois points vaut mieux que toute mise à niveau du matériel. Cette partie aborde aussi la composition de base et la lecture de la lumière.'},
  items:[
    { i:'fa-hand', t:{zh:'握持與站姿', en:'Holding the camera', fr:'Tenir l’appareil'},
      p:{zh:'右手握住握把，左手掌心向上托住鏡頭底部，手肘收向身體。眼睛貼著觀景窗，相機就多了一個支點。按快門是「壓」，不是「戳」。',
         en:'Right hand on the grip, left palm under the lens from below, elbows tucked into your sides. With your eye to the viewfinder the camera gains a third point of contact. Squeeze the shutter release; do not stab at it.',
         fr:'Main droite sur la poignée, paume gauche sous l’objectif, coudes serrés contre le corps. L’œil au viseur ajoute un troisième point d’appui. Pressez le déclencheur, ne le frappez pas.'},
      tip:{zh:'伸長手臂看螢幕拍，是最常見的手震來源。真的要用螢幕，就把手肘靠在身體或桌面上。',
           en:'Shooting at arm’s length off the screen is the commonest source of shake. If you must use the screen, brace your elbows against your body or a table.',
           fr:'Photographier bras tendus en regardant l’écran est la première cause de bougé. Si vous devez utiliser l’écran, calez les coudes contre le corps ou une table.'} },
    { i:'fa-gauge-high', t:{zh:'模式轉盤：P、A、S、M', en:'The mode dial: P, A, S, M', fr:'Le barillet : P, A, S, M'},
      p:{zh:'P 程式自動，相機決定光圈和快門；A（Canon 為 Av）光圈優先，你決定光圈；S（Canon 為 Tv）快門優先，你決定快門；M 全手動。入門建議直接從 A 模式開始，而不是全自動。',
         en:'P is program: the camera picks both. A (Av on Canon) is aperture priority: you pick the aperture. S (Tv on Canon) is shutter priority: you pick the speed. M is full manual. Start in A rather than full auto.',
         fr:'P est le programme : l’appareil choisit tout. A (Av chez Canon) est la priorité ouverture : vous choisissez le diaphragme. S (Tv chez Canon) est la priorité vitesse. M est le manuel. Commencez en A plutôt qu’en automatique intégral.'},
      tip:{zh:'A 模式下相機會自動配快門。記得看一眼快門有沒有慢到手會震（見下方「安全快門」），太慢就把 ISO 調高。',
           en:'In A the camera sets the shutter for you. Glance at it to make sure it has not dropped low enough to shake (see the safe shutter rule below); if it has, raise the ISO.',
           fr:'En A, l’appareil règle la vitesse. Jetez-y un œil pour vérifier qu’elle n’est pas assez lente pour bouger (voir la règle de vitesse de sécurité) ; sinon, montez les ISO.'} },
    { i:'fa-crosshairs', t:{zh:'對焦點：半按再全按', en:'Focus point: half-press, then press', fr:'Le collimateur : mi-course, puis à fond'},
      p:{zh:'快門鈕半按是對焦，全按才是拍攝。把對焦點放在主體上（人像就放在眼睛），聽到嗶聲或看到綠框再按到底。現代相機大多有眼部偵測，記得打開。',
         en:'Half-pressing the release focuses; pressing fully takes the picture. Put the focus point on the subject (on the eye, for a portrait), wait for the beep or the green box, then press through. Most modern cameras have eye detection; turn it on.',
         fr:'Appuyer à mi-course fait la mise au point ; à fond, on déclenche. Placez le collimateur sur le sujet (sur l’œil pour un portrait), attendez le bip ou le cadre vert, puis enfoncez. La plupart des appareils récents détectent l’œil : activez-le.'},
      tip:{zh:'照片「整張糊」是手震或主體在動；「背景清楚、人糊」是對焦點跑到背景。兩種要分開診斷。',
           en:'If the whole frame is soft, it is shake or subject movement. If the background is sharp and the person is not, the focus point landed on the background. Diagnose them separately.',
           fr:'Si toute l’image est floue, c’est du bougé ou un sujet en mouvement. Si le fond est net mais pas la personne, la mise au point est partie sur le fond. Deux diagnostics distincts.'} },
    { i:'fa-table-cells', t:{zh:'三分法與引導線', en:'Thirds and leading lines', fr:'Tiers et lignes directrices'},
      p:{zh:'把畫面用井字分成九格。主體放在交點、地平線放在橫線上，畫面立刻比置中穩定又有方向。再找一條線（道路、欄杆、河岸）把視線帶到主體。',
         en:'Divide the frame into nine with two lines each way. Put the subject on an intersection and the horizon on a line, and the picture at once gains both balance and direction. Then find a line (a road, a railing, a riverbank) to carry the eye to the subject.',
         fr:'Divisez le cadre en neuf par deux lignes dans chaque sens. Sujet sur une intersection, horizon sur une ligne : l’image gagne équilibre et direction. Cherchez ensuite une ligne (route, rambarde, berge) qui mène l’œil au sujet.'},
      tip:{zh:'地平線歪了比構圖普通更顯眼。打開相機的水平儀或格線顯示，拍之前就處理，不要留給修圖。',
           en:'A tilted horizon is more noticeable than an ordinary composition. Turn on the level or grid overlay and fix it in camera rather than leaving it to editing.',
           fr:'Un horizon penché se voit plus qu’une composition banale. Activez le niveau ou la grille et corrigez à la prise de vue plutôt qu’au développement.'},
      dia:'comp' },
    { i:'fa-sun', t:{zh:'看光：方向與時間', en:'Reading light: direction and time', fr:'Lire la lumière : direction et heure'},
      p:{zh:'順光平而無立體感，側光最能表現質感與輪廓，逆光會有髮絲光與光暈但臉容易暗。日出後與日落前的「黃金時刻」光線低、柔、暖；中午頂光最難處理。',
         en:'Front light is flat, side light shows texture and shape best, back light gives rim light and flare but darkens faces. The golden hour after sunrise and before sunset is low, soft and warm; midday overhead light is the hardest.',
         fr:'La lumière de face aplatit, la lumière latérale révèle le mieux texture et volume, le contre-jour donne un liseré et du flare mais assombrit les visages. L’heure dorée, après le lever et avant le coucher, est basse, douce et chaude ; le zénith de midi est le plus difficile.'},
      tip:{zh:'中午拍人，把人移到陰影裡。陰影中的光是均勻的，比在太陽底下瞇眼好看得多。',
           en:'At midday, move people into open shade. The light there is even, and far more flattering than squinting into the sun.',
           fr:'À midi, placez les gens à l’ombre. La lumière y est homogène, et bien plus flatteuse que des yeux plissés au soleil.'} },
    { i:'fa-images', t:{zh:'多拍、刪得狠', en:'Shoot more, delete harder', fr:'Déclenchez plus, triez plus durement'},
      p:{zh:'同一個場景換位置、換高度、換焦距各拍幾張。蹲低或站高常常比換鏡頭更有效。回家後只留最好的，練的是判斷力。',
         en:'For the same scene, shoot a few frames from another spot, another height, another focal length. Crouching or climbing often does more than a new lens. At home keep only the best; the training is in the judging.',
         fr:'Pour une même scène, déclenchez depuis un autre point, une autre hauteur, une autre focale. S’accroupir ou monter fait souvent plus qu’un nouvel objectif. Au retour, ne gardez que les meilleures : c’est le jugement qu’on entraîne.'},
      tip:{zh:'人眼的高度是最無聊的高度，因為大家每天都這樣看世界。',
           en:'Eye level is the dullest height there is, because it is how everyone sees the world every day.',
           fr:'La hauteur des yeux est la plus banale qui soit, puisque c’est ainsi que tout le monde voit le monde chaque jour.'} },
  ] },
{ id:'inter', tone:'sky', icon:'fa-camera', n:2,
  t:{zh:'第二部・進階：讓曝光聽你的', en:'Part 2 · Intermediate: making exposure obey you', fr:'Partie 2 · Intermédiaire : maîtriser l’exposition'},
  lead:{zh:'進階的關鍵是理解三要素各自的「副作用」。光圈管景深、快門管動態、ISO 管雜訊。選設定其實是在選你要哪種副作用，亮度只是附帶結果。',
        en:'The key at this level is understanding each control’s side effect. Aperture governs depth of field, shutter governs motion, ISO governs noise. Choosing settings is really choosing which side effect you want; the brightness follows from that.',
        fr:'La clé de ce niveau est de comprendre l’effet secondaire de chaque réglage. L’ouverture gouverne la profondeur de champ, la vitesse le mouvement, les ISO le bruit. Choisir ses réglages, c’est choisir l’effet voulu ; la luminosité en découle.'},
  items:[
    { i:'fa-circle-half-stroke', t:{zh:'景深的四個變數', en:'The four levers of depth of field', fr:'Les quatre leviers de la profondeur de champ'},
      p:{zh:'背景模不模糊，不只看光圈。光圈越大、焦距越長、離主體越近、主體離背景越遠，背景就越模糊。85mm f/1.8 站近一點、讓人離牆遠一點，效果比單純開大光圈明顯得多。',
         en:'Background blur is not only about aperture. A wider aperture, a longer focal length, a closer subject and a more distant background all add blur. An 85mm at f/1.8, standing closer, with the person well away from the wall, does far more than opening up alone.',
         fr:'Le flou d’arrière-plan ne dépend pas que de l’ouverture. Ouverture plus grande, focale plus longue, sujet plus proche, fond plus éloigné : tout ajoute du flou. Un 85 mm à f/1,8, en s’approchant et en éloignant la personne du mur, fait bien plus qu’ouvrir seul.'},
      tip:{zh:'f/1.4 拍團體照，常常只有第一排清楚。多人合照至少收到 f/4 以上。',
           en:'At f/1.4 a group shot often has only the front row sharp. For several people, stop down to f/4 or more.',
           fr:'À f/1,4, une photo de groupe n’a souvent que le premier rang net. Pour plusieurs personnes, fermez au moins à f/4.'} },
    { i:'fa-person-running', t:{zh:'快門：凍結或拉出動態', en:'Shutter: freeze or show motion', fr:'Vitesse : figer ou montrer le mouvement'},
      p:{zh:'走路的人約 1/250 秒、小孩跑跳 1/500、運動與飛鳥 1/1000 以上可凍結。反過來，1/15 秒跟著車子橫移（追焦）能讓背景拉成線條；三腳架加幾秒能讓流水變絲綢。',
         en:'About 1/250 s freezes a walking person, 1/500 running children, 1/1000 or faster for sport and birds. The other way, panning with a car at 1/15 s streaks the background, and a few seconds on a tripod turns water to silk.',
         fr:'Environ 1/250 s fige un piéton, 1/500 des enfants qui courent, 1/1000 et plus pour le sport et les oiseaux. À l’inverse, un filé à 1/15 s derrière une voiture étire le fond, et quelques secondes sur trépied rendent l’eau soyeuse.'},
      tip:{zh:'動態模糊和手震模糊不一樣：前者只有移動的東西糊，後者是整張一起糊。',
           en:'Motion blur and camera shake are different: in the first only the moving thing is soft, in the second the whole frame is.',
           fr:'Flou de mouvement et flou de bougé diffèrent : dans le premier, seul ce qui bouge est flou ; dans le second, toute l’image.'} },
    { i:'fa-grip-lines', t:{zh:'ISO：雜訊比糊掉好', en:'ISO: noise beats blur', fr:'ISO : le bruit vaut mieux que le flou'},
      p:{zh:'ISO 放大訊號，代價是雜訊。現代機身 ISO 3200 甚至 6400 都可用，雜訊也能後製降掉；但手震或動態模糊救不回來。所以光線不足時，先確保快門，再讓 ISO 往上走。',
         en:'ISO amplifies the signal, at the cost of noise. Modern bodies are usable at 3200 or even 6400, and noise can be reduced in editing; blur cannot be undone. So in poor light, secure the shutter speed first and let ISO rise.',
         fr:'Les ISO amplifient le signal, au prix du bruit. Les boîtiers récents sont exploitables à 3200, voire 6400, et le bruit se réduit au développement ; le flou, non. En basse lumière, assurez d’abord la vitesse et laissez monter les ISO.'},
      tip:{zh:'設定「自動 ISO＋最低快門限制」，讓相機在 A 模式下自己守住安全快門。',
           en:'Set auto ISO with a minimum shutter speed, so the camera guards the safe speed for you in A mode.',
           fr:'Réglez l’ISO auto avec une vitesse minimale : en mode A, l’appareil protège lui-même la vitesse de sécurité.'} },
    { i:'fa-plus-minus', t:{zh:'測光與曝光補償', en:'Metering and exposure compensation', fr:'Mesure et correction d’exposition'},
      p:{zh:'測光錶假設整個畫面平均是 18% 中灰。所以拍雪地、白牆會偏暗，拍黑衣、夜景會偏亮。用 ± 曝光補償修正：亮場景加，暗場景減。',
         en:'The meter assumes the scene averages out to 18% grey. So snow and white walls come out too dark, black clothes and night scenes too bright. Correct with exposure compensation: plus for bright scenes, minus for dark ones.',
         fr:'La cellule suppose que la scène fait en moyenne un gris à 18 %. La neige et les murs blancs sortent donc trop sombres, les vêtements noirs et les scènes nocturnes trop clairs. Corrigez : plus pour les scènes claires, moins pour les sombres.'},
      tip:{zh:'雪景通常要 +1 到 +2 級才會是白色，否則就是灰色的雪。',
           en:'Snow usually needs +1 to +2 stops to come out white; otherwise it comes out grey.',
           fr:'La neige demande en général +1 à +2 IL pour sortir blanche ; sinon, elle est grise.'} },
    { i:'fa-bullseye', t:{zh:'對焦模式：單次與連續', en:'Focus modes: single and continuous', fr:'Modes AF : ponctuel et continu'},
      p:{zh:'AF-S（Canon 為 One Shot）對到焦就鎖住，適合靜物與風景；AF-C（Canon 為 AI Servo）持續追蹤，適合會動的人與動物。進一步可以把對焦改到背後的 AF-ON 鈕（背鈕對焦），讓對焦與拍攝分開。',
         en:'AF-S (One Shot on Canon) locks once focused, for still subjects and landscapes; AF-C (AI Servo on Canon) keeps tracking, for people and animals that move. A further step is moving focus to the rear AF-ON button (back-button focus), separating focusing from taking the picture.',
         fr:'L’AF-S (One Shot chez Canon) se verrouille une fois la mise au point faite, pour les sujets immobiles et les paysages ; l’AF-C (AI Servo chez Canon) suit en continu, pour les personnes et animaux en mouvement. Étape suivante : déporter l’AF sur le bouton AF-ON arrière, pour séparer mise au point et déclenchement.'},
      tip:{zh:'用 AF-S 拍走過來的人，對焦鎖在一秒前的位置，人已經不在那裡了。',
           en:'With AF-S on someone walking towards you, focus is locked where they were a second ago, and they are no longer there.',
           fr:'En AF-S sur quelqu’un qui avance vers vous, la mise au point reste là où il était une seconde plus tôt, et il n’y est plus.'} },
    { i:'fa-file-image', t:{zh:'RAW 與 JPEG', en:'RAW and JPEG', fr:'RAW et JPEG'},
      p:{zh:'JPEG 是相機已經修好、壓縮過的成品；RAW 是感光元件的原始資料，保留更多亮部暗部細節，白平衡可以事後任意改。想修圖就拍 RAW，或 RAW＋JPEG 一起存。',
         en:'A JPEG is a finished, compressed picture the camera has already processed; a RAW file is the sensor’s original data, holding far more highlight and shadow detail, with white balance freely adjustable later. If you intend to edit, shoot RAW, or RAW plus JPEG.',
         fr:'Le JPEG est une image finie et compressée, déjà traitée par l’appareil ; le RAW est la donnée brute du capteur, avec bien plus de détail dans les hautes et basses lumières, et une balance des blancs modifiable à volonté. Si vous comptez retoucher, photographiez en RAW, ou RAW + JPEG.'},
      tip:{zh:'RAW 打開來看起來比 JPEG 平淡、灰，這是正常的：它還沒被調過。',
           en:'A RAW file opens looking flatter and greyer than the JPEG. That is normal: nothing has been applied to it yet.',
           fr:'Un RAW s’ouvre plus terne et plus gris que le JPEG. C’est normal : rien n’y a encore été appliqué.'} },
    { i:'fa-temperature-half', t:{zh:'白平衡', en:'White balance', fr:'Balance des blancs'},
      p:{zh:'不同光源的顏色不同：鎢絲燈偏橘、陰天陰影偏藍。白平衡告訴相機「什麼是白色」。自動白平衡大多不錯，但在室內暖光或日落時會把氣氛修掉，這時改用日光或手動 K 值。',
         en:'Light sources differ in colour: tungsten is orange, overcast shade is blue. White balance tells the camera what white is. Auto is usually fine, but it will neutralise the mood of warm interiors or sunsets; switch to daylight or a manual Kelvin value then.',
         fr:'Les sources ont des couleurs différentes : le tungstène est orangé, l’ombre par temps couvert bleutée. La balance des blancs dit à l’appareil ce qu’est le blanc. L’auto convient souvent, mais elle efface l’ambiance d’un intérieur chaud ou d’un coucher de soleil ; passez alors en lumière du jour ou en Kelvin manuel.'},
      tip:{zh:'K 值的方向容易搞混：設定的 K 值越高，照片越暖（越黃）。',
           en:'The Kelvin direction trips people up: the higher the value you set, the warmer (yellower) the picture.',
           fr:'Le sens des Kelvin déroute : plus la valeur réglée est haute, plus l’image est chaude (jaune).'} },
  ] },
{ id:'adv', tone:'red', icon:'fa-mountain-sun', n:3,
  t:{zh:'第三部・高階：控制光與時間', en:'Part 3 · Advanced: controlling light and time', fr:'Partie 3 · Avancé : maîtriser la lumière et le temps'},
  lead:{zh:'到這個階段，問題不再是「怎麼拍對」，而是「怎麼拍到相機一次拍不到的東西」：超過感光元件動態範圍的場景、比肉眼看得更久的時間、自己製造的光。',
        en:'At this stage the question is no longer how to get it right, but how to capture what the camera cannot in a single frame: scenes beyond the sensor’s dynamic range, longer stretches of time than the eye sees, light you make yourself.',
        fr:'À ce stade, la question n’est plus de bien faire, mais de saisir ce que l’appareil ne peut pas en une seule image : des scènes au-delà de la dynamique du capteur, des durées plus longues que l’œil n’en perçoit, une lumière que l’on crée.'},
  items:[
    { i:'fa-chart-area', t:{zh:'看直方圖，向右曝光', en:'Read the histogram, expose to the right', fr:'Lire l’histogramme, exposer à droite'},
      p:{zh:'螢幕亮度會騙人，直方圖不會。拍 RAW 時，可以在亮部不爆掉的前提下讓直方圖盡量靠右（ETTR），因為暗部資料最少、雜訊最多，後製再把亮度降回來，畫質會比較乾淨。',
         en:'The screen’s brightness lies; the histogram does not. Shooting RAW, push the histogram as far right as you can without clipping the highlights (ETTR). The shadows hold the least data and the most noise, so bringing the brightness down later gives a cleaner file.',
         fr:'La luminosité de l’écran trompe ; l’histogramme, non. En RAW, poussez l’histogramme le plus à droite possible sans écrêter les hautes lumières (ETTR). Les ombres contiennent le moins de données et le plus de bruit : redescendre ensuite donne un fichier plus propre.'},
      tip:{zh:'亮部一旦爆掉（純白）就沒有資料了，任何軟體都救不回。暗部還能拉，亮部不行。',
           en:'Once a highlight clips to pure white there is no data left, and no software will bring it back. Shadows can be lifted; blown highlights cannot.',
           fr:'Une haute lumière brûlée en blanc pur n’a plus aucune donnée, aucun logiciel ne la récupère. Les ombres se remontent ; les blancs brûlés, non.'} },
    { i:'fa-layer-group', t:{zh:'包圍曝光與 HDR', en:'Bracketing and HDR', fr:'Bracketing et HDR'},
      p:{zh:'室內窗景或日落逆光，亮暗差距超過感光元件能記錄的範圍。拍 3 到 5 張、每張差 1 到 2 級，後製合成 HDR。用三腳架，或至少用高速連拍。',
         en:'A window from inside, or a sunset into the light, spans more range than the sensor can record. Shoot three to five frames one or two stops apart and merge them to HDR later. Use a tripod, or at least a fast burst.',
         fr:'Une fenêtre vue de l’intérieur, un coucher de soleil à contre-jour dépassent la dynamique du capteur. Prenez trois à cinq vues espacées d’un ou deux IL, à fusionner en HDR. Sur trépied, ou au moins en rafale rapide.'},
      tip:{zh:'HDR 的目標是看起來「像肉眼看到的」，不是看起來「像 HDR」。光暈與灰糊的天空就是做過頭了。',
           en:'The aim of HDR is to look like what the eye saw, not to look like HDR. Halos and a muddy grey sky mean it has been overdone.',
           fr:'Le but du HDR est de ressembler à ce que l’œil a vu, pas de ressembler à du HDR. Halos et ciel gris boueux trahissent l’excès.'} },
    { i:'fa-water', t:{zh:'長曝光與 ND 減光鏡', en:'Long exposure and ND filters', fr:'Pose longue et filtres ND'},
      p:{zh:'白天要拍好幾秒的流水或雲，光太多，需要 ND 減光鏡。ND8 減 3 級、ND64 減 6 級、ND1000 減 10 級。先算好不加鏡的正常快門，再依級數乘上去：1/30 秒加 10 級約等於 30 秒。',
         en:'To expose water or cloud for several seconds by day there is too much light, so you need an ND filter. ND8 cuts 3 stops, ND64 cuts 6, ND1000 cuts 10. Meter without the filter, then multiply by the stops: 1/30 s plus 10 stops is about 30 s.',
         fr:'Pour poser plusieurs secondes sur l’eau ou les nuages en plein jour, il y a trop de lumière : il faut un filtre ND. ND8 retire 3 IL, ND64 en retire 6, ND1000 en retire 10. Mesurez sans filtre, puis multipliez : 1/30 s plus 10 IL font environ 30 s.'},
      tip:{zh:'先對焦再裝 ND，並把對焦切到手動。裝上深色 ND 之後，自動對焦常常就找不到了。',
           en:'Focus before fitting the ND, then switch to manual focus. Behind a dark ND the autofocus often cannot find anything.',
           fr:'Faites la mise au point avant de visser le ND, puis passez en manuel. Derrière un ND dense, l’autofocus ne trouve souvent plus rien.'} },
    { i:'fa-arrows-to-dot', t:{zh:'超焦距與景深合成', en:'Hyperfocal distance and focus stacking', fr:'Hyperfocale et empilement de mise au point'},
      p:{zh:'風景要前景到遠方都清楚，可以對焦在超焦距：全片幅 24mm f/8 約 2.4 公尺，此時約 1.2 公尺到無限遠都可接受地清楚。前景極近或拍微距時，改拍多張不同對焦距離再合成。',
         en:'For a landscape sharp from foreground to horizon, focus at the hyperfocal distance: about 2.4 m for 24mm at f/8 on full frame, giving acceptable sharpness from about 1.2 m to infinity. With a very close foreground, or in macro, shoot several frames at different focus distances and stack them.',

/* Three histograms built from smooth distributions. x runs from pure
   black (left) to pure white (right); a spike at either wall is clipping. */
function histPath(fn, X, Y, W, H) {
  const n = 120; let pts = [], max = 0;
  for (let i = 0; i <= n; i++) { const v = fn(i / n); pts.push(v); if (v > max) max = v; }
  let d = 'M' + X + ' ' + (Y + H);
  pts.forEach((v, i) => { d += ' L' + f1(X + W * i / n) + ' ' + f1(Y + H - H * 0.92 * v / max); });
  return d + ' L' + (X + W) + ' ' + (Y + H) + ' Z';
}
const gauss = (x, m, s) => Math.exp(-((x - m) * (x - m)) / (2 * s * s));
const HISTS = [
  { t:{zh:'曝光不足', en:'Underexposed', fr:'Sous-exposé'}, clipL:true,
    fn:x => gauss(x, 0.05, 0.1) * 1.4 + gauss(x, 0.28, 0.12) * 0.8,
    n:{zh:'堆在左牆，暗部全黑', en:'piled on the left wall, shadows crushed', fr:'tassé à gauche, ombres bouchées'} },
  { t:{zh:'正常', en:'Well exposed', fr:'Bien exposé'},
    fn:x => gauss(x, 0.35, 0.13) + gauss(x, 0.68, 0.14) * 0.85,
    n:{zh:'兩端都沒有碰牆', en:'touches neither wall', fr:'ne touche aucun bord'} },
  { t:{zh:'亮部爆掉', en:'Clipped highlights', fr:'Hautes lumières brûlées'}, clipR:true,
    fn:x => gauss(x, 0.72, 0.13) * 0.8 + gauss(x, 0.97, 0.08) * 1.4,
    n:{zh:'撞上右牆，白色沒有細節', en:'hits the right wall, whites hold no detail', fr:'bute à droite, blancs sans détail'} },
];
function histDiagram() {
  const W = 250, H = 150, gap = 40, X0 = 25, Y = 40;
  let s = '<svg class="dg" viewBox="0 0 900 290" role="img" aria-label="' + esc(t({zh:'三種直方圖', en:'Three histograms', fr:'Trois histogrammes'})) + '">';
  HISTS.forEach((h, i) => {
    const X = X0 + i * (W + gap);
    s += '<text class="lab" x="' + X + '" y="' + (Y - 12) + '">' + esc(t(h.t)) + '</text>';
    s += '<rect x="' + X + '" y="' + Y + '" width="' + W + '" height="' + H + '" fill="#0f151c" stroke="#334155" stroke-width="1.5"/>';
    s += '<path d="' + histPath(h.fn, X, Y, W, H) + '" fill="rgba(226,232,240,0.55)" stroke="#e2e8f0" stroke-width="1.5"/>';
    if (h.clipL) s += '<rect x="' + X + '" y="' + Y + '" width="5" height="' + H + '" fill="#38bdf8"/>';
    if (h.clipR) s += '<rect x="' + (X + W - 5) + '" y="' + Y + '" width="5" height="' + H + '" fill="#f87171"/>';
    s += '<text class="sub" x="' + X + '" y="' + (Y + H + 22) + '">' + esc(t({zh:'黑', en:'black', fr:'noir'})) + '</text>';
    s += '<text class="sub" x="' + (X + W) + '" y="' + (Y + H + 22) + '" text-anchor="end">' + esc(t({zh:'白', en:'white', fr:'blanc'})) + '</text>';
    s += '<text class="sub" x="' + X + '" y="' + (Y + H + 48) + '" style="fill:#cbd5e1">' + esc(t(h.n)) + '</text>';
  });
  return s + '</svg>';
}

/* Tone curves: input on x, output on y. Each function is monotonic,
   so no tone ever swaps places with its neighbour. */
const CURVES = [
  { t:{zh:'原始（直線）', en:'Untouched (straight)', fr:'Neutre (droite)'}, fn:x => x,
    n:{zh:'輸入等於輸出', en:'input equals output', fr:'entrée = sortie'} },
  { t:{zh:'S 曲線：加對比', en:'S-curve: more contrast', fr:'Courbe en S : + de contraste'}, fn:x => x - 0.08 * Math.sin(2 * Math.PI * x),
    n:{zh:'暗的更暗、亮的更亮', en:'darks darker, lights lighter', fr:'sombres plus sombres, clairs plus clairs'} },
  { t:{zh:'抬黑：霧面感', en:'Lifted blacks: matte look', fr:'Noirs relevés : effet mat'}, fn:x => x + 0.14 * Math.pow(1 - x, 3),
    n:{zh:'最黑的點變成深灰', en:'the deepest black turns dark grey', fr:'le noir devient gris foncé'} },
];
function curveDiagram() {
  const S = 190, gap = 110, X0 = 40, Y = 50;
  let s = '<svg class="dg" viewBox="0 0 900 330" role="img" aria-label="' + esc(t({zh:'色調曲線', en:'Tone curves', fr:'Courbes de tonalité'})) + '">';
  CURVES.forEach((c, i) => {
    const X = X0 + i * (S + gap);
    s += '<text class="lab" x="' + X + '" y="' + (Y - 16) + '">' + esc(t(c.t)) + '</text>';
    s += '<rect x="' + X + '" y="' + Y + '" width="' + S + '" height="' + S + '" fill="#0f151c" stroke="#334155" stroke-width="1.5"/>';
    let g = '';
    for (let k = 1; k < 4; k++) g += 'M' + (X + S * k / 4) + ' ' + Y + ' V' + (Y + S) + ' M' + X + ' ' + (Y + S * k / 4) + ' H' + (X + S) + ' ';
    s += '<path class="grid" d="' + g + '"/>';
    s += '<path d="M' + X + ' ' + (Y + S) + ' L' + (X + S) + ' ' + Y + '" stroke="rgba(148,163,184,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>';
    let d = '';
    for (let j = 0; j <= 60; j++) { const x = j / 60; d += (j ? ' L' : 'M') + f1(X + S * x) + ' ' + f1(Y + S - S * c.fn(x)); }
    s += '<path d="' + d + '" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>';
    s += '<text class="sub" x="' + X + '" y="' + (Y + S + 26) + '">' + esc(t({zh:'輸入 →', en:'input →', fr:'entrée →'})) + '</text>';
    s += '<text class="sub" x="' + X + '" y="' + (Y + S + 52) + '" style="fill:#cbd5e1">' + esc(t(c.n)) + '</text>';
  });
  return s + '</svg>';
}

const LENSES = [
  { f:14,  u:{zh:'超廣角：室內、建築、星空', en:'Ultra-wide: interiors, architecture, night sky', fr:'Ultra grand-angle : intérieurs, architecture, ciel nocturne'} },

  { f:85,  u:{zh:'人像：臉部比例自然、背景好虛化', en:'Portrait: natural facial proportions, easy background blur', fr:'Portrait : proportions naturelles, fond facile à flouter'} },

];
const fov = f => 2 * Math.atan(18 / f) * 180 / Math.PI;
function fovDiagram() {
  const ox = 450, oy = 380, R = 330;
  const side = ['L','R','L','R','L','R'];
  let s = '<svg class="dg" viewBox="0 0 900 410" role="img" aria-label="' + esc(t({zh:'各焦距水平視角', en:'Horizontal angle of view by focal length', fr:'Angle de champ horizontal par focale'})) + '">';
  LENSES.forEach((L, i) => {
    const h = fov(L.f) / 2 * Math.PI / 180;
    const xl = ox - R * Math.sin(h), xr = ox + R * Math.sin(h), y = oy - R * Math.cos(h);
    const op = 0.10 + i * 0.03;
    s += '<path d="M' + ox + ' ' + oy + ' L' + f1(xl) + ' ' + f1(y) + ' A' + R + ' ' + R + ' 0 0 1 ' + f1(xr) + ' ' + f1(y) + ' Z" fill="rgba(34,211,238,' + op + ')" stroke="#22d3ee" stroke-opacity=".6" stroke-width="1.5"/>';
    const right = side[i] === 'R';
    const lx = right ? xr + 8 : xl - 8;
    s += '<text class="val" x="' + f1(lx) + '" y="' + f1(y - 8) + '" text-anchor="' + (right ? 'start' : 'end') + '" style="font-size:15px">'
      + L.f + 'mm · ' + Math.round(fov(L.f)) + '°</text>';
  });
  s += '<circle cx="' + ox + '" cy="' + oy + '" r="7" fill="#f1f5f9"/>';
  s += '<text class="sub" x="24" y="398">' + esc(t({zh:'全片幅水平視角，以相同半徑繪製。', en:'Full-frame horizontal angle of view, drawn to one radius.', fr:'Angle de champ horizontal en plein format, même rayon.'})) + '</text>';
  return s + '</svg>';
}

/* ═══════════════════════════════════════════════════════════

   science it illustrates: real blend arithmetic, real hue
   angles, CIE 1931 coordinates, black-body approximations.
   ═══════════════════════════════════════════════════════════ */

/* Additive light on black (screen) beside subtractive ink on white
   (multiply). The overlaps are produced by the blend modes
   themselves, not painted in. */
function rgbDiagram() {
  const c3 = (cx, cy, cols, mode) => {
    const pos = [[0, -46], [-42, 28], [42, 28]];
    return '<g style="isolation:isolate">' + cols.map((c, i) =>
      '<circle cx="' + (cx + pos[i][0]) + '" cy="' + (cy + pos[i][1]) + '" r="78" fill="' + c + '" style="mix-blend-mode:' + mode + '"/>').join('') + '</g>';
  };
  const L = (x, y, s, fill) => '<text class="val" x="' + x + '" y="' + y + '" text-anchor="middle" style="font-size:14px;fill:' + (fill || '#0b0f13') + '">' + esc(s) + '</text>';
  return '<svg class="dg" viewBox="0 0 900 380" role="img" aria-label="' + esc(t({zh:'加色法與減色法', en:'Additive and subtractive colour', fr:'Synthèse additive et soustractive'})) + '">'
    + '<rect x="30" y="20" width="400" height="300" rx="14" fill="#000"/>'

/* Hue wheel: angle is hue (red at the top, clockwise), distance from
   the centre is saturation. The grey core is laid over the colours. */
function wheelDiagram() {
  const cx = 220, cy = 210, R = 165, N = 72;
  const P = (a, r) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  let s = '<svg class="dg" viewBox="0 0 900 420" role="img" aria-label="' + esc(t({zh:'色環', en:'Colour wheel', fr:'Cercle chromatique'})) + '">'
    + '<defs><radialGradient id="satg"><stop offset="0" stop-color="#808080" stop-opacity="1"/><stop offset="1" stop-color="#808080" stop-opacity="0"/></radialGradient></defs>';
  for (let i = 0; i < N; i++) {
    const a0 = i * 360 / N, a1 = (i + 1) * 360 / N + 0.6;
    const p0 = P(a0, R), p1 = P(a1, R);
    s += '<path d="M' + cx + ' ' + cy + ' L' + f1(p0[0]) + ' ' + f1(p0[1]) + ' A' + R + ' ' + R + ' 0 0 1 ' + f1(p1[0]) + ' ' + f1(p1[1]) + ' Z" fill="hsl(' + (a0 + 180 / N) + ',100%,50%)"/>';
  }
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="url(#satg)"/>';
  [[0, '0° R'], [120, '120° G'], [240, '240° B']].forEach(([a, l]) => {
    const p = P(a, R + 22);
    s += '<text class="val" x="' + f1(p[0]) + '" y="' + f1(p[1] + 6) + '" text-anchor="middle" style="font-size:14px">' + l + '</text>';
  });
  /* complementary pair: orange (30°) against azure (210°) */
  const o = P(30, R - 30), b = P(210, R - 30);
  s += '<line x1="' + f1(o[0]) + '" y1="' + f1(o[1]) + '" x2="' + f1(b[0]) + '" y2="' + f1(b[1]) + '" stroke="#fff" stroke-width="3" stroke-dasharray="7 6"/>'
    + '<circle cx="' + f1(o[0]) + '" cy="' + f1(o[1]) + '" r="11" fill="hsl(30,100%,50%)" stroke="#fff" stroke-width="3"/>'
    + '<circle cx="' + f1(b[0]) + '" cy="' + f1(b[1]) + '" r="11" fill="hsl(210,100%,50%)" stroke="#fff" stroke-width="3"/>';
  /* lightness strip for one hue */
  for (let i = 0; i <= 20; i++)
    s += '<rect x="440" y="' + (40 + i * 16) + '" width="34" height="17" fill="hsl(30,100%,' + (100 - i * 5) + '%)"/>';
  s += '<rect x="440" y="40" width="34" height="336" fill="none" stroke="#475569" stroke-width="2"/>';
  const rows = [
    [t({zh:'H 色相：角度', en:'H, hue: the angle', fr:'T, teinte : l’angle'}), t({zh:'紅 0°、綠 120°、藍 240°', en:'red 0°, green 120°, blue 240°', fr:'rouge 0°, vert 120°, bleu 240°'})],
    [t({zh:'S 飽和度：離中心多遠', en:'S, saturation: distance from the centre', fr:'S, saturation : distance au centre'}), t({zh:'中心是灰，邊緣最濃', en:'grey at the centre, purest at the rim', fr:'gris au centre, pur au bord'})],
    [t({zh:'L 明度：左邊的色條', en:'L, luminance: the strip at left', fr:'L, luminance : la bande à gauche'}), t({zh:'同一色相，由白到黑', en:'one hue, from white to black', fr:'une teinte, du blanc au noir'})],
    [t({zh:'虛線：互補色', en:'Dashed line: complements', fr:'Pointillés : complémentaires'}), t({zh:'相隔 180°，例如橘與青藍', en:'180° apart, such as orange and azure', fr:'à 180°, comme l’orangé et l’azur'})],
  ];
  rows.forEach((r, i) => {
    s += '<text class="lab" x="510" y="' + (80 + i * 82) + '">' + esc(r[0]) + '</text>'
      +  '<text class="sub" x="510" y="' + (104 + i * 82) + '">' + esc(r[1]) + '</text>';
  });
  return s + '</svg>';
}

/* Black-body colour, Tanner Helland's fit to the Planckian locus.
   Good to a few percent between 1000 K and 40000 K, which is all a
   picture of the scale needs. */
function kelvinRGB(K) {
  const T = K / 100, cl = v => Math.max(0, Math.min(255, Math.round(v)));
  const r = T <= 66 ? 255 : 329.698727446 * Math.pow(T - 60, -0.1332047592);
  const g = T <= 66 ? 99.4708025861 * Math.log(T) - 161.1195681661 : 288.1221695283 * Math.pow(T - 60, -0.0755148492);
  const b = T >= 66 ? 255 : (T <= 19 ? 0 : 138.5177312231 * Math.log(T - 10) - 305.0447927307);
  return 'rgb(' + cl(r) + ',' + cl(g) + ',' + cl(b) + ')';
}
function kelvinDiagram() {
  const K0 = 1500, K1 = 10000, X = 40, W = 820, kx = K => X + W * (K - K0) / (K1 - K0);
  let stops = '';
  for (let K = K0; K <= K1; K += 250) stops += '<stop offset="' + f1((K - K0) / (K1 - K0) * 100) + '%" stop-color="' + kelvinRGB(K) + '"/>';
  let s = '<svg class="dg" viewBox="0 0 900 330" role="img" aria-label="' + esc(t({zh:'色溫刻度', en:'Colour temperature scale', fr:'Échelle de température de couleur'})) + '">'

    + '<rect x="' + X + '" y="40" width="' + W + '" height="46" rx="8" fill="url(#kg)"/>';
  [[1900, {zh:'燭光', en:'candle', fr:'bougie'}], [3200, {zh:'鎢絲燈', en:'tungsten', fr:'tungstène'}],
   [5500, {zh:'日光', en:'daylight', fr:'jour'}], [7500, {zh:'陰影', en:'shade', fr:'ombre'}]].forEach(([K, n]) => {
    const x = kx(K);
    s += '<line x1="' + f1(x) + '" y1="86" x2="' + f1(x) + '" y2="102" stroke="#e2e8f0" stroke-width="2"/>'

      +  '<text class="sub" x="' + f1(x) + '" y="142" text-anchor="middle">' + esc(t(n)) + '</text>';
  });
  s += '<text class="sub" x="' + X + '" y="28">← ' + esc(t({zh:'低 K：偏橘', en:'low K: orange', fr:'K bas : orangé'})) + '</text>'
    +  '<text class="sub" x="' + (X + W) + '" y="28" text-anchor="end">' + esc(t({zh:'高 K：偏藍', en:'high K: blue', fr:'K haut : bleuté'})) + ' →</text>';
  /* what the white-balance setting does: it applies the opposite cast */

    +  '<path d="M200 ' + (y + 40) + ' H380" stroke="#38bdf8" stroke-width="3" marker-end="url(#ar)"/>'
    +  '<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/></marker></defs>'
    +  '<text class="lab" x="290" y="' + (y + 28) + '" text-anchor="middle">WB = 3200K</text>'
    +  '<text class="sub" x="290" y="' + (y + 64) + '" text-anchor="middle">' + esc(t({zh:'相機加藍補償', en:'the camera adds blue', fr:'l’appareil ajoute du bleu'})) + '</text>'
    +  '<rect x="400" y="' + y + '" width="120" height="80" rx="8" fill="#f4f4f2"/>'
    +  '<text class="sub" x="460" y="' + (y + 104) + '" text-anchor="middle">' + esc(t({zh:'校正後：白', en:'corrected: white', fr:'corrigé : blanc'})) + '</text>'
    +  '<text class="lab" x="570" y="' + (y + 22) + '" style="fill:#fcd34d">' + esc(t({zh:'設定值是「光源的色溫」', en:'The setting names the light', fr:'Le réglage nomme la source'})) + '</text>'
    +  '<text class="sub" x="570" y="' + (y + 48) + '">' + esc(t({zh:'設得比實際低 → 畫面偏藍', en:'set lower than the light → bluer', fr:'plus bas que la source → plus bleu'})) + '</text>'
    +  '<text class="sub" x="570" y="' + (y + 72) + '">' + esc(t({zh:'設得比實際高 → 畫面偏暖', en:'set higher than the light → warmer', fr:'plus haut que la source → plus chaud'})) + '</text>';

/* Depth of field from the thin-lens equation 1/f = 1/u + 1/v, with
   f = 150 drawing units and the sensor 400 behind the lens, so the
   point at u = 240 is in focus. The nearer and farther points come to
   a focus behind and in front of the sensor, and meet it as discs
   whose diameter is 2A·|1 − 400/v|: proportional to the aperture. */
function dofDiagram() {
  const LX = 330, SX = 730, F = 150;
  const PTS = [
    { u:210, c:'#22d3ee', n:{zh:'近點', en:'near', fr:'proche'} },
    { u:240, c:'#f1f5f9', n:{zh:'對焦點', en:'in focus', fr:'net'} },
    { u:280, c:'#f472b6', n:{zh:'遠點', en:'far', fr:'lointain'} },
  ];
  const ROWS = [{ A:80, l:'f/2' }, { A:80 * 2 / 5.6, l:'f/5.6' }];
  const TOL = 8;
  let s = '<svg class="dg mt-4" viewBox="0 0 900 580" role="img" aria-label="' + esc(t({zh:'景深原理', en:'How depth of field works', fr:'Le principe de la profondeur de champ'})) + '">';
  PTS.forEach((p, i) => {
    s += '<circle cx="' + (40 + i * 150) + '" cy="26" r="7" fill="' + p.c + '"/>'
      +  '<text class="sub" x="' + (54 + i * 150) + '" y="31">' + esc(t(p.n)) + '</text>';
  });
  ROWS.forEach((row, r) => {
    const y0 = 160 + r * 250, A = row.A;
    s += '<text class="lab" x="24" y="' + (y0 - 92) + '">' + esc(r ? t({zh:'小光圈', en:'Small aperture', fr:'Petite ouverture'}) : t({zh:'大光圈', en:'Wide aperture', fr:'Grande ouverture'})) + ' ' + row.l + '</text>';
    s += '<line x1="20" y1="' + y0 + '" x2="880" y2="' + y0 + '" stroke="rgba(148,163,184,0.2)" stroke-width="1"/>';
    s += '<ellipse class="glass" cx="' + LX + '" cy="' + y0 + '" rx="12" ry="96"/>';
    s += '<line class="blade" x1="' + (LX + 22) + '" y1="' + (y0 - 100) + '" x2="' + (LX + 22) + '" y2="' + f1(y0 - A) + '"/>'
      +  '<line class="blade" x1="' + (LX + 22) + '" y1="' + f1(y0 + A) + '" x2="' + (LX + 22) + '" y2="' + (y0 + 100) + '"/>';
    s += '<line x1="' + SX + '" y1="' + (y0 - 100) + '" x2="' + SX + '" y2="' + (y0 + 100) + '" stroke="#a78bfa" stroke-width="6"/>';
    PTS.forEach((p, k) => {
      const v = 1 / (1 / F - 1 / p.u), ox = LX - p.u;
      const half = A * Math.abs(1 - (SX - LX) / v);
      [-1, 1].forEach(sg => {
        const ly = y0 + sg * A, sy = y0 + sg * A * (1 - (SX - LX) / v);
        s += '<path d="M' + ox + ' ' + y0 + ' L' + LX + ' ' + f1(ly) + ' L' + SX + ' ' + f1(sy) + '" fill="none" stroke="' + p.c + '" stroke-opacity=".75" stroke-width="1.8"/>';
      });
      s += '<circle cx="' + ox + '" cy="' + y0 + '" r="5" fill="' + p.c + '"/>';
      const dx = 778 + k * 44;
      s += '<circle cx="' + dx + '" cy="' + y0 + '" r="' + TOL + '" fill="none" stroke="#94a3b8" stroke-dasharray="3 3"/>'
        +  '<circle cx="' + dx + '" cy="' + y0 + '" r="' + f1(Math.max(half, 2)) + '" fill="' + p.c + '" fill-opacity=".55" stroke="' + p.c + '" stroke-width="1.5"/>';
    });
    s += '<text class="sub" x="822" y="' + (y0 + 58) + '" text-anchor="middle" style="font-size:13px">'
      + esc(t({zh:'感光元件上的光斑', en:'discs on the sensor', fr:'taches sur le capteur'})) + '</text>';
    s += '<text class="sub" x="822" y="' + (y0 + 78) + '" text-anchor="middle" style="font-size:13px;fill:' + (r ? '#86efac' : '#fca5a5') + '">'
      + esc(r ? t({zh:'都在虛線內：看起來清楚', en:'inside the dashes: sharp', fr:'dans les pointillés : net'}) : t({zh:'超出虛線：看起來模糊', en:'outside the dashes: blurred', fr:'hors des pointillés : flou'})) + '</text>';
  });
  s += '<text class="sub" x="' + SX + '" y="' + (160 - 108) + '" text-anchor="middle" style="fill:#c4b5fd">' + esc(t({zh:'感光元件', en:'sensor', fr:'capteur'})) + '</text>';
  s += '<text class="sub" x="' + (LX + 10) + '" y="' + (160 - 108) + '" text-anchor="middle" style="fill:#67e8f9">' + esc(t({zh:'鏡頭與光圈', en:'lens and aperture', fr:'objectif et diaphragme'})) + '</text>';
  s += '<text class="sub" x="24" y="544">' + esc(t({zh:'虛線圓＝可接受的模糊圈。', en:'Dashed circle = the acceptable circle of confusion.', fr:'Cercle en pointillés = le cercle de confusion admissible.'})) + '</text>'
    +  '<text class="sub" x="24" y="566">' + esc(t({
    zh:'光圈越小，光錐越窄，前後的點在感光元件上的光斑越小。',
    en:'A smaller aperture narrows the cone, so points in front and behind make smaller discs.',
    fr:'Une ouverture plus petite resserre le cône : les points avant et arrière font des taches plus petites.'})) + '</text>';
  return s + '</svg>';
}

/* Unsharp mask on a soft edge: sharpened = original + amount ×
   (original − blurred). The overshoot either side of the edge is the
   entire effect; no detail is created. */
function sharpDiagram() {
  const sig = (x, w) => 1 / (1 + Math.exp(-(x - 0.5) / w));
  const orig = x => 0.25 + 0.5 * sig(x, 0.025);
  const blur = x => 0.25 + 0.5 * sig(x, 0.08);
  const sharp = x => Math.max(0, Math.min(1, orig(x) + 0.9 * (orig(x) - blur(x))));
  const X = 40, W = 820, n = 160;
  let s = '<svg class="dg mt-4" viewBox="0 0 900 400" role="img" aria-label="' + esc(t({zh:'銳利化原理', en:'How sharpening works', fr:'Le principe de l’accentuation'})) + '">';
  [[orig, t({zh:'原圖', en:'original', fr:'original'})], [sharp, t({zh:'銳利化後', en:'sharpened', fr:'accentué'})]].forEach(([fn, lab], r) => {
    const y = 26 + r * 56;
    for (let i = 0; i < n; i++) {
      const v = Math.round(fn((i + 0.5) / n) * 255);
      s += '<rect x="' + f1(X + W * i / n) + '" y="' + y + '" width="' + f1(W / n + 0.6) + '" height="36" shape-rendering="crispEdges" fill="rgb(' + v + ',' + v + ',' + v + ')"/>';
    }
    s += '<text class="val" x="' + (X + 8) + '" y="' + (y + 24) + '" style="font-size:14px;fill:#e2e8f0;paint-order:stroke;stroke:#0b0f13;stroke-width:4px">' + esc(lab) + '</text>';
  });
  const GY = 150, GH = 200, path = fn => {
    let d = '';
    for (let i = 0; i <= n; i++) { const x = i / n; d += (i ? ' L' : 'M') + f1(X + W * x) + ' ' + f1(GY + GH - GH * fn(x)); }
    return d;
  };
  s += '<rect x="' + X + '" y="' + GY + '" width="' + W + '" height="' + GH + '" fill="#0f151c" stroke="#334155"/>';
  s += '<path d="' + path(blur) + '" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>';
  s += '<path d="' + path(orig) + '" fill="none" stroke="#e2e8f0" stroke-width="3"/>';
  s += '<path d="' + path(sharp) + '" fill="none" stroke="#c4b5fd" stroke-width="4"/>';
  const lg = [['#64748b', t({zh:'模糊版本', en:'blurred copy', fr:'copie floutée'})], ['#e2e8f0', t({zh:'原圖亮度', en:'original brightness', fr:'luminosité d’origine'})], ['#c4b5fd', t({zh:'原圖＋（原圖－模糊）', en:'original + (original − blurred)', fr:'original + (original − flou)'})]];
  lg.forEach((l, i) => {
    s += '<line x1="' + (X + 14) + '" y1="' + (GY + 22 + i * 22) + '" x2="' + (X + 40) + '" y2="' + (GY + 22 + i * 22) + '" stroke="' + l[0] + '" stroke-width="4"/>'
      +  '<text class="sub" x="' + (X + 48) + '" y="' + (GY + 27 + i * 22) + '" style="font-size:13px">' + esc(l[1]) + '</text>';
  });
  s += '<text class="sub" x="' + X + '" y="' + (GY + GH + 30) + '" style="font-size:13px">' + esc(t({
    zh:'邊緣兩側被推得更暗、更亮（過衝），看起來就更銳利。推太多就是白邊光暈。',
    en:'Each side of the edge is pushed darker or lighter (overshoot), which reads as sharpness. Too much is a white halo.',
    fr:'Chaque côté du contour est poussé plus sombre ou plus clair : c’est la netteté perçue. Trop, c’est un halo blanc.'})) + '</text>';
  return s + '</svg>';
}

  p:{zh:'f 值＝焦距 ÷ 開口直徑。用比例而不用直徑，是為了讓不同鏡頭在同一 f 值下亮度相同：50mm f/2 的開口是 25mm，100mm f/2 的開口是 50mm，影像被放大兩倍但開口也大兩倍，到達感光元件的亮度一樣。', en:'f-number = focal length ÷ opening diameter. A ratio rather than a diameter, so every lens gives the same brightness at the same f-number: a 50mm at f/2 opens 25mm, a 100mm at f/2 opens 50mm; the image is twice as magnified but the hole is twice as wide, and the sensor sees the same brightness.', fr:'Nombre f = focale ÷ diamètre de l’ouverture. Un rapport plutôt qu’un diamètre, pour que tout objectif donne la même luminosité au même nombre f : un 50 mm à f/2 ouvre 25 mm, un 100 mm à f/2 ouvre 50 mm ; l’image est deux fois plus grande mais le trou aussi, et le capteur reçoit la même luminosité.'},
  e:{zh:'數字越大開口越小。1.4、2、2.8、4、5.6、8、11、16 每格相差 √2 倍，也就是一級。', en:'The bigger the number, the smaller the hole. 1.4, 2, 2.8, 4, 5.6, 8, 11, 16 differ by √2 each, one stop apart.', fr:'Plus le nombre est grand, plus le trou est petit. 1,4 ; 2 ; 2,8 ; 4 ; 5,6 ; 8 ; 11 ; 16 diffèrent de √2, soit un IL.'} },
{ c:'opt', id:'stop', k:{zh:'級（stop）與 EV', en:'Stop and EV', fr:'IL (diaphragme) et EV'},
  m:{zh:'曝光的計量單位：一級＝光量加倍或減半。', en:'The unit of exposure: one stop doubles or halves the light.', fr:'L’unité d’exposition : un IL double ou divise la lumière par deux.'},
  p:{zh:'人眼對亮度的感受接近對數，光量加倍看起來才像「亮了一格」，所以用倍數而非加減來計量。EV 把光圈與快門合成一個數：EV＝log₂（N² ÷ t），EV 相同的組合曝光量相同。', en:'The eye perceives brightness roughly logarithmically: doubling the light is what looks like one step brighter, so exposure is counted in factors of two. EV folds aperture and shutter into one number, EV = log₂(N² ÷ t); combinations with the same EV give the same exposure.', fr:'L’œil perçoit la luminosité de façon à peu près logarithmique : c’est le doublement qui paraît « un cran plus clair ». On compte donc par facteurs deux. L’EV réunit ouverture et vitesse : EV = log₂(N² ÷ t) ; même EV, même exposition.'},
  e:{zh:'曝光補償 +1 EV 就是亮一倍。相機多半以 1/3 級為一格調整。', en:'+1 EV of compensation is twice as bright. Cameras usually step in thirds of a stop.', fr:'+1 EV de correction donne deux fois plus clair. Les appareils avancent en général par tiers d’IL.'} },
{ c:'opt', id:'shutter', k:{zh:'快門速度', en:'Shutter speed', fr:'Vitesse d’obturation'},
  m:{zh:'感光元件接收光線的時間長度，例如 1/250 秒。', en:'How long the sensor receives light, 1/250 s for instance.', fr:'La durée pendant laquelle le capteur reçoit la lumière, par exemple 1/250 s.'},
  p:{zh:'機械快門有前後兩片簾幕：前簾打開開始曝光，後簾跟上結束曝光。速度很快時，兩簾同時移動，只露出一條縫掃過感光元件。閃光燈只亮一瞬間，照不到整個畫面，所以有「閃燈同步速度」上限，多在 1/200 到 1/250 秒。', en:'A mechanical shutter has two curtains: the first opens to start the exposure, the second follows to end it. At high speeds both travel together, exposing the sensor through a moving slit. A flash lasts an instant and would light only part of that slit, hence the flash sync limit, usually 1/200 to 1/250 s.', fr:'Un obturateur mécanique a deux rideaux : le premier s’ouvre pour commencer la pose, le second le suit pour la finir. Aux vitesses élevées, ils défilent ensemble et exposent le capteur par une fente mobile. Un flash ne dure qu’un instant et n’éclairerait qu’une partie de la fente, d’où la vitesse de synchronisation, souvent 1/200 à 1/250 s.'},
  e:{zh:'決定動作被凍結還是拉出模糊；時間加倍＝一級。', en:'It decides whether motion freezes or blurs; doubling the time is one stop.', fr:'Elle décide si le mouvement est figé ou flou ; doubler la durée vaut un IL.'} },
{ c:'opt', id:'iso', k:{zh:'ISO 感光度', en:'ISO', fr:'Sensibilité ISO'},
  m:{zh:'相機把感光元件訊號放大的程度。', en:'How much the camera amplifies the sensor’s signal.', fr:'L’amplification que l’appareil applique au signal du capteur.'},
  p:{zh:'ISO 不會讓感光元件更敏感，它只是在讀出後放大訊號。雜訊主要來自「收到的光太少」：光子到達本來就有隨機起伏，光越少，起伏占的比例越大。高 ISO 照片雜訊多，是因為你在光少的條件下拍，ISO 只是把它變亮到能看。', en:'ISO does not make the sensor more sensitive; it amplifies the signal after it is read. Noise comes mainly from too little light: photons arrive with random fluctuation, and the less light, the larger that fluctuation in proportion. High-ISO pictures are noisy because they were taken in little light; ISO only brightens them enough to see.', fr:'Les ISO ne rendent pas le capteur plus sensible ; ils amplifient le signal après lecture. Le bruit vient surtout du manque de lumière : les photons arrivent avec une fluctuation aléatoire, d’autant plus importante en proportion que la lumière est faible. Une image à ISO élevés est bruitée parce qu’elle a été prise avec peu de lumière ; les ISO ne font que l’éclaircir.'},
  e:{zh:'能用低 ISO 就用低 ISO；但為了守住快門，提高 ISO 比拍糊好。', en:'Use the lowest ISO you can, but raising ISO beats a blurred picture.', fr:'Gardez les ISO aussi bas que possible, mais les monter vaut mieux qu’une image floue.'} },
{ c:'opt', id:'exposure', k:{zh:'曝光', en:'Exposure', fr:'Exposition'},
  m:{zh:'感光元件總共收到多少光。', en:'The total amount of light the sensor receives.', fr:'La quantité totale de lumière reçue par le capteur.'},
  p:{zh:'曝光量＝照度 × 時間，由光圈（照度）和快門（時間）決定；ISO 改變的是亮度的呈現，而非真正收進的光。「正確曝光」是讓重要的亮部和暗部都落在感光元件能記錄的範圍內。', en:'Exposure = illuminance × time, set by the aperture (illuminance) and the shutter (time). ISO changes how bright it is rendered, not how much light was collected. A correct exposure puts the important highlights and shadows inside what the sensor can record.', fr:'Exposition = éclairement × durée, fixés par l’ouverture et la vitesse. Les ISO changent le rendu de la luminosité, pas la lumière recueillie. Une exposition correcte place les hautes et basses lumières importantes dans ce que le capteur peut enregistrer.'},
  e:{zh:'用直方圖判斷，不要只相信螢幕亮度。', en:'Judge it by the histogram, not the brightness of the screen.', fr:'Jugez-la à l’histogramme, pas à la luminosité de l’écran.'} },
{ c:'opt', id:'dof', dia:'dof', k:{zh:'景深', en:'Depth of field', fr:'Profondeur de champ'},
  m:{zh:'畫面中「看起來清楚」的前後距離範圍。', en:'The range of distances, front to back, that looks sharp.', fr:'La plage de distances, d’avant en arrière, qui paraît nette.'},
  p:{zh:'鏡頭其實只能精準對焦在一個平面上。這個平面前後的點，到了感光元件上不是一個點，而是一個小圓盤，叫「模糊圈」。只要圓盤小到眼睛分辨不出（全片幅常以 0.03mm 為基準），我們就覺得它清楚。光圈越小，光錐越窄，圓盤越小，景深就越深（見下圖）。', en:'A lens focuses exactly on only one plane. A point in front of or behind it reaches the sensor not as a point but as a small disc, the circle of confusion. While that disc is too small for the eye to resolve (0.03 mm is the usual full-frame figure) it looks sharp. A smaller aperture narrows the cone of light, shrinks the disc, and deepens the depth of field (see the diagram).', fr:'Un objectif ne fait la mise au point exacte que sur un plan. Un point devant ou derrière arrive au capteur non comme un point mais comme un petit disque, le cercle de confusion. Tant que ce disque est trop petit pour l’œil (0,03 mm est la valeur usuelle en plein format), il paraît net. Une ouverture plus petite resserre le cône, réduit le disque et augmente la profondeur de champ (voir le schéma).'},
  e:{zh:'由光圈、焦距、拍攝距離與感光元件尺寸共同決定。中等距離時，清楚範圍大約前面三分之一、後面三分之二；微距時前後各半，而且非常淺。', en:'Aperture, focal length, distance and sensor size set it together. At moderate distances about a third lies in front of the focus point and two thirds behind; in macro it splits evenly and is very thin.', fr:'Ouverture, focale, distance et taille du capteur la fixent ensemble. À distance moyenne, environ un tiers est devant le point net et deux tiers derrière ; en macro, moitié-moitié, et très mince.'} },
{ c:'opt', id:'focal', k:{zh:'焦距', en:'Focal length', fr:'Focale'},
  m:{zh:'鏡頭的放大能力，以 mm 表示。', en:'A lens’s power of magnification, in millimetres.', fr:'Le pouvoir de grossissement d’un objectif, en millimètres.'},
  p:{zh:'光學上是對焦在無限遠時，鏡頭光學中心到感光元件的距離。距離越長，影像被放得越大，同一塊感光元件裝得下的視野就越窄。', en:'Optically, the distance from the lens’s optical centre to the sensor when focused at infinity. The longer it is, the larger the image is projected, and the less of the scene fits on the same sensor.', fr:'Optiquement, la distance entre le centre optique et le capteur quand l’objectif est réglé sur l’infini. Plus elle est longue, plus l’image projetée est grande, et moins la scène tient sur le même capteur.'},
  e:{zh:'焦距決定視角與放大率；14mm 看得廣，200mm 看得遠。', en:'It sets the angle of view and the magnification: 14mm sees wide, 200mm sees far.', fr:'Elle fixe l’angle de champ et le grossissement : 14 mm voit large, 200 mm voit loin.'} },
{ c:'opt', id:'aov', k:{zh:'視角', en:'Angle of view', fr:'Angle de champ'},

  p:{zh:'由焦距和感光元件尺寸決定：水平視角＝2 × arctan（元件寬度 ÷ 2 ÷ 焦距）。元件越小，同一焦距的視角越窄。', en:'Set by focal length and sensor size: horizontal angle = 2 × arctan(sensor width ÷ 2 ÷ focal length). A smaller sensor gives a narrower angle at the same focal length.', fr:'Fixé par la focale et la taille du capteur : angle horizontal = 2 × arctan(largeur ÷ 2 ÷ focale). Un capteur plus petit donne un angle plus étroit à focale égale.'},

  m:{zh:'較小感光元件相對全片幅的縮小比例。', en:'How much smaller a sensor is than full frame.', fr:'Le rapport de réduction d’un capteur par rapport au plein format.'},
  p:{zh:'以對角線相除得到，APS-C 約 1.5。小元件只截取鏡頭成像的中央部分，等於把全片幅照片裁切後放大。', en:'The ratio of the diagonals, about 1.5 for APS-C. A smaller sensor takes only the centre of the lens’s image, as if a full-frame picture were cropped and enlarged.', fr:'Le rapport des diagonales, environ 1,5 en APS-C. Un petit capteur ne prend que le centre de l’image projetée, comme un plein format recadré puis agrandi.'},
  e:{zh:'用來換算等效焦距與景深，焦距本身不變。', en:'Used to convert equivalent focal length and depth of field; the focal length itself is unchanged.', fr:'Sert à convertir focale équivalente et profondeur de champ ; la focale elle-même ne change pas.'} },
