/* One eight of bachata: steps on 1-3 and 5-7, the accented tap on 4 and 8,
   and the hip curve that rises on each tap (drawn as a computed wave). */
function diaEight() {
  const L = {
    title:{zh:'Bachata 的一個八拍：三步＋一個重音', en:'One eight of bachata: three steps and an accent', fr:'Un huit de bachata : trois pas et un accent'},
    feet:{zh:'腳步', en:'Feet', fr:'Pieds'}, hip:{zh:'髖部', en:'Hips', fr:'Hanches'},
    step:{zh:'踏', en:'step', fr:'pas'}, tap:{zh:'tap', en:'tap', fr:'tap'},
    note:{zh:'音樂在 4 與 8 有明顯的重音（吉他與 bongo），舞者用 tap 和髖部把它「跳出來」。', en:'The music accents 4 and 8 (guitar and bongo); dancers show it with the tap and the hip.', fr:'La musique accentue 4 et 8 (guitare et bongo) ; le danseur le montre avec le tap et la hanche.'},
  };
  const X0 = 90, cw = 96, y = 60;
  let s = `<text x="0" y="22" class="lab">${t(L.title)}</text>
    <text x="0" y="${y + 26}" class="sub">${t(L.feet)}</text><text x="0" y="${y + 110}" class="sub">${t(L.hip)}</text>`;
  for (let i = 0; i < 8; i++) {
    const x = X0 + i * cw, accent = (i === 3 || i === 7);
    s += `<rect x="${x}" y="${y}" width="${cw - 8}" height="44" rx="8" fill="${accent ? '#e879f9' : 'rgba(148,163,184,0.08)'}" fill-opacity="${accent ? 0.55 : 1}" stroke="rgba(148,163,184,0.25)"/>`;
    s += `<text x="${x + (cw - 8) / 2}" y="${y + 20}" text-anchor="middle" class="val">${i + 1}</text>`;
    s += `<text x="${x + (cw - 8) / 2}" y="${y + 37}" text-anchor="middle" class="sub">${accent ? t(L.tap) : t(L.step)}</text>`;
  }
  /* hip: low through the steps, popping up on each accent */
  let d = '';
  for (let k = 0; k <= 320; k++) {
    const beat = k / 40;                              /* 0..8 */
    const near = Math.min(Math.abs(beat - 3.5), Math.abs(beat - 7.5));
    const v = Math.exp(-near * near * 10);
    d += (k ? ' L' : 'M') + (X0 + beat * cw).toFixed(1) + ' ' + (y + 130 - v * 40).toFixed(1);
  }
  s += `<path d="${d}" fill="none" stroke="#e879f9" stroke-width="3"/>`;
  s += `<text x="0" y="${y + 166}" class="sub">${t(L.note)}</text>`;
  return `<svg class="dg" viewBox="0 0 900 240" role="img" aria-label="${t(L.title)}">${s}</svg>`;
}

/* ── 5. Partner work ── */
{ id:'partner', i:'fa-people-arrows', c:S,
  nav:{zh:'雙人與花式', en:'Partner work', fr:'En couple'},
  eyebrow:{zh:'第五章・教學', en:'Chapter 5 · Lessons', fr:'Chapitre 5 · Leçons'},
  h2:{zh:'舞姿、轉圈與入門花式', en:'Holds, turns and first figures', fr:'Tenues, tours et premières figures'},
  blocks:[
  { type:'cards', cols:3, items:[
    { i:'fa-people-pulling', t:{zh:'閉式（Close hold）', en:'Close hold', fr:'Tenue fermée'}, p:{zh:'男生右手放在女生左肩胛骨或腰後，左手握女生右手在肩膀高度；女生左手搭在男生右肩或上臂。胸口保持一點距離（Dominican）或貼近（Sensual）。', en:'His right hand on her left shoulder blade or lower back, his left holding her right at shoulder height; her left hand on his right shoulder or upper arm. A little space between chests (Dominican) or close (sensual).', fr:'Main droite du cavalier sur l’omoplate gauche ou le bas du dos, main gauche tenant sa droite à hauteur d’épaule ; main gauche de la cavalière sur son épaule ou son bras. Un peu d’espace (dominicain) ou rapproché (sensual).'} },
    { i:'fa-handshake', t:{zh:'開放式（Open hold）', en:'Open hold', fr:'Tenue ouverte'}, p:{zh:'雙手相握在腰的高度，手肘微彎有張力，用來轉圈與花式。', en:'Both hands joined at waist height, elbows softly bent with tone; for turns and patterns.', fr:'Les deux mains jointes à hauteur de taille, coudes légèrement fléchis et toniques ; pour les tours et figures.'} },
    { i:'fa-heart', t:{zh:'連結', en:'Connection', fr:'Connexion'}, p:{zh:'帶領從軀幹出發，透過手臂與背上的手傳遞。跟隨者保持自己的平衡，不要整個人掛在對方身上。', en:'The lead starts in the torso and travels through the arms and the hand on the back. Followers keep their own balance and never hang on their partner.', fr:'Le guidage part du buste et passe par les bras et la main dans le dos. La cavalière garde son équilibre sans se suspendre à son partenaire.'} },
  ]},
  { type:'steps', items:[
    { t:{zh:'女生右轉（Right turn）', en:'Follower’s right turn', fr:'Tour à droite de la cavalière'}, p:{zh:'開放式。1–4 側步往左並在 4 給準備（左手往左下輕帶）；5 男生左手舉高到女生頭頂；女生 5–7 用三步向右轉一圈（右、左、右），8 點地面對男生。男生在原地踏基本步。', en:'Open hold. Side basic to the left on 1–4 with a prep on 4 (left hand slightly down-left); on 5 he raises his left hand above her head; she turns right in three steps on 5–7 (R, L, R) and taps facing him on 8. He keeps his basic on the spot.', fr:'Tenue ouverte. Pas latéral à gauche sur 1–4 avec une préparation sur 4 (main gauche vers le bas à gauche) ; sur 5, il lève la main au-dessus de sa tête ; elle tourne à droite en trois pas sur 5–7 (D, G, D) et tape face à lui sur 8. Lui reste sur son pas de base.'} },
    { t:{zh:'男生轉身（Leader’s turn）', en:'Leader’s turn', fr:'Tour du cavalier'}, p:{zh:'男生自己在 5–7 往左轉一圈，手從女生手中滑過或在頭頂交換，8 點地回到面對面。', en:'He turns left himself on 5–7, letting her hand slide around or passing it over his head, and taps facing her on 8.', fr:'Il tourne lui-même à gauche sur 5–7, la main glissant autour ou passant au-dessus de sa tête, et tape face à elle sur 8.'} },
    { t:{zh:'Cross body lead（換位）', en:'Cross-body lead', fr:'Cross body lead'}, p:{zh:'1–3 男生往前並轉 90° 讓出路線，4 點地；5–7 女生走過男生身前，兩人交換位置並在 7 轉回面對面，8 點地。', en:'On 1–3 he steps forward turning 90° to open a path, tapping on 4; on 5–7 she walks across in front of him, they swap places and face each other again on 7, tapping on 8.', fr:'Sur 1–3, il avance en pivotant de 90° pour ouvrir le passage, tap sur 4 ; sur 5–7, elle passe devant lui, ils échangent leurs places et se refont face sur 7, tap sur 8.'} },
    { t:{zh:'Hammerlock（手臂纏繞）', en:'Hammerlock', fr:'Hammerlock'}, p:{zh:'女生右轉半圈時，男生把她的右手輕放在她背後，兩人變成並肩，再用另一個右轉解開。動作要溫和，不要把手臂往上扳。', en:'During a half right turn, he places her right hand gently behind her back so they end side by side, then unwinds with another right turn. Be gentle: never lever the arm upwards.', fr:'Pendant un demi-tour à droite, il pose doucement sa main droite dans son dos, ils se retrouvent côte à côte, puis il défait la figure par un autre tour. En douceur : ne jamais forcer le bras vers le haut.'} },

  { type:'counts', t:{zh:'單人練習：由上而下的波浪（四拍一次）', en:'Solo drill: a top-down wave (one every four counts)', fr:'Exercice solo : ondulation de haut en bas (une tous les quatre temps)'},
    p:{zh:'雙腳與髖同寬、膝蓋放鬆，對著鏡子側身做。重點是一個部位接著一個部位，像水流經過，而不是同時一起動。', en:'Feet hip-width, knees soft, side-on to a mirror. The point is one part after another, like water flowing through, never all at once.', fr:'Pieds largeur de hanches, genoux souples, de profil face au miroir. Une partie après l’autre, comme de l’eau qui s’écoule, jamais tout en même temps.'},
    items:[
      {n:'1', p:{zh:'頭與胸往前推', en:'Head and chest push forward', fr:'Tête et poitrine vers l’avant'}},
      {n:'2', p:{zh:'胸收回、腹部往前', en:'Chest back, belly forward', fr:'Poitrine en arrière, ventre en avant'}},
      {n:'3', p:{zh:'腹部收回、髖往前', en:'Belly back, hips forward', fr:'Ventre en arrière, bassin en avant'}},
      {n:'4', p:{zh:'髖收回、膝蓋微彎再伸直', en:'Hips back, knees bend and straighten', fr:'Bassin en arrière, genoux fléchis puis tendus'}},
    ]},
  { type:'warn', p:{
    zh:'安全與尊重：dip（下腰）與 head roll（頭部繞圈）只在雙方都會、而且舞伴同意時做；帶領者要撐住舞伴的重量，動作慢、幅度小，絕不能突然甩頭。近身舞姿可以由跟隨者調整距離，覺得不舒服隨時可以拉開。',
    en:'Safety and respect: do dips and head rolls only when both of you know them and your partner agrees; the leader supports the follower’s weight, moving slowly and small, never whipping the head. In close hold the follower can adjust the distance and step back whenever they feel uncomfortable.',
    fr:'Sécurité et respect : dips et head rolls seulement si les deux les maîtrisent et que le partenaire est d’accord ; le cavalier soutient le poids, lentement et en petite amplitude, sans jamais fouetter la tête. En tenue rapprochée, la cavalière règle la distance et peut s’écarter dès qu’elle se sent mal à l’aise.'} },
]},
