<script>
let LANG = 'zh';
function t(o){ if(o==null) return ''; if(typeof o==='string') return o; return o[LANG]||o.en||o.zh||''; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ═══════════════════════════════════════════════════════════
   Stitch symbols, drawn in a 100x100 cell so they can be used
   both on their own and composed into a pattern chart. These
   follow the international (JIS) symbol set, which is what
   Japanese and most European charts use.
   ═══════════════════════════════════════════════════════════ */
const T_BAR = 'M26 16 H74';            /* the top bar every post stitch carries */
const STEM  = 'M50 16 V86';
function bars(n) {                      /* the slashes that count the yarn-overs */
  let d = '';
  for (let i = 0; i < n; i++) { const y = 36 + i * 15; d += `M32 ${y + 6} L68 ${y - 2} `; }
  return d ? `<path class="s" d="${d.trim()}"/>` : '';
}
const SHAPES = {
  ch:  () => '<ellipse class="s" cx="50" cy="50" rx="30" ry="15"/>',
  sl:  () => '<circle class="f" cx="50" cy="50" r="12"/>',
  sc:  () => '<path class="s" d="M28 26 L72 74 M72 26 L28 74"/>',
  hdc: () => `<path class="s" d="${STEM} ${T_BAR}"/>`,
  dc:  () => `<path class="s" d="${STEM} ${T_BAR}"/>` + bars(1),
  tr:  () => `<path class="s" d="${STEM} ${T_BAR}"/>` + bars(2),
  dtr: () => `<path class="s" d="${STEM} ${T_BAR}"/>` + bars(3),
  /* two posts growing out of one stitch below */
  inc: () => '<path class="s" d="M50 88 L28 22 M50 88 L72 22 M10 22 H46 M54 22 H90"/>'
           + '<path class="s" d="M20 46 L40 40 M60 40 L80 46"/>',
  /* two posts drawn together into one loop above */
  dec: () => '<path class="s" d="M28 88 L50 22 M72 88 L50 22 M26 22 H74"/>'
           + '<path class="s" d="M22 52 L40 46 M60 46 L78 52"/>',
  /* several posts sharing one base and one top: a bobble */
  bob: () => '<path class="s" d="M50 90 L30 26 M50 90 L50 24 M50 90 L70 26 M26 22 H74"/>',
  /* several posts fanning from one base: a shell */
  shell:()=> '<path class="s" d="M50 92 L16 30 M50 92 L34 24 M50 92 L50 22 M50 92 L66 24 M50 92 L84 30"/>'
           + '<path class="s" d="M12 26 H88"/>',
  /* a picot: three chains closed into a loop */
  pic: () => '<ellipse class="s" cx="26" cy="60" rx="16" ry="9" transform="rotate(-38 26 60)"/>'
           + '<ellipse class="s" cx="50" cy="34" rx="16" ry="9"/>'
           + '<ellipse class="s" cx="74" cy="60" rx="16" ry="9" transform="rotate(38 74 60)"/>',
  /* worked into the back loop only: the bar under the symbol */
  scP: () => '<path class="s" d="M50 24 V76 M24 50 H76"/>',
  blo: () => `<path class="s" d="${STEM} ${T_BAR}"/>` + bars(1)
           + '<path class="s" d="M22 92 H78"/>',
};
function symSvg(key, size, cls) {
  const f = SHAPES[key]; if (!f) return '';
  return `<svg class="sym ${cls || ''}" viewBox="0 0 100 100" width="${size}" height="${size}"`
       + ` role="img" aria-label="${esc(key)}">${f()}</svg>`;
}

/* ── Chart composition ───────────────────────────────────────
   A flat chart is rows worked bottom to top, alternating
   direction; a round chart is worked outward from the centre. */
function chartFlat(rows, cell) {
  cell = cell || 46;
  const w = Math.max.apply(null, rows.map(r => r.length)) * cell + cell * 1.6;
  const h = rows.length * cell + cell * 0.9;
  let g = '';
  rows.forEach((row, ri) => {
    const y = h - cell * 0.6 - (ri + 1) * cell;
    row.forEach((k, ci) => {
      const x = cell * 0.8 + ci * cell;
      g += `<g transform="translate(${x},${y}) scale(${cell / 100})">${SHAPES[k] ? SHAPES[k]() : ''}</g>`;
    });
    /* which way the row is worked */
    const dir = ri % 2 === 0 ? '→' : '←';
    g += `<text class="lbl" x="${w - cell * 0.35}" y="${y + cell * 0.72}" text-anchor="end"`
       + ` stroke="#120d0e" stroke-width="6" paint-order="stroke">${dir}${ri + 1}</text>`;
  });
  return `<svg class="chart w-full" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
function chartRound(rounds, cell) {
  cell = cell || 44;
  const R = rounds.length * cell * 1.15 + cell;
  const size = R * 2 + cell;
  const c = size / 2;
  let g = '';
  rounds.forEach((rd, ri) => {
    const r = cell * 0.9 + ri * cell * 1.15;
    g += `<circle class="guide" cx="${c}" cy="${c}" r="${r}"/>`;
    for (let i = 0; i < rd.n; i++) {
      const a = (i / rd.n) * Math.PI * 2 - Math.PI / 2;
      const x = c + Math.cos(a) * r, y = c + Math.sin(a) * r;
      const deg = (a * 180 / Math.PI) + 90;
      g += `<g transform="translate(${x},${y}) rotate(${deg}) translate(${-cell / 2},${-cell / 2})`
         + ` scale(${cell / 100})">${SHAPES[rd.k] ? SHAPES[rd.k]() : ''}</g>`;
    }
    /* offset off the 12 o'clock stitch, with a dark halo so it stays legible */
    g += `<text class="lbl" x="${c - cell * 0.85}" y="${c - r + cell * 0.34}" text-anchor="end"`
       + ` stroke="#120d0e" stroke-width="6" paint-order="stroke">${ri + 1}</text>`;
  });
  return `<svg class="chart w-full" viewBox="0 0 ${size} ${size}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* ═══════════════════════════════════════════════════════════
   Tools, hook sizes
   ═══════════════════════════════════════════════════════════ */
const TOOLS = [
  { i:'fa-mitten', t:{zh:'鉤針', en:'The hook', fr:'Le crochet'},
    p:{zh:'金屬、竹製或塑膠，粗細以毫米標示。新手建議從 4.0 至 5.0 mm 開始：太細看不清針目，太粗手容易累。握把加粗的款式對長時間鉤織友善很多。',
       en:'Metal, bamboo or plastic, sized in millimetres. Start somewhere between 4.0 and 5.0 mm: anything finer hides the stitches from you, anything much thicker tires the hand. A padded grip makes a long session far kinder.',
       fr:'Métal, bambou ou plastique, calibré en millimètres. Commencez entre 4,0 et 5,0 mm : plus fin, les mailles deviennent illisibles ; beaucoup plus gros, la main fatigue. Un manche rembourré change tout sur la durée.'} },
  { i:'fa-circle-notch', t:{zh:'線材', en:'The yarn', fr:'Le fil'},
    p:{zh:'新手用淺色、平滑、中等粗細（DK 或 worsted）的棉線或壓克力線最好。深色線看不見針目，毛海與圈圈紗會讓拆線變成惡夢，這兩種都留到以後。',
       en:'For a first project use a smooth, pale, medium-weight (DK or worsted) cotton or acrylic. Dark yarn hides your stitches, and mohair or bouclé turns any mistake into an ordeal to undo. Both can wait.',
       fr:'Pour débuter, un fil lisse, clair, d’épaisseur moyenne (DK ou worsted) en coton ou acrylique. Un fil sombre masque les mailles, et le mohair ou le bouclé transforme la moindre erreur en cauchemar à défaire. Plus tard.'} },

{ id:'basics', tone:'teal', icon:'fa-seedling', n:1,
  t:{zh:'第一部・入門', en:'Part 1 · Beginner', fr:'Partie 1 · Débutant'},

        fr:'Tout le crochet consiste à passer une boucle dans une autre. Les six mailles ci-dessous couvrent presque tout, et les quatre premières suffisent à terminer un vrai ouvrage. Chacune porte son symbole international, tel qu’il apparaît sur un diagramme.'},

           en:'Keep the chain loose. Nine beginners in ten make the first row too tight to get the hook back into. If yours is tight, work the chain with a hook one size larger.',

    { sym:'sc', t:{zh:'短針（美式 sc）', en:'Single crochet (US)', fr:'Maille serrée'}, abbr:'sc / UK dc',
      p:{zh:'最常用的針法，織出來緊密扎實。插入針目，掛線拉出（針上兩圈），再掛線一次拉過兩圈。玩偶幾乎全部用它，因為孔隙小、不透棉。',
         en:'The workhorse, and the densest of the basic stitches. Insert, yarn over and draw up a loop (two on the hook), yarn over and pull through both. Amigurumi is made almost entirely of it, because the fabric is tight enough to hide the stuffing.',
         fr:'La maille de base la plus utilisée, et la plus dense. Piquez, jeté, remontez une boucle (deux sur le crochet), jeté, tirez à travers les deux. L’amigurumi en est presque entièrement fait : le tissu est assez serré pour cacher le rembourrage.'},
      tip:{zh:'注意：這個符號在英式術語裡叫 double crochet。看到外文圖解，先確認是美式還是英式，否則整件會做錯。',

         en:'Yarn over, insert, draw up a loop (three on the hook), yarn over and through two, yarn over and through the last two. It grows fast, has give, and leaves a moderate hole. It is the mainstay of blankets and garments.',
         fr:'Jeté, piquez, remontez une boucle (trois sur le crochet), jeté et à travers deux, jeté et à travers les deux dernières. Elle monte vite, reste souple, ajoure modérément : la maille reine des couvertures et des vêtements.'},
      tip:{zh:'每排開頭要先鉤三個鎖針當作「立起針」，它算作第一個長針。忘記立針，邊緣就會越縮越窄。',

    { sym:'tr', t:{zh:'長長針', en:'Treble crochet (US)', fr:'Double bride'}, abbr:'tr / UK dtr',
      p:{zh:'掛線兩次再插入，之後每次掛線拉過兩圈，共三次。高度是長針的一倍半，主要用在蕾絲、網狀花樣，以及需要快速拉高的地方。',

      tip:{zh:'掛線次數決定針的高度：0 次是短針、1 次長針、2 次長長針。記住這條規律就不必背針法。',

    p:{zh:'由下往上、依照箭頭方向讀。最底下一排橢圓是起針鎖鏈；第二排的 × 是短針；上面兩排的 T 加一橫是長針。這就是一片最基本的織片，也是您的第一個作品。',

{ id:'inter', tone:'amber', icon:'fa-layer-group', n:2,
  t:{zh:'第二部・進階', en:'Part 2 · Intermediate', fr:'Partie 2 · Intermédiaire'},
  lead:{zh:'會了基本針法之後，接下來要學的不是更多針法，而是<strong class="text-white">怎麼控制形狀</strong>：往哪裡加針、往哪裡減針、怎麼從一個點鉤成一個圓。這一部學完，您就能自己看懂大部分市售圖解。',
        en:'Once the basic stitches are in your hands, the next thing to learn is not more stitches but <strong class="text-white">how to control shape</strong>: where to add, where to take away, and how to get from a single point to a circle. Finish this part and most published patterns become readable.',
        fr:'Une fois les mailles de base acquises, ce qu’il faut apprendre n’est pas d’autres mailles mais <strong class="text-white">la maîtrise de la forme</strong> : où augmenter, où diminuer, comment passer d’un point à un cercle. Cette partie franchie, la plupart des modèles publiés deviennent lisibles.'},
  items:[
    { sym:'inc', t:{zh:'加針', en:'Increase', fr:'Augmentation'}, abbr:'inc',
      p:{zh:'在同一個針目裡鉤兩針。符號畫成兩根柱子共用一個底點，一眼就看得出來。加針讓織片變寬，也是所有圓形與立體造型的原理。',
         en:'Two stitches worked into the same stitch below. The symbol shows two posts sharing one base, so it reads at a glance. Increases widen the fabric, and they are the whole principle behind circles and three-dimensional shapes.',
         fr:'Deux mailles dans la même maille du rang précédent. Le symbole montre deux montants partageant une base : cela se lit d’un coup d’œil. Les augmentations élargissent le tissu et fondent tout le travail en rond et en volume.'},
      tip:{zh:'圓形要平整，每圈的加針數必須固定：短針圓第一圈 6 針，之後每圈加 6 針。加太少會變成碗狀，加太多會荷葉邊。',
           en:'For a flat circle the number of increases per round must stay constant: six stitches in the first round, then six more in every round after. Too few and it cups into a bowl, too many and it ruffles.',

    { sym:'dec', t:{zh:'減針', en:'Decrease', fr:'Diminution'}, abbr:'dec / tog',
      p:{zh:'把兩針併成一針：分別插入兩個針目各拉出一個線圈，最後一次拉過全部。符號是兩根柱子共用一個頂點。',
         en:'Two stitches worked together into one: draw up a loop in each of the two stitches, then finish them off together. The symbol shows two posts sharing a single top.',
         fr:'Deux mailles rabattues ensemble : remontez une boucle dans chacune, puis écoulez-les ensemble. Le symbole montre deux montants partageant un même sommet.'},
      tip:{zh:'玩偶收口請用「隱形減針」：只挑兩針的前半段線圈再併，正面看不出孔洞，這是業餘與熟手最明顯的差別之一。',
           en:'For amigurumi use the invisible decrease: pick up only the front loops of the two stitches before joining them. It leaves no visible hole, and it is one of the clearest differences between a beginner finish and a practised one.',
           fr:'Pour l’amigurumi, utilisez la diminution invisible : ne prenez que les brins avant des deux mailles avant de les rabattre. Aucun trou visible : c’est l’un des écarts les plus nets entre une finition débutante et une main exercée.'} },
    { sym:'sl', t:{zh:'輪狀起針（魔術環）', en:'The magic ring', fr:'Le cercle magique'}, abbr:'MR',
      p:{zh:'把線在手指上繞一圈，在圈裡鉤出第一圈針目，然後拉緊線尾把中央的洞收死。所有從中心開始的圓形都從這裡起步。',
         en:'Loop the yarn around your fingers, work the first round of stitches into that loop, then pull the tail to close the hole in the middle. Every circle worked from the centre starts here.',
         fr:'Enroulez le fil autour des doigts, travaillez le premier tour dans cette boucle, puis tirez le brin pour refermer le trou central. Tout cercle travaillé depuis le centre commence ainsi.'},
      tip:{zh:'替代做法是「鎖針成圈」，但中央會留一個小孔。玩偶用魔術環，孔洞才會完全消失。',
           en:'The alternative is to chain a few and join into a ring, but that leaves a small hole in the middle. For amigurumi use the magic ring, so the hole closes completely.',
           fr:'On peut aussi fermer une chaînette en anneau, mais un petit trou subsiste au centre. Pour l’amigurumi, préférez le cercle magique : le trou disparaît entièrement.'} },
    { sym:'blo', t:{zh:'挑針位置：前段與後段', en:'Front loop and back loop', fr:'Brin avant et brin arrière'}, abbr:'FLO / BLO',
      p:{zh:'每個針目的頂端是一個 V 字，由前後兩條線構成。平常整條挑（兩條一起），只挑後面那條叫 BLO，只挑前面那條叫 FLO。符號底下多一條橫線就代表只挑後段。',
         en:'The top of every stitch is a V made of two strands. Normally you go under both. Working under only the back strand is BLO, only the front strand is FLO. A bar drawn beneath the symbol means back loop only.',
         fr:'Le sommet de chaque maille forme un V de deux brins. Normalement on pique sous les deux. Sous le brin arrière seul, c’est BLO ; sous le brin avant seul, FLO. Une barre sous le symbole signale le brin arrière.'},
      tip:{zh:'只挑後段會留下一條明顯的橫脊，那正是鉤出「羅紋」與玩偶轉折線的方法，不是失誤。',
           en:'Working back loop only leaves a visible horizontal ridge. That ridge is exactly how ribbing and the fold lines on amigurumi are made; it is not a mistake.',
           fr:'Ne piquer que le brin arrière laisse une nervure horizontale visible. C’est précisément ainsi qu’on obtient les côtes et les lignes de pliage des amigurumis : ce n’est pas un défaut.'} },
    { sym:'shell', t:{zh:'貝殼針', en:'The shell', fr:'L’éventail'}, abbr:'shell',
      p:{zh:'在同一個針目裡連續鉤五針長針，展開成扇形。它是最容易上手的花樣針，一排貝殼加一排短針就能織出漂亮的圍巾或毯邊。',
         en:'Five double crochets worked into one stitch, fanning open. It is the easiest decorative stitch to pick up: a row of shells alternating with a row of single crochet already makes a handsome scarf or blanket edge.',
         fr:'Cinq brides dans une même maille, ouvertes en éventail. C’est le point fantaisie le plus accessible : une rangée d’éventails alternée avec une rangée de mailles serrées suffit à faire une belle écharpe ou une bordure.'},
      tip:{zh:'貝殼針很吃線，用量大約是平織的一倍半，買線時要多抓一些。',
           en:'Shells eat yarn: budget roughly half again as much as a plain fabric of the same size.',
           fr:'L’éventail consomme beaucoup : comptez environ une fois et demie la quantité d’un tissu uni de même taille.'} },
    { sym:'bob', t:{zh:'玉編（爆米花針）', en:'Bobble and popcorn', fr:'Point boule et pop-corn'}, abbr:'bob / pc',
      p:{zh:'在同一針目裡鉤數針未完成的長針，最後一次全部拉在一起，形成一顆凸起的球。符號是數根柱子同時共用頂點與底點。',
         en:'Several unfinished double crochets in one stitch, closed together at the end so the bundle pops forward. The symbol shows several posts sharing both a base and a top.',
         fr:'Plusieurs brides inachevées dans une même maille, fermées ensemble pour former une boule saillante. Le symbole montre plusieurs montants partageant base et sommet.'},
      tip:{zh:'玉編會凸在「背面」。鉤的時候看到的是凹面，成品要翻過來才是正面，這一點常讓新手以為自己做錯了。',
           en:'A bobble pops out on the side facing away from you as you work. What you see while crocheting is the dented side, which regularly convinces beginners they have done it wrong.',
           fr:'La boule ressort du côté opposé à celui que vous voyez. Pendant le travail, vous voyez le creux, ce qui fait croire à bien des débutants qu’ils se sont trompés.'} },
  ],
  chart:{ kind:'round', rounds:[{n:6,k:'sc'},{n:12,k:'sc'},{n:18,k:'sc'},{n:24,k:'sc'}],
    t:{zh:'平面圓形的加針規律', en:'The increase rule for a flat circle', fr:'La règle du cercle plat'},
    p:{zh:'從中心往外讀。第一圈魔術環裡 6 針短針，第二圈每針加一次（12 針），第三圈每兩針加一次（18 針），第四圈每三針加一次（24 針）。每圈都固定加 6 針，圓形就會平。同樣的道理換成長針時改成每圈加 12 針。',
       en:'Read outward from the centre. Six single crochets into a magic ring, then increase in every stitch (12), then in every second stitch (18), then in every third (24). Six added per round, every round, keeps it flat. Swap to double crochet and the number becomes twelve per round.',
       fr:'Lisez du centre vers l’extérieur. Six mailles serrées dans un cercle magique, puis une augmentation dans chaque maille (12), une sur deux (18), une sur trois (24). Six ajoutées par tour, à chaque tour : le cercle reste plat. En brides, le nombre passe à douze par tour.'} } },
{ id:'adv', tone:'rose', icon:'fa-wand-magic-sparkles', n:3,
  t:{zh:'第三部・高階', en:'Part 3 · Advanced', fr:'Partie 3 · Avancé'},
  lead:{zh:'到這一階段，針法已經不是限制了。真正決定成品好壞的是三件事：<strong class="text-white">密度、立體塑形、收尾</strong>。這一部處理的是這些，以及幾種需要另外學的技法家族。',
        en:'By this stage the stitches are no longer the constraint. What separates a good finished piece from a poor one is three things: <strong class="text-white">gauge, shaping in three dimensions, and finishing</strong>. This part covers those, and a few technique families that have to be learned separately.',
        fr:'À ce stade, les mailles ne sont plus la contrainte. Ce qui sépare un bel ouvrage d’un ouvrage raté tient à trois choses : <strong class="text-white">l’échantillon, la mise en volume et les finitions</strong>. Cette partie les traite, ainsi que quelques familles de techniques à apprendre à part.'},
  items:[
    { sym:'sc', t:{zh:'密度：唯一決定尺寸的東西', en:'Gauge: the only thing that decides size', fr:'L’échantillon : ce qui décide de la taille'}, abbr:'gauge',
      p:{zh:'圖解寫「10 公分 = 14 針 × 8 排」，指的是作者的手勁。同樣的線與針，您鉤出來可能是 16 針。做衣物之前一定要先鉤一塊 15 公分見方的試片量密度；針數不對就換針號，不要改針法。',
         en:'A pattern that says 14 stitches and 8 rows to 10 cm is describing its author’s hands, not yours. With the same yarn and hook you might get sixteen. Before any garment, work a 15 cm swatch and measure. If the count is off, change hook size; do not change the stitch.',
         fr:'Un modèle qui annonce 14 mailles et 8 rangs pour 10 cm décrit les mains de son auteur, pas les vôtres. Avec le même fil et le même crochet, vous en ferez peut-être seize. Avant tout vêtement, faites un échantillon de 15 cm et mesurez. Si le compte diffère, changez de crochet, pas de maille.'},

           en:'Measure across the middle of the swatch, never the edges. Edge stitches are always looser than the ones in the body.',

    { sym:'dec', t:{zh:'立體塑形：玩偶的球與筒', en:'Shaping in the round: spheres and tubes', fr:'Le volume : sphères et tubes'}, abbr:'amigurumi',
      p:{zh:'球體等於先照圓形規律加針，中段不加不減鉤幾圈，再照鏡像規律減針。筒狀則是加到需要的直徑之後就一直平鉤。玩偶的所有部位都是這兩者的變形。',
         en:'A sphere is the flat-circle rule on the way out, several rounds of no shaping through the middle, and the mirror of the rule on the way back in. A tube is increases until you reach the diameter you want, then straight rounds. Every part of a stuffed toy is a variation on those two.',
         fr:'Une sphère : la règle du cercle plat à l’aller, quelques tours sans façonnage au milieu, puis la règle en miroir au retour. Un tube : des augmentations jusqu’au diamètre voulu, puis des tours droits. Toutes les pièces d’une peluche dérivent de ces deux formes.'},
      tip:{zh:'玩偶要用比線材建議小一號的針，織片才夠密。填充棉從鬆的織片裡透出來，是新手作品看起來廉價的主因。',

    { sym:'tr', t:{zh:'方格編與蕾絲', en:'Filet crochet and lace', fr:'Crochet filet et dentelle'}, abbr:'filet',

         en:'Filet uses only two things, double crochet and chain: filled squares and open squares arranged into a picture, exactly like pixel art. It is the easiest door into lace because there are so few rules.',

      tip:{zh:'蕾絲作品鉤完看起來皺皺的很正常，必須經過「定型」：噴濕或蒸氣後用珠針固定在墊子上陰乾，圖案才會展開。',

         en:'Thread each tail onto a tapestry needle and run it back through the fabric along the line of the stitches, reversing direction at least three times before you cut. A single round of single crochet around the edge instantly makes a piece look finished; add picots and you have a decorative lace edging.',
         fr:'Enfilez chaque fil sur une aiguille à laine et faites-le cheminer dans le tissu en suivant les mailles, en changeant de sens au moins trois fois avant de couper. Un simple tour de mailles serrées sur le pourtour donne aussitôt un air fini ; ajoutez des picots et vous obtenez une bordure de dentelle.'},

           en:'Before ripping back, run a length of contrasting yarn through the last row you want to keep. It stops you from going too far.',

/* A labelled diagram of the hook itself, since every instruction
   below names these parts and a beginner has no idea which is which. */
function hookAnatomy() {
  return '<svg class="anat w-full" viewBox="0 0 760 200" preserveAspectRatio="xMidYMid meet" role="img"'
    + ' aria-label="' + esc(t({zh:'鉤針各部位名稱',en:'The parts of a crochet hook',fr:'Les parties d’un crochet'})) + '">'
    /* shaft and handle */
    + '<path class="hook" d="M120 100 H430"/>'
    + '<path class="hook" d="M430 100 H700" stroke-width="16" stroke-linecap="round" opacity="0.55"/>'
    /* the head and throat */
    + '<path class="hook" d="M120 100 q-42 0 -46 -26 q-2 -20 22 -22 q22 -2 24 22"/>'
    /* the flat thumb rest */
    + '<rect class="hook" x="470" y="86" width="90" height="28" rx="8" fill="none"/>'
    + '<g class="call">'
    +   '<path d="M96 58 V30"/><path d="M170 92 V44"/><path d="M300 92 V52"/>'
    +   '<path d="M515 82 V46"/><path d="M650 92 V60"/>'
    + '</g>'
    + '<g class="txt" text-anchor="middle">'
    +   '<text x="96"  y="22">' + t({zh:'針頭',en:'head',fr:'tête'}) + '</text>'
    +   '<text x="170" y="36">' + t({zh:'針喉',en:'throat',fr:'gorge'}) + '</text>'
    +   '<text x="300" y="44">' + t({zh:'針身',en:'shaft',fr:'tige'}) + '</text>'
    +   '<text x="515" y="38">' + t({zh:'指托',en:'thumb rest',fr:'repose-pouce'}) + '</text>'
    +   '<text x="650" y="52">' + t({zh:'握柄',en:'handle',fr:'manche'}) + '</text>'
    + '</g>'
    + '<text class="txt" x="300" y="168" text-anchor="middle" font-size="19" opacity="0.75">'
    +   t({zh:'針身的直徑就是標示的尺寸，決定針目大小',
          en:'The shaft diameter is the stated size, and it sets the size of every stitch',
          fr:'Le diamètre de la tige est la taille annoncée : c’est lui qui règle la taille des mailles'})
    + '</text></svg>';
}

let revealObserver = null;
function armReveals(root) {
  const els = root.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window) ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    els.forEach(e => e.classList.add('in')); return;
  }
  if (!revealObserver) {
    revealObserver = new IntersectionObserver((es, obs) => {
      es.forEach(e => { if (!e.isIntersecting) return;
        setTimeout(() => e.target.classList.add('in'), (+e.target.dataset.i || 0) * 70);
        obs.unobserve(e.target); });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });
  }
  els.forEach((e, i) => { if (!e.classList.contains('in')) { e.dataset.i = i % 5; revealObserver.observe(e); } });
}
