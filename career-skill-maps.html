<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>職業技能心智圖</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Serif+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0907;
  --panel: #12100c;
  --panel2: #18150f;
  --line: rgba(148,163,184,0.16);
  --text: #e7e2d6;
  --muted: #9a9384;
  --faint: #6b6558;
  --gold: #e3c27a;
  --accent: #38bdf8;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(at 0% 0%, rgba(56,189,248,0.07) 0px, transparent 45%),
    radial-gradient(at 100% 0%, rgba(227,194,122,0.07) 0px, transparent 45%);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Nunito', 'Noto Serif TC', sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: inherit; }

/* Header */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,9,7,0.88); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 14px 16px;
}
.hdr { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(145deg, rgba(56,189,248,0.18), rgba(227,194,122,0.12));
  border: 1px solid rgba(227,194,122,0.28); color: var(--gold); font-size: 18px; }
.brand .badge { font-size: 9px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.brand h1 { font-family: 'Noto Serif TC', serif; font-size: 21px; font-weight: 700; letter-spacing: .01em; }
.hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.back { font-size: 12px; font-weight: 700; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); }
.back:hover { color: var(--text); border-color: rgba(227,194,122,0.4); }
.langs { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #15130f; border: 1px solid var(--line); }
.langs button { font: 700 12px Nunito, sans-serif; color: var(--muted); background: none; border: 1px solid transparent; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
.langs button.on { color: var(--gold); background: rgba(227,194,122,0.12); border-color: rgba(227,194,122,0.3); }

main { max-width: 1240px; margin: 0 auto; padding: 32px 16px 80px; }
.intro { color: #c9c3b5; line-height: 1.85; max-width: 860px; font-size: 15px; }
.intro b { color: var(--gold); font-weight: 700; }

/* Career picker */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 28px 0 26px; }
.pick { display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer;
  padding: 11px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  color: var(--muted); font: 700 13px/1.3 Nunito, 'Noto Serif TC', sans-serif; transition: border-color .2s, color .2s, background .2s; }
.pick i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; flex-shrink: 0;
  background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.pick:hover { color: var(--text); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.pick.on { color: var(--text); background: color-mix(in srgb, var(--c) 9%, var(--panel)); border-color: color-mix(in srgb, var(--c) 60%, transparent); }

/* Career head */
.chead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.chead h2 { font-family: 'Noto Serif TC', serif; font-size: clamp(24px, 3.4vw, 34px); font-weight: 700; }
.chead h2 small { display: block; font-family: Nunito, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--c); margin-bottom: 4px; }
.chead p { color: var(--muted); max-width: 720px; line-height: 1.7; margin-top: 8px; font-size: 14.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.lg-ring { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); }
.lg-chip { padding: 1px 7px; border-radius: 6px; border: 1px solid var(--muted); font-size: 11px; }

/* Mind map */
.mapbox { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow-x: auto; overflow-y: hidden; }
.mapbox::-webkit-scrollbar { height: 8px; }
.mapbox::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 8px; }
#map { display: block; width: 100%; min-width: 960px; height: auto; }
#map text { font-family: Nunito, 'Noto Serif TC', sans-serif; }
#map .leaf-t { font-size: 13.5px; fill: #ddd7ca; }
#map .br-t { font-size: 15px; font-weight: 800; }
#map .ctr-t { font-size: 19px; font-weight: 900; fill: #0a0907; font-family: 'Noto Serif TC', serif; }
#map .branch { cursor: pointer; transition: opacity .25s; }
#map.dim .branch { opacity: .22; }
#map.dim .branch.hot { opacity: 1; }
.hint { font-size: 12px; color: var(--faint); margin-top: 8px; }
.hint .mob { display: none; }
@media (max-width: 980px) { .hint .mob { display: inline; } }

/* Branch cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-top: 26px; }
@media (max-width: 380px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--bc); border-radius: 14px; padding: 16px 18px; scroll-margin-top: 90px; transition: box-shadow .3s; }
.card.flash { box-shadow: 0 0 0 2px var(--bc); }
.card h3 { font-size: 16px; font-weight: 800; color: var(--bc); display: flex; align-items: center; gap: 8px; }
.card h3 em { font-style: normal; font-size: 11px; color: var(--faint); font-weight: 700; }
.card p { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin: 6px 0 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: #1b1812; border: 1px solid transparent; color: #d6d0c2; display: inline-flex; align-items: center; gap: 6px; }
.tag::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--bc); flex-shrink: 0; }
.tag.l2::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--bc); }
.tag.tool { border-radius: 6px; border-color: color-mix(in srgb, var(--bc) 45%, transparent); background: color-mix(in srgb, var(--bc) 8%, #14120e); }

/* Roadmap */
.sec-title { font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700; margin: 38px 0 14px; display: flex; align-items: center; gap: 10px; }
.sec-title i { color: var(--gold); font-size: 16px; }
.road { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 760px) { .road { grid-template-columns: 1fr; } }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; position: relative; }
.stage .n { font-size: 11px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: var(--c); }
.stage h4 { font-size: 15.5px; font-weight: 800; margin: 4px 0 8px; }
.stage p { color: var(--muted); font-size: 13.5px; line-height: 1.75; }
.proj { margin-top: 14px; background: color-mix(in srgb, var(--c) 7%, var(--panel)); border: 1px dashed color-mix(in srgb, var(--c) 45%, transparent); border-radius: 14px; padding: 14px 18px; font-size: 14px; line-height: 1.75; color: #d6d0c2; }
.proj b { color: var(--c); }

/* Matrix */
.mx-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
table.mx { border-collapse: collapse; width: 100%; min-width: 1040px; font-size: 13px; }
.mx th, .mx td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line); }
.mx thead th { color: var(--muted); font-weight: 800; font-size: 12px; vertical-align: bottom; }
.mx thead th i { display: block; font-size: 14px; margin-bottom: 4px; }
.mx tbody th { text-align: left; font-weight: 700; color: #d6d0c2; white-space: nowrap; padding-left: 16px; }
.mx tr:last-child th, .mx tr:last-child td { border-bottom: none; }
.mx td span { display: inline-block; width: 26px; height: 26px; border-radius: 7px; line-height: 26px; font-weight: 900; font-size: 11px; }
.mx .v0 { background: transparent; color: var(--faint); }
.mx .v1 { background: rgba(56,189,248,0.12); color: #7dd3fc; }
.mx .v2 { background: rgba(56,189,248,0.30); color: #e0f2fe; }
.mx .v3 { background: rgba(227,194,122,0.85); color: #1a1408; }
.mx-leg { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.mx-leg span { display: inline-flex; align-items: center; gap: 6px; }
.mx-leg i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); line-height: 1.7; }
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="brand">
      <div class="ico"><i class="fa-solid fa-diagram-project"></i></div>
      <div>
        <div class="badge" data-i18n="badge"></div>
        <h1 data-i18n="title"></h1>
      </div>
    </div>
    <div class="hdr-right">
      <a class="back" href="index.html" target="_top" data-i18n="back"></a>
      <div class="langs">
        <button id="lang-zh" onclick="setLanguage('zh')">繁中</button>
        <button id="lang-en" onclick="setLanguage('en')">EN</button>
        <button id="lang-fr" onclick="setLanguage('fr')">FR</button>
      </div>
    </div>
  </div>
</header>

<main>
  <p class="intro" data-i18n="intro"></p>

  <div class="picker" id="picker"></div>

  <section id="career"></section>

  <h2 class="sec-title"><i class="fa-solid fa-table-cells"></i><span data-i18n="mxTitle"></span></h2>
  <p class="intro" style="font-size:14px;margin-bottom:14px" data-i18n="mxIntro"></p>
  <div class="mx-wrap"><table class="mx" id="matrix"></table></div>
  <div class="mx-leg" id="mxleg"></div>

  <footer data-i18n="footer"></footer>
</main>

<script>

let LANG = 'zh';
const t = o => o == null ? '' : (typeof o === 'string' ? o : (o[LANG] || o.en || o.zh || ''));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ─── Interface text ─── */
const UI = {

    'Onze métiers courants, chacun sous forme de carte mentale : le métier au centre, six branches pour les <b>domaines de compétence à maîtriser</b>, et au bout les <b>savoir-faire et outils</b> concrets. Un point plein signale l\'indispensable du débutant, un cercle vide un atout avancé ; les étiquettes encadrées sont des logiciels ou outils, le reste des notions et aptitudes. Sous chaque carte : le détail des branches, un parcours en trois étapes et un projet d\'entraînement pour votre portfolio.'),

               L('準備求職（約 6–12 個月）', 'Getting hired (about 6–12 months)', 'Se faire recruter (environ 6–12 mois)')],

  items: L('項', 'items', 'éléments'),
  mxTitle: L('跨職業共通技能', 'Skills shared across careers', 'Compétences communes aux métiers'),
  mxIntro: L('同一項技能在不同職業裡的份量不同。這張表可以幫助你看出轉職時哪些能力可以直接帶走，哪些需要補強。',
             'The same skill weighs differently from one job to the next. This table shows which abilities carry over when you switch careers and which need work.',

            'Compiled from common job postings and learning resources for each role; actual requirements vary by company, industry and region. Tools are listed under their usual English names.',

/* ─── Careers ───
   Leaf: [label, kind, level]  kind: 's' skill/concept, 't' tool   level: 1 must-have, 2 advanced */
const CAREERS = [
{

/* ─── Mind map layout ───
   Widths adapt to the longest labels in the current language. */
const ROW = 30, PADY = 34, GAP = 18;
const textW = (s, px) => { let w = 0; for (const ch of s) w += /[\u2E80-\uFFEF]/.test(ch) ? px : (/[A-Z]/.test(ch) ? px * 0.68 : px * 0.56); return w; };
const sideH = brs => brs.reduce((n, b) => n + b.leaves.length, 0) * ROW + (brs.length - 1) * GAP;

function drawMap(c) {
  const left = c.branches.slice(0, 3), right = c.branches.slice(3);
  const H = Math.max(sideH(left), sideH(right)) + PADY * 2;
  const CY = H / 2;
  const cname = t(c.name);
  const cw = Math.max(170, textW(cname, 19) + 44);
  const bws = c.branches.map(b => Math.max(110, textW(t(b.name), 15) + 30));
  const bwMax = Math.max(...bws);
  const leafMax = Math.max(...c.branches.flatMap(b => b.leaves.map(([l, k]) => textW(t(l), 13.5) + (k === 't' ? 10 : 0))));
  const BX = Math.max(220, cw / 2 + bwMax / 2 + 40);   // branch centre offset
  const LX = BX + bwMax / 2 + 70;                      // leaf dot offset
  const W = Math.ceil(2 * (LX + 14 + leafMax + 24));
  const CX = W / 2;
  let nodes = '';

  [[left, -1, 0], [right, 1, 3]].forEach(([brs, s, off]) => {
    let y = (H - sideH(brs)) / 2 + ROW / 2;
    brs.forEach((b, bi) => {
      const idx = off + bi;
      const n = b.leaves.length;
      const ys = b.leaves.map((_, i) => y + i * ROW);
      const by = (ys[0] + ys[n - 1]) / 2;
      const bx = CX + s * BX;
      const label = t(b.name);
      const bw = bws[idx];
      let g = `<g class="branch" data-b="${idx}">`;
      const x0 = CX + s * (cw / 2 - 8), x1 = bx - s * bw / 2;
      g += `<path d="M${x0},${CY} C${(x0 + x1) / 2},${CY} ${(x0 + x1) / 2},${by} ${x1},${by}" fill="none" stroke="${b.color}" stroke-width="3" stroke-opacity=".75"/>`;
      const xb = bx + s * bw / 2, xl = CX + s * LX;
      ys.forEach((ly, i) => {
        const [lab, kind, lvl] = b.leaves[i];
        const txt = t(lab);
        g += `<path d="M${xb},${by} C${(xb + xl) / 2},${by} ${(xb + xl) / 2},${ly} ${xl - s * 7},${ly}" fill="none" stroke="${b.color}" stroke-width="1.6" stroke-opacity=".5"/>`;
        g += lvl === 1
          ? `<circle cx="${xl}" cy="${ly}" r="5.5" fill="${b.color}"/>`
          : `<circle cx="${xl}" cy="${ly}" r="4.6" fill="#12100c" stroke="${b.color}" stroke-width="2"/>`;
        const tx = xl + s * 16, anchor = s < 0 ? 'end' : 'start';
        if (kind === 't') {
          const tw = textW(txt, 13.5) + 14;
          const rx = s < 0 ? tx - tw + 7 : tx - 7;
          g += `<rect x="${rx}" y="${ly - 11}" width="${tw}" height="22" rx="5" fill="${b.color}" fill-opacity=".1" stroke="${b.color}" stroke-opacity=".55"/>`;
        }
        g += `<text x="${tx}" y="${ly + 4.5}" text-anchor="${anchor}" class="leaf-t">${esc(txt)}</text>`;
      });
      g += `<rect x="${bx - bw / 2}" y="${by - 17}" width="${bw}" height="34" rx="17" fill="#18150f" stroke="${b.color}" stroke-width="2"/>`;
      g += `<text x="${bx}" y="${by + 5}" text-anchor="middle" class="br-t" fill="${b.color}">${esc(label)}</text>`;
      g += `</g>`;
      nodes += g;
      y += n * ROW + GAP;
    });
  });

  const centre = `<rect x="${CX - cw / 2}" y="${CY - 30}" width="${cw}" height="60" rx="30" fill="${c.color}"/>
    <text x="${CX}" y="${CY + 7}" text-anchor="middle" class="ctr-t">${esc(cname)}</text>`;
  return `<svg id="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cname)}">${nodes}${centre}</svg>`;
}

/* ─── Render ─── */
let current = 'da';
try { const s = localStorage.getItem('kb_career_map'); if (CAREERS.some(c => c.id === s)) current = s; } catch (e) {}

function renderPicker() {
  document.getElementById('picker').innerHTML = CAREERS.map(c =>
    `<button class="pick${c.id === current ? ' on' : ''}" style="--c:${c.color}" onclick="pick('${c.id}')"><i class="fa-solid ${c.icon}"></i>${esc(t(c.name))}</button>`).join('');
}

function renderCareer() {
  const c = CAREERS.find(x => x.id === current);
  const sec = document.getElementById('career');
  sec.style.setProperty('--c', c.color);
  const cards = c.branches.map((b, i) => `
    <div class="card" id="br-${i}" style="--bc:${b.color}">
      <h3>${esc(t(b.name))} <em>${b.leaves.length} ${t(UI.items)}</em></h3>
      <p>${esc(t(b.desc))}</p>
      <div class="tags">${b.leaves.map(([lab, kind, lvl]) =>
        `<span class="tag${kind === 't' ? ' tool' : ''}${lvl === 2 ? ' l2' : ''}">${esc(t(lab))}</span>`).join('')}</div>
    </div>`).join('');
  const road = c.road.map((r, i) => `
    <div class="stage"><div class="n">${t(UI.stages[i])}</div><h4>${t(UI.stageNames[i])}</h4><p>${esc(t(r))}</p></div>`).join('');
  sec.innerHTML = `
    <div class="chead">
      <div><h2><small>${esc(c.name.en)}</small>${esc(t(c.name))}</h2><p>${esc(t(c.tag))}</p></div>
      <div class="legend">
        <span><i class="lg-dot" style="background:${c.color}"></i>${t(UI.legDot)}</span>
        <span><i class="lg-ring" style="border-color:${c.color}"></i>${t(UI.legRing)}</span>
        <span><i class="lg-chip" style="border-color:${c.color}">Aa</i>${t(UI.legChip)}</span>
      </div>
    </div>
    <div class="mapbox">${drawMap(c)}</div>
    <p class="hint">${t(UI.hint)}<span class="mob">${t(UI.hintMob)}</span></p>
    <div class="cards">${cards}</div>
    <h2 class="sec-title"><i class="fa-solid fa-route"></i>${t(UI.road)}</h2>
    <div class="road">${road}</div>
    <div class="proj"><b>${t(UI.proj)}</b>${esc(t(c.proj))}</div>`;
  wireMap();
}

function wireMap() {
  const map = document.getElementById('map');
  map.addEventListener('click', e => {
    const g = e.target.closest('.branch');
    map.querySelectorAll('.branch').forEach(b => b.classList.remove('hot'));
    if (!g) { map.classList.remove('dim'); return; }
    map.classList.add('dim'); g.classList.add('hot');
    const card = document.getElementById('br-' + g.dataset.b);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1400);
    }
  });
}

function renderMatrix() {
  const head = `<thead><tr><th></th>${CAREERS.map(c => `<th><i class="fa-solid ${c.icon}" style="color:${c.color}"></i>${esc(t(c.name))}</th>`).join('')}</tr></thead>`;
  const body = MATRIX.map(r => `<tr><th>${esc(t(r.name))}</th>${CAREERS.map(c => {
    const v = r.v[c.id]; return `<td><span class="v${v}">${v ? v : '·'}</span></td>`; }).join('')}</tr>`).join('');
  document.getElementById('matrix').innerHTML = head + `<tbody>${body}</tbody>`;
  document.getElementById('mxleg').innerHTML = UI.mxLeg.map((l, i) =>
    `<span><i class="v${i}" style="${['border:1px solid #6b6558', 'background:rgba(56,189,248,0.12)', 'background:rgba(56,189,248,0.30)', 'background:rgba(227,194,122,0.85)'][i]}"></i>${i} · ${t(l)}</span>`).join('');
}

function pick(id) {
  current = id;
  try { localStorage.setItem('kb_career_map', id); } catch (e) {}
  renderPicker(); renderCareer();
}

function setLanguage(lang) {
  if (!['zh', 'en', 'fr'].includes(lang)) return;
  LANG = lang;
  try { localStorage.setItem('kb_lang', lang); } catch (e) {}
  ['zh', 'en', 'fr'].forEach(l => document.getElementById('lang-' + l).classList.toggle('on', l === lang));
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : lang;
  document.title = t(UI.title);
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(UI[el.dataset.i18n]); });
  renderPicker(); renderCareer(); renderMatrix();
}

let _l = 'zh';
try { const s = localStorage.getItem('kb_lang'); if (['zh', 'en', 'fr'].includes(s)) _l = s; } catch (e) {}
setLanguage(_l);
</script>
</body>
