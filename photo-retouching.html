<script>
let LANG = 'zh';
function t(o){ if(o==null) return ''; if(typeof o==='string') return o; return o[LANG]||o.en||o.zh||''; }

/* ═══════════════════════════════════════════════════════════
   Diagrams. Each returns an SVG string in the current language.
   ═══════════════════════════════════════════════════════════ */

/* A layer stack seen from the side: what sits on top wins. */
function diaLayers() {
  const L = {
    title:{zh:'圖層堆疊：上面的蓋住下面的', en:'A layer stack: upper layers cover lower ones', fr:'Une pile de calques : le haut recouvre le bas'},
    out:{zh:'最後看到的結果', en:'What you finally see', fr:'Le résultat visible'},
  };
  const layers = [
    { c:'#f59e0b', n:{zh:'調整圖層：曲線（加遮色片，只作用在人物）', en:'Adjustment layer: Curves (masked to the subject)', fr:'Calque de réglage : Courbes (masqué sur le sujet)'} },
    { c:'#a78bfa', n:{zh:'調整圖層：色彩平衡（整張）', en:'Adjustment layer: Colour Balance (whole image)', fr:'Calque de réglage : Balance des couleurs (toute l’image)'} },
    { c:'#38bdf8', n:{zh:'修補圖層：在空白圖層上修瑕疵', en:'Repair layer: blemishes healed on an empty layer', fr:'Calque de retouche : corrections sur un calque vide'} },
    { c:'#64748b', n:{zh:'背景：原始照片（不直接動它）', en:'Background: the original photo (never touched)', fr:'Arrière-plan : la photo d’origine (jamais modifiée)'} },
  ];
  let s = `<text x="0" y="22" class="lab">${t(L.title)}</text>`;
  layers.forEach((l, i) => {
    const y = 48 + i * 52, x = 20 + i * 14;
    s += `<path d="M${x} ${y + 30} l60 -26 h240 l-60 26 z" fill="${l.c}" fill-opacity="0.22" stroke="${l.c}" stroke-width="2"/>`;
    s += `<text x="${x + 330}" y="${y + 21}" class="sub" style="fill:#e2e8f0">${t(l.n)}</text>`;
  });
  s += `<path d="M120 264 v16" stroke="#94a3b8" stroke-width="2"/><path d="M114 276 l6 8 l6 -8" fill="none" stroke="#94a3b8" stroke-width="2"/>`;
  s += `<text x="140" y="284" class="sub">${t(L.out)}</text>`;
  return `<svg class="dg" viewBox="0 0 900 296" role="img" aria-label="${t(L.title)}">${s}</svg>`;
}

/* A mask is a greyscale image: white shows, black hides, grey is partial. */
function diaMask() {
  const L = {
    title:{zh:'遮色片：白顯黑隱', en:'Masks: white reveals, black conceals', fr:'Masques : le blanc révèle, le noir cache'},
    k0:{zh:'黑：完全隱藏效果', en:'Black: effect hidden', fr:'Noir : effet caché'},
    k5:{zh:'50% 灰：效果一半', en:'50% grey: half the effect', fr:'Gris 50 % : moitié de l’effet'},
    k1:{zh:'白：完全顯示效果', en:'White: effect shown', fr:'Blanc : effet visible'},
  };
  return `<svg class="dg" viewBox="0 0 900 130" role="img" aria-label="${t(L.title)}">
    <defs><linearGradient id="mg" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
    <text x="0" y="22" class="lab">${t(L.title)}</text>
    <rect x="20" y="40" width="860" height="44" rx="8" fill="url(#mg)" stroke="#334155"/>
    <text x="20" y="108" class="sub">${t(L.k0)}</text>
    <text x="450" y="108" class="sub" text-anchor="middle">${t(L.k5)}</text>
    <text x="880" y="108" class="sub" text-anchor="end">${t(L.k1)}</text></svg>`;
}

/* Four tone curves, each computed from a function on [0,1]. */
function diaCurves() {
  const S = 150, P = 12;
  const plot = (fns, title, desc) => {
    let s = `<rect x="${P}" y="${P}" width="${S}" height="${S}" fill="#0b0a12" stroke="#334155"/>`;
    for (let i = 1; i < 4; i++) {
      const g = P + i * S / 4;
      s += `<line x1="${g}" y1="${P}" x2="${g}" y2="${P + S}" class="grid"/><line x1="${P}" y1="${g}" x2="${P + S}" y2="${g}" class="grid"/>`;
    }
    s += `<line x1="${P}" y1="${P + S}" x2="${P + S}" y2="${P}" stroke="#475569" stroke-dasharray="4 4"/>`;
    fns.forEach(([f, col]) => {
      let d = '';
      for (let i = 0; i <= 50; i++) {
        const x = i / 50, y = Math.min(1, Math.max(0, f(x)));
        d += (i ? ' L' : 'M') + (P + x * S).toFixed(1) + ' ' + (P + S - y * S).toFixed(1);
      }
      s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="3"/>`;
    });
    return `<div class="dia-box reveal"><svg class="dg" viewBox="0 0 ${S + 2 * P} ${S + 2 * P}" style="max-width:220px;margin:0 auto" role="img" aria-label="${t(title)}">${s}</svg>
      <h4 class="text-sm font-black text-emerald-300 mt-3">${t(title)}</h4><p class="text-xs text-slate-400 leading-relaxed mt-1">${t(desc)}</p></div>`;
  };
  const TAU = 2 * Math.PI;
  return `<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">`
    + plot([[x => x - 0.07 * Math.sin(TAU * x), '#e2e8f0']],
        {zh:'S 曲線：加對比', en:'S-curve: more contrast', fr:'Courbe en S : plus de contraste'},
        {zh:'壓暗暗部、提亮亮部，中間調變陡，畫面更立體。', en:'Darker shadows, brighter highlights, a steeper middle: more depth.', fr:'Ombres plus sombres, hautes lumières plus claires, milieu plus raide : plus de relief.'})
    + plot([[x => 0.13 + 0.82 * (x - 0.04 * Math.sin(TAU * x)), '#e2e8f0']],
        {zh:'霧面褪色（Matte）', en:'Matte fade', fr:'Effet mat délavé'},
        {zh:'把最左下的點往上拉，黑色變成深灰，是底片感與復古風的關鍵。', en:'Lift the bottom-left point so black becomes dark grey: the key to film and vintage looks.', fr:'Relever le point en bas à gauche : le noir devient gris foncé. La clé des looks pellicule et rétro.'})
    + plot([[x => x + 0.06 * Math.sin(TAU * x), '#e2e8f0']],
        {zh:'反 S 曲線：降對比', en:'Inverse S: less contrast', fr:'S inversé : moins de contraste'},
        {zh:'暗部提亮、亮部壓暗，畫面柔和，適合日系清新與高調人像。', en:'Lifted shadows and lowered highlights: soft, for airy and high-key portraits.', fr:'Ombres relevées, hautes lumières abaissées : doux, pour les portraits clairs et aériens.'})
    + plot([[x => x - 0.06 * Math.sin(TAU * x), '#f87171'], [x => x + 0.06 * Math.sin(TAU * x), '#60a5fa']],
        {zh:'青橙色調（分通道）', en:'Teal and orange (per channel)', fr:'Sarcelle et orange (par canal)'},
        {zh:'紅色通道做 S、藍色通道做反 S：暗部偏青藍、亮部偏橘。', en:'An S on red and an inverse S on blue: teal shadows, orange highlights.', fr:'Un S sur le rouge et un S inversé sur le bleu : ombres sarcelle, hautes lumières orangées.'})
    + `</div>`;
}

/* Frequency separation: original = low frequency (tone) + high frequency (texture). */
function diaFreq() {
  const L = {
    title:{zh:'頻率分離：把顏色和質感拆開', en:'Frequency separation: colour and texture apart', fr:'Séparation de fréquences : couleur et texture séparées'},
    o:{zh:'原圖', en:'Original', fr:'Original'},
    lo:{zh:'低頻：顏色與明暗', en:'Low: colour and tone', fr:'Basse : couleur et tons'},
    hi:{zh:'高頻：毛孔與紋理', en:'High: pores and texture', fr:'Haute : pores et texture'},
    lo2:{zh:'在這層修不均的膚色', en:'Even out blotches here', fr:'Unifier le teint ici'},
    hi2:{zh:'在這層修痘痘與雜毛', en:'Remove spots and hairs here', fr:'Retirer boutons et poils ici'},
  };
  const box = (x, inner, cap, cap2) => `<g transform="translate(${x},40)"><rect width="180" height="130" rx="10" fill="#0b0a12" stroke="#334155"/>${inner}
    <text x="90" y="156" text-anchor="middle" class="val">${cap}</text><text x="90" y="176" text-anchor="middle" class="sub">${cap2 || ''}</text></g>`;
  const blob = `<ellipse cx="90" cy="65" rx="56" ry="44" fill="#d6a184"/><ellipse cx="72" cy="58" rx="16" ry="10" fill="#c48a6c"/><ellipse cx="108" cy="78" rx="14" ry="9" fill="#e0b39a"/>`;
  return `<svg class="dg" viewBox="0 0 760 230" role="img" aria-label="${t(L.title)}">
    <defs>
      <filter id="fsBlur"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="fsTex"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 1"/></feComponentTransfer></filter>
      <clipPath id="fsClip"><rect width="180" height="130" rx="10"/></clipPath>
    </defs>
    <text x="0" y="22" class="lab">${t(L.title)}</text>
    ${box(0, `<g clip-path="url(#fsClip)">${blob}<rect width="180" height="130" filter="url(#fsTex)" opacity="0.28"/><circle cx="104" cy="52" r="4" fill="#9a4b3a"/><circle cx="66" cy="80" r="3" fill="#9a4b3a"/></g>`, t(L.o))}
    <text x="215" y="112" text-anchor="middle" class="lab" style="font-size:28px">=</text>
    ${box(250, `<g clip-path="url(#fsClip)"><g filter="url(#fsBlur)">${blob}</g></g>`, t(L.lo), t(L.lo2))}
    <text x="465" y="112" text-anchor="middle" class="lab" style="font-size:28px">+</text>
    ${box(500, `<g clip-path="url(#fsClip)"><rect width="180" height="130" fill="#808080"/><rect width="180" height="130" filter="url(#fsTex)" opacity="0.35"/><circle cx="104" cy="52" r="4" fill="#5a5a5a"/><circle cx="66" cy="80" r="3" fill="#5a5a5a"/></g>`, t(L.hi), t(L.hi2))}
  </svg>`;
}

const DIA = { layers: diaLayers, mask: diaMask, curves: diaCurves, freq: diaFreq };

/* ═══════════════════════════════════════════════════════════
   Content. Each section is a list of blocks rendered below.
   ═══════════════════════════════════════════════════════════ */
const SECTIONS = [

      p:{zh:'GIMP 對應 Photoshop 的像素編輯；Darktable、RawTherapee 對應 Lightroom 的 RAW 顯影。功能完整，介面需要時間適應。', en:'GIMP covers Photoshop-style pixel editing; Darktable and RawTherapee cover Lightroom-style RAW development. Capable, though the interfaces take getting used to.', fr:'GIMP couvre l’édition de pixels façon Photoshop ; Darktable et RawTherapee le développement RAW façon Lightroom. Complets, mais leurs interfaces demandent un temps d’adaptation.'} },

      p:{zh:'在瀏覽器裡執行、介面幾乎和 Photoshop 一樣，能開 PSD 檔。臨時要改圖又沒裝軟體時很方便。', en:'Runs in the browser with an interface very close to Photoshop’s, and opens PSD files. Handy for a quick fix on a machine with nothing installed.', fr:'Fonctionne dans le navigateur avec une interface très proche de Photoshop et ouvre les PSD. Pratique pour une retouche rapide sur une machine sans logiciel.'} },
    { i:'fa-mobile-screen', t:'Snapseed／Lightroom Mobile',
      tag:{zh:'手機 · 免費／部分付費', en:'Phone · free / partly paid', fr:'Mobile · gratuit / partiellement payant'},
      p:{zh:'手機上最完整的修圖工具：曲線、局部調整、修復筆刷、透視校正都有。Lightroom Mobile 還能和電腦同步預設集。', en:'The most complete phone editors: curves, local adjustments, healing brush, perspective correction. Lightroom Mobile also syncs presets with the desktop.', fr:'Les éditeurs mobiles les plus complets : courbes, réglages locaux, correcteur, perspective. Lightroom Mobile synchronise aussi les presets avec l’ordinateur.'} },
    { i:'fa-wand-magic-sparkles', t:{zh:'醒圖／美圖秀秀／VSCO', en:'Meitu / Xingtu / VSCO', fr:'Meitu / Xingtu / VSCO'},
      tag:{zh:'手機 · 免費＋訂閱', en:'Phone · free + subscription', fr:'Mobile · gratuit + abonnement'},
      p:{zh:'濾鏡與一鍵美顏為主。VSCO 以底片風濾鏡出名；醒圖、美圖秀秀在亞洲流行，擅長修臉、修身、妝容。方便快速，但容易修過頭。', en:'Built around filters and one-tap beautification. VSCO is known for film-style presets; Xingtu and Meitu, popular across Asia, specialise in face, body and make-up retouching. Fast, and easy to overdo.', fr:'Centrées sur les filtres et l’embellissement en un geste. VSCO est connu pour ses presets façon pellicule ; Xingtu et Meitu, très populaires en Asie, retouchent visage, silhouette et maquillage. Rapides, et faciles à pousser trop loin.'} },
    { i:'fa-robot', t:{zh:'AI 工具', en:'AI tools', fr:'Outils d’IA'},
      tag:{zh:'多已內建在上述軟體', en:'Mostly built into the above', fr:'Le plus souvent intégrés aux logiciels ci-dessus'},
      p:{zh:'AI 降噪、一鍵選取主體、生成填色、延伸畫面、放大解析度。它們讓過去要花一小時的工作變成幾秒，但結果仍要放大檢查：AI 常在手指、文字、邊緣出錯。', en:'AI noise reduction, one-click subject selection, generative fill, canvas expansion, upscaling. They turn an hour’s work into seconds, but always zoom in to check: AI often slips on fingers, lettering and edges.', fr:'Débruitage IA, sélection du sujet en un clic, remplissage génératif, extension du cadre, agrandissement. Une heure de travail devient quelques secondes, mais vérifiez toujours à 100 % : l’IA se trompe souvent sur les doigts, les textes et les contours.'} },

/* ── 2. Basic concepts ── */
{ id:'basics', i:'fa-image', c:'#2dd4bf',
  nav:{zh:'基本概念', en:'Basics', fr:'Notions'},
  eyebrow:{zh:'第二章', en:'Chapter 2', fr:'Chapitre 2'},
  h2:{zh:'修圖前要懂的名詞', en:'Words to know before you edit', fr:'Les mots à connaître avant de retoucher'},
  blocks:[
  { type:'cards', cols:3, items:[
    { i:'fa-file-image', t:{zh:'RAW、JPEG、PNG、TIFF', en:'RAW, JPEG, PNG, TIFF', fr:'RAW, JPEG, PNG, TIFF'},
      p:{zh:'RAW 是感光元件的原始資料，修圖空間最大；JPEG 已壓縮、檔案小，適合分享；PNG 無損且支援透明背景，適合去背圖與圖示；TIFF 無損、檔案大，用於印刷與存檔。手機常見的 HEIC 是比 JPEG 更省空間的格式。', en:'RAW is the sensor’s original data with the most room to edit; JPEG is compressed and small, for sharing; PNG is lossless with transparency, for cut-outs and icons; TIFF is lossless and large, for print and archive. HEIC, common on phones, is a more efficient JPEG alternative.', fr:'Le RAW est la donnée brute du capteur, avec la plus grande latitude ; le JPEG est compressé et léger, pour partager ; le PNG est sans perte avec transparence, pour les détourages et icônes ; le TIFF est sans perte et lourd, pour l’impression et l’archive. Le HEIC des téléphones est une alternative plus efficace au JPEG.'} },
    { i:'fa-shield-halved', t:{zh:'非破壞性編輯', en:'Non-destructive editing', fr:'Retouche non destructive'},
      p:{zh:'所有修改都能隨時回頭調整或刪除，原圖不被改動。做法是用調整圖層、遮色片、智慧型物件，而不是直接在原圖上塗改。這是修圖最重要的習慣。', en:'Every change can be revisited or removed at any time and the original is never altered. You get there with adjustment layers, masks and smart objects rather than painting on the photo itself. The single most important habit in retouching.', fr:'Chaque modification reste réversible et l’original n’est jamais altéré, grâce aux calques de réglage, masques et objets dynamiques plutôt qu’en peignant sur la photo. L’habitude la plus importante en retouche.'} },
    { i:'fa-border-all', t:{zh:'點陣圖與向量圖', en:'Raster and vector', fr:'Matriciel et vectoriel'},
      p:{zh:'照片是點陣圖，由像素組成，放大會模糊。向量圖（Logo、插畫）由數學路徑組成，放多大都銳利。修圖處理的是點陣圖。', en:'Photos are raster images made of pixels and blur when enlarged. Vector graphics (logos, illustrations) are mathematical paths that stay sharp at any size. Retouching works on raster.', fr:'Les photos sont des images matricielles, faites de pixels, qui deviennent floues à l’agrandissement. Les images vectorielles (logos, illustrations) sont des tracés mathématiques nets à toute taille. La retouche travaille en matriciel.'} },
    { i:'fa-ruler-combined', t:{zh:'解析度與 PPI', en:'Resolution and PPI', fr:'Définition et PPP'},
      p:{zh:'網路上只看像素數（例如 1080×1350），PPI 設定沒有影響。印刷才需要 PPI：一般用 300 PPI，所以 4×6 吋相片需要 1200×1800 像素，A4 需要約 2480×3508 像素。', en:'Online, only the pixel count matters (1080×1350, say) and the PPI setting does nothing. PPI matters for print, usually 300: a 4×6 inch print needs 1200×1800 pixels, A4 about 2480×3508.', fr:'En ligne, seul compte le nombre de pixels (1080×1350 par exemple) ; le réglage PPP n’a aucun effet. Il compte pour l’impression, en général 300 PPP : un tirage 10×15 cm demande environ 1200×1800 pixels, un A4 environ 2480×3508.'} },
    { i:'fa-palette', t:{zh:'色彩空間', en:'Colour space', fr:'Espace colorimétrique'},
      p:{zh:'sRGB 是網路與多數螢幕的標準，輸出到網路一律用它；Adobe RGB、ProPhoto RGB 範圍更廣，用於編輯與高階印刷；Display P3 是 Apple 裝置的廣色域。印刷廠通常要 CMYK。用錯色彩空間，上傳後顏色會變灰或變豔。', en:'sRGB is the standard of the web and most screens; always export to it for online use. Adobe RGB and ProPhoto RGB are wider, for editing and fine print; Display P3 is Apple’s wide gamut. Printers usually want CMYK. The wrong space makes colours go dull or garish after upload.', fr:'Le sRVB est la norme du web et de la plupart des écrans : exportez toujours en sRVB pour l’en ligne. Adobe RGB et ProPhoto RGB sont plus larges, pour l’édition et le tirage d’art ; Display P3 est le gamut étendu d’Apple. Les imprimeurs demandent souvent du CMJN. Un mauvais espace ternit ou sature les couleurs après mise en ligne.'} },
    { i:'fa-signal', t:{zh:'8 位元與 16 位元', en:'8-bit and 16-bit', fr:'8 bits et 16 bits'},
      p:{zh:'16 位元的每個通道有 65,536 階，大幅調整時天空等漸層不容易斷層。修 RAW 時用 16 位元工作，最後輸出 JPEG 才轉成 8 位元。', en:'16-bit has 65,536 levels per channel, so gradients such as sky survive heavy adjustments without banding. Work in 16-bit from RAW and drop to 8-bit only when exporting a JPEG.', fr:'Le 16 bits offre 65 536 niveaux par canal : les dégradés comme le ciel résistent aux fortes corrections sans cassures. Travaillez en 16 bits depuis le RAW et ne passez en 8 bits qu’à l’export JPEG.'} },
    { i:'fa-chart-area', t:{zh:'直方圖', en:'Histogram', fr:'Histogramme'},
      p:{zh:'把照片中每個亮度有多少像素畫成山形圖，左邊是黑、右邊是白。貼到最左或最右，表示有細節已經變成死黑或死白。詳細讀法見攝影卷的修圖章。', en:'A mountain of how many pixels sit at each brightness, black on the left, white on the right. Piled against either wall means detail lost to pure black or white. The photography volume’s retouching part explains how to read it.', fr:'Une courbe du nombre de pixels par luminosité, noir à gauche, blanc à droite. Collée à un bord, elle signale des détails perdus dans le noir ou le blanc pur. La partie retouche du volume photographie explique sa lecture.'} },
    { i:'fa-desktop', t:{zh:'螢幕校色', en:'Monitor calibration', fr:'Calibrage de l’écran'},
      p:{zh:'每台螢幕的顏色和亮度都不同。沒有校色的螢幕上修得剛好的照片，在別人手機上可能偏黃或太暗。認真修圖可以考慮校色器；至少把螢幕亮度調低、關掉夜覽模式。', en:'Every screen differs in colour and brightness. A photo that looks right on an uncalibrated screen may look yellow or dark on someone else’s phone. A calibrator is worth it for serious work; at minimum, lower the brightness and turn off night mode.', fr:'Chaque écran a sa couleur et sa luminosité. Une photo juste sur un écran non calibré peut paraître jaune ou sombre sur le téléphone d’un autre. Une sonde vaut l’investissement pour un travail sérieux ; à défaut, baissez la luminosité et désactivez le mode nuit.'} },
    { i:'fa-arrows-to-dot', t:{zh:'全域與局部', en:'Global and local', fr:'Global et local'},
      p:{zh:'全域調整作用在整張照片（曝光、白平衡）；局部調整只作用在選取的區域（只提亮臉、只壓暗天空）。先全域、後局部。', en:'Global adjustments affect the whole picture (exposure, white balance); local ones only a selected area (brighten just the face, darken just the sky). Global first, then local.', fr:'Les réglages globaux agissent sur toute l’image (exposition, balance des blancs) ; les réglages locaux sur une zone choisie (éclaircir le visage, assombrir le ciel). Le global d’abord, le local ensuite.'} },
  ]},
]},

  { type:'lead', p:{zh:'橫軸是原本的亮度，縱軸是調整後的亮度，虛線對角線代表「不變」。把線往上拉就變亮、往下壓就變暗；分別調紅綠藍通道就能調色。下面四種曲線是最常見的風格基礎。', en:'The horizontal axis is the original brightness, the vertical the result; the dashed diagonal means “no change”. Raise the line to brighten, lower it to darken; work on the red, green and blue channels separately to shift colour. These four curves underpin the most common looks.', fr:'L’axe horizontal est la luminosité d’origine, l’axe vertical le résultat ; la diagonale en pointillé signifie « aucun changement ». Monter la courbe éclaircit, la descendre assombrit ; agir sur les canaux rouge, vert et bleu change la couleur. Ces quatre courbes fondent les looks les plus courants.'} },

/* ── 4. Photoshop functions ── */
{ id:'ps', i:'fa-layer-group', c:'#60a5fa',
  nav:{zh:'Photoshop 功能', en:'Photoshop', fr:'Photoshop'},
  eyebrow:{zh:'第四章', en:'Chapter 4', fr:'Chapitre 4'},
  h2:{zh:'Photoshop 的核心功能', en:'Photoshop’s core functions', fr:'Les fonctions clés de Photoshop'},
  blocks:[
  { type:'lead', p:{
    zh:'Photoshop 的功能多到數不完，但真正每天用的只有幾類：<strong class="text-white">圖層、遮色片、選取、修補、變形</strong>。這些觀念在 Affinity Photo、GIMP、Photopea 裡也完全相同。',
    en:'Photoshop has countless features, but the daily ones fall into a few families: <strong class="text-white">layers, masks, selections, repair and transformation</strong>. The ideas are identical in Affinity Photo, GIMP and Photopea.',
    fr:'Photoshop a des fonctions innombrables, mais celles du quotidien tiennent en quelques familles : <strong class="text-white">calques, masques, sélections, correction et transformation</strong>. Les notions sont identiques dans Affinity Photo, GIMP et Photopea.'} },
  { type:'dia', k:'layers' },
  { type:'dia', k:'mask' },
  { type:'h3', t:{zh:'圖層與遮色片', en:'Layers and masks', fr:'Calques et masques'} },
  { type:'cards', cols:3, items:[
    { i:'fa-layer-group', t:{zh:'圖層', en:'Layers', fr:'Calques'},
      p:{zh:'像一疊透明片，每張可以各自修改、調透明度、開關。修圖的第一步通常是 Ctrl+J 複製背景，或新增空白圖層再修。', en:'A stack of transparent sheets, each editable, with its own opacity and visibility. The first move is usually Ctrl+J to duplicate the background, or a new empty layer to work on.', fr:'Une pile de feuilles transparentes, modifiables, chacune avec son opacité et sa visibilité. Premier geste habituel : Ctrl+J pour dupliquer l’arrière-plan, ou un nouveau calque vide.'} },
    { i:'fa-circle-half-stroke', t:{zh:'調整圖層', en:'Adjustment layers', fr:'Calques de réglage'},
      p:{zh:'曲線、色階、色相／飽和度、色彩平衡、黑白、漸層對應等，以「圖層」形式套用，可以隨時修改或刪除，不會動到原圖。', en:'Curves, Levels, Hue/Saturation, Colour Balance, Black & White, Gradient Map and more, applied as layers you can change or delete at any time without touching the photo.', fr:'Courbes, Niveaux, Teinte/Saturation, Balance des couleurs, Noir et blanc, Courbe de transfert de dégradé…, appliqués sous forme de calques modifiables ou supprimables sans toucher à la photo.'} },
    { i:'fa-mask', t:{zh:'圖層遮色片', en:'Layer masks', fr:'Masques de fusion'},
      p:{zh:'控制圖層哪裡顯示、哪裡隱藏。用黑色筆刷擦掉不要的部分，用白色找回來；不像橡皮擦會真的刪掉像素。', en:'Decide where a layer shows and where it hides. Paint black to hide, white to bring back; unlike the eraser, nothing is actually deleted.', fr:'Décident où un calque apparaît ou non. Peindre en noir cache, en blanc restaure ; contrairement à la gomme, rien n’est supprimé.'} },
    { i:'fa-paperclip', t:{zh:'剪裁遮色片', en:'Clipping masks', fr:'Masques d’écrêtage'},
      p:{zh:'讓上面的圖層只作用在下面那一層的形狀裡，例如調整圖層只影響某張貼進來的圖片。', en:'Restrict a layer to the shape of the one beneath, so an adjustment affects only one pasted-in image.', fr:'Limiter un calque à la forme du calque inférieur, pour qu’un réglage n’agisse que sur une image collée.'} },
    { i:'fa-cube', t:{zh:'智慧型物件', en:'Smart objects', fr:'Objets dynamiques'},
      p:{zh:'把圖層包起來保護原始像素。縮小再放大不會變糊，套用的濾鏡變成「智慧型濾鏡」，可以重新調整。', en:'Wrap a layer to protect its original pixels. Scaling down and back up loses nothing, and filters become editable Smart Filters.', fr:'Encapsuler un calque pour protéger ses pixels d’origine. Réduire puis agrandir ne dégrade rien, et les filtres deviennent des filtres dynamiques modifiables.'} },
    { i:'fa-object-group', t:{zh:'群組與命名', en:'Groups and names', fr:'Groupes et noms'},
      p:{zh:'圖層一多就要分群組並命名，例如「修膚」「調色」「文字」。半年後再打開檔案時會感謝自己。', en:'Once layers pile up, group and name them: “skin”, “colour”, “type”. You will thank yourself when you reopen the file in six months.', fr:'Quand les calques s’accumulent, groupez-les et nommez-les : « peau », « couleur », « texte ». Vous vous en féliciterez en rouvrant le fichier six mois plus tard.'} },
  ]},
  { type:'h3', t:{zh:'選取工具', en:'Selection tools', fr:'Outils de sélection'} },
  { type:'cards', cols:4, items:[
    { i:'fa-vector-square', t:{zh:'矩形／橢圓選取', en:'Marquee', fr:'Rectangle / ellipse de sélection'}, p:{zh:'選出規則形狀。', en:'Selects regular shapes.', fr:'Sélectionne des formes régulières.'} },
    { i:'fa-draw-polygon', t:{zh:'套索', en:'Lasso', fr:'Lasso'}, p:{zh:'手繪任意形狀，適合粗略範圍。', en:'Freehand shapes for rough areas.', fr:'Formes libres pour des zones approximatives.'} },
    { i:'fa-wand-magic', t:{zh:'快速／物件選取', en:'Quick / Object selection', fr:'Sélection rapide / d’objet'}, p:{zh:'自動找邊緣，框一下就選出物件。', en:'Finds edges automatically; box an object to select it.', fr:'Détecte les contours ; encadrez un objet pour le sélectionner.'} },
    { i:'fa-user', t:{zh:'選取主體', en:'Select Subject', fr:'Sélectionner le sujet'}, p:{zh:'AI 一鍵選出照片中的人物或主角。', en:'AI selects the person or main subject in one click.', fr:'L’IA sélectionne la personne ou le sujet principal en un clic.'} },
    { i:'fa-feather', t:{zh:'選取並遮住', en:'Select and Mask', fr:'Sélectionner et masquer'}, p:{zh:'精修選取邊緣，處理頭髮、毛絮最有效。', en:'Refines edges; the answer for hair and fur.', fr:'Affine les contours ; la solution pour les cheveux et la fourrure.'} },
    { i:'fa-eye-dropper', t:{zh:'顏色範圍', en:'Color Range', fr:'Plage de couleurs'}, p:{zh:'依顏色選取，例如選出所有藍天。', en:'Selects by colour, such as every patch of blue sky.', fr:'Sélectionne par couleur, par exemple tout le ciel bleu.'} },
    { i:'fa-pen-nib', t:{zh:'筆型工具', en:'Pen tool', fr:'Outil Plume'}, p:{zh:'畫出貝茲曲線路徑，選出邊緣俐落的商品最精準。', en:'Draws Bézier paths; the most precise way to cut out crisp-edged products.', fr:'Trace des chemins de Bézier ; le plus précis pour détourer des produits aux bords nets.'} },
    { i:'fa-sliders', t:{zh:'羽化', en:'Feather', fr:'Contour progressif'}, p:{zh:'讓選取邊緣柔化，調整後才不會有生硬的邊界。', en:'Softens the selection edge so adjustments blend in without a hard line.', fr:'Adoucit le bord de la sélection pour que le réglage se fonde sans démarcation.'} },
  ]},
  { type:'h3', t:{zh:'修補工具', en:'Repair tools', fr:'Outils de correction'} },
  { type:'cards', cols:3, items:[
    { i:'fa-bandage', t:{zh:'汙點修復筆刷', en:'Spot Healing Brush', fr:'Correcteur localisé'},
      p:{zh:'點一下就自動用周圍的紋理蓋掉小瑕疵，痘痘、灰塵最快。', en:'One click covers a small flaw with surrounding texture; fastest for spots and dust.', fr:'Un clic recouvre un petit défaut avec la texture voisine ; le plus rapide pour boutons et poussières.'} },
    { i:'fa-kit-medical', t:{zh:'修復筆刷', en:'Healing Brush', fr:'Correcteur'},
      p:{zh:'先按 Alt 取樣一個乾淨的區域，再塗到瑕疵上，會自動融合明暗與顏色。', en:'Alt-click a clean area to sample, then paint over the flaw; light and colour blend automatically.', fr:'Alt-clic sur une zone propre pour échantillonner, puis peindre sur le défaut ; tons et couleurs se fondent seuls.'} },
    { i:'fa-stamp', t:{zh:'仿製印章', en:'Clone Stamp', fr:'Tampon de duplication'},
      p:{zh:'把取樣處的像素原封不動複製過來，不會融合。適合有明確邊緣或圖案的地方，例如牆角、磁磚。', en:'Copies sampled pixels exactly, without blending. For areas with clear edges or patterns: wall corners, tiles.', fr:'Copie les pixels échantillonnés à l’identique, sans fusion. Pour les zones à bords nets ou à motifs : angles de murs, carrelage.'} },
    { i:'fa-shirt', t:{zh:'修補工具', en:'Patch tool', fr:'Outil Pièce'},
      p:{zh:'圈出一塊區域，拖到乾淨的地方取代，適合較大的瑕疵或眼袋。', en:'Circle an area and drag it onto a clean patch to replace it; good for larger flaws or under-eye bags.', fr:'Entourer une zone et la faire glisser sur une partie propre ; utile pour les grands défauts ou les cernes.'} },
    { i:'fa-wand-magic-sparkles', t:{zh:'內容感知填色／移除工具', en:'Content-Aware Fill / Remove', fr:'Remplissage d’après le contenu / Supprimer'},
      p:{zh:'選取或塗過要刪除的物體（路人、電線、垃圾桶），軟體自動依周圍畫面補上。', en:'Select or brush over an object to delete (a passer-by, wires, a bin) and the software rebuilds the area from its surroundings.', fr:'Sélectionner ou peindre l’objet à supprimer (passant, fils, poubelle) : le logiciel reconstruit la zone d’après l’entourage.'} },
    { i:'fa-robot', t:{zh:'生成填色／生成延伸', en:'Generative Fill / Expand', fr:'Remplissage / Extension génératifs'},
      p:{zh:'用 AI 依文字描述新增或替換內容，或把畫布延伸、補出原本沒拍到的背景。若用於新聞或比賽，通常不被允許。', en:'AI adds or replaces content from a text prompt, or extends the canvas to invent background that was never shot. Usually not allowed in journalism or competitions.', fr:'L’IA ajoute ou remplace du contenu d’après une description, ou agrandit la toile en inventant un décor jamais photographié. Généralement interdit en photojournalisme et en concours.'} },
  ]},
  { type:'h3', t:{zh:'變形與濾鏡', en:'Transformation and filters', fr:'Transformation et filtres'} },
  { type:'cards', cols:3, items:[
    { i:'fa-up-right-and-down-left-from-center', t:{zh:'任意變形與彎曲', en:'Free Transform and Warp', fr:'Transformation manuelle et Déformation'},
      p:{zh:'縮放、旋轉、透視、彎曲圖層，例如把設計稿貼到書本封面上。', en:'Scale, rotate, add perspective or bend a layer, for example to place artwork on a book cover.', fr:'Mettre à l’échelle, pivoter, mettre en perspective ou courber un calque, par exemple pour poser un visuel sur une couverture.'} },
    { i:'fa-hand-sparkles', t:{zh:'液化', en:'Liquify', fr:'Fluidité'},
      p:{zh:'像推黏土一樣推動像素，臉部感知液化可以直接調整眼睛、鼻子、臉型。注意背景的直線會跟著彎，是修過頭最常見的破綻。', en:'Push pixels like clay; Face-Aware Liquify adjusts eyes, nose and face shape directly. Watch straight lines behind: bent door frames are the classic giveaway.', fr:'Pousser les pixels comme de l’argile ; la Fluidité adaptée au visage règle yeux, nez et forme du visage. Surveillez les lignes droites derrière : un chambranle tordu trahit la retouche.'} },
    { i:'fa-camera', t:{zh:'Camera Raw 濾鏡', en:'Camera Raw Filter', fr:'Filtre Camera Raw'},
      p:{zh:'在 Photoshop 裡使用與 Lightroom 相同的所有滑桿。先轉成智慧型物件再套用，之後還能修改。', en:'Every Lightroom slider inside Photoshop. Convert to a smart object first so it stays editable.', fr:'Tous les curseurs de Lightroom dans Photoshop. Convertissez d’abord en objet dynamique pour garder la main.'} },
    { i:'fa-droplet', t:{zh:'模糊濾鏡', en:'Blur filters', fr:'Filtres de flou'},
      p:{zh:'高斯模糊、鏡頭模糊（模擬景深）、移軸模糊、動態模糊，用來虛化背景或做速度感。', en:'Gaussian, Lens Blur (fake depth of field), Tilt-Shift and Motion Blur, for soft backgrounds or a sense of speed.', fr:'Flou gaussien, flou de l’objectif (profondeur de champ simulée), Tilt-Shift et flou de mouvement, pour adoucir le fond ou suggérer la vitesse.'} },
    { i:'fa-bullseye', t:{zh:'顏色快調（High Pass）銳利化', en:'High Pass sharpening', fr:'Accentuation par passe-haut'},
      p:{zh:'複製圖層、套用顏色快調、混合模式改成柔光或覆蓋，只加強邊緣，最常用的銳利化手法之一。', en:'Duplicate the layer, apply High Pass and set it to Soft Light or Overlay: sharpening that touches only edges, one of the most used methods.', fr:'Dupliquer le calque, appliquer Passe-haut et le passer en Lumière tamisée ou Incrustation : une accentuation limitée aux contours, parmi les plus employées.'} },
    { i:'fa-gears', t:{zh:'動作與批次處理', en:'Actions and batch processing', fr:'Scripts et traitement par lots'},
      p:{zh:'把一連串步驟錄成「動作」，再對整個資料夾自動執行，例如統一加浮水印、縮圖。', en:'Record a series of steps as an action and run it on a whole folder: adding a watermark or resizing everything at once.', fr:'Enregistrer une série d’étapes comme script et l’appliquer à tout un dossier : filigrane ou redimensionnement d’un coup.'} },
  ]},
  { type:'h3', t:{zh:'混合模式', en:'Blend modes', fr:'Modes de fusion'} },
  { type:'table', head:[{zh:'類別', en:'Group', fr:'Famille'},{zh:'代表模式', en:'Main modes', fr:'Modes principaux'},{zh:'效果', en:'Effect', fr:'Effet'},{zh:'常見用途', en:'Typical use', fr:'Usage courant'}],
    rows:[
    [{zh:'變暗', en:'Darken', fr:'Obscurcir'}, {zh:'色彩增值', en:'Multiply', fr:'Produit'}, {zh:'白色消失、只留下較暗的部分', en:'White disappears; only darker parts remain', fr:'Le blanc disparaît ; seules les parties sombres restent'}, {zh:'加陰影、疊紋理、壓暗', en:'Shadows, texture overlays, darkening', fr:'Ombres, textures, assombrissement'}],
    [{zh:'變亮', en:'Lighten', fr:'Éclaircir'}, {zh:'濾色、加亮顏色', en:'Screen, Color Dodge', fr:'Superposition, Densité couleur −'}, {zh:'黑色消失、只留下較亮的部分', en:'Black disappears; only lighter parts remain', fr:'Le noir disparaît ; seules les parties claires restent'}, {zh:'光暈、火花、雙重曝光', en:'Glow, sparks, double exposure', fr:'Halo, étincelles, double exposition'}],
    [{zh:'對比', en:'Contrast', fr:'Contraste'}, {zh:'覆蓋、柔光', en:'Overlay, Soft Light', fr:'Incrustation, Lumière tamisée'}, {zh:'50% 灰消失，亮的更亮、暗的更暗', en:'50% grey vanishes; lights get lighter, darks darker', fr:'Le gris 50 % disparaît ; les clairs s’éclaircissent, les sombres s’assombrissent'}, {zh:'加亮加深、銳利化、加對比', en:'Dodge and burn, sharpening, contrast', fr:'Dodge & burn, accentuation, contraste'}],
    [{zh:'比較', en:'Comparative', fr:'Comparaison'}, {zh:'差異化', en:'Difference', fr:'Différence'}, {zh:'相同的地方變黑', en:'Identical areas turn black', fr:'Les zones identiques deviennent noires'}, {zh:'對齊兩張照片、檢查差異', en:'Aligning two photos, spotting changes', fr:'Aligner deux photos, repérer les écarts'}],
    [{zh:'色彩組成', en:'Component', fr:'Composantes'}, {zh:'顏色、明度', en:'Color, Luminosity', fr:'Couleur, Luminosité'}, {zh:'只套用顏色或只套用亮度', en:'Apply only the colour, or only the brightness', fr:'N’applique que la couleur, ou que la luminosité'}, {zh:'上色、調色時不改變亮度', en:'Colouring and grading without shifting brightness', fr:'Coloriser ou étalonner sans changer la luminosité'}],
    ]},
]},

/* ── 5. Common effects ── */
{ id:'fx', i:'fa-wand-magic-sparkles', c:'#f472b6',
  nav:{zh:'常見效果', en:'Effects', fr:'Effets'},
  eyebrow:{zh:'第五章', en:'Chapter 5', fr:'Chapitre 5'},
  h2:{zh:'常見效果與做法', en:'Common effects and how to make them', fr:'Les effets courants et leur réalisation'},
  blocks:[
  { type:'h3', t:{zh:'人像', en:'Portraits', fr:'Portrait'} },
  { type:'cards', cols:3, items:[
    { i:'fa-face-smile', t:{zh:'修膚：頻率分離', en:'Skin: frequency separation', fr:'Peau : séparation de fréquences'},
      p:{zh:'把照片拆成「顏色明暗」與「紋理」兩層：在低頻層修不均勻的膚色，在高頻層修痘痘，毛孔紋理得以保留，不會像磨皮一樣變成塑膠臉。', en:'Split the picture into a tone layer and a texture layer: even out blotches on the low layer, remove spots on the high one, and the pores survive instead of turning to plastic.', fr:'Séparer l’image en couche de tons et couche de texture : unifier le teint sur la basse, retirer les boutons sur la haute ; les pores restent, la peau ne devient pas plastique.'} },
    { i:'fa-sun', t:{zh:'加亮加深（Dodge & Burn）', en:'Dodge and burn', fr:'Dodge & burn'},
      p:{zh:'新增一個填滿 50% 灰、模式為柔光的圖層，用低流量白色筆刷提亮、黑色筆刷壓暗，修飾明暗不均、加強輪廓。是高階人像修圖的核心。', en:'Add a 50% grey layer in Soft Light; paint with a low-flow white brush to lighten and black to darken, evening out tone and sculpting form. The core of high-end portrait work.', fr:'Ajouter un calque gris 50 % en Lumière tamisée ; peindre au pinceau blanc à faible flux pour éclaircir, noir pour assombrir, afin d’unifier et de sculpter. Le cœur de la retouche portrait haut de gamme.'} },
    { i:'fa-eye', t:{zh:'眼睛與牙齒', en:'Eyes and teeth', fr:'Yeux et dents'},
      p:{zh:'虹膜稍微提亮、加清晰度；眼白和牙齒降低黃色飽和度，但不要完全變白，否則很不自然。', en:'Lift and add a little clarity to the irises; reduce the yellow in eye whites and teeth, but never to pure white, which looks unreal.', fr:'Éclaircir légèrement l’iris et lui donner un peu de clarté ; réduire le jaune du blanc des yeux et des dents, sans jamais aller au blanc pur, qui paraît faux.'} },
    { i:'fa-person', t:{zh:'液化修身修臉', en:'Liquify for face and body', fr:'Fluidité visage et silhouette'},
      p:{zh:'少量調整姿勢造成的衣服皺褶或角度變形。過度修改會改變一個人的長相，也會加深不切實際的審美標準。', en:'Small fixes to clothing folds or distortion from an angle. Heavy reshaping changes who a person is and feeds unrealistic beauty standards.', fr:'De petites corrections de plis ou de déformations dues à l’angle. Remodeler lourdement change la personne et nourrit des standards de beauté irréalistes.'} },
  ]},
  { type:'dia', k:'freq' },
  { type:'h3', t:{zh:'清理與合成', en:'Clean-up and compositing', fr:'Nettoyage et compositing'} },
  { type:'cards', cols:3, items:[
    { i:'fa-person-walking-arrow-right', t:{zh:'移除路人與雜物', en:'Removing people and clutter', fr:'Supprimer passants et éléments parasites'},
      p:{zh:'小東西用汙點修復筆刷，較大的用移除工具或內容感知填色。另一招：腳架固定連拍十幾張，用「中間值」堆疊，移動的人會自動消失。', en:'Small things with the Spot Healing Brush, larger ones with Remove or Content-Aware Fill. Another trick: shoot a dozen frames on a tripod and stack them in Median mode; moving people simply vanish.', fr:'Les petits éléments au correcteur localisé, les plus grands avec Supprimer ou le remplissage d’après le contenu. Autre astuce : une douzaine de vues sur trépied empilées en mode Médiane ; les passants disparaissent.'} },
    { i:'fa-scissors', t:{zh:'去背', en:'Cutting out the background', fr:'Détourage'},
      p:{zh:'選取主體 → 選取並遮住修頭髮 → 加上圖層遮色片 → 存成 PNG 保留透明。商品去背用筆型工具最乾淨。', en:'Select Subject → Select and Mask for the hair → add a layer mask → save as PNG to keep transparency. For products, the Pen tool gives the cleanest edge.', fr:'Sélectionner le sujet → Sélectionner et masquer pour les cheveux → masque de fusion → enregistrer en PNG pour garder la transparence. Pour un produit, la Plume donne le bord le plus net.'} },
    { i:'fa-cloud-sun', t:{zh:'換天空', en:'Sky replacement', fr:'Remplacement du ciel'},
      p:{zh:'Photoshop 有內建「天空取代」。重點是光線方向和色調要一致：夕陽天空配正午陰影會一眼看穿，換完要把前景也調成天空的色溫。', en:'Photoshop has a built-in Sky Replacement. What matters is matching light direction and colour: a sunset sky over noon shadows gives itself away, so warm or cool the foreground to match.', fr:'Photoshop intègre un Remplacement du ciel. L’essentiel est d’accorder direction et couleur de la lumière : un ciel couchant sur des ombres de midi se repère aussitôt, alors réchauffez ou refroidissez le premier plan.'} },
    { i:'fa-images', t:{zh:'雙重曝光', en:'Double exposure', fr:'Double exposition'},
      p:{zh:'人物剪影放底層，風景放上層並設為「濾色」，風景會出現在人物較暗的地方。再用遮色片控制臉部保留多少。', en:'Put a silhouetted portrait below and a landscape above in Screen mode; the landscape shows through the darker parts of the figure. Mask to control how much of the face survives.', fr:'Un portrait en silhouette dessous, un paysage dessus en mode Superposition : le paysage apparaît dans les zones sombres du personnage. Un masque dose ce qui reste du visage.'} },
    { i:'fa-mountain-sun', t:{zh:'HDR 與包圍曝光合成', en:'HDR and exposure blending', fr:'HDR et fusion d’expositions'},
      p:{zh:'同一個畫面拍暗、正常、亮三張，合成保留亮部與暗部細節。適合室內窗景、逆光風景。', en:'Shoot the same frame dark, normal and bright, then merge to keep detail in both highlights and shadows. For interiors with windows and backlit landscapes.', fr:'Photographier la même scène sombre, normale et claire, puis fusionner pour garder les détails des hautes et basses lumières. Pour les intérieurs avec fenêtre et les paysages à contre-jour.'} },
    { i:'fa-panorama', t:{zh:'全景接圖與焦點堆疊', en:'Panoramas and focus stacking', fr:'Panoramas et empilement de mise au point'},
      p:{zh:'全景：重疊約三分之一連拍，軟體自動接合。焦點堆疊：對焦在不同距離拍多張，合成整張都清楚，常用於微距與商品。', en:'Panorama: overlap shots by about a third and let the software stitch. Focus stacking: shoot at several focus distances and merge for front-to-back sharpness, common in macro and product work.', fr:'Panorama : chevaucher les vues d’environ un tiers et laisser le logiciel assembler. Empilement : plusieurs vues à des distances de mise au point différentes, fusionnées pour une netteté totale, courant en macro et en packshot.'} },
  ]},

    </article>`).join('') + `</div>`,
  steps:(b, s) => `<ol class="grid md:grid-cols-2 gap-4">` + b.items.map((c, n) => `
    <li class="reveal flex gap-4 bg-slate-900/40 rounded-2xl border border-slate-800 p-5" data-i="${n % 6}">
      <div class="shrink-0 w-10 h-10 rounded-full flex items-center justify-center font-black text-sm border" style="color:${s.c};background:${s.c}14;border-color:${s.c}55">${n + 1}</div>
      <div><h4 class="font-black text-white text-sm">${t(c.t)}</h4><p class="text-sm text-slate-400 leading-relaxed mt-1.5">${t(c.p)}</p></div>
    </li>`).join('') + `</ol>`,
  table:(b) => `<div class="table-scroll overflow-x-auto"><table class="w-full text-sm min-w-[640px]">
    <thead><tr class="text-left text-slate-400 border-b border-slate-800">${b.head.map(h => `<th class="py-3 px-4 font-bold">${t(h)}</th>`).join('')}</tr></thead>
    <tbody class="divide-y divide-slate-800/60">${b.rows.map(r => `<tr>${r.map((c, i) => `<td class="py-3 px-4 align-top ${i ? 'text-slate-300' : 'text-white font-bold'}">${b.kbd && i ? kbdify(t(c)) : t(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`,
};

function renderSections() {
  document.getElementById('nav').innerHTML = SECTIONS.map(s =>
    `<a href="#${s.id}" class="px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 hover:border-slate-500/60 transition-colors">${t(s.nav)}</a>`).join('');
  document.getElementById('sections').innerHTML = SECTIONS.map(s => `
  <section id="${s.id}" class="scroll-mt-28">
    <div class="flex items-center gap-3 mb-5">
      <div class="p-3 rounded-2xl border" style="color:${s.c};background:${s.c}1a;border-color:${s.c}40;box-shadow:0 0 20px ${s.c}33"><i class="fa-solid ${s.i} text-xl"></i></div>
      <div>
        <span class="text-xs uppercase tracking-wider font-bold" style="color:${s.c}">${t(s.eyebrow)}</span>
        <h2 class="text-2xl font-black text-white">${t(s.h2)}</h2>
      </div>
    </div>
    <div class="gradient-border bg-slate-950/40 rounded-3xl p-6 md:p-8 border border-slate-900 space-y-6">
      ${s.blocks.map(b => BLOCK[b.type](b, s)).join('')}
    </div>
  </section>`).join('');
}

let revealObserver = null;
function armReveals(root) {
  const els = root.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window) ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    els.forEach(e => e.classList.add('in')); return;
  }
  if (!revealObserver) {
    revealObserver = new IntersectionObserver((es, obs) => {
      es.forEach(e => { if (!e.isIntersecting) return;
        setTimeout(() => e.target.classList.add('in'), (+e.target.dataset.i || 0) * 70);
        obs.unobserve(e.target); });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });
  }
  els.forEach(e => revealObserver.observe(e));
}

const BTN_ON  = 'px-2.5 py-1 text-xs font-bold rounded-lg transition-all bg-emerald-500/15 text-emerald-300 border border-emerald-500/25';
const BTN_OFF = 'px-2.5 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200';
function setLanguage(lang) {
  if (!I18N[lang]) return;
  LANG = lang;
  try { localStorage.setItem('kb_lang', lang); } catch (e) {}
  ['zh','en','fr'].forEach(l => {
    const b = document.getElementById('lang-' + l);
    if (b) b.className = (l === lang) ? BTN_ON : BTN_OFF;
  });
  document.title = ui('doc.title');
  document.documentElement.lang = (lang === 'zh') ? 'zh-Hant' : lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = ui(el.dataset.i18n); if (v) el.innerHTML = v;
  });
  renderSections();
  armReveals(document.querySelector('main'));
}
let _l = 'zh';
try { const st = localStorage.getItem('kb_lang'); if (['zh','en','fr'].includes(st)) _l = st; } catch (e) {}
setLanguage(_l);

</script>
