<style>
  body {
    background-color: #06060c;
    background-image:
      radial-gradient(at 0% 0%,   rgba(245,158,11,0.08) 0px, transparent 40%),
      radial-gradient(at 100% 0%, rgba(167,139,250,0.07) 0px, transparent 40%),
      radial-gradient(at 50% 100%, rgba(56,189,248,0.05) 0px, transparent 50%);
    background-attachment: fixed;
  }
  .gradient-border { position: relative; }
  .gradient-border::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(to bottom right, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .card { transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .card:hover { transform: translateY(-4px); }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(90deg); }
  .table-scroll::-webkit-scrollbar { height: 8px; }
  .table-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 8px; }

  /* artwork thumbnail frames */
  .art-thumb {
    width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block;
    background: #0d0d16; transition: transform .4s ease, opacity .4s ease; opacity: 0;
  }
  .art-thumb.loaded { opacity: 1; }
  .art-frame { overflow: hidden; border-radius: 1rem; background: #0d0d16; position: relative; }
  .art-frame:hover .art-thumb { transform: scale(1.05); }
  .art-frame .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: rgba(148,163,184,0.35); font-size: 1.6rem;
  }
  /* small inline artwork chip */
  .art-chip {
    display: inline-flex; align-items: center; gap: .4rem; cursor: pointer;
    padding: .28rem .6rem; border-radius: 9999px; font-size: .7rem; line-height: 1.1;
    background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.22);
    color: #fcd34d; transition: background .2s, border-color .2s, color .2s;
  }
  .art-chip:hover { background: rgba(245,158,11,0.18); border-color: rgba(245,158,11,0.5); color: #fde68a; }

  /* ── Diagram tokens ──
     Mark fills are the validated dark-surface steps (lightness band + >=3:1
     on this page's card surface #0b0b14; Greek/Roman pair CVD dE 20.9).
     Text keeps the lighter ink tints -- marks and ink are separate scales. */
  .viz {
    --gr-mark:  #0284c7;  --gr-ink:  #7dd3fc;   /* Greek  */
    --ro-mark:  #e11d48;  --ro-ink:  #fda4af;   /* Roman  */
    --bar-mark: #d97706;  --bar-ink: #fcd34d;   /* chart  */
    --mid-mark: #57534e;  --mid-ink: #a8a29e;   /* medieval / neutral */
    --line:     rgba(148,163,184,0.28);
  }

  /* Vertical spine timeline */
  .tl { position: relative; padding-left: 0; }
  .tl-row { display: grid; grid-template-columns: 7.5rem 1.25rem 1fr; gap: 0 .75rem; }
  @media (max-width: 640px) { .tl-row { grid-template-columns: 5.25rem 1.25rem 1fr; } }
  .tl-rail { position: relative; display: flex; justify-content: center; align-self: stretch; }
  .tl-rail::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--rail, var(--line));
  }
  .tl-row:first-child .tl-rail::before { top: .55rem; }
  .tl-row:last-child  .tl-rail::before { bottom: calc(100% - .55rem); }
  .tl-dot {
    position: relative; flex: 0 0 auto; width: .6rem; height: .6rem; margin-top: .3rem; border-radius: 50%;
    background: var(--rail, var(--line)); box-shadow: 0 0 0 3px #0b0b14;
  }
  .tl-row.is-key .tl-dot { width: .85rem; height: .85rem; margin-top: .18rem; }

  /* Generation bands (theogony) */
  .gen { border-radius: 1rem; border: 1px solid rgba(148,163,184,0.16); background: rgba(15,23,42,0.45); padding: 1rem 1.1rem; }
  .gen-pill {
    display: inline-block; padding: .2rem .55rem; border-radius: 9999px;
    font-size: .65rem; font-weight: 800; letter-spacing: .04em;
  }
  .fig { display: inline-block; padding: .28rem .6rem; border-radius: .55rem; font-size: .78rem;
         background: rgba(148,163,184,0.10); border: 1px solid rgba(148,163,184,0.18); }
  .fig.is-lead { background: rgba(217,119,6,0.14); border-color: rgba(217,119,6,0.45); color: #fcd34d; font-weight: 700; }
  .coup { display: flex; align-items: center; gap: .6rem; padding: .55rem 0 .55rem 1.1rem; }
  .coup-bar { width: 2px; align-self: stretch; background: linear-gradient(180deg, var(--line), rgba(217,119,6,0.55)); }

  /* Fork (Greek line / Roman line) */
  .fork { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  @media (max-width: 720px) { .fork { grid-template-columns: 1fr; } }

  /* Era band (reception) — position of each era across the whole span */
  .band { display: block; width: 100%; position: relative; height: .5rem; border-radius: 9999px; background: rgba(148,163,184,0.12); overflow: hidden; }
  .band-fill { position: absolute; top: 0; bottom: 0; border-radius: 9999px; background: var(--seg, var(--mid-mark)); }

  /* Bar chart — horizontal, single hue, 2px surface gap between bars */
  .bars { display: flex; flex-direction: column; gap: 2px; }
  .bar-row { display: grid; grid-template-columns: 9.5rem 1fr auto; align-items: center; gap: .6rem; }
  @media (max-width: 640px) { .bar-row { grid-template-columns: 6.5rem 1fr auto; } }
  .bar-track { display: block; width: 100%; position: relative; height: 1.35rem; }
  .bar-fill {
    position: absolute; left: 0; top: 0; bottom: 0; min-width: 2px;
    background: var(--bar-mark); border-radius: 0 4px 4px 0;
    transition: width .5s cubic-bezier(.2,.7,.3,1);
  }
  .bar-row:hover .bar-fill { background: #f59e0b; }
  .bar-axis { border-left: 1px solid rgba(148,163,184,0.22); }

  /* lightbox */
  #lb { position: fixed; inset: 0; z-index: 100; display: none; }
  #lb.open { display: block; }
  #lb .veil { position: absolute; inset: 0; background: rgba(2,2,8,0.88); backdrop-filter: blur(6px); }
  #lb .panel {
    position: relative; max-width: 1000px; margin: 4vh auto; max-height: 92vh; overflow-y: auto;
    background: #0b0b14; border: 1px solid rgba(148,163,184,0.18); border-radius: 1.5rem;
  }
  #lb .panel::-webkit-scrollbar { width: 8px; }
  #lb .panel::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 8px; }
  #lb img { display: block; width: 100%; max-height: 62vh; object-fit: contain; background: #05050a; }
</style>

<script>
/* ══════════════════════════════════════════════════════════════
   Greek & Roman Mythology Atlas — trilingual (zh / en / fr)
   Artwork images are resolved at runtime from Wikipedia's
   pageimages API, so no image file names are hard-coded here.
   ══════════════════════════════════════════════════════════════ */

let LANG = 'zh';
/* Pick a localized string from a {zh,en,fr} bundle; fall back to en, then zh. */
function t(o) {
  if (o == null) return '';
  if (typeof o === 'string') return o;
  return o[LANG] || o.en || o.zh || '';
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ─────────────────────────────────────────────────────────────
   ARTWORKS — the registry every myth links into.
   wiki : English Wikipedia article title (used to fetch the image)
   t    : title      a: artist      y: date      m: medium & museum
   why  : why this work matters for the myth (the myth ↔ art link)
   ───────────────────────────────────────────────────────────── */
const ARTS = {

/* ── Cosmogony & Titans ── */
uranus: {
  wiki: 'Uranus (mythology)',
  t:{zh:'薩圖恩閹割烏拉諾斯', en:'The Mutilation of Uranus by Saturn', fr:'La Mutilation d’Ouranos par Saturne'},
  a:{zh:'瓦薩里與蓋拉爾迪 Vasari &amp; Gherardi', en:'Giorgio Vasari &amp; Cristofano Gherardi'},
  y:'c. 1560', yr:1560, m:{zh:'濕壁畫．佛羅倫斯舊宮', en:'Fresco · Palazzo Vecchio, Florence', fr:'Fresque · Palazzo Vecchio, Florence'},
  why:{zh:'赫西俄德《神譜》開篇的暴力場景：時間之神以鐮刀推翻天空之神，濺入海中的血沫生出阿芙蘿黛蒂。文藝復興宮廷把這幕畫在天花板上，是要用宇宙起源為統治者的權力世系背書。',
       en:'The violent opening of Hesiod’s <em>Theogony</em>: Time overthrows Sky with a sickle, and Aphrodite is born from the foam where the severed flesh falls into the sea. Renaissance courts put this on their ceilings to anchor a ruling dynasty in the origin of the cosmos itself.',
       fr:'L’ouverture violente de la <em>Théogonie</em> d’Hésiode : le Temps renverse le Ciel à la faux, et Aphrodite naît de l’écume. Les cours de la Renaissance peignaient cette scène aux plafonds pour ancrer une dynastie dans l’origine même du cosmos.'} },

saturn: {
  wiki: 'Saturn Devouring His Son',
  t:{zh:'農神吞噬其子', en:'Saturn Devouring His Son', fr:'Saturne dévorant un de ses fils'},
  a:{zh:'哥雅 Goya', en:'Francisco de Goya'},
  y:'1819–23', yr:1821, m:{zh:'壁畫移置畫布．馬德里普拉多美術館', en:'Mural transferred to canvas · Museo del Prado, Madrid', fr:'Peinture murale transposée sur toile · Musée du Prado, Madrid'},
  why:{zh:'克洛諾斯（羅馬名薩圖恩）吞食親生兒女以阻止預言。魯本斯畫過同一題材的古典版本；哥雅則把它畫在自家餐廳牆上，變成毫無神性的瘋狂——同一則神話，兩百年間從宮廷裝飾墜落為現代心理的深淵。',
       en:'Cronus (Roman Saturn) devours his children to cheat a prophecy. Rubens painted the same subject as classical narrative; Goya painted it on his own dining-room wall as sheer godless madness — one myth, and in two centuries it falls from courtly décor into the modern psychological abyss.',
       fr:'Cronos (Saturne chez les Romains) dévore ses enfants pour déjouer une prophétie. Rubens en fit un récit classique ; Goya la peignit sur le mur de sa salle à manger comme une folie sans dieu — un même mythe qui, en deux siècles, passe du décor de cour à l’abîme psychologique moderne.'} },

prometheus: {
  wiki: 'Prometheus Bound (Rubens)',
  t:{zh:'被縛的普羅米修斯', en:'Prometheus Bound', fr:'Prométhée enchaîné'},
  a:{zh:'魯本斯 Rubens', en:'Peter Paul Rubens'},
  y:'1611–18', yr:1614, m:{zh:'油彩畫布．費城美術館', en:'Oil on canvas · Philadelphia Museum of Art', fr:'Huile sur toile · Philadelphia Museum of Art'},
  why:{zh:'盜火者被鎖在高加索山，鷹每日啄食其肝。魯本斯畫身體，老鷹由動物畫家史奈德斯代筆——巴洛克「痛苦的雄辯」典範。此後普羅米修斯成為啟蒙與浪漫主義最愛的反叛象徵。',
       en:'The fire-thief chained to the Caucasus, his liver torn daily by an eagle. Rubens painted the body; the eagle was left to the animal specialist Frans Snyders — a textbook case of Baroque “eloquent suffering.” Prometheus then became the favourite rebel-symbol of the Enlightenment and Romanticism.',
       fr:'Le voleur du feu enchaîné au Caucase, le foie déchiré chaque jour par un aigle. Rubens peignit le corps, l’aigle revenant au spécialiste animalier Frans Snyders — cas d’école de la « souffrance éloquente » baroque. Prométhée devint ensuite le symbole rebelle des Lumières et du romantisme.'} },

pergamon: {
  wiki: 'Pergamon Altar',
  t:{zh:'佩加蒙祭壇．巨人之戰浮雕', en:'Pergamon Altar — Gigantomachy Frieze', fr:'Autel de Pergame — frise de la Gigantomachie'},
  a:{zh:'佚名（希臘化時期）', en:'Unknown (Hellenistic)', fr:'Anonyme (période hellénistique)'},
  y:'c. 165–156 BC', yr:-160, m:{zh:'大理石浮雕．柏林佩加蒙博物館', en:'Marble relief · Pergamonmuseum, Berlin', fr:'Relief en marbre · Pergamonmuseum, Berlin'},
  why:{zh:'奧林帕斯諸神對抗巨人族的宇宙級戰爭，被雕成一百二十公尺長的浮雕。翻騰的衣褶、深挖的陰影與痛苦扭曲的身體，界定了「希臘化激情風格」，也直接哺育了《勞孔》與後來的巴洛克。',
       en:'The cosmic war of the Olympians against the Giants, carved as a 120-metre frieze. Churning drapery, deep undercut shadow and bodies twisted in agony define the Hellenistic “pathos style” that fed directly into the <em>Laocoön</em> and, much later, the Baroque.',
       fr:'La guerre cosmique des Olympiens contre les Géants, sculptée sur 120 mètres. Draperies tourbillonnantes, ombres profondément creusées et corps tordus de douleur définissent le « style pathétique » hellénistique, qui nourrit directement le <em>Laocoon</em> puis, bien plus tard, le baroque.'} },

/* ── The Pantheon ── */
jupiter_thetis: {
  wiki: 'Jupiter and Thetis',
  t:{zh:'朱庇特與忒提斯', en:'Jupiter and Thetis', fr:'Jupiter et Thétis'},
  a:{zh:'安格爾 Ingres', en:'Jean-Auguste-Dominique Ingres'},
  y:'1811', yr:1811, m:{zh:'油彩畫布．普羅旺斯艾克斯格拉內美術館', en:'Oil on canvas · Musée Granet, Aix-en-Provence', fr:'Huile sur toile · Musée Granet, Aix-en-Provence'},
  why:{zh:'《伊利亞德》第一卷：海洋女神忒提斯跪求宙斯替兒子阿基里斯出頭。安格爾刻意讓神王巨大而僵直、女神的手臂拉長變形——新古典主義用解剖上的「錯誤」來製造神性的壓迫感。',
       en:'<em>Iliad</em>, Book I: the sea-nymph Thetis kneels to beg Zeus to favour her son Achilles. Ingres makes the king of gods colossal and rigid while stretching Thetis’s arm out of all anatomy — Neoclassicism using deliberate “error” to manufacture divine pressure.',
       fr:'<em>Iliade</em>, chant I : la nymphe Thétis supplie Zeus à genoux en faveur de son fils Achille. Ingres rend le roi des dieux colossal et rigide et étire le bras de Thétis hors de toute anatomie — le néoclassicisme se sert de « l’erreur » délibérée pour fabriquer la pression du divin.'} },

milky_way: {
  wiki: 'The Origin of the Milky Way',
  t:{zh:'銀河的起源', en:'The Origin of the Milky Way', fr:'L’Origine de la Voie lactée'},
  a:{zh:'丁托列托 Tintoretto', en:'Jacopo Tintoretto'},
  y:'c. 1575', yr:1575, m:{zh:'油彩畫布．倫敦國家美術館', en:'Oil on canvas · The National Gallery, London', fr:'Huile sur toile · National Gallery, Londres'},
  why:{zh:'宙斯把私生子赫拉克勒斯偷偷放到熟睡的赫拉胸前吸奶，好讓他得到不死；乳汁噴濺，上成銀河、下化百合。此畫是「神話解釋自然現象」的最佳範例，也是威尼斯畫派飛旋構圖的展示。',
       en:'Zeus smuggles the infant Heracles to the breast of the sleeping Hera so the boy will gain immortality; the spurting milk becomes the Milky Way above and lilies below. The clearest example of myth as aetiology — a story told to explain a natural fact — and a showcase of Venetian spiralling composition.',
       fr:'Zeus glisse l’enfant Héraclès au sein d’Héra endormie pour le rendre immortel ; le lait jaillit et forme la Voie lactée en haut, les lis en bas. Exemple parfait du mythe étiologique — un récit qui explique un fait naturel — et démonstration de la composition tournoyante vénitienne.'} },

artemision: {
  wiki: 'Artemision Bronze',
  t:{zh:'阿特米西翁青銅像（宙斯或波賽頓）', en:'Artemision Bronze (Zeus or Poseidon)', fr:'Bronze d’Artémision (Zeus ou Poséidon)'},
  a:{zh:'佚名（古典早期）', en:'Unknown (Early Classical)', fr:'Anonyme (premier classicisme)'},
  y:'c. 460 BC', yr:-460, m:{zh:'青銅．雅典國家考古博物館', en:'Bronze · National Archaeological Museum, Athens', fr:'Bronze · Musée national archéologique, Athènes'},
  why:{zh:'學界至今爭論他擲的是宙斯的雷霆還是波賽頓的三叉戟——因為手中的物件遺失了。這正說明希臘藝術中「屬性物」的決定性：拿走屬性，連神的身分都無從辨認。',
       en:'Scholars still argue whether he hurls Zeus’s thunderbolt or Poseidon’s trident, because the object in his hand is lost. That single gap proves how decisive <em>attributes</em> are in classical art: remove the attribute and even a god becomes unidentifiable.',
       fr:'Les spécialistes débattent encore : lance-t-il la foudre de Zeus ou le trident de Poséidon ? L’objet a disparu. Cette seule lacune prouve le rôle décisif des <em>attributs</em> dans l’art antique : ôtez l’attribut, et même un dieu devient méconnaissable.'} },

pallas_centaur: {
  wiki: 'Pallas and the Centaur',
  t:{zh:'帕拉斯與半人馬', en:'Pallas and the Centaur', fr:'Pallas et le Centaure'},
  a:{zh:'波提切利 Botticelli', en:'Sandro Botticelli'},
  y:'c. 1482', yr:1482, m:{zh:'蛋彩畫布．佛羅倫斯烏菲茲美術館', en:'Tempera on canvas · Uffizi, Florence', fr:'Tempera sur toile · Galerie des Offices, Florence'},
  why:{zh:'雅典娜輕輕揪住半人馬的頭髮——理性馴服獸性。她衣上滿佈美第奇家族的鑽石環徽記，於是新柏拉圖主義的道德寓言同時是一則政治宣傳：美第奇即智慧本身。',
       en:'Athena calmly grips the centaur’s hair — reason bridling the beast. Her dress is strewn with the Medici diamond-ring device, so a Neoplatonic moral allegory doubles as political advertising: the Medici <em>are</em> wisdom.',
       fr:'Athéna saisit calmement la chevelure du centaure — la raison bridant la bête. Sa robe est semée de l’emblème médicéen de l’anneau de diamant : l’allégorie morale néoplatonicienne sert aussi de propagande — les Médicis <em>sont</em> la sagesse.'} },

apollo_belvedere: {
  wiki: 'Apollo Belvedere',
  t:{zh:'貝爾維德雷的阿波羅', en:'Apollo Belvedere', fr:'Apollon du Belvédère'},
  a:{zh:'羅馬複製自雷歐卡雷斯 after Leochares', en:'Roman copy after Leochares'},
  y:'c. 120–140 AD', yr:130, m:{zh:'大理石．梵蒂岡博物館', en:'Marble · Vatican Museums', fr:'Marbre · Musées du Vatican'},
  why:{zh:'溫克爾曼稱它為「古代藝術的最高理想」，一句話讓這尊羅馬複製品統治了新古典主義的審美標準近一個世紀。它也提醒我們：歐洲人心中的「希臘」，多半是透過羅馬複製品認識的。',
       en:'Winckelmann called it “the highest ideal of art among all the works of antiquity” — one sentence that let a Roman copy rule Neoclassical taste for nearly a century. It is also the reminder that Europe’s idea of “Greek” art was mostly learned from Roman copies.',
       fr:'Winckelmann y voyait « l’idéal le plus élevé de l’art antique » : une phrase qui fit régner une copie romaine sur le goût néoclassique pendant près d’un siècle. Rappel utile : l’idée européenne de l’art « grec » vient surtout de copies romaines.'} },

diana_versailles: {
  wiki: 'Diana of Versailles',
  t:{zh:'凡爾賽的黛安娜', en:'Diana of Versailles', fr:'Diane de Versailles'},
  a:{zh:'羅馬複製自雷歐卡雷斯 after Leochares', en:'Roman copy after Leochares'},
  y:'c. 1st–2nd c. AD', yr:150, m:{zh:'大理石．巴黎羅浮宮', en:'Marble · Musée du Louvre, Paris', fr:'Marbre · Musée du Louvre, Paris'},
  why:{zh:'獵犬、短獵裝、伸手取箭——三個屬性就足以宣告「這是狩獵女神」。法王將她安置於凡爾賽，讓王室狩獵權與神話直接接軌。',
       en:'A hound, a short hunting chiton, a hand reaching for an arrow: three attributes are enough to announce “goddess of the hunt.” Installed at Versailles, she wired the royal privilege of the chase straight into myth.',
       fr:'Un chien, une courte tunique de chasse, la main qui saisit une flèche : trois attributs suffisent à dire « déesse de la chasse ». Installée à Versailles, elle branche le privilège royal de la chasse directement sur le mythe.'} },

venus_mars: {
  wiki: 'Venus and Mars (Botticelli)',
  t:{zh:'維納斯與馬爾斯', en:'Venus and Mars', fr:'Vénus et Mars'},
  a:{zh:'波提切利 Botticelli', en:'Sandro Botticelli'},
  y:'c. 1485', yr:1485, m:{zh:'蛋彩與油彩木板．倫敦國家美術館', en:'Tempera and oil on panel · The National Gallery, London', fr:'Tempera et huile sur bois · National Gallery, Londres'},
  why:{zh:'戰神癱睡，愛神清醒——小薩堤爾們偷走他的長矛與盔甲當玩具。這是文藝復興最著名的視覺格言：<em>愛征服戰爭</em>。長條形的畫幅顯示它原是婚房家具的背板。',
       en:'Mars sleeps helpless while Venus stays awake; baby satyrs make toys of his lance and armour. The Renaissance’s most famous visual maxim — <em>love conquers war</em> — and its long, narrow format shows it was made as the backboard of marriage-chamber furniture.',
       fr:'Mars dort, impuissant, tandis que Vénus veille ; de petits satyres jouent avec sa lance et son armure. La maxime visuelle la plus célèbre de la Renaissance — <em>l’amour vainc la guerre</em> — et son format allongé trahit un dossier de meuble de chambre nuptiale.'} },

birth_venus: {
  wiki: 'The Birth of Venus',
  t:{zh:'維納斯的誕生', en:'The Birth of Venus', fr:'La Naissance de Vénus'},
  a:{zh:'波提切利 Botticelli', en:'Sandro Botticelli'},
  y:'c. 1485', yr:1485, m:{zh:'蛋彩畫布．佛羅倫斯烏菲茲美術館', en:'Tempera on canvas · Uffizi, Florence', fr:'Tempera sur toile · Galerie des Offices, Florence'},
  why:{zh:'她從烏拉諾斯落海的血沫中生成，乘貝殼上岸——中世紀千年之後，第一件以真人大小、非宗教理由呈現裸體的作品。神話在此成為讓裸體重返西方藝術的「通行證」。',
       en:'Born from the sea-foam of Uranus’s severed flesh, she arrives on a shell — the first life-size nude painted for a non-religious reason after a thousand medieval years. Myth here is the licence that let the nude re-enter Western art.',
       fr:'Née de l’écume marine, elle aborde sur une conque : le premier nu grandeur nature peint pour une raison non religieuse après mille ans de Moyen Âge. Le mythe sert ici de laissez-passer au retour du nu dans l’art occidental.'} },

vulcan_forge: {
  wiki: 'Apollo in the Forge of Vulcan',
  t:{zh:'火神的鍛冶場', en:'Apollo in the Forge of Vulcan', fr:'La Forge de Vulcain'},
  a:{zh:'委拉斯奎茲 Velázquez', en:'Diego Velázquez'},
  y:'1630', yr:1630, m:{zh:'油彩畫布．馬德里普拉多美術館', en:'Oil on canvas · Museo del Prado, Madrid', fr:'Huile sur toile · Musée du Prado, Madrid'},
  why:{zh:'阿波羅前來通報：你的妻子維納斯與馬爾斯私通。委拉斯奎茲把奧林帕斯神話搬進一間真實的鐵匠鋪，工人有汗、有肌肉、有錯愕的表情——神話被「日常化」，正是西班牙黃金時代寫實主義的宣言。',
       en:'Apollo arrives to tell Vulcan that his wife Venus is sleeping with Mars. Velázquez relocates Olympus into a real blacksmith’s shop with sweating, startled workmen — myth made everyday, and a manifesto of Spanish Golden Age realism.',
       fr:'Apollon vient annoncer à Vulcain que Vénus le trompe avec Mars. Velázquez transporte l’Olympe dans une vraie forge, avec des ouvriers en sueur et stupéfaits : le mythe rendu quotidien, manifeste du réalisme du Siècle d’or espagnol.'} },

giambologna_mercury: {
  wiki: 'Mercury (Giambologna)',
  t:{zh:'飛翔的墨丘利', en:'Flying Mercury', fr:'Mercure volant'},
  a:{zh:'詹波隆那 Giambologna', en:'Giambologna'},
  y:'1580', yr:1580, m:{zh:'青銅．佛羅倫斯巴傑羅美術館', en:'Bronze · Museo Nazionale del Bargello, Florence', fr:'Bronze · Musée national du Bargello, Florence'},
  why:{zh:'全身重量落在一縷西風之神吹出的氣息上——矯飾主義用青銅的抗拉強度炫技，把「神的輕盈」變成一道工程難題的解答。帶翼涼鞋與雙蛇杖是墨丘利不變的身分證。',
       en:'The entire body balances on a breath exhaled by a wind-god — Mannerist virtuosity turning “divine weightlessness” into a solved engineering problem in bronze. The winged sandals and caduceus are Mercury’s permanent ID.',
       fr:'Tout le corps repose sur un souffle exhalé par un dieu du vent : virtuosité maniériste qui fait de « l’apesanteur divine » un problème d’ingénierie résolu en bronze. Sandales ailées et caducée sont la carte d’identité de Mercure.'} },

bacchus_ariadne: {
  wiki: 'Bacchus and Ariadne',
  t:{zh:'巴克斯與阿里阿德涅', en:'Bacchus and Ariadne', fr:'Bacchus et Ariane'},
  a:{zh:'提香 Titian', en:'Titian'},
  y:'1522–23', yr:1523, m:{zh:'油彩畫布．倫敦國家美術館', en:'Oil on canvas · The National Gallery, London', fr:'Huile sur toile · National Gallery, Londres'},
  why:{zh:'被忒修斯拋棄在納克索斯島的阿里阿德涅，回頭撞見酒神從豹車上一躍而下。畫面左上角的星冠，是她死後被升上天空的王冠座。提香用當時最昂貴的青金石群青畫天空——顏料本身就是敘事的一部分。',
       en:'Abandoned on Naxos by Theseus, Ariadne turns to find Bacchus leaping from his leopard-drawn car. The ring of stars at upper left is the constellation Corona Borealis she will become. Titian painted that sky in ultramarine ground from lapis lazuli — the pigment itself is part of the storytelling.',
       fr:'Abandonnée à Naxos par Thésée, Ariane se retourne : Bacchus bondit de son char tiré par des léopards. La couronne d’étoiles en haut à gauche est la Couronne boréale qu’elle deviendra. Titien peignit ce ciel en outremer de lapis-lazuli : le pigment fait partie du récit.'} },

caravaggio_bacchus: {
  wiki: 'Bacchus (Caravaggio)',
  t:{zh:'巴克斯', en:'Bacchus', fr:'Bacchus'},
  a:{zh:'卡拉瓦喬 Caravaggio', en:'Caravaggio'},
  y:'c. 1596', yr:1596, m:{zh:'油彩畫布．佛羅倫斯烏菲茲美術館', en:'Oil on canvas · Uffizi, Florence', fr:'Huile sur toile · Galerie des Offices, Florence'},
  why:{zh:'神被畫成一個指甲有污垢、臉頰泛紅的羅馬少年，果籃裡的水果已開始腐爛。卡拉瓦喬用「不完美」擊碎理想化的古典神祇——這是巴洛克寫實主義對神話最挑釁的一次介入。',
       en:'The god is a flushed Roman boy with dirt under his fingernails, and the fruit in his basket is already rotting. Caravaggio breaks the idealized classical deity with imperfection — the most provocative intervention Baroque realism ever made in myth.',
       fr:'Le dieu est un garçon romain au teint rouge, les ongles sales, et les fruits de sa corbeille pourrissent déjà. Caravage brise la divinité classique idéalisée par l’imperfection : l’intervention la plus provocante du réalisme baroque dans le mythe.'} },

proserpina: {
  wiki: 'The Rape of Proserpina',
  t:{zh:'冥王劫持普洛塞庇娜', en:'The Rape of Proserpina', fr:'L’Enlèvement de Proserpine'},
  a:{zh:'貝尼尼 Bernini', en:'Gian Lorenzo Bernini', fr:'Le Bernin'},
  y:'1621–22', yr:1622, m:{zh:'大理石．羅馬博爾蓋塞美術館', en:'Marble · Galleria Borghese, Rome', fr:'Marbre · Galerie Borghèse, Rome'},
  why:{zh:'普魯托的手指陷入少女大腿的那一小塊「凹陷」，是西方雕塑史上最常被引用的細節：貝尼尼讓堅硬的大理石模仿出皮膚的柔軟。神話（四季的起源）在此被壓縮成一個觸覺瞬間。',
       en:'Pluto’s fingers sinking into the flesh of her thigh is the most-cited detail in Western sculpture: Bernini makes hard marble impersonate soft skin. The myth that explains the seasons is compressed into a single tactile instant.',
       fr:'Les doigts de Pluton s’enfonçant dans la cuisse : le détail le plus cité de la sculpture occidentale — Le Bernin fait imiter au marbre la douceur de la peau. Le mythe qui explique les saisons se condense en un instant tactile.'} },

amor_vincit: {
  wiki: 'Amor Vincit Omnia (Caravaggio)',
  t:{zh:'愛征服一切', en:'Amor Vincit Omnia', fr:'L’Amour victorieux'},
  a:{zh:'卡拉瓦喬 Caravaggio', en:'Caravaggio'},
  y:'1601–02', yr:1602, m:{zh:'油彩畫布．柏林畫廊', en:'Oil on canvas · Gemäldegalerie, Berlin', fr:'Huile sur toile · Gemäldegalerie, Berlin'},
  why:{zh:'邱比特踩踏著盔甲、樂器、圓規與王冠——象徵戰爭、藝術、科學與權力全數敗給愛慾。維吉爾的詩句「愛征服一切」被翻譯成一個赤裸、帶著壞笑的真實男孩。',
       en:'Cupid tramples armour, instruments, compasses and a crown — war, art, science and power all defeated by desire. Virgil’s line <em>omnia vincit amor</em> translated into one naked, smirking, unmistakably real boy.',
       fr:'Cupidon piétine armure, instruments, compas et couronne : guerre, art, science et pouvoir vaincus par le désir. Le vers de Virgile <em>omnia vincit amor</em> traduit en un garçon nu, narquois et bien réel.'} },

canova_psyche: {
  wiki: "Psyche Revived by Cupid's Kiss",
  t:{zh:'被邱比特之吻喚醒的賽姬', en:'Psyche Revived by Cupid’s Kiss', fr:'Psyché ranimée par le baiser de l’Amour'},
  a:{zh:'卡諾瓦 Canova', en:'Antonio Canova'},
  y:'1787–93', yr:1790, m:{zh:'大理石．巴黎羅浮宮', en:'Marble · Musée du Louvre, Paris', fr:'Marbre · Musée du Louvre, Paris'},
  why:{zh:'故事出自阿普列尤斯《金驢記》：靈魂（Psyche）因愛而復活。兩人的手臂交織成一個 X 形，觀者必須繞行才能看完——卡諾瓦把新古典主義的「靜穆」變成需要走動的體驗。',
       en:'From Apuleius’s <em>Golden Ass</em>: the Soul (Psyche) revived by Love. The two figures’ arms lock into an X that cannot be read from one viewpoint — Canova turns Neoclassical “calm grandeur” into something you must walk around to receive.',
       fr:'D’après <em>L’Âne d’or</em> d’Apulée : l’Âme (Psyché) ranimée par l’Amour. Les bras des deux figures forment un X illisible d’un seul point de vue : Canova fait de la « calme grandeur » néoclassique une expérience qu’il faut contourner.'} },

/* ── Heroes ── */
farnese: {
  wiki: 'Farnese Hercules',
  t:{zh:'法爾內塞的海克力斯', en:'Farnese Hercules', fr:'Hercule Farnèse'},
  a:{zh:'格利孔複製自呂西波斯 Glykon, after Lysippos', en:'Glykon, after Lysippos'},
  y:'early 3rd c. AD', yr:220, m:{zh:'大理石．拿坡里國家考古博物館', en:'Marble · National Archaeological Museum, Naples', fr:'Marbre · Musée archéologique national de Naples'},
  why:{zh:'英雄倚著棍棒喘息，背在身後的手裡藏著金蘋果——十二項苦差已經完成。誇張的肌肉配上疲憊的低頭，把「力量」與「代價」同時放進一個身體，成為後世描繪英雄的原型。',
       en:'The hero leans exhausted on his club, the golden apples hidden in the hand behind his back — the Twelve Labours are done. Overwhelming muscle plus a lowered, weary head puts strength and its cost into one body, the prototype for heroic figures ever after.',
       fr:'Le héros s’appuie, épuisé, sur sa massue, les pommes d’or cachées dans la main derrière son dos : les Douze Travaux sont accomplis. Musculature écrasante et tête baissée de fatigue placent la force et son prix dans un même corps — prototype de toute figure héroïque ultérieure.'} },

pollaiuolo_hercules: {
  wiki: 'Hercules Slaying Antaeus',
  t:{zh:'海克力斯與安泰俄斯', en:'Hercules and Antaeus', fr:'Hercule et Antée'},
  a:{zh:'波拉伊烏歐洛 Pollaiuolo', en:'Antonio del Pollaiuolo'},
  y:'c. 1475', yr:1475, m:{zh:'青銅．佛羅倫斯巴傑羅美術館', en:'Bronze · Museo Nazionale del Bargello, Florence', fr:'Bronze · Musée national du Bargello, Florence'},
  why:{zh:'巨人安泰俄斯只要碰到大地母親就能回復力量，海克力斯於是把他舉離地面勒死。這件小銅像是文藝復興「動態解剖學」的實驗場：兩具身體在空中扭成一個不穩定的螺旋。',
       en:'The giant Antaeus regains strength whenever he touches his mother Earth, so Heracles lifts him clear of the ground and crushes him. This small bronze is a Renaissance laboratory of anatomy in motion: two bodies twisted into one unstable airborne spiral.',
       fr:'Le géant Antée retrouve ses forces dès qu’il touche la Terre, sa mère : Héraclès le soulève donc et l’étouffe. Ce petit bronze est un laboratoire d’anatomie en mouvement : deux corps tordus en une spirale instable, sans appui.'} },

cellini_perseus: {
  wiki: 'Perseus with the Head of Medusa',
  t:{zh:'手持梅杜莎頭顱的柏修斯', en:'Perseus with the Head of Medusa', fr:'Persée tenant la tête de Méduse'},
  a:{zh:'切利尼 Cellini', en:'Benvenuto Cellini'},
  y:'1545–54', yr:1550, m:{zh:'青銅．佛羅倫斯傭兵涼廊', en:'Bronze · Loggia dei Lanzi, Florence', fr:'Bronze · Loggia dei Lanzi, Florence'},
  why:{zh:'它就立在市政廣場上，正對著多那太羅與米開朗基羅的作品，而且刻意讓梅杜莎的頭朝向他們——柯西莫一世用一則斬首神話宣告：反抗美第奇者，下場如此。神話是政治語言。',
       en:'It stands on the civic square facing Donatello’s and Michelangelo’s works, with Medusa’s severed head deliberately turned toward them. Cosimo I used a decapitation myth to announce what happens to those who resist the Medici — myth as political speech.',
       fr:'Elle se dresse sur la place civique face aux œuvres de Donatello et Michel-Ange, la tête tranchée de Méduse délibérément tournée vers elles. Côme Ier utilise un mythe de décapitation pour dire le sort réservé aux ennemis des Médicis : le mythe comme parole politique.'} },

medusa: {
  wiki: 'Medusa (Caravaggio)',
  t:{zh:'梅杜莎', en:'Medusa', fr:'Méduse'},
  a:{zh:'卡拉瓦喬 Caravaggio', en:'Caravaggio'},
  y:'1597', yr:1597, m:{zh:'油彩畫布裱於凸面木盾．佛羅倫斯烏菲茲美術館', en:'Oil on canvas over a convex wooden shield · Uffizi, Florence', fr:'Huile sur toile marouflée sur bouclier de bois convexe · Offices, Florence'},
  why:{zh:'畫在凸面盾牌上：觀者站在本該被石化的位置，卻看見梅杜莎自己驚駭的表情——她看見的是自己的倒影。卡拉瓦喬把「凝視」這個神話核心，做成一件會回望你的物件。',
       en:'Painted on a convex shield: you stand where you should be turned to stone, yet what you see is Medusa’s own horror — she is looking at her reflection. Caravaggio turns the myth’s central theme, the gaze, into an object that looks back.',
       fr:'Peinte sur un bouclier convexe : vous occupez la place où l’on devrait être pétrifié, mais c’est l’effroi de Méduse elle-même que vous voyez — elle contemple son reflet. Caravage fait du regard, cœur du mythe, un objet qui vous regarde.'} },

canova_theseus: {
  wiki: 'Theseus and the Minotaur (sculpture)',
  t:{zh:'忒修斯與米諾陶洛斯', en:'Theseus and the Minotaur', fr:'Thésée et le Minotaure'},
  a:{zh:'卡諾瓦 Canova', en:'Antonio Canova'},
  y:'1781–83', yr:1782, m:{zh:'大理石．倫敦維多利亞與亞伯特博物館', en:'Marble · Victoria and Albert Museum, London', fr:'Marbre · Victoria and Albert Museum, Londres'},
  why:{zh:'卡諾瓦不選搏鬥的高潮，而選了戰鬥「之後」：英雄坐在屍體上平靜地喘息。新古典主義相信最高貴的時刻不是暴力本身，而是暴力的收束——這正是溫克爾曼「高貴的單純、靜穆的偉大」。',
       en:'Canova skips the fight and takes the moment <em>after</em>: the hero sits on the corpse, quietly catching his breath. Neoclassicism held that the noblest moment is not violence but its aftermath — Winckelmann’s “noble simplicity and quiet grandeur.”',
       fr:'Canova écarte le combat pour l’instant d’<em>après</em> : le héros assis sur le cadavre, reprenant calmement son souffle. Le néoclassicisme tient que le moment le plus noble n’est pas la violence mais sa retombée — la « noble simplicité et calme grandeur » de Winckelmann.'} },

delacroix_medea: {
  wiki: 'Medea about to Kill Her Children',
  t:{zh:'即將殺子的美狄亞', en:'Medea about to Kill Her Children', fr:'Médée furieuse'},
  a:{zh:'德拉克洛瓦 Delacroix', en:'Eugène Delacroix'},
  y:'1838', yr:1838, m:{zh:'油彩畫布．里爾美術館', en:'Oil on canvas · Palais des Beaux-Arts, Lille', fr:'Huile sur toile · Palais des Beaux-Arts de Lille'},
  why:{zh:'金羊毛故事的黑暗結局：被伊阿宋背叛的女巫殺死自己的孩子。德拉克洛瓦讓陰影切過她的雙眼，我們看不見她的眼神——浪漫主義用「看不見」來表達無法被理性化的激情。',
       en:'The dark ending of the Golden Fleece story: the sorceress, betrayed by Jason, kills her own children. Delacroix throws a band of shadow across her eyes so we cannot read them — Romanticism using visual withholding for a passion reason cannot process.',
       fr:'La fin sombre de la Toison d’or : la magicienne, trahie par Jason, tue ses enfants. Delacroix jette une bande d’ombre sur ses yeux, illisibles — le romantisme dérobe le regard pour dire une passion que la raison ne peut traiter.'} },

corot_orpheus: {
  wiki: 'Orpheus and Eurydice',
  t:{zh:'俄耳甫斯引領歐律狄刻走出冥界', en:'Orpheus Leading Eurydice from the Underworld', fr:'Orphée ramenant Eurydice des Enfers'},
  a:{zh:'柯洛 Corot', en:'Jean-Baptiste-Camille Corot'},
  y:'1861', yr:1861, m:{zh:'油彩畫布．休士頓美術館', en:'Oil on canvas · Museum of Fine Arts, Houston', fr:'Huile sur toile · Museum of Fine Arts, Houston'},
  why:{zh:'整則神話的關鍵是一個禁令：走出冥界前不准回頭。柯洛因此把敘事完全交給風景——朦朧的銀灰樹林本身就是「不可回望」的焦慮。音樂之神舉起里拉琴，仍然失敗。',
       en:'The whole myth turns on one prohibition: do not look back before you are out. Corot therefore hands the narrative to landscape — the hazy silver woods <em>are</em> the anxiety of not looking. The god of music raises his lyre, and still fails.',
       fr:'Tout le mythe tient à un interdit : ne pas se retourner avant d’être sorti. Corot confie donc le récit au paysage — ces bois d’argent brumeux <em>sont</em> l’angoisse de ne pas regarder. Le dieu de la musique lève sa lyre, et échoue pourtant.'} },

ingres_oedipus: {
  wiki: 'Oedipus and the Sphinx',
  t:{zh:'伊底帕斯與斯芬克斯', en:'Oedipus and the Sphinx', fr:'Œdipe explique l’énigme du Sphinx'},
  a:{zh:'安格爾 Ingres', en:'Jean-Auguste-Dominique Ingres'},
  y:'1808/1827', yr:1808, m:{zh:'油彩畫布．巴黎羅浮宮', en:'Oil on canvas · Musée du Louvre, Paris', fr:'Huile sur toile · Musée du Louvre, Paris'},
  why:{zh:'謎題是「什麼動物早晨四足、中午兩足、晚上三足」，答案是「人」。安格爾把英雄畫成裸體、直視怪物——這是理性面對未知的圖像。摩洛在 1864 年重畫同一場景，卻讓斯芬克斯攀附上身，象徵主義由此誕生。',
       en:'The riddle — what walks on four legs, then two, then three? — has one answer: <em>man</em>. Ingres paints the hero nude and staring the monster down: an image of reason facing the unknown. When Moreau repainted the scene in 1864 he let the Sphinx cling to Oedipus’s body, and Symbolism was born.',
       fr:'L’énigme — quel être marche à quatre pattes, puis deux, puis trois ? — n’a qu’une réponse : <em>l’homme</em>. Ingres peint le héros nu, fixant le monstre : image de la raison devant l’inconnu. Quand Moreau reprend la scène en 1864, le Sphinx s’agrippe au corps d’Œdipe : le symbolisme est né.'} },

icarus: {
  wiki: 'Landscape with the Fall of Icarus',
  t:{zh:'有伊卡洛斯墜落的風景', en:'Landscape with the Fall of Icarus', fr:'La Chute d’Icare'},
  a:{zh:'老布勒哲爾（傳）after Bruegel', en:'After Pieter Bruegel the Elder'},
  y:'c. 1560s', yr:1565, m:{zh:'油彩畫布．布魯塞爾比利時皇家美術館', en:'Oil on canvas · Royal Museums of Fine Arts of Belgium, Brussels', fr:'Huile sur toile · Musées royaux des Beaux-Arts de Belgique, Bruxelles'},
  why:{zh:'農夫繼續耕田，牧羊人抬頭看天，只有畫面右下角一雙腿沒入海中——那就是伊卡洛斯。把神話高潮縮到近乎看不見，是西方藝術對「災難的旁觀者」最早也最冷靜的反省（後來成為奧登名詩的主題）。',
       en:'The ploughman ploughs on, the shepherd looks the wrong way, and only a pair of legs disappearing into the sea at lower right is Icarus. Shrinking the mythic climax to near-invisibility is Western art’s earliest and coolest meditation on bystanders to catastrophe — later the subject of Auden’s famous poem.',
       fr:'Le laboureur laboure, le berger regarde ailleurs, et seules deux jambes qui s’enfoncent dans la mer, en bas à droite, signalent Icare. Réduire le sommet du mythe à l’invisible est la plus ancienne et la plus froide méditation de l’art occidental sur les témoins du désastre — plus tard sujet du célèbre poème d’Auden.'} },

/* ── Troy & the Homeric epics ── */
rubens_paris: {
  wiki: 'The Judgement of Paris (Rubens)',
  t:{zh:'帕里斯的評判', en:'The Judgement of Paris', fr:'Le Jugement de Pâris'},
  a:{zh:'魯本斯 Rubens', en:'Peter Paul Rubens'},
  y:'c. 1636', yr:1636, m:{zh:'油彩木板．倫敦國家美術館', en:'Oil on panel · The National Gallery, London', fr:'Huile sur bois · National Gallery, Londres'},
  why:{zh:'牧羊人帕里斯必須在三位女神之間選出「最美者」，他選了維納斯，代價是特洛伊戰爭。這個題材是西方畫家唯一能「合法」同時畫三個裸體、且各以正面、側面、背面呈現的機會——神話成為人體研究的藉口。',
       en:'The shepherd Paris must judge which of three goddesses is fairest; he chooses Venus, and the price is the Trojan War. The subject was the one legitimate excuse for painting three nudes at once — front, side and back — so myth became a pretext for the study of the body.',
       fr:'Le berger Pâris doit désigner la plus belle des trois déesses ; il choisit Vénus, et le prix en sera la guerre de Troie. Le sujet offrait le seul prétexte légitime pour peindre trois nus de face, de profil et de dos : le mythe comme alibi de l’étude du corps.'} },

exekias: {
  wiki: 'Exekias',
  t:{zh:'阿基里斯與埃阿斯擲骰（黑繪雙耳瓶）', en:'Achilles and Ajax Playing Dice (black-figure amphora)', fr:'Achille et Ajax jouant aux dés (amphore à figures noires)'},
  a:{zh:'埃克塞基亞斯 Exekias', en:'Exekias'},
  y:'c. 540–530 BC', yr:-535, m:{zh:'陶器．梵蒂岡博物館', en:'Ceramic · Vatican Museums', fr:'Céramique · Musées du Vatican'},
  why:{zh:'荷馬從沒寫過這一幕：兩位最偉大的戰士在戰場邊安靜地擲骰子。畫家自己「補寫」了史詩，並用兩人俯身的弧線構成一個屋頂形——這是希臘瓶畫從裝飾走向敘事心理的轉捩點。',
       en:'Homer never wrote this scene: the two greatest warriors quietly throwing dice beside the battlefield. The painter has extended the epic himself, and framed the pair’s bent backs into a gable — the turning point where Greek vase painting moves from ornament to narrative psychology.',
       fr:'Homère n’a jamais écrit cette scène : les deux plus grands guerriers jouant tranquillement aux dés en marge de la bataille. Le peintre prolonge lui-même l’épopée et fait de leurs dos courbés un fronton — le moment où la céramique grecque passe de l’ornement à la psychologie narrative.'} },

laocoon: {
  wiki: 'Laocoön and His Sons',
  t:{zh:'勞孔群像', en:'Laocoön and His Sons', fr:'Laocoon et ses fils'},
  a:{zh:'阿格桑德羅斯等三位羅得島雕刻家', en:'Agesander, Athenodoros and Polydorus of Rhodes'},
  y:'c. 27 BC–68 AD', yr:20, m:{zh:'大理石．梵蒂岡博物館', en:'Marble · Vatican Museums', fr:'Marbre · Musées du Vatican'},
  why:{zh:'祭司警告特洛伊人別收下木馬，被海蛇絞死。1506 年在羅馬出土時米開朗基羅親自到場，此後它重新定義了西方對「痛苦」的表現；萊辛更以《拉奧孔》一書用它劃分詩與畫的界線——一件雕像觸發了整個美學學科。',
       en:'The priest who warned Troy against the wooden horse, strangled by sea-serpents. Michelangelo was present at its unearthing in Rome in 1506, and it redefined how the West depicts pain; Lessing then used it in <em>Laokoon</em> to draw the border between poetry and painting — one statue that launched a whole discipline of aesthetics.',
       fr:'Le prêtre qui mit Troie en garde contre le cheval de bois, étouffé par des serpents marins. Michel-Ange assista à sa découverte à Rome en 1506 ; l’œuvre redéfinit la représentation occidentale de la douleur, et Lessing s’en servit dans son <em>Laocoon</em> pour tracer la frontière entre poésie et peinture — une statue à l’origine de toute une esthétique.'} },

turner_polyphemus: {
  wiki: 'Ulysses Deriding Polyphemus',
  t:{zh:'嘲弄波呂斐摩斯的尤利西斯', en:'Ulysses Deriding Polyphemus', fr:'Ulysse raillant Polyphème'},
  a:{zh:'透納 Turner', en:'J. M. W. Turner'},
  y:'1829', yr:1829, m:{zh:'油彩畫布．倫敦國家美術館', en:'Oil on canvas · The National Gallery, London', fr:'Huile sur toile · National Gallery, Londres'},
  why:{zh:'奧德修斯逃出獨眼巨人的洞穴後高喊自己的名字，招來波賽頓十年的怒火。透納幾乎把巨人溶進山霧裡，讓真正的主角變成日出的光——神話題材成為純粹光線實驗的載體，直指印象派。',
       en:'Having escaped the Cyclops’ cave, Odysseus shouts his own name and earns ten years of Poseidon’s rage. Turner all but dissolves the giant into the mountain haze so that the real protagonist becomes sunrise itself — a mythological subject repurposed as pure light experiment, pointing straight at Impressionism.',
       fr:'Échappé de la caverne du Cyclope, Ulysse crie son nom et s’attire dix ans de colère de Poséidon. Turner dissout presque le géant dans la brume : le vrai protagoniste devient le lever du soleil — sujet mythologique reconverti en expérience de lumière pure, annonçant l’impressionnisme.'} },

waterhouse_sirens: {
  wiki: 'Ulysses and the Sirens (Waterhouse)',
  t:{zh:'尤利西斯與賽壬', en:'Ulysses and the Sirens', fr:'Ulysse et les Sirènes'},
  a:{zh:'瓦特豪斯 Waterhouse', en:'John William Waterhouse'},
  y:'1891', yr:1891, m:{zh:'油彩畫布．墨爾本維多利亞國家美術館', en:'Oil on canvas · National Gallery of Victoria, Melbourne', fr:'Huile sur toile · National Gallery of Victoria, Melbourne'},
  why:{zh:'奧德修斯把自己綁在桅杆上、替水手塞住耳朵，好在不喪命的前提下聽見禁忌的歌聲。瓦特豪斯依照古希臘瓶畫把賽壬畫成鳥身女首（而非後世的美人魚），是十九世紀學術考據進入繪畫的證據。',
       en:'Odysseus has himself lashed to the mast and plugs his crew’s ears so he can hear the forbidden song and survive it. Following Greek vase painting, Waterhouse gives the Sirens bird bodies rather than the later mermaid form — nineteenth-century archaeology entering the picture itself.',
       fr:'Ulysse se fait attacher au mât et bouche les oreilles de ses marins pour entendre le chant interdit sans y périr. Fidèle à la céramique grecque, Waterhouse donne aux Sirènes des corps d’oiseau plutôt que la forme tardive de sirène-poisson : l’archéologie du XIXᵉ siècle entre dans le tableau.'} },

apotheosis_homer: {
  wiki: 'The Apotheosis of Homer',
  t:{zh:'荷馬的神化', en:'The Apotheosis of Homer', fr:'L’Apothéose d’Homère'},
  a:{zh:'安格爾 Ingres', en:'Jean-Auguste-Dominique Ingres'},
  y:'1827', yr:1827, m:{zh:'油彩畫布．巴黎羅浮宮', en:'Oil on canvas · Musée du Louvre, Paris', fr:'Huile sur toile · Musée du Louvre, Paris'},
  why:{zh:'詩人被勝利女神加冕，腳下坐著擬人化的《伊利亞德》與《奧德賽》，兩側是拉斐爾、莫札特、普桑等後世大師。這是新古典主義的信仰告白：整個歐洲藝術的族譜，都從一位希臘盲詩人開始。',
       en:'Victory crowns the poet; personifications of the <em>Iliad</em> and <em>Odyssey</em> sit at his feet while Raphael, Poussin, Mozart and others assemble on either side. It is Neoclassicism’s creed made visible: the entire genealogy of European art begins with one blind Greek poet.',
       fr:'La Victoire couronne le poète ; l’<em>Iliade</em> et l’<em>Odyssée</em> personnifiées siègent à ses pieds, tandis que Raphaël, Poussin, Mozart et d’autres se rassemblent de part et d’autre. Credo visible du néoclassicisme : toute la généalogie de l’art européen commence avec un aède aveugle.'} },

/* ── Rome: foundation, virtue, empire ── */
bernini_aeneas: {
  wiki: 'Aeneas, Anchises, and Ascanius',
  t:{zh:'埃涅阿斯、安基塞斯與阿斯卡尼俄斯', en:'Aeneas, Anchises, and Ascanius', fr:'Énée, Anchise et Ascagne'},
  a:{zh:'貝尼尼（與其父）Bernini', en:'Gian Lorenzo Bernini (with Pietro Bernini)', fr:'Le Bernin (avec Pietro Bernini)'},
  y:'1618–19', yr:1619, m:{zh:'大理石．羅馬博爾蓋塞美術館', en:'Marble · Galleria Borghese, Rome', fr:'Marbre · Galerie Borghèse, Rome'},
  why:{zh:'埃涅阿斯背著老父逃出燃燒的特洛伊，父親手中捧著家族神像，幼子跟在腳邊。三代人垂直疊成一根柱子，正是羅馬最高德性 <em>pietas</em>（對神、父、國的責任）的圖像定義。',
       en:'Aeneas carries his father out of burning Troy, the old man clutching the household gods, the small son at his heels. Three generations stacked into a single vertical column: the visual definition of <em>pietas</em>, Rome’s supreme virtue — duty to gods, father and state.',
       fr:'Énée porte son père hors de Troie en flammes, le vieillard serrant les dieux domestiques, le fils cadet à ses pieds. Trois générations empilées en une colonne verticale : définition visuelle de la <em>pietas</em>, vertu suprême de Rome — devoir envers les dieux, le père et l’État.'} },

capitoline_wolf: {
  wiki: 'Capitoline Wolf',
  t:{zh:'卡比托利歐母狼', en:'Capitoline Wolf', fr:'Louve du Capitole'},
  a:{zh:'佚名（母狼），雙嬰為文藝復興補作', en:'Unknown (wolf); twins added in the Renaissance', fr:'Anonyme (louve) ; jumeaux ajoutés à la Renaissance'},
  y:{zh:'母狼年代仍具爭議；雙嬰約 1471–1509', en:'Wolf date disputed; twins c. 1471–1509', fr:'Datation de la louve discutée ; jumeaux v. 1471–1509'}, yr:null,
  m:{zh:'青銅．羅馬卡比托利歐博物館', en:'Bronze · Capitoline Museums, Rome', fr:'Bronze · Musées du Capitole, Rome'},
  why:{zh:'羅慕勒斯與雷穆斯由母狼哺育——羅馬把自己的起源訴說為「被野性拯救」。有趣的是母狼原本可能沒有雙嬰，是文藝復興才加上去的：連建國神話的圖像本身，都是後人不斷補寫的結果。',
       en:'Romulus and Remus suckled by a she-wolf: Rome tells its own origin as a rescue by the wild. Tellingly, the wolf may originally have had no twins at all — they were added in the Renaissance. Even the image of a foundation myth keeps being rewritten by later hands.',
       fr:'Romulus et Rémus allaités par une louve : Rome raconte son origine comme un sauvetage par la nature sauvage. Fait révélateur, la louve n’avait peut-être pas de jumeaux à l’origine — ajoutés à la Renaissance. Jusqu’à l’image du mythe fondateur, tout est réécrit par les siècles suivants.'} },

giambologna_sabine: {
  wiki: 'Abduction of a Sabine Woman',
  t:{zh:'劫掠薩賓婦女', en:'Abduction of a Sabine Woman', fr:'Enlèvement d’une Sabine'},
  a:{zh:'詹波隆那 Giambologna', en:'Giambologna'},
  y:'1579–83', yr:1581, m:{zh:'大理石．佛羅倫斯傭兵涼廊', en:'Marble · Loggia dei Lanzi, Florence', fr:'Marbre · Loggia dei Lanzi, Florence'},
  why:{zh:'早期羅馬男多女少，遂設局擄走鄰邦薩賓的婦女。詹波隆那自陳先做出這個螺旋上升的三人結構，才替它「找」了一個題目——矯飾主義的 <em>figura serpentinata</em> 讓形式先於敘事。',
       en:'Short of women, early Rome seized them from the neighbouring Sabines. Giambologna admitted he built the upward-spiralling group of three figures first and only then found a subject for it — Mannerism’s <em>figura serpentinata</em>, where form precedes narrative.',
       fr:'Manquant de femmes, la Rome primitive enleva celles des Sabins voisins. Giambologna avoua avoir d’abord conçu ce groupe en spirale ascendante, puis lui avoir cherché un sujet — la <em>figura serpentinata</em> maniériste, où la forme précède le récit.'} },

david_sabines: {
  wiki: 'The Intervention of the Sabine Women',
  t:{zh:'薩賓婦女的調停', en:'The Intervention of the Sabine Women', fr:'Les Sabines'},
  a:{zh:'大衛 David', en:'Jacques-Louis David'},
  y:'1799', yr:1799, m:{zh:'油彩畫布．巴黎羅浮宮', en:'Oil on canvas · Musée du Louvre, Paris', fr:'Huile sur toile · Musée du Louvre, Paris'},
  why:{zh:'被擄的薩賓婦女多年後衝入戰場，用自己的身體隔開丈夫與父兄。大衛在恐怖統治後入獄、獲釋，選這個「和解」的神話向法國喊話——同一位畫家先前用《荷拉斯兄弟之誓》呼籲犧牲，如今用神話呼籲停手。',
       en:'Years after the abduction, the Sabine women hurl themselves between their husbands and their fathers. David painted it after imprisonment in the wake of the Terror, choosing a myth of reconciliation to address France — the same artist who had once used the <em>Oath of the Horatii</em> to demand sacrifice now used myth to demand that the killing stop.',
       fr:'Des années après l’enlèvement, les Sabines se jettent entre leurs maris et leurs pères. David la peint après son emprisonnement, au sortir de la Terreur, choisissant un mythe de réconciliation pour parler à la France — le peintre qui avait exigé le sacrifice avec <em>Le Serment des Horaces</em> réclame désormais l’arrêt du carnage.'} },

horatii: {
  wiki: 'Oath of the Horatii',
  t:{zh:'荷拉斯兄弟之誓', en:'Oath of the Horatii', fr:'Le Serment des Horaces'},
  a:{zh:'大衛 David', en:'Jacques-Louis David'},
  y:'1784', yr:1784, m:{zh:'油彩畫布．巴黎羅浮宮', en:'Oil on canvas · Musée du Louvre, Paris', fr:'Huile sur toile · Musée du Louvre, Paris'},
  why:{zh:'李維記載的羅馬傳說：三兄弟受命與敵城代表決鬥，母姊在右側癱軟哭泣。左側的直線與右側的曲線，把「國家／男性／理性」與「家庭／女性／情感」對立起來——革命前夕最有名的道德號令。',
       en:'A Roman legend from Livy: three brothers swear to fight for the city while the women collapse in grief on the right. Straight lines on the left against curves on the right split state/male/reason from family/female/feeling — the most famous moral summons on the eve of the Revolution.',
       fr:'Légende romaine rapportée par Tite-Live : trois frères jurent de combattre pour la cité tandis que les femmes s’effondrent à droite. Lignes droites à gauche contre courbes à droite : l’État/le masculin/la raison contre la famille/le féminin/le sentiment — la plus célèbre sommation morale à la veille de la Révolution.'} },

prima_porta: {
  wiki: 'Augustus of Prima Porta',
  t:{zh:'第一門的奧古斯都', en:'Augustus of Prima Porta', fr:'Auguste de Prima Porta'},
  a:{zh:'佚名（羅馬帝國）', en:'Unknown (Roman Imperial)', fr:'Anonyme (Rome impériale)'},
  y:'c. 20 BC (copy 1st c. AD)', yr:-20, m:{zh:'大理石．梵蒂岡博物館', en:'Marble · Vatican Museums', fr:'Marbre · Musées du Vatican'},
  why:{zh:'請看皇帝右腳邊：一個騎海豚的小邱比特。那是在提醒觀者——尤利烏斯家族自稱是埃涅阿斯之後，而埃涅阿斯是維納斯之子。神話在此不是裝飾，而是政權合法性的法律文件。',
       en:'Look at the emperor’s right ankle: a small Cupid riding a dolphin. It reminds the viewer that the Julian family claimed descent from Aeneas, and Aeneas was the son of Venus. Here myth is not decoration but the legal paperwork of legitimacy.',
       fr:'Regardez à la cheville droite de l’empereur : un petit Cupidon chevauchant un dauphin. Il rappelle que la gens Julia se disait issue d’Énée, fils de Vénus. Le mythe n’est pas ici un décor mais le titre juridique de la légitimité.'} },

ara_pacis: {
  wiki: 'Ara Pacis',
  t:{zh:'和平祭壇', en:'Ara Pacis', fr:'Ara Pacis'},
  a:{zh:'佚名（羅馬帝國）', en:'Unknown (Roman Imperial)', fr:'Anonyme (Rome impériale)'},
  y:'13–9 BC', yr:-11, m:{zh:'大理石．羅馬和平祭壇博物館', en:'Marble · Museo dell’Ara Pacis, Rome', fr:'Marbre · Museo dell’Ara Pacis, Rome'},
  why:{zh:'浮雕上，埃涅阿斯獻祭、母狼哺育雙嬰、大地女神懷抱豐饒，與真實的奧古斯都家族遊行並列。神話場景與當代人物出現在同一圈牆上——這是把當朝政治直接寫進神譜的官方宣傳。',
       en:'Its reliefs set Aeneas sacrificing, the she-wolf with the twins, and a fertile Earth goddess beside a procession of the real Augustan family. Mythical scenes and living contemporaries share one wall — state propaganda writing the current regime directly into the genealogy of the gods.',
       fr:'Ses reliefs placent Énée sacrifiant, la louve et les jumeaux, une déesse Terre féconde à côté d’un cortège de la famille augustéenne réelle. Scènes mythiques et contemporains vivants sur un même mur : la propagande d’État inscrit le régime dans la généalogie des dieux.'} },

/* ── Ovid: Metamorphoses ── */
bernini_daphne: {
  wiki: 'Apollo and Daphne (Bernini)',
  t:{zh:'阿波羅與達芙妮', en:'Apollo and Daphne', fr:'Apollon et Daphné'},
  a:{zh:'貝尼尼 Bernini', en:'Gian Lorenzo Bernini', fr:'Le Bernin'},
  y:'1622–25', yr:1623, m:{zh:'大理石．羅馬博爾蓋塞美術館', en:'Marble · Galleria Borghese, Rome', fr:'Marbre · Galerie Borghèse, Rome'},
  why:{zh:'寧芙求父親救她，於是手指抽長為枝、腳趾扎根、皮膚變成月桂樹皮——而阿波羅的手才剛碰到她。貝尼尼選中「變形進行到一半」的那一秒，把《變形記》的核心動詞刻進石頭；月桂從此成為詩人的桂冠。',
       en:'The nymph begs her father for rescue, and her fingers lengthen into branches, her toes root, her skin turns to laurel bark — at the exact instant Apollo’s hand touches her. Bernini chooses the half-second in which the change is still happening, carving the central verb of the <em>Metamorphoses</em>; the laurel becomes the poet’s crown ever after.',
       fr:'La nymphe supplie son père : ses doigts s’allongent en rameaux, ses orteils s’enracinent, sa peau devient écorce de laurier — à l’instant précis où la main d’Apollon la touche. Le Bernin choisit la demi-seconde où la métamorphose est en cours, gravant dans la pierre le verbe central des <em>Métamorphoses</em> ; le laurier deviendra la couronne des poètes.'} },

narcissus: {
  wiki: 'Narcissus (Caravaggio)',
  t:{zh:'納西瑟斯', en:'Narcissus', fr:'Narcisse'},
  a:{zh:'卡拉瓦喬（傳）Caravaggio', en:'Caravaggio (attributed)', fr:'Caravage (attribué)'},
  y:'c. 1597–99', yr:1598, m:{zh:'油彩畫布．羅馬國立古代藝術美術館', en:'Oil on canvas · Galleria Nazionale d’Arte Antica, Rome', fr:'Huile sur toile · Galleria Nazionale d’Arte Antica, Rome'},
  why:{zh:'少年愛上自己的倒影而枯萎。畫面被水面切成上下對稱的兩半，中央是他發亮的膝蓋——構圖本身就是「自戀」的幾何學。阿爾伯提甚至說：繪畫的發明者就是納西瑟斯。',
       en:'The boy who withers loving his own reflection. The canvas is split into mirrored halves by the water, hinged on his glowing knee — the composition itself is the geometry of self-love. Alberti went further: the inventor of painting, he wrote, <em>was</em> Narcissus.',
       fr:'L’adolescent qui dépérit d’aimer son reflet. La toile est coupée en deux moitiés symétriques par l’eau, pivotant sur son genou lumineux : la composition est la géométrie même de l’amour de soi. Alberti allait plus loin : l’inventeur de la peinture, écrivait-il, <em>était</em> Narcisse.'} },

titian_europa: {
  wiki: 'The Rape of Europa (Titian)',
  t:{zh:'劫奪歐羅巴', en:'The Rape of Europa', fr:'L’Enlèvement d’Europe'},
  a:{zh:'提香 Titian', en:'Titian'},
  y:'1560–62', yr:1561, m:{zh:'油彩畫布．波士頓伊莎貝拉嘉納藝術博物館', en:'Oil on canvas · Isabella Stewart Gardner Museum, Boston', fr:'Huile sur toile · Isabella Stewart Gardner Museum, Boston'},
  why:{zh:'宙斯化為白牛把腓尼基公主馱過海，她的名字後來成為「歐洲」。這是提香為西班牙腓力二世所作《詩畫》系列之一——他自稱在畫「poesie（視覺的詩）」，等於主張畫家與詩人平起平坐。',
       en:'Zeus, disguised as a white bull, carries the Phoenician princess across the sea; her name becomes “Europe.” One of the <em>poesie</em> Titian made for Philip II of Spain — by calling them visual poems he claimed for the painter the standing of the poet.',
       fr:'Zeus, changé en taureau blanc, emporte la princesse phénicienne par-delà la mer ; son nom deviendra « Europe ». L’une des <em>poesie</em> peintes par Titien pour Philippe II d’Espagne : en les nommant poèmes visuels, il revendique pour le peintre le rang du poète.'} },

titian_actaeon: {
  wiki: 'Diana and Actaeon (Titian)',
  t:{zh:'黛安娜與阿克泰翁', en:'Diana and Actaeon', fr:'Diane et Actéon'},
  a:{zh:'提香 Titian', en:'Titian'},
  y:'1556–59', yr:1557, m:{zh:'油彩畫布．倫敦與愛丁堡國家美術館共有', en:'Oil on canvas · National Gallery, London / National Galleries of Scotland', fr:'Huile sur toile · National Gallery, Londres / National Galleries of Scotland'},
  why:{zh:'獵人偶然撞見沐浴中的月神，被變成鹿、遭自己的獵犬撕碎。整幅畫在講「看見」的罪與罰；提香晚年鬆散的筆觸讓形體幾乎溶解，預告了三百年後的印象派。',
       en:'A hunter blunders upon the bathing goddess, is turned into a stag and torn apart by his own hounds. The whole picture is about the crime and punishment of <em>seeing</em>; Titian’s late, loosened brushwork half-dissolves the forms, three centuries ahead of Impressionism.',
       fr:'Un chasseur surprend la déesse au bain, est changé en cerf et déchiré par ses propres chiens. Tout le tableau traite du crime et du châtiment de <em>voir</em> ; la touche tardive et relâchée de Titien dissout à demi les formes, trois siècles avant l’impressionnisme.'} },

rembrandt_danae: {
  wiki: 'Danaë (Rembrandt painting)',
  t:{zh:'達娜厄', en:'Danaë', fr:'Danaé'},
  a:{zh:'林布蘭 Rembrandt', en:'Rembrandt van Rijn'},
  y:'1636–43', yr:1640, m:{zh:'油彩畫布．聖彼得堡艾爾米塔什博物館', en:'Oil on canvas · Hermitage Museum, St Petersburg', fr:'Huile sur toile · Musée de l’Ermitage, Saint-Pétersbourg'},
  why:{zh:'宙斯化作金雨進入被囚的公主房中。多數畫家真的畫出金幣，林布蘭卻只用一道暖光——神的臨在被翻譯成純粹的光線。克林姆在 1907 年重畫同一題材，則把金雨變成裝飾性的金色渦流。',
       en:'Zeus enters the imprisoned princess’s chamber as a shower of gold. Most painters render actual coins; Rembrandt gives only a wash of warm light — divine presence translated into pure illumination. Klimt repainted the subject in 1907, turning the golden rain into an ornamental swirl.',
       fr:'Zeus pénètre en pluie d’or dans la chambre de la princesse enfermée. La plupart des peintres montrent de vraies pièces ; Rembrandt ne donne qu’une nappe de lumière chaude — la présence divine traduite en pure clarté. Klimt reprendra le sujet en 1907, changeant la pluie d’or en tourbillon ornemental.'} },

gerome_pygmalion: {
  wiki: 'Pygmalion and Galatea (Gérôme painting)',
  t:{zh:'皮格馬利翁與加拉泰亞', en:'Pygmalion and Galatea', fr:'Pygmalion et Galatée'},
  a:{zh:'傑洛姆 Gérôme', en:'Jean-Léon Gérôme'},
  y:'c. 1890', yr:1890, m:{zh:'油彩畫布．紐約大都會藝術博物館', en:'Oil on canvas · The Metropolitan Museum of Art, New York', fr:'Huile sur toile · Metropolitan Museum of Art, New York'},
  why:{zh:'雕刻家愛上自己的作品，維納斯讓象牙變成血肉。傑洛姆讓下半身仍是灰白石頭、上半身已泛出膚色——這是藝術家關於自身職業的終極神話：創作能否真的賦予生命？',
       en:'A sculptor falls in love with his own statue and Venus turns ivory into flesh. Gérôme keeps the legs chalky stone while the upper body already flushes with skin tone — the ultimate myth artists tell about their own trade: can making really give life?',
       fr:'Un sculpteur s’éprend de sa propre statue et Vénus change l’ivoire en chair. Gérôme laisse les jambes de pierre blafarde tandis que le buste rosit déjà : le mythe ultime que les artistes racontent sur leur métier — créer peut-il vraiment donner la vie ?'} },

las_hilanderas: {
  wiki: 'Las Hilanderas',
  t:{zh:'紡紗女（阿拉克涅的寓言）', en:'The Spinners (The Fable of Arachne)', fr:'Les Fileuses (La Fable d’Arachné)'},
  a:{zh:'委拉斯奎茲 Velázquez', en:'Diego Velázquez'},
  y:'c. 1655–60', yr:1657, m:{zh:'油彩畫布．馬德里普拉多美術館', en:'Oil on canvas · Museo del Prado, Madrid', fr:'Huile sur toile · Musée du Prado, Madrid'},
  why:{zh:'前景是馬德里的織坊女工，後景掛毯裡才是雅典娜懲罰凡人織女阿拉克涅的神話。委拉斯奎茲把神話推到畫中畫的深處，讓「勞動」占據前台——一幅關於藝術家地位與技藝競賽的宣言。',
       en:'The foreground holds real Madrid weavers; the myth — Athena punishing the mortal weaver Arachne — appears only in the tapestry at the back. Velázquez pushes myth into a picture-within-a-picture and gives the front to labour: a manifesto about craft, contest and the artist’s status.',
       fr:'Au premier plan, de vraies fileuses madrilènes ; le mythe — Athéna châtiant la mortelle Arachné — n’apparaît que dans la tapisserie du fond. Velázquez relègue le mythe dans le tableau-dans-le-tableau et donne le devant au travail : manifeste sur le métier, le concours et le statut de l’artiste.'} },

raphael_galatea: {
  wiki: 'The Triumph of Galatea',
  t:{zh:'加拉泰亞的凱旋', en:'The Triumph of Galatea', fr:'Le Triomphe de Galatée'},
  a:{zh:'拉斐爾 Raphael', en:'Raphael', fr:'Raphaël'},
  y:'c. 1512', yr:1512, m:{zh:'濕壁畫．羅馬法爾內西納別墅', en:'Fresco · Villa Farnesina, Rome', fr:'Fresque · Villa Farnésine, Rome'},
  why:{zh:'海中寧芙乘海豚貝車，四周小愛神拉弓。拉斐爾說他畫的不是任何真實模特兒，而是「心中的某個理念」——這句話後來成為藝術理論中「理想美」概念的起點。',
       en:'The sea-nymph rides a shell-car drawn by dolphins while cupids take aim. Raphael said he painted no living model but “a certain idea” in his mind — a sentence that became the starting point for the whole theory of ideal beauty.',
       fr:'La nymphe marine file sur un char-coquille tiré par des dauphins, sous les flèches des amours. Raphaël disait ne peindre aucun modèle vivant mais « une certaine idée » présente à son esprit — phrase fondatrice de toute la théorie de la beauté idéale.'} },

bronzino_venus: {
  wiki: 'Venus, Cupid, Folly and Time',
  t:{zh:'維納斯、邱比特、愚妄與時間', en:'Venus, Cupid, Folly and Time', fr:'Vénus, Cupidon, la Folie et le Temps'},
  a:{zh:'布隆津諾 Bronzino', en:'Agnolo Bronzino'},
  y:'c. 1545', yr:1545, m:{zh:'油彩木板．倫敦國家美術館', en:'Oil on panel · The National Gallery, London', fr:'Huile sur bois · National Gallery, Londres'},
  why:{zh:'冰冷光滑的裸體、蜂蜜與蠍尾的少女、右上角拉開帷幕的時間老人。矯飾主義用一堆難解的神話符號堆出一則關於情慾與其代價的謎題，正是宮廷文化「越難懂越高級」的極致。',
       en:'Glassy cold nudes, a girl who is honey in front and scorpion behind, and old Father Time hauling back the curtain at upper right. Mannerism piles up deliberately unreadable mythological signs into a riddle about desire and its cost — courtly culture at its most “the harder, the better.”',
       fr:'Des nus froids et lisses, une fille de miel par-devant et de scorpion par-derrière, et le vieux Temps tirant le rideau en haut à droite. Le maniérisme accumule des signes mythologiques volontairement illisibles en une énigme sur le désir et son prix : la culture de cour dans son goût du plus obscur possible.'} },

  wiki: 'Oedipus and the Sphinx (Moreau)',
  t:{zh:'伊底帕斯與斯芬克斯（摩洛）', en:'Oedipus and the Sphinx', fr:'Œdipe et le Sphinx'},
  a:{zh:'摩洛 Moreau', en:'Gustave Moreau'},

  why:{zh:'與安格爾的版本相對照：這裡斯芬克斯用爪子攀上英雄胸口，兩人四目相接。象徵主義不再把神話當歷史場景，而當成慾望與死亡的內在心像——直通後來的佛洛伊德。',

       fr:'À comparer avec Ingres : ici le Sphinx grimpe, griffes plantées, sur la poitrine du héros, et leurs regards se soudent. Le symbolisme cesse de voir dans le mythe une scène historique pour y lire une image intérieure du désir et de la mort — la route qui mène droit à Freud.'} },

/* ─────────────────────────────────────────────────────────────
   BASICS — written for a reader with no background at all.
   Starts from the one question every beginner has: why does
   the same god have two names?
   ───────────────────────────────────────────────────────────── */
const BASICS = {
  oneLine:{
    zh:'最短的答案：<strong class="text-white">希臘神話是原版，羅馬神話是羅馬人接手之後的改編版。</strong>宙斯和朱庇特不是兩位神，是同一位神的希臘名字和羅馬名字。但「只是改個名字」這句話只對了一半——差別在哪裡，就是這一節要慢慢說清楚的事。',
    en:'The shortest answer: <strong class="text-white">Greek myth is the original; Roman myth is what the Romans made of it after they took it over.</strong> Zeus and Jupiter are not two gods — they are the Greek name and the Roman name for one god. But “they just changed the names” is only half true, and the other half is what this section is for.',
    fr:'La réponse la plus brève : <strong class="text-white">le mythe grec est l’original ; le mythe romain est ce que les Romains en ont fait après l’avoir repris.</strong> Zeus et Jupiter ne sont pas deux dieux : ce sont le nom grec et le nom romain d’un même dieu. Mais « ils ont juste changé les noms » n’est vrai qu’à moitié — et l’autre moitié est l’objet de cette section.'},

         en:'The tragedians put myth on stage — Oedipus and Medea become plays in these years — and the Parthenon is built. Myth is simultaneously religion, literature and public art.',
         fr:'Les tragiques portent le mythe à la scène — Œdipe et Médée deviennent des pièces en ces années — et le Parthénon s’élève. Le mythe est à la fois religion, littérature et art public.'} },
    { era:'rome', y:'前 146', ye:'146 BC',
      t:{zh:'羅馬征服希臘', en:'Rome conquers Greece', fr:'Rome conquiert la Grèce'},
      p:{zh:'這是關鍵的轉折點。希臘成為羅馬的行省，大量希臘雕像被運回羅馬，希臘教師成為羅馬貴族子弟的家教。羅馬人在軍事上贏了，卻在文化上被希臘同化——羅馬詩人賀拉斯自己就這樣寫：「被征服的希臘，反過來征服了她粗野的征服者。」',
         en:'The hinge. Greece becomes a Roman province, Greek statues are shipped to Rome by the boatload, and Greek tutors teach the children of the Roman elite. Rome won militarily and was culturally absorbed by the loser — a Roman poet said exactly that himself.',

      p:{zh:'羅馬終於有了自己的國家史詩：特洛伊王子埃涅阿斯逃出焚城、遠渡義大利，成為羅馬人的祖先。這不是希臘故事的翻譯，是羅馬人用希臘材料寫的自家起源。',

         fr:'Rome se dote enfin d’une épopée nationale : le prince troyen Énée fuit la ville en flammes, gagne l’Italie et devient l’ancêtre des Romains. Ce n’est pas la traduction d’un récit grec, c’est Rome écrivant sa propre origine avec des matériaux grecs.'} },
    { era:'rome', y:'後 8', ye:'AD 8',

      p:{zh:'兩百五十則神話被編成一本拉丁文的故事集。它日後成為歐洲畫家的教科書——本圖譜裡超過三分之一的作品，題材都出自這本書。',
         en:'Some 250 myths collected into one Latin storybook. It later becomes the working textbook of European painters — more than a third of the artworks in this atlas take their subject from it.',
         fr:'Quelque 250 mythes réunis en un recueil latin. Il deviendra le manuel de travail des peintres européens — plus d’un tiers des œuvres de cet atlas y puisent leur sujet.'} },
    { era:'mid', y:'約 500–1400', ye:'c. 500–1400',

      p:{zh:'西歐幾乎沒有人讀得懂希臘文了，荷馬因此中斷。但拉丁文一直是教會與學者的語言，所以維吉爾和奧維德活了下來。這一步決定了後面所有事情。',

         fr:'Presque plus personne en Europe occidentale ne lit le grec : Homère sort de la circulation. Mais le latin demeure la langue de l’Église et du savoir, et Virgile comme Ovide survivent. Ce seul fait détermine tout le reste.'} },

  timelineNote:{
    zh:'看完這條時間軸，一個重要的結論就出來了：<strong class="text-white">歐洲人「認識」希臘神話，絕大部分是透過羅馬人的拉丁文轉述。</strong>這就是為什麼西方藝術裡的神幾乎都用羅馬名字。',
    en:'One important conclusion falls out of this timeline: <strong class="text-white">Europe learned Greek mythology overwhelmingly through the Romans’ Latin retelling.</strong> That is why the gods in Western art are almost always called by their Roman names.',
    fr:'Une conclusion importante se dégage de cette chronologie : <strong class="text-white">l’Europe a appris la mythologie grecque essentiellement à travers la version latine des Romains.</strong> D’où les noms romains portés par presque tous les dieux de l’art occidental.'},

  howTook:{
    zh:'羅馬人並不是「抄襲」，也不完全是「翻譯」。在遇到希臘之前，羅馬本來就有自己的神，只是那些神很抽象：祂們是一股力量（拉丁文叫 <em>numen</em>，神威），有名字、有該怎麼拜的規矩，但幾乎<strong class="text-white">沒有故事</strong>——沒有戀愛，沒有吵架，沒有家譜。<br><br>當羅馬人大量接觸希臘文化後，他們做了一件很自然的事：把兩邊性質相近的神配對起來。「我們掌管農作的薩圖恩，就是你們的克洛諾斯」「我們的朱庇特，就是你們的宙斯」。這個做法有個專門的名稱，叫 <em class="text-white">interpretatio romana</em>（羅馬式解釋）。<br><br>如果要打個比方：<strong class="text-white">羅馬人原本只有神明的「名字」和「拜拜的規矩」，希臘人則有一整套精彩的連續劇劇情。羅馬人保留了自己的名字，借用了希臘的劇本。</strong>這就是為什麼今天我們讀到的羅馬神話，故事幾乎都是希臘的，名字卻是拉丁的。',
    en:'The Romans were not plagiarising, and they were not exactly translating either. Before they met the Greeks they already had gods of their own — but those gods were abstract. They were powers (Latin <em>numen</em>), each with a name and a correct way to be worshipped, and almost <strong class="text-white">no stories</strong>: no love affairs, no quarrels, no family tree.<br><br>When Greek culture arrived in bulk, the Romans did something very natural: they paired up gods that resembled each other. “Our Saturn, who looks after the crops, is your Cronus.” “Our Jupiter is your Zeus.” The practice has a name of its own — <em class="text-white">interpretatio romana</em>, Roman interpretation.<br><br>An analogy: <strong class="text-white">the Romans had the names of the gods and the rules for worshipping them; the Greeks had a whole season of gripping drama. The Romans kept their own names and borrowed the Greek scripts.</strong> That is why the Roman mythology we read today has Greek plots and Latin names.',
    fr:'Les Romains ne plagiaient pas, et ne traduisaient pas non plus tout à fait. Avant de rencontrer les Grecs, ils avaient déjà leurs propres dieux — mais abstraits. C’étaient des puissances (le <em>numen</em> latin), chacune avec un nom et une manière correcte de l’honorer, et presque <strong class="text-white">aucun récit</strong> : ni amours, ni querelles, ni généalogie.<br><br>Quand la culture grecque afflua, les Romains firent une chose très naturelle : ils apparièrent les dieux qui se ressemblaient. « Notre Saturne, qui veille sur les moissons, c’est votre Cronos. » « Notre Jupiter, c’est votre Zeus. » Cette pratique porte un nom : l’<em class="text-white">interpretatio romana</em>.<br><br>Une image : <strong class="text-white">les Romains avaient les noms des dieux et les règles du culte ; les Grecs avaient toute une saison de feuilleton passionnant. Les Romains gardèrent leurs noms et empruntèrent les scénarios grecs.</strong> D’où une mythologie romaine aux intrigues grecques et aux noms latins.'},

  diffs:[
    { t:{zh:'神的性格', en:'What the gods are like', fr:'Le caractère des dieux'},
      g:{zh:'像放大版的人。會吃醋、會外遇、會為了面子鬧脾氣。宙斯不斷偷情，赫拉不斷報復——神有缺點，而且缺點就是故事的動力。',
         en:'Like humans writ large. They are jealous, unfaithful, and sulk over wounded pride. Zeus is serially unfaithful, Hera serially vengeful — the gods have flaws, and the flaws are what drive the stories.',
         fr:'Des humains en plus grand. Jaloux, infidèles, boudeurs par orgueil blessé. Zeus trompe sans cesse, Héra se venge sans cesse — les dieux ont des défauts, et ces défauts font avancer les récits.'},
      r:{zh:'原本比較像「職務單位」。重點不是祂的個性，而是儀式有沒有做對：一個字念錯，整場祭典要重來。個性是後來從希臘借過來的。',
         en:'Originally more like offices than personalities. What mattered was not character but whether the ritual was performed correctly — one misspoken word and the whole ceremony had to start again. The personalities were borrowed later, from Greece.',
         fr:'À l’origine, plus des fonctions que des personnalités. L’essentiel n’était pas le caractère mais l’exactitude du rite : un mot mal prononcé, et toute la cérémonie recommençait. Les personnalités furent empruntées plus tard à la Grèce.'} },
    { t:{zh:'神話拿來做什麼', en:'What myth is for', fr:'À quoi sert le mythe'},
      g:{zh:'解釋這個世界。為什麼有四季？因為冥王劫走了穀物女神的女兒。為什麼有苦難？因為潘朵拉打開了甕。神話是古人版本的「為什麼」。',
         en:'To explain the world. Why are there seasons? Because the lord of the dead carried off the grain goddess’s daughter. Why is there suffering? Because Pandora opened the jar. Myth is the ancient version of “why.”',
         fr:'Expliquer le monde. Pourquoi les saisons ? Parce que le maître des morts a enlevé la fille de la déesse des moissons. Pourquoi la souffrance ? Parce que Pandore a ouvert la jarre. Le mythe est la version antique du « pourquoi ».'},
      r:{zh:'證明羅馬該統治世界。埃涅阿斯是維納斯的兒子，羅馬皇帝是埃涅阿斯的後代，所以羅馬的權力來自神。神話在羅馬更接近一份出身證明。',
         en:'To prove that Rome ought to rule. Aeneas was the son of Venus, the emperors descend from Aeneas, therefore Rome’s power comes from the gods. In Rome, myth works more like a certificate of pedigree.',
         fr:'Prouver que Rome doit régner. Énée était fils de Vénus, les empereurs descendent d’Énée, donc le pouvoir de Rome vient des dieux. À Rome, le mythe fonctionne surtout comme un certificat de filiation.'} },
    { t:{zh:'英雄追求什麼', en:'What the hero wants', fr:'Ce que veut le héros'},
      g:{zh:'個人的卓越與不朽的名聲（希臘文 <em>arete</em>）。阿基里斯明知去打仗會死，還是去了，因為他要的是被永遠傳頌。結局常常是悲劇。',
         en:'Personal excellence and undying fame (Greek <em>arete</em>). Achilles knows the war will kill him and goes anyway, because what he wants is to be sung about forever. It usually ends in tragedy.',
         fr:'L’excellence personnelle et la gloire impérissable (le grec <em>areté</em>). Achille sait que la guerre le tuera et y va quand même, parce qu’il veut qu’on le chante à jamais. Cela finit d’ordinaire en tragédie.'},
      r:{zh:'對神、對父親、對國家的責任（拉丁文 <em>pietas</em>）。埃涅阿斯放棄了迦太基女王的愛情，因為他有建國的任務。英雄不是最耀眼的人，是最盡責的人。',
         en:'Duty — to the gods, to one’s father, to the state (Latin <em>pietas</em>). Aeneas gives up the love of the queen of Carthage because he has a nation to found. The hero is not the most dazzling man but the most dutiful one.',
         fr:'Le devoir — envers les dieux, le père, l’État (le latin <em>pietas</em>). Énée renonce à l’amour de la reine de Carthage parce qu’il a une nation à fonder. Le héros n’est pas le plus éclatant mais le plus fidèle à son devoir.'} },
    { t:{zh:'宗教的重心', en:'Where the religion’s weight falls', fr:'Où pèse la religion'},

  why:{
    zh:'最後回到看畫這件事。您站在美術館裡，標籤上寫著《維納斯的誕生》——這是<strong class="text-white">羅馬名字</strong>，因為畫家讀的是拉丁文的奧維德。但畫裡那具身體的比例、站姿與衣褶，來自<strong class="text-white">希臘雕塑</strong>（而且多半是透過羅馬人的複製品輾轉學來的）。<br><br>所以有一句話可以帶著走：<strong class="text-white">名字看羅馬，形體看希臘。</strong>把這一點放在心裡，接下來的章節就不會再混亂了——後面會依序介紹諸神長什麼樣、神話怎麼開始、英雄做了什麼，以及每一則故事被畫成了哪些作品。',
    en:'Finally, back to looking at pictures. You stand in a museum and the label says <em>The Birth of Venus</em> — a <strong class="text-white">Roman name</strong>, because the painter was reading Ovid in Latin. But the proportions, the stance and the fall of the drapery in that body come from <strong class="text-white">Greek sculpture</strong>, mostly learned second-hand through Roman copies.<br><br>So here is one line worth carrying with you: <strong class="text-white">the names are Roman, the bodies are Greek.</strong> Keep that in mind and the rest of this atlas will stay clear — the sections that follow introduce what each god looks like, how the myths begin, what the heroes did, and which artworks each story became.',
    fr:'Revenons enfin au fait de regarder des tableaux. Vous êtes au musée, le cartel indique <em>La Naissance de Vénus</em> — un <strong class="text-white">nom romain</strong>, parce que le peintre lisait Ovide en latin. Mais les proportions, l’attitude et la chute des draperies de ce corps viennent de la <strong class="text-white">sculpture grecque</strong>, apprise le plus souvent de seconde main, par des copies romaines.<br><br>Une phrase à emporter : <strong class="text-white">les noms sont romains, les corps sont grecs.</strong> Gardez-la en tête et la suite restera claire — les sections qui viennent présentent l’aspect de chaque dieu, le commencement des mythes, les exploits des héros, et les œuvres qu’est devenue chaque histoire.'}

{

  eyebrow:{zh:'從混沌到奧林帕斯', en:'From Chaos to Olympus', fr:'Du Chaos à l’Olympe'},

  lead:{zh:'希臘人的宇宙起源沒有全能的造物主，而是一連串的家族政變：每一代統治者都被自己的兒子推翻。這個「以暴力換取秩序」的結構，讓創世故事天生具有戲劇性，也讓後世藝術家有了描繪極端情緒的正當題材。主要文本是赫西俄德的《神譜》（約西元前 700 年），羅馬則由奧維德在《變形記》第一卷改寫。',
       en:'Greek cosmogony has no omnipotent creator, only a chain of family coups: each ruling generation is overthrown by its own son. That structure — order bought with violence — makes the creation story inherently dramatic, and gave later artists a legitimate subject for extreme emotion. The core text is Hesiod’s <em>Theogony</em> (c. 700 BC); Ovid rewrote it in Latin in <em>Metamorphoses</em> I.',

    { t:{zh:'混沌 → 蓋亞 → 烏拉諾斯', en:'Chaos → Gaia → Uranus', fr:'Chaos → Gaïa → Ouranos'},
      p:{zh:'最初是混沌（Chaos，「裂口」），接著出現大地女神蓋亞（羅馬名 Terra），她生出天空烏拉諾斯（Caelus）並與之結合，產下十二泰坦。烏拉諾斯懼怕子女，把他們塞回大地深處；蓋亞於是打造鐮刀，唆使最小的兒子克洛諾斯動手。',
         en:'First came Chaos (“the gap”), then Gaia the earth (Roman Terra), who bore and then coupled with Uranus the sky (Caelus), producing the twelve Titans. Fearing his children, Uranus stuffed them back inside the earth; Gaia forged a sickle and set her youngest son Cronus on him.',
         fr:'D’abord le Chaos (« la béance »), puis Gaïa la terre (Terra chez les Romains), qui enfanta puis épousa Ouranos le ciel (Caelus), d’où les douze Titans. Craignant ses enfants, Ouranos les repoussait dans la terre ; Gaïa forgea une faucille et arma son plus jeune fils, Cronos.'},

    { t:{zh:'克洛諾斯／薩圖恩吞子', en:'Cronus / Saturn devours his children', fr:'Cronos / Saturne dévore ses enfants'},
      p:{zh:'克洛諾斯得知自己也將被兒子推翻，於是逐一吞下新生的孩子。妻子瑞亞用襁褓包住一塊石頭掉包，保住了宙斯。宙斯長大後迫使父親吐出兄姊，率領他們發動十年的泰坦之戰。羅馬人把薩圖恩想像成黃金時代的仁君，每年以農神節（Saturnalia）紀念——同一位神，在希臘是恐怖，在羅馬是懷舊。',
         en:'Warned that a son would overthrow him in turn, Cronus swallowed each newborn. Rhea substituted a stone in swaddling and saved Zeus, who grew up, forced his father to disgorge his siblings and led them through the ten-year Titanomachy. Romans reimagined Saturn as the benign king of a Golden Age, honoured each December at the Saturnalia — the same god read as horror in Greece and as nostalgia in Rome.',
         fr:'Averti qu’un fils le renverserait à son tour, Cronos avalait chaque nouveau-né. Rhéa lui substitua une pierre emmaillotée et sauva Zeus, qui grandit, contraignit son père à recracher ses aînés et mena la Titanomachie, dix ans de guerre. Les Romains firent de Saturne le roi bienveillant d’un Âge d’or, fêté chaque décembre aux Saturnales — dieu d’horreur en Grèce, de nostalgie à Rome.'},

    { t:{zh:'泰坦之戰與巨人之戰', en:'Titanomachy &amp; Gigantomachy', fr:'Titanomachie &amp; Gigantomachie'},
      p:{zh:'奧林帕斯諸神先擊敗泰坦，再擊敗大地所生的巨人族。兩場戰爭在藝術中固定成「秩序戰勝混亂」的模板，任何統治者都能借用：佩加蒙王國用它比喻擊退高盧人，文藝復興君主用它比喻擊退異端。',
         en:'The Olympians defeat first the Titans, then the earth-born Giants. In art both wars harden into a template — order defeating chaos — that any ruler could borrow: Pergamon used it for its victory over the Gauls, Renaissance princes for victory over heresy.',
         fr:'Les Olympiens vainquent d’abord les Titans, puis les Géants nés de la Terre. Dans l’art, ces deux guerres deviennent un schéma — l’ordre vainquant le chaos — que tout pouvoir peut emprunter : Pergame pour sa victoire sur les Galates, les princes de la Renaissance pour la victoire sur l’hérésie.'},
      arts:['pergamon'] },
    { t:{zh:'普羅米修斯、潘朵拉與人類', en:'Prometheus, Pandora and the human race', fr:'Prométhée, Pandore et la race humaine'},
      p:{zh:'泰坦普羅米修斯用泥土造人，又盜火給人類，因而被鎖在高加索山受鷹啄肝之刑。宙斯的報復是送出第一個女人潘朵拉與那只不該打開的甕。這則神話同時是「文明的起源」與「苦難的起源」，並在近代成為科學越界的隱喻——瑪麗・雪萊的《科學怪人》副標題就是「現代的普羅米修斯」。',
         en:'The Titan Prometheus shapes humans from clay and steals fire for them, and is chained to the Caucasus with an eagle at his liver. Zeus retaliates with the first woman, Pandora, and the jar she must not open. The myth is at once an origin of civilization and an origin of suffering — and in the modern age a metaphor for science overreaching: Mary Shelley subtitled <em>Frankenstein</em> “The Modern Prometheus.”',
         fr:'Le Titan Prométhée façonne les hommes dans l’argile et leur vole le feu ; il est enchaîné au Caucase, un aigle au foie. Zeus riposte par la première femme, Pandore, et la jarre à ne pas ouvrir. Le mythe est à la fois origine de la civilisation et origine du malheur — et, à l’époque moderne, métaphore de la science qui outrepasse : Mary Shelley sous-titra <em>Frankenstein</em> « Le Prométhée moderne ».'},
