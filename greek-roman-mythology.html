{
  id:'heroes', icon:'fa-shield-halved', color:'rose',
  eyebrow:{zh:'凡人、怪物與代價', en:'Mortals, Monsters and the Price', fr:'Mortels, monstres et le prix à payer'},
  h2:{zh:'英雄傳說', en:'The Heroic Cycles', fr:'Les cycles héroïques'},
  lead:{zh:'希臘英雄幾乎都是神與凡人所生：擁有超凡能力，卻仍必死。他們追求的是 <em>arete</em>（卓越）與不朽的名聲，而不是道德上的完美——因此海克力斯會發狂殺妻，忒修斯會拋棄救命恩人。正是這種「偉大與缺陷並存」，讓他們兩千年來持續適合被雕刻與繪畫。',
       en:'Greek heroes are almost all children of a god and a mortal: superhuman, yet still bound to die. What they pursue is <em>arete</em> (excellence) and undying fame, not moral perfection — which is why Heracles murders his family in madness and Theseus abandons the woman who saved him. That coexistence of greatness and flaw is exactly what has kept them carvable and paintable for two thousand years.',
       fr:'Les héros grecs sont presque tous nés d’un dieu et d’une mortelle : surhumains, et pourtant voués à mourir. Ils poursuivent l’<em>areté</em> (l’excellence) et une gloire impérissable, non la perfection morale — d’où Héraclès massacrant les siens dans la folie, ou Thésée abandonnant celle qui l’a sauvé. Cette coexistence de la grandeur et du défaut est ce qui les rend sculptables et peignables depuis deux millénaires.'},
  items:[
    { t:{zh:'海克力斯／赫丘利與十二苦差', en:'Heracles / Hercules and the Twelve Labours', fr:'Héraclès / Hercule et les Douze Travaux'},
      p:{zh:'宙斯之子，被赫拉降下瘋狂而殺死妻兒，為贖罪必須完成十二項苦差：尼米亞獅、九頭蛇、金蘋果、擒住地獄犬……他是唯一死後被接納進奧林帕斯的英雄。獅皮與棍棒是他不變的辨識標誌；羅馬將軍、文藝復興公爵到路易十四，都樂於把自己畫成赫丘利。',
         en:'A son of Zeus, driven mad by Hera into killing his wife and children, he must expiate the crime through twelve labours: the Nemean lion, the Hydra, the golden apples, hauling Cerberus out of hell. He is the one hero admitted to Olympus after death. Lion-skin and club are his permanent markers — and Roman generals, Renaissance dukes and Louis XIV all had themselves portrayed as Hercules.',
         fr:'Fils de Zeus, rendu fou par Héra jusqu’à tuer femme et enfants, il doit expier par douze travaux : le lion de Némée, l’Hydre, les pommes d’or, Cerbère traîné hors des Enfers. Seul héros admis à l’Olympe après sa mort. Peau de lion et massue sont ses marques constantes — généraux romains, ducs de la Renaissance et Louis XIV se firent tous portraiturer en Hercule.'},
      arts:['farnese','pollaiuolo_hercules','milky_way'] },
    { t:{zh:'柏修斯與梅杜莎', en:'Perseus and Medusa', fr:'Persée et Méduse'},
      p:{zh:'柏修斯藉雅典娜的鏡盾避開直視，斬下能將人石化的梅杜莎；從她頸中躍出飛馬佩加索斯。返程途中他又救下被獻祭給海怪的安卓美達。「用鏡子看怪物」的細節，讓這則神話成為藝術家談論「觀看與再現」的永恆隱喻。',
         en:'Perseus uses Athena’s mirrored shield to avoid a direct look and beheads Medusa, whose gaze turns men to stone; the winged horse Pegasus springs from her neck. On the way home he rescues Andromeda from a sea-monster. That detail — seeing the monster only as a reflection — has made the myth a permanent metaphor for artists talking about looking and representation.',
         fr:'Persée se sert du bouclier-miroir d’Athéna pour éviter le regard direct et décapite Méduse, dont les yeux pétrifient ; de son cou jaillit Pégase. Au retour, il délivre Andromède d’un monstre marin. Ce détail — ne voir le monstre qu’en reflet — fait du mythe une métaphore durable du regard et de la représentation.'},
      arts:['cellini_perseus','medusa'] },
    { t:{zh:'忒修斯、迷宮與米諾陶洛斯', en:'Theseus, the Labyrinth and the Minotaur', fr:'Thésée, le Labyrinthe et le Minotaure'},
      p:{zh:'雅典每九年須向克里特進貢少年少女餵食牛頭人身的米諾陶洛斯。忒修斯自願前往，靠公主阿里阿德涅的線團走出迷宮——卻在歸途把她丟在納克索斯島。畢卡索在 1930 年代把米諾陶洛斯認領為自己的分身，讓這頭怪物成為二十世紀最重要的神話形象之一。',
         en:'Every nine years Athens had to send youths to Crete to feed the bull-headed Minotaur. Theseus volunteers and escapes the labyrinth by Ariadne’s thread — then abandons her on Naxos on the way home. In the 1930s Picasso adopted the Minotaur as his own alter ego, making the monster one of the twentieth century’s central mythic images.',
         fr:'Tous les neuf ans, Athènes devait livrer des jeunes gens à la Crète pour nourrir le Minotaure à tête de taureau. Thésée s’offre et sort du labyrinthe grâce au fil d’Ariane — qu’il abandonne ensuite à Naxos. Dans les années 1930, Picasso adopta le Minotaure comme alter ego, faisant du monstre l’une des grandes images mythiques du XXᵉ siècle.'},
      arts:['canova_theseus','bacchus_ariadne'] },
    { t:{zh:'伊阿宋、金羊毛與美狄亞', en:'Jason, the Golden Fleece and Medea', fr:'Jason, la Toison d’or et Médée'},
      p:{zh:'伊阿宋率阿爾戈號眾英雄遠航取金羊毛，靠科爾基斯公主美狄亞的巫術成功；日後他為政治聯姻拋棄她，美狄亞的復仇是殺死兩人的孩子。歐里庇得斯的悲劇讓她成為西方文學中最令人不安的女性形象之一。',
         en:'Jason sails with the Argonauts for the Golden Fleece and wins it through the sorcery of the Colchian princess Medea; when he later discards her for a political marriage, her revenge is to kill their children. Euripides’ tragedy made her one of the most disturbing female figures in Western literature.',
         fr:'Jason part avec les Argonautes chercher la Toison d’or et l’obtient grâce à la magie de Médée, princesse de Colchide ; quand il la répudie pour un mariage politique, elle se venge en tuant leurs enfants. La tragédie d’Euripide en a fait l’une des figures féminines les plus troublantes de la littérature occidentale.'},
      arts:['delacroix_medea'] },
    { t:{zh:'俄耳甫斯與歐律狄刻', en:'Orpheus and Eurydice', fr:'Orphée et Eurydice'},
      p:{zh:'歌聲能感動萬物的俄耳甫斯下冥界救亡妻，冥王允許，條件是出口前不可回頭——他回頭了。這是「藝術能否戰勝死亡」的原型故事，也因此成為歌劇誕生時最早的題材（蒙台威爾第《奧菲歐》，1607）。',
         en:'Orpheus, whose song moves stones and beasts, descends to bring back his dead wife; the lord of the dead consents on one condition — do not look back before you are out. He looks. It is the archetypal story of whether art can defeat death, which is why it became the founding subject of opera (Monteverdi’s <em>L’Orfeo</em>, 1607).',
         fr:'Orphée, dont le chant émeut pierres et bêtes, descend chercher son épouse morte ; le maître des Enfers consent à une condition — ne pas se retourner avant la sortie. Il se retourne. Récit archétypal de l’art face à la mort, et pour cela sujet fondateur de l’opéra (<em>L’Orfeo</em> de Monteverdi, 1607).'},
      arts:['corot_orpheus'] },
    { t:{zh:'伊底帕斯與斯芬克斯', en:'Oedipus and the Sphinx', fr:'Œdipe et le Sphinx'},
      p:{zh:'為逃避「弒父娶母」的神諭而離家的伊底帕斯，恰恰因此走上實現神諭的路；途中他解開斯芬克斯之謎而成為底比斯之王。索福克勒斯的劇本是「越掙扎越陷落」的命運悲劇原型，也是佛洛伊德最著名概念的名稱來源。',
         en:'Fleeing an oracle that he will kill his father and marry his mother, Oedipus walks straight into fulfilling it; on the way he answers the Sphinx’s riddle and becomes king of Thebes. Sophocles’ play is the archetype of fate-tragedy — the harder you struggle, the deeper you sink — and the source of Freud’s most famous term.',
         fr:'Fuyant l’oracle qui le dit meurtrier de son père et époux de sa mère, Œdipe court précisément à son accomplissement ; en chemin il résout l’énigme du Sphinx et devient roi de Thèbes. La pièce de Sophocle est l’archétype de la tragédie du destin — plus on se débat, plus on s’enfonce — et la source du terme le plus célèbre de Freud.'},
      arts:['ingres_oedipus','moreau_sphinx'] },
    { t:{zh:'代達羅斯與伊卡洛斯', en:'Daedalus and Icarus', fr:'Dédale et Icare'},
      p:{zh:'建造迷宮的工匠代達羅斯以蠟與羽毛製翼帶兒子逃離克里特，並警告他不可飛得太高。伊卡洛斯忘形接近太陽，蠟融墜海。這是關於「技術的傲慢」最簡潔的寓言，二十世紀的航空與太空時代讓它重新變得鋒利。',
         en:'Daedalus, the craftsman who built the labyrinth, makes wings of wax and feathers to escape Crete with his son, warning him not to fly too high. Icarus soars near the sun, the wax melts, he falls. The tersest fable there is about technological hubris — and the age of flight and spaceflight sharpened it all over again.',
         fr:'Dédale, l’artisan du labyrinthe, fabrique des ailes de cire et de plumes pour fuir la Crète avec son fils, en le prévenant de ne pas monter trop haut. Icare s’approche du soleil, la cire fond, il tombe. La plus concise des fables sur l’orgueil technique — que l’ère de l’aviation et de l’espace a réaffûtée.'},
      arts:['icarus'] }

{
  id:'troy', icon:'fa-chess-rook', color:'sky',
  eyebrow:{zh:'荷馬史詩', en:'The Homeric Epics', fr:'Les épopées homériques'},
  h2:{zh:'特洛伊戰爭與歸鄉', en:'Troy &amp; the Long Way Home', fr:'Troie &amp; le long retour'},
  lead:{zh:'《伊利亞德》只寫戰爭第十年裡的幾十天，《奧德賽》寫一個人回家的十年。兩部史詩定義了西方敘事的兩種基本形狀——戰爭與旅程，也提供了藝術家兩千五百年取用不盡的場景庫。十九世紀，施里曼在土耳其希沙利克丘挖出多層城址，證明這則「神話」底下確實壓著一座真實的城。',
       en:'The <em>Iliad</em> covers a few dozen days in the war’s tenth year; the <em>Odyssey</em> covers one man’s ten-year journey home. Between them the two epics define the two basic shapes of Western narrative — the war and the voyage — and supply a scene-bank artists have drawn on for twenty-five centuries. In the nineteenth century Schliemann dug a stack of city levels at Hisarlik in Turkey, proving a real city lies under the “myth.”',
       fr:'L’<em>Iliade</em> couvre quelques dizaines de jours de la dixième année de guerre ; l’<em>Odyssée</em>, les dix ans du retour d’un homme. Ensemble, elles définissent les deux formes fondamentales du récit occidental — la guerre et le voyage — et fournissent un répertoire de scènes exploité depuis vingt-cinq siècles. Au XIXᵉ siècle, Schliemann exhuma à Hisarlik, en Turquie, une pile de niveaux urbains : une ville réelle dort sous le « mythe ».'},
  items:[
    { t:{zh:'金蘋果與帕里斯的評判', en:'The golden apple and the Judgement of Paris', fr:'La pomme d’or et le Jugement de Pâris'},
      p:{zh:'不和女神厄里斯在婚宴上丟下一顆刻著「獻給最美者」的金蘋果，赫拉、雅典娜與阿芙蘿黛蒂爭執不下。特洛伊王子帕里斯被指派裁決，三位女神各以權力、智慧與最美的女人賄賂他；他選了愛。戰爭由此開始——整場十年浩劫的起因是一場選美。',
         en:'Eris, goddess of discord, throws a golden apple inscribed “to the fairest” into a wedding feast; Hera, Athena and Aphrodite cannot settle it. The Trojan prince Paris is made judge, and the three bribe him with power, wisdom and the most beautiful woman alive. He chooses love, and the war begins — a ten-year catastrophe that starts as a beauty contest.',
         fr:'Éris, déesse de la discorde, jette lors d’un banquet nuptial une pomme d’or gravée « à la plus belle » ; Héra, Athéna et Aphrodite ne peuvent trancher. Le prince troyen Pâris est fait juge ; les trois le corrompent par le pouvoir, la sagesse et la plus belle femme du monde. Il choisit l’amour, et la guerre commence — dix ans de désastre nés d’un concours de beauté.'},
      arts:['rubens_paris'] },
    { t:{zh:'阿基里斯之怒', en:'The wrath of Achilles', fr:'La colère d’Achille'},
      p:{zh:'《伊利亞德》的第一個字就是「憤怒」。阿基里斯因統帥搶走戰利品而罷戰，直到摯友帕特羅克洛斯戰死才復出，殺死赫克托並侮辱其屍。全詩以老王普里阿摩斯夜訪敵營、跪吻殺子仇人的手索回兒子屍體作結——西方文學史上最早的和解場景。',
         en:'The first word of the <em>Iliad</em> is “rage.” Achilles withdraws from the fighting after his commander seizes his prize, returns only when his companion Patroclus is killed, then kills Hector and desecrates his body. The poem ends with old King Priam entering the enemy camp at night to kiss the hands of his son’s killer and beg back the corpse — the earliest scene of reconciliation in Western literature.',
         fr:'Le premier mot de l’<em>Iliade</em> est « colère ». Achille se retire du combat après qu’on lui a pris sa part de butin, ne revient qu’à la mort de son compagnon Patrocle, tue Hector et outrage son cadavre. Le poème s’achève sur le vieux Priam entrant de nuit dans le camp ennemi pour baiser les mains du meurtrier de son fils et réclamer le corps — la première scène de réconciliation de la littérature occidentale.'},
      arts:['exekias','jupiter_thetis'] },
    { t:{zh:'木馬與勞孔', en:'The wooden horse and Laocoön', fr:'Le cheval de bois et Laocoon'},
      p:{zh:'希臘人佯裝撤退，留下巨大的木馬。祭司勞孔投矛示警並說出「我懼怕希臘人，即使他們帶著禮物」，隨即與兩子被海蛇絞殺——特洛伊人因此認定神意要他們收下木馬。維吉爾《埃涅阿斯紀》第二卷把這場毀滅寫成羅馬建國的序曲。',
         en:'The Greeks feign withdrawal and leave a giant wooden horse. The priest Laocoön hurls a spear at it and warns “I fear Greeks even bearing gifts” — and is instantly strangled with his two sons by sea-serpents, which the Trojans read as divine instruction to take the horse in. Book II of Virgil’s <em>Aeneid</em> turns that destruction into the prologue of Rome’s founding.',
         fr:'Les Grecs feignent de partir et laissent un immense cheval de bois. Le prêtre Laocoon y lance un javelot en avertissant : « je crains les Grecs, même porteurs de présents » — et il est aussitôt étouffé avec ses deux fils par des serpents marins, ce que les Troyens prennent pour un ordre divin d’accueillir le cheval. Le chant II de l’<em>Énéide</em> fait de cette destruction le prologue de la fondation de Rome.'},
      arts:['laocoon'] },
    { t:{zh:'奧德修斯的十年航程', en:'The ten-year voyage of Odysseus', fr:'Les dix ans d’errance d’Ulysse'},
      p:{zh:'獨眼巨人、把人變成豬的女巫瑟茜、以歌聲致命的賽壬、卡呂普索的島、冥界之行——最後回到伊薩卡，喬裝成乞丐、以只有自己拉得開的弓射殺追求者。奧德修斯靠的不是力量而是狡智（<em>metis</em>），因此他被視為第一個「現代」主角。',
         en:'The Cyclops, the witch Circe who turns men into pigs, the deadly song of the Sirens, Calypso’s island, a descent to the dead — and finally Ithaca, where he returns disguised as a beggar and kills the suitors with the bow only he can string. Odysseus survives on cunning (<em>metis</em>) rather than strength, which is why he is often called the first “modern” protagonist.',
         fr:'Le Cyclope, la magicienne Circé qui change les hommes en porcs, le chant mortel des Sirènes, l’île de Calypso, une descente chez les morts — puis Ithaque, où il revient déguisé en mendiant et tue les prétendants avec l’arc que lui seul peut bander. Ulysse survit par la ruse (<em>mètis</em>) plutôt que par la force : on en fait souvent le premier protagoniste « moderne ».'},
      arts:['turner_polyphemus','waterhouse_sirens'] },
    { t:{zh:'荷馬本人的神化', en:'The deification of Homer himself', fr:'La divinisation d’Homère'},
      p:{zh:'到了十九世紀，荷馬已不只是詩人，而是整個歐洲文明的象徵性源頭。學界至今爭論「荷馬」是否為單一作者（所謂荷馬問題），但這無損於他在藝術中的地位：他被畫成受女神加冕的祖先。',
         en:'By the nineteenth century Homer was no longer merely a poet but the symbolic source of European civilization itself. Scholars still argue whether “Homer” was one author at all (the Homeric Question) — which has never dented his standing in art, where he is painted as an ancestor crowned by a goddess.',
         fr:'Au XIXᵉ siècle, Homère n’est plus seulement un poète mais la source symbolique de la civilisation européenne. Les savants débattent encore de l’existence d’un auteur unique (la question homérique) — sans jamais entamer son statut dans l’art, où on le peint en ancêtre couronné par une déesse.'},
      arts:['apotheosis_homer'] }
  ]
},
{
  id:'rome', icon:'fa-landmark', color:'lime',
  eyebrow:{zh:'國家如何自我敘述', en:'How a State Tells Its Own Story', fr:'Comment un État se raconte'},
  h2:{zh:'羅馬建國神話與德性典範', en:'Rome’s Foundation Myths &amp; Exempla', fr:'Mythes fondateurs de Rome &amp; exempla'},
  lead:{zh:'羅馬人借用了希臘諸神，卻自己發明了建國故事。與希臘神話關心個人卓越不同，羅馬神話幾乎全部服務於一個問題：<em>羅馬憑什麼統治世界？</em> 因此它的英雄不追求榮耀，而承擔義務（<em>pietas</em>、<em>virtus</em>、<em>gravitas</em>）。這種「以神話論證政權合法性」的做法，後來被歐洲每一個王朝原封不動地繼承。',
       en:'The Romans borrowed the Greek gods but invented their own foundation story. Where Greek myth is preoccupied with individual excellence, Roman myth serves almost entirely one question: <em>by what right does Rome rule the world?</em> Its heroes therefore pursue obligation rather than glory — <em>pietas</em>, <em>virtus</em>, <em>gravitas</em>. Every later European dynasty inherited this technique of arguing legitimacy through myth, essentially unchanged.',
       fr:'Les Romains empruntèrent les dieux grecs mais inventèrent leur propre récit fondateur. Là où le mythe grec s’occupe de l’excellence individuelle, le mythe romain sert presque uniquement une question : <em>de quel droit Rome gouverne-t-elle le monde ?</em> Ses héros poursuivent donc le devoir plutôt que la gloire — <em>pietas</em>, <em>virtus</em>, <em>gravitas</em>. Toutes les dynasties européennes ultérieures ont hérité, presque intacte, de cette technique de légitimation par le mythe.'},
  items:[
    { t:{zh:'埃涅阿斯：從特洛伊到義大利', en:'Aeneas: from Troy to Italy', fr:'Énée : de Troie à l’Italie'},
      p:{zh:'維吉爾《埃涅阿斯紀》（西元前 29–19 年）讓特洛伊王子埃涅阿斯背著父親逃出焚城，歷經迦太基女王狄多的愛情與自殺，最終在義大利落腳，成為羅馬人的祖先。這部史詩是奧古斯都時代的官方敘事：羅馬不是暴發戶，而是特洛伊的合法繼承人，且血緣直通維納斯。',
         en:'Virgil’s <em>Aeneid</em> (29–19 BC) has the Trojan prince Aeneas carry his father out of the burning city, pass through the love and suicide of Dido of Carthage, and settle in Italy as the ancestor of the Romans. The epic is the official narrative of the Augustan age: Rome is no upstart but Troy’s lawful heir, with a bloodline running straight to Venus.',
         fr:'L’<em>Énéide</em> de Virgile (29–19 av. J.-C.) fait porter par le prince troyen Énée son père hors de la ville en flammes, traverser l’amour et le suicide de Didon de Carthage, puis s’établir en Italie comme ancêtre des Romains. L’épopée est le récit officiel de l’âge augustéen : Rome n’est pas une parvenue mais l’héritière légitime de Troie, au sang remontant à Vénus.'},
      arts:['bernini_aeneas','ara_pacis'] },
    { t:{zh:'羅慕勒斯、雷穆斯與母狼', en:'Romulus, Remus and the she-wolf', fr:'Romulus, Rémus et la louve'},
      p:{zh:'戰神馬爾斯與維斯塔貞女所生的雙胞胎被棄於台伯河，由母狼哺育、牧人撫養。成年後兄弟為城牆位置爭執，羅慕勒斯殺死雷穆斯，於西元前 753 年建城並以己名命名。羅馬人從不掩飾建國始於一樁謀殺——這反而成為他們自我形象的一部分。',
         en:'Twins fathered by Mars on a Vestal Virgin are exposed on the Tiber, suckled by a she-wolf and raised by a shepherd. Grown, the brothers quarrel over the line of the city wall; Romulus kills Remus, founds the city in 753 BC and names it for himself. Romans never concealed that their state began in fratricide — it became part of how they saw themselves.',
         fr:'Des jumeaux conçus par Mars avec une vestale sont exposés sur le Tibre, allaités par une louve, élevés par un berger. Adultes, les frères se disputent le tracé du mur ; Romulus tue Rémus, fonde la ville en 753 av. J.-C. et lui donne son nom. Les Romains n’ont jamais dissimulé que leur État commençait par un fratricide — cela faisait partie de leur image d’eux-mêmes.'},
      arts:['capitoline_wolf'] },
    { t:{zh:'劫掠薩賓婦女', en:'The rape of the Sabine women', fr:'L’enlèvement des Sabines'},
      p:{zh:'新城缺乏女性，羅慕勒斯以節慶為名邀請鄰邦薩賓人前來，趁機擄走其婦女。數年後薩賓人來襲，已為人母的薩賓女子衝入兩軍之間，逼使父兄與丈夫和解——兩個民族從此合為一體。這個故事同時是暴力的自白與融合的頌歌。',
         en:'Short of women, Romulus invites the neighbouring Sabines to a festival and seizes theirs. Years later the Sabines attack, and the abducted women — now mothers on both sides — throw themselves between the armies and force fathers and husbands to make peace; the two peoples merge into one. The story is at once a confession of violence and a hymn to assimilation.',
         fr:'À court de femmes, Romulus invite les Sabins voisins à une fête et enlève les leurs. Des années après, les Sabins attaquent : les femmes enlevées, désormais mères des deux camps, se jettent entre les armées et contraignent pères et maris à la paix ; les deux peuples n’en font plus qu’un. Le récit est à la fois aveu de violence et hymne à l’assimilation.'},
      arts:['giambologna_sabine','david_sabines'] },
    { t:{zh:'德性典範：荷拉斯兄弟、盧克蕾提亞、辛辛納圖斯', en:'Exempla virtutis: the Horatii, Lucretia, Cincinnatus', fr:'Exempla virtutis : les Horaces, Lucrèce, Cincinnatus'},
      p:{zh:'李維的《羅馬史》提供一整套道德範例：三兄弟為國決鬥；被強暴的盧克蕾提亞自盡，引發推翻王政、建立共和；辛辛納圖斯受命為獨裁官、擊敗敵人後立刻回去耕田。十八世紀的新古典主義畫家幾乎把這些故事當成革命宣傳品重新啟用。',
         en:'Livy supplies a whole catalogue of moral exempla: three brothers who duel for the state; Lucretia, raped, who takes her own life and triggers the overthrow of the monarchy and the birth of the Republic; Cincinnatus, made dictator, who defeats the enemy and goes straight back to his plough. Eighteenth-century Neoclassical painters reactivated these stories as something close to revolutionary propaganda.',
         fr:'Tite-Live fournit tout un catalogue d’exempla moraux : trois frères qui se battent pour l’État ; Lucrèce, violée, qui se donne la mort et provoque la chute de la royauté et la naissance de la République ; Cincinnatus, fait dictateur, qui bat l’ennemi et retourne aussitôt à sa charrue. Les peintres néoclassiques du XVIIIᵉ siècle réactivèrent ces récits en quasi-propagande révolutionnaire.'},
      arts:['horatii','david_sabines'] },
    { t:{zh:'帝國的神話工程', en:'The empire’s myth engineering', fr:'L’ingénierie mythique de l’Empire'},
      p:{zh:'奧古斯都把家族血統上溯至埃涅阿斯與維納斯，並在和平祭壇、雕像與錢幣上系統性地重複這條線。凱撒死後被正式神化，此後皇帝崇拜成為帝國整合的黏著劑。神話在羅馬不是文學，而是治理技術。',
         en:'Augustus traced his family to Aeneas and thus to Venus, and repeated that line systematically across the Ara Pacis, statuary and coinage. Caesar was formally deified after death, and the imperial cult became the adhesive of an empire. In Rome, myth was not literature but a technology of government.',
         fr:'Auguste faisait remonter sa famille à Énée, donc à Vénus, et répétait systématiquement cette filiation sur l’Ara Pacis, la statuaire et les monnaies. César fut officiellement divinisé après sa mort, et le culte impérial devint le ciment de l’Empire. À Rome, le mythe n’était pas de la littérature mais une technologie de gouvernement.'},
      arts:['prima_porta','ara_pacis'] }
  ]
},
{
  id:'ovid', icon:'fa-feather', color:'emerald',
  eyebrow:{zh:'西方藝術最重要的一本書', en:'The Single Most Useful Book in Western Art', fr:'Le livre le plus utile de l’art occidental'},
  h2:{zh:'奧維德《變形記》與愛情神話', en:'Ovid’s Metamorphoses &amp; the Love Myths', fr:'Les Métamorphoses d’Ovide &amp; les mythes amoureux'},
  lead:{zh:'奧維德在西元 8 年完成的《變形記》串起兩百五十則以「變形」為主軸的故事，從創世一路寫到凱撒化為星辰。它之所以主宰西方藝術，原因很實際：它是拉丁文寫的（中世紀歐洲讀得懂）、故事短而視覺性強（一幅畫就能講完）、而且每一則都提供了描繪裸體、暴力與情慾的正當理由。文藝復興以後，畫家的案頭幾乎必備此書。',
       en:'Ovid finished the <em>Metamorphoses</em> in AD 8: some 250 stories strung on the theme of transformation, from the creation of the world to Caesar turning into a star. Its dominance over Western art has practical causes — it is in Latin (medieval Europe could read it), its episodes are short and intensely visual (one canvas tells one whole story), and each supplies a respectable reason to depict nudity, violence and desire. From the Renaissance on, a copy sat on nearly every painter’s desk.',
       fr:'Ovide acheva les <em>Métamorphoses</em> en 8 apr. J.-C. : quelque 250 récits enfilés sur le thème de la transformation, de la création du monde à César changé en astre. Sa domination sur l’art occidental a des causes très concrètes — le texte est en latin (l’Europe médiévale le lisait), les épisodes sont brefs et intensément visuels (une toile suffit à raconter), et chacun fournit un motif respectable pour peindre la nudité, la violence et le désir. Depuis la Renaissance, presque tout peintre en gardait un exemplaire sur sa table.'},
  items:[
    { t:{zh:'阿波羅與達芙妮', en:'Apollo and Daphne', fr:'Apollon et Daphné'},
      p:{zh:'邱比特以金箭射中阿波羅、鉛箭射中寧芙達芙妮：一個狂戀，一個厭惡。被追至力竭的達芙妮求父親河神救她，於是化為月桂樹。阿波羅折下枝葉為冠——桂冠從此成為詩人與勝利者的標誌，而它的來源是一次未遂的強暴。',
         en:'Cupid shoots Apollo with a golden arrow and the nymph Daphne with a leaden one: one inflamed, one repelled. Run to exhaustion, Daphne begs her river-god father for rescue and becomes a laurel. Apollo breaks off a branch for a wreath — and so the laurel crown of poets and victors originates in an attempted rape.',
         fr:'Cupidon frappe Apollon d’une flèche d’or et la nymphe Daphné d’une flèche de plomb : l’un embrasé, l’autre rebutée. Épuisée par la course, Daphné supplie son père le fleuve et devient laurier. Apollon en rompt un rameau pour s’en couronner — la couronne des poètes et des vainqueurs naît ainsi d’un viol manqué.'},
      arts:['bernini_daphne'] },
    { t:{zh:'納西瑟斯與回音女神', en:'Narcissus and Echo', fr:'Narcisse et Écho'},
      p:{zh:'只能重複他人話語的寧芙厄科愛上納西瑟斯而不得，形銷骨立只餘聲音；納西瑟斯則愛上水中自己的倒影，同樣枯萎而死，原地長出水仙花。兩人各自被困在「只能反射」的處境裡——這是關於再現本質的神話。',
         en:'The nymph Echo, who can only repeat others’ words, loves Narcissus and is refused until nothing is left of her but a voice; Narcissus falls in love with his own reflection and withers likewise, leaving a flower. Both are trapped in pure reflection — a myth about the nature of representation itself.',
         fr:'La nymphe Écho, qui ne peut que répéter les mots d’autrui, aime Narcisse en vain jusqu’à n’être plus qu’une voix ; Narcisse s’éprend de son reflet et dépérit de même, laissant une fleur. Tous deux sont prisonniers du pur reflet — un mythe sur la nature même de la représentation.'},
      arts:['narcissus'] },
    { t:{zh:'宙斯的變形：歐羅巴、達娜厄、麗達', en:'The transformations of Zeus: Europa, Danaë, Leda', fr:'Les métamorphoses de Zeus : Europe, Danaé, Léda'},
      p:{zh:'化為白牛拐走歐羅巴、化為金雨進入被囚的達娜厄、化為天鵝接近麗達。這一組故事在藝術史上數量驚人，原因不難理解：神的變形提供了描繪女性裸體的最佳藉口。因此也正是這批作品，最早被現代批評重新檢視其中的暴力與凝視。',
         en:'A white bull carrying off Europa, a shower of gold entering the imprisoned Danaë, a swan approaching Leda. The sheer number of these pictures is easy to explain: divine transformation was the best available pretext for painting the female nude. Which is also why this group is the first that modern criticism re-examined for its violence and its gaze.',
         fr:'Un taureau blanc enlevant Europe, une pluie d’or pénétrant chez Danaé enfermée, un cygne approchant Léda. L’abondance de ces tableaux s’explique aisément : la métamorphose divine était le meilleur prétexte disponible pour peindre le nu féminin. C’est aussi ce groupe que la critique moderne a réexaminé en premier pour sa violence et son régime du regard.'},
      arts:['titian_europa','rembrandt_danae'] },
    { t:{zh:'黛安娜與阿克泰翁', en:'Diana and Actaeon', fr:'Diane et Actéon'},
      p:{zh:'獵人阿克泰翁無意間撞見沐浴中的黛安娜，女神將他變成一隻鹿，隨即被他自己養的五十隻獵犬撕成碎片。奧維德特別強調：他沒有犯罪，只是「不巧看見」——這是關於偶然、目光與不成比例懲罰的故事。',
         en:'The hunter Actaeon stumbles on Diana bathing; the goddess turns him into a stag and his own fifty hounds tear him apart. Ovid is careful to insist he committed no crime — he merely happened to see. It is a story about accident, the gaze, and punishment out of all proportion.',
         fr:'Le chasseur Actéon surprend Diane au bain ; la déesse le change en cerf et ses propres cinquante chiens le déchirent. Ovide insiste : il n’a commis aucun crime, il a seulement vu par hasard. Récit du hasard, du regard et d’un châtiment sans commune mesure.'},
      arts:['titian_actaeon','diana_versailles'] },
    { t:{zh:'皮格馬利翁與阿拉克涅：藝術家的兩則寓言', en:'Pygmalion and Arachne: two fables about artists', fr:'Pygmalion et Arachné : deux fables sur l’artiste'},
      p:{zh:'雕刻家皮格馬利翁愛上自己的作品，維納斯讓象牙變成活人——藝術的最高夢想。織女阿拉克涅織藝勝過雅典娜，被女神打成蜘蛛——藝術家挑戰神明的下場。兩則故事並置，正好構成西方對「創造」的希望與恐懼。',
         en:'The sculptor Pygmalion loves his own statue and Venus turns ivory into a living woman — art’s highest dream. The weaver Arachne out-weaves Athena and is beaten into a spider — what happens to an artist who challenges the gods. Placed side by side, the two fables map the West’s hope and its fear about making things.',
         fr:'Le sculpteur Pygmalion aime sa propre statue et Vénus change l’ivoire en femme vivante — le rêve suprême de l’art. La tisserande Arachné surpasse Athéna et se voit changée en araignée — le sort de l’artiste qui défie les dieux. Côte à côte, ces deux fables dessinent l’espoir et la peur de l’Occident devant l’acte de créer.'},
      arts:['gerome_pygmalion','las_hilanderas'] },
    { t:{zh:'巴克斯與阿里阿德涅', en:'Bacchus and Ariadne', fr:'Bacchus et Ariane'},
      p:{zh:'被忒修斯拋棄在納克索斯島的阿里阿德涅，遇上返程中的酒神。他一見鍾情、當場求婚，並把她的冠冕拋上天成為星座。在整部《變形記》大量的失去與懲罰之中，這是少數真正圓滿的結局，也因此成為最受歡迎的婚禮題材。',
         en:'Abandoned on Naxos by Theseus, Ariadne meets Bacchus returning from the east. He falls in love on sight, proposes on the spot, and throws her crown into the sky as a constellation. Among the <em>Metamorphoses</em>’ long catalogue of loss and punishment this is one of the few genuinely happy endings — which is why it became a favourite wedding subject.',
         fr:'Abandonnée à Naxos par Thésée, Ariane rencontre Bacchus revenant d’Orient. Il l’aime au premier regard, la demande sur-le-champ et lance sa couronne au ciel en constellation. Dans le long catalogue de pertes et de châtiments des <em>Métamorphoses</em>, c’est l’une des rares fins vraiment heureuses — d’où sa faveur comme sujet nuptial.'},
      arts:['bacchus_ariadne','caravaggio_bacchus'] }
  ]
}

/* ─────────────────────────────────────────────────────────────
   Artwork images — resolved at runtime from Wikipedia.
   Tries the exact article title first, then falls back to a
   search, so a renamed article still yields a picture.
   ───────────────────────────────────────────────────────────── */
const IMG_CACHE = {};
function wikiPage(title) { return 'https://en.wikipedia.org/wiki/' + encodeURIComponent(title.replace(/ /g, '_')); }

function resolveImg(title, size, cb) {
  const key = title + '|' + size;
  if (IMG_CACHE[key] !== undefined) { cb(IMG_CACHE[key]); return; }
  const base = 'https://en.wikipedia.org/w/api.php?format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=' + size;
  const direct = base + '&action=query&titles=' + encodeURIComponent(title);
  const search = base + '&action=query&generator=search&gsrlimit=1&gsrsearch=' + encodeURIComponent(title);
  const thumbOf = d => {
    const pages = d && d.query && d.query.pages;
    const p = pages && Object.values(pages)[0];
    return (p && p.thumbnail && p.thumbnail.source) || null;
  };
  const done = src => { IMG_CACHE[key] = src; cb(src); };
  fetch(direct).then(r => r.json()).then(d => {
    const s = thumbOf(d);
    if (s) { done(s); return; }
    return fetch(search).then(r => r.json()).then(d2 => done(thumbOf(d2)));
  }).catch(() => done(null));
}

/* Lazily fill a thumbnail once it scrolls into view. */
const imgObserver = ('IntersectionObserver' in window)
  ? new IntersectionObserver((entries, obs) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const el = e.target; obs.unobserve(el);
        resolveImg(el.dataset.wiki, 480, src => {
          if (!src) return;
          el.src = src;
          el.addEventListener('load', () => el.classList.add('loaded'), { once: true });
        });
      });
    }, { rootMargin: '250px' })
  : null;

function watchThumbs(root) {
  root.querySelectorAll('img[data-wiki]').forEach(el => {
    if (imgObserver) imgObserver.observe(el);
    else resolveImg(el.dataset.wiki, 480, s => { if (s) { el.src = s; el.classList.add('loaded'); } });
  });
}

/* The order of events inside the myths, forking at the fall of Troy. */
function renderMythTime() {
  const el = document.getElementById('diagram-mythtime');
  if (!el) return;
  const stage = (s, tone) =>
      '<div class="bg-slate-900/40 rounded-2xl border border-slate-800 p-4">'
    +   '<div class="flex items-baseline gap-2.5">'
    +     (s.n ? '<span class="shrink-0 w-6 h-6 rounded-full grid place-items-center text-[0.7rem] font-black"'
    +            + ' style="background:' + tone + ';color:#fff">' + s.n + '</span>' : '')
    +     '<h4 class="text-sm font-bold text-white">' + t(s.t) + '</h4>'
    +   '</div>'
    +   '<p class="text-xs text-slate-400 leading-relaxed mt-2' + (s.n ? ' pl-[2.1rem]' : '') + '">' + t(s.p) + '</p>'
    +   (s.arts && s.arts.length ? '<div class="' + (s.n ? 'pl-[2.1rem]' : '') + '">' + artChips(s.arts) + '</div>' : '')
    + '</div>';
  const arrow = '<div class="grid place-items-center py-1.5 text-slate-700"><i class="fa-solid fa-chevron-down"></i></div>';

  const M = MYTHTIME;
  let html = M.before.map(s => stage(s, 'var(--gr-mark)')).join(arrow);

  html += '<div class="grid place-items-center py-3">'
    +   '<span class="text-[0.7rem] font-bold text-slate-400 bg-slate-900 border border-slate-700 rounded-full px-3 py-1">'
    +     '<i class="fa-solid fa-code-fork mr-1.5 text-amber-500"></i>' + t(M.fork.label) + '</span>'
    + '</div>';

  const branch = (b, tone, ink) =>
      '<div class="rounded-2xl border p-3 space-y-2" style="border-color:' + tone + '55;background:' + tone + '0f">'
    +   '<h4 class="text-xs font-black px-1" style="color:' + ink + '">' + t(b.head) + '</h4>'
    +   b.steps.map(s => stage(s, tone)).join('')
    + '</div>';
  html += '<div class="fork">'
    + branch(M.fork.greek, 'var(--gr-mark)', 'var(--gr-ink)')
    + branch(M.fork.roman, 'var(--ro-mark)', 'var(--ro-ink)')
    + '</div>';

  html += arrow + M.after.map(s => stage(s, 'var(--ro-mark)')).join(arrow);
  html += '<p class="text-sm text-slate-300 leading-relaxed mt-5 bg-slate-900/50 border border-slate-800 rounded-2xl p-4">'
    + t(M.close) + '</p>';
  el.innerHTML = html;
}

/* Where each era sits across the whole span — shows at a glance that
   antiquity and the Middle Ages are enormous and the Renaissance is a sliver. */
function renderBand() {
  const S = -700, E = 2000, SPAN = E - S;
  const pct = y => ((y - S) / SPAN) * 100;
  const tone = r => (r.e <= -30 ? 'var(--gr-mark)' : r.e <= 500 ? 'var(--ro-mark)'
                   : r.e <= 1400 ? 'var(--mid-mark)' : 'var(--bar-mark)');
  document.getElementById('reception-band').innerHTML = RECEPTION.map(r =>
      '<div class="grid grid-cols-[8.5rem_1fr] md:grid-cols-[11rem_1fr] items-center gap-3">'
    +   '<span class="text-[0.7rem] text-slate-400 truncate text-right">' + t(r.era) + '</span>'
    +   '<span class="band"><span class="band-fill" style="left:' + pct(r.s).toFixed(2) + '%;'
    +     'width:' + Math.max(pct(r.e) - pct(r.s), 0.6).toFixed(2) + '%;--seg:' + tone(r) + '"></span></span>'
    + '</div>').join('');
  document.getElementById('reception-scale').innerHTML =
    ['700 BC','1 AD','700','1400','2000'].map(l => '<span>' + l + '</span>').join('');
}

/* Bar chart: when the 51 artworks in this atlas were actually made.
   One series, one hue, counts direct-labelled; the empty medieval bin is
   the point of the chart, so the bin is kept even at zero. */
const ART_BINS = [
  { s:-800, e:-100, l:{zh:'古希臘',        en:'Ancient Greece',    fr:'Grèce antique'} },
  { s:-100, e:500,  l:{zh:'古羅馬',        en:'Ancient Rome',      fr:'Rome antique'} },
  { s:500,  e:1400, l:{zh:'中世紀',        en:'Middle Ages',       fr:'Moyen Âge'} },
  { s:1400, e:1500, l:{zh:'15 世紀',       en:'15th century',      fr:'XVᵉ siècle'} },
  { s:1500, e:1600, l:{zh:'16 世紀',       en:'16th century',      fr:'XVIᵉ siècle'} },
  { s:1600, e:1700, l:{zh:'17 世紀',       en:'17th century',      fr:'XVIIᵉ siècle'} },
  { s:1700, e:1800, l:{zh:'18 世紀',       en:'18th century',      fr:'XVIIIᵉ siècle'} },
  { s:1800, e:1900, l:{zh:'19 世紀',       en:'19th century',      fr:'XIXᵉ siècle'} },
];
function renderArtChart() {
  const dated = Object.values(ARTS).filter(a => typeof a.yr === 'number');
  const counts = ART_BINS.map(b => dated.filter(a => a.yr >= b.s && a.yr < b.e).length);
  const max = Math.max.apply(null, counts) || 1;
  const unit = {zh:'件', en:' works', fr:' œuvres'};
  const chart = document.getElementById('art-chart');
  chart.setAttribute('role', 'img');
  chart.setAttribute('aria-label', ART_BINS.map((b, i) => t(b.l) + ': ' + counts[i] + t(unit)).join(', '));
  chart.innerHTML = ART_BINS.map((b, i) => {
    const n = counts[i];
    return '<div class="bar-row" title="' + esc(t(b.l) + ' — ' + n + t(unit)) + '">'
      + '<span class="text-[0.7rem] text-slate-400 text-right truncate">' + t(b.l) + '</span>'
      + '<span class="bar-track bar-axis">'
      +   (n ? '<span class="bar-fill" style="width:' + ((n / max) * 100).toFixed(1) + '%"></span>' : '')
      + '</span>'
      + '<span class="text-xs font-bold tabular-nums w-6 text-right ' + (n ? 'text-amber-300' : 'text-slate-700') + '">'
      +   n + '</span>'
      + '</div>';
  }).join('');
  const note = {
    zh:'兩件事值得注意。第一，<strong class="text-white">中世紀那一格是零</strong>——不是這本圖譜漏了，而是神話題材在基督教歐洲的一千年間幾乎消失，直到文藝復興才回來。第二，高峰落在<strong class="text-white">十六世紀</strong>，因為印刷術讓奧維德的《變形記》變成畫家人手一本的工具書。（共 ' + dated.length + ' 件；卡比托利歐母狼年代仍有爭議，未列入。）',
    en:'Two things worth noticing. First, <strong class="text-white">the medieval bar is zero</strong> — not an omission but the fact itself: mythological subjects all but vanish for a thousand Christian years and only return with the Renaissance. Second, the peak is the <strong class="text-white">sixteenth century</strong>, when printing turned Ovid’s <em>Metamorphoses</em> into a book every painter owned. (' + dated.length + ' dated works; the Capitoline Wolf is excluded, its date being disputed.)',
    fr:'Deux points à noter. D’abord, <strong class="text-white">la barre médiévale est à zéro</strong> — non par oubli, mais parce que les sujets mythologiques disparaissent presque totalement pendant mille ans chrétiens et ne reviennent qu’à la Renaissance. Ensuite, le sommet est le <strong class="text-white">XVIᵉ siècle</strong>, quand l’imprimerie fit des <em>Métamorphoses</em> d’Ovide un livre que tout peintre possédait. (' + dated.length + ' œuvres datées ; la Louve du Capitole, de datation discutée, est exclue.)'
  };
  document.getElementById('art-chart-note').innerHTML = t(note);
}

function renderCompare() {
  document.getElementById('compare-body').innerHTML = COMPARE.map(c =>
      '<tr>'
    + '<td class="py-3 px-4 font-semibold text-rose-300 align-top whitespace-nowrap">' + t(c.k) + '</td>'
    + '<td class="py-3 px-4 text-slate-400 align-top">' + t(c.g) + '</td>'
    + '<td class="py-3 px-4 text-slate-400 align-top">' + t(c.r) + '</td>'
    + '</tr>').join('');
  document.getElementById('compare-notes').innerHTML =
    COMPARE_NOTES.map(n => '<li>' + t(n) + '</li>').join('');
}

/* ─────────────────────────────────────────────────────────────
   Lightbox
   ───────────────────────────────────────────────────────────── */
function openArt(key) {
  const a = ARTS[key];
  if (!a) return;
  const lb = document.getElementById('lb');
  const body = document.getElementById('lb-body');
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';

  const caption =
      '<div class="p-6">'
    +   '<h3 class="text-lg font-black text-white leading-snug">' + t(a.t) + '</h3>'
    +   '<p class="text-sm text-amber-300 mt-1">' + t(a.a) + ' · ' + t(a.y) + '</p>'
    +   '<p class="text-xs text-slate-500 mt-1">' + t(a.m) + '</p>'
    +   '<div class="mt-5 pt-5 border-t border-slate-800">'
    +     '<span class="text-[0.7rem] uppercase tracking-wider text-slate-500 font-bold">' + ui('lb.why') + '</span>'
    +     '<p class="text-sm text-slate-300 leading-relaxed mt-2">' + t(a.why) + '</p>'
    +   '</div>'
    +   '<a class="inline-flex items-center gap-2 mt-5 text-xs text-sky-400 hover:text-sky-300 transition-colors"'
    +     ' href="' + wikiPage(a.wiki) + '" target="_blank" rel="noopener">'
    +     ui('lb.link') + ' <i class="fa-solid fa-arrow-up-right-from-square text-[0.65rem]"></i></a>'
    + '</div>';

  body.innerHTML = '<div class="px-6 pt-8 pb-2 text-center text-sm text-slate-500">' + ui('lb.loading') + '</div>' + caption;
  resolveImg(a.wiki, 1100, src => {
    if (!lb.classList.contains('open')) return;
    body.innerHTML = (src
      ? '<img src="' + esc(src) + '" alt="' + esc(t(a.t)) + '">'
      : '<div class="px-6 pt-8 pb-2 text-center text-sm text-slate-500">' + ui('lb.none') + '</div>') + caption;
  });
}
function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

/* ─────────────────────────────────────────────────────────────
   Language switching
   ───────────────────────────────────────────────────────────── */
const LANG_BTN_ON  = 'px-2.5 py-1 text-xs font-bold rounded-lg transition-all duration-200 bg-amber-500/15 text-amber-400 border border-amber-500/20';
const LANG_BTN_OFF = 'px-2.5 py-1 text-xs font-bold rounded-lg transition-all duration-200 text-slate-400 hover:text-slate-200';

function setLanguage(lang) {
  if (!I18N[lang]) return;
  LANG = lang;
  localStorage.setItem('kb_lang', lang);

  ['zh','en','fr'].forEach(l => {
    const btn = document.getElementById('lang-' + l);
    if (btn) btn.className = (l === lang) ? LANG_BTN_ON : LANG_BTN_OFF;
  });

  document.title = ui('doc.title').replace(/&amp;/g, '&');
  document.documentElement.lang = (lang === 'zh') ? 'zh-Hant' : lang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = ui(el.dataset.i18n);
    if (v) el.innerHTML = v;
  });

  renderBasics();
  renderTheogony();
  renderMythTime();
  renderPantheon();
  renderCycles();
  renderDecoder();
  renderGallery();
  renderReception();
  renderBand();
  renderArtChart();
  renderCompare();
}

setLanguage(['zh','en','fr'].includes(localStorage.getItem('kb_lang'))
  ? localStorage.getItem('kb_lang') : 'zh');
</script>
