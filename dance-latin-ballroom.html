/* The waltz box step for the leader, seen from above, and the line of dance. */
function diaBox() {
  const L = {
    title:{zh:'華爾滋方步（男步，俯視）與舞程線', en:'The waltz box step (leader, from above) and the line of dance', fr:'Le pas carré de la valse (cavalier, vu de dessus) et la ligne de danse'},
    s:[
      {zh:'1 左腳前進', en:'1 left forward', fr:'1 gauche en avant'},
      {zh:'2 右腳往右旁', en:'2 right to the side', fr:'2 droit sur le côté'},
      {zh:'3 左腳併右腳', en:'3 left closes to right', fr:'3 gauche rejoint le droit'},
      {zh:'4 右腳後退', en:'4 right back', fr:'4 droit en arrière'},
      {zh:'5 左腳往左旁', en:'5 left to the side', fr:'5 gauche sur le côté'},
      {zh:'6 右腳併左腳', en:'6 right closes to left', fr:'6 droit rejoint le gauche'},
    ],
    lod:{zh:'舞程線：沿舞池逆時針前進', en:'Line of dance: anticlockwise round the floor', fr:'Ligne de danse : sens inverse des aiguilles d’une montre'},
    f:{zh:'女步是鏡像：從右腳後退開始', en:'The follower mirrors it, starting right foot back', fr:'La cavalière fait l’inverse, départ pied droit en arrière'},
  };
  /* positions after each step: L foot, R foot; start feet together at bottom */
  const P = [[100, 80, 'L'], [190, 80, 'R'], [160, 80, 'L'], [190, 160, 'R'], [100, 160, 'L'], [130, 160, 'R']];
  let s = `<text x="0" y="22" class="lab">${t(L.title)}</text>
    <rect x="100" y="80" width="90" height="80" fill="none" stroke="#475569" stroke-dasharray="5 4"/>
    <text x="145" y="194" text-anchor="middle" class="sub">${t({zh:'起點：雙腳併攏', en:'Start: feet together', fr:'Départ : pieds joints'})}</text>`;
  P.forEach((p, i) => {
    const col = p[2] === 'L' ? '#fbbf24' : '#f87171';
    s += `<ellipse cx="${p[0]}" cy="${p[1]}" rx="11" ry="18" fill="${col}" fill-opacity="0.35" stroke="${col}" stroke-width="2"/>
      <text x="${p[0]}" y="${p[1] + 5}" text-anchor="middle" class="val">${i + 1}</text>`;
    s += `<text x="250" y="${66 + i * 24}" class="val" style="fill:${col}">${t(L.s[i])}</text>`;
  });
  s += `<text x="250" y="${70 + 6 * 24}" class="sub">${t(L.f)}</text>`;
  /* line of dance: a rounded rectangle with anticlockwise arrows */
  const ox = 600, oy = 50, w = 260, h = 150;
  s += `<rect x="${ox}" y="${oy}" width="${w}" height="${h}" rx="40" fill="none" stroke="#475569"/>`;
  const arr = (x, y, ang) => `<g transform="translate(${x},${y}) rotate(${ang})"><path d="M-12 0 H12 M4 -7 L12 0 L4 7" stroke="#fbbf24" stroke-width="3" fill="none"/></g>`;
  s += arr(ox + w / 2, oy, 180) + arr(ox, oy + h / 2, 90) + arr(ox + w / 2, oy + h, 0) + arr(ox + w, oy + h / 2, -90);
  s += `<text x="${ox + w / 2}" y="${oy + h / 2 + 5}" text-anchor="middle" class="sub">${t(L.lod)}</text>`;
  return `<svg class="dg" viewBox="0 0 900 236" role="img" aria-label="${t(L.title)}">${s}</svg>`;
}

  { type:'h3', t:{zh:'拉丁舞', en:'Latin', fr:'Latines'} },
  { type:'cards', cols:3, items:[
    { i:'fa-circle-notch', t:{zh:'古巴動作（Cuban motion）', en:'Cuban motion', fr:'Mouvement cubain'}, p:{zh:'髖部動作不是刻意扭腰，而是「腳掌壓地 → 膝蓋打直 → 髖自然移到那隻腳上」的結果。', en:'Hip action is not a deliberate wiggle but the result of pressing into the floor, straightening the knee, and letting the hip settle over that leg.', fr:'L’action de hanche n’est pas un déhanché volontaire : elle résulte de la pression dans le sol, du genou qui se tend et de la hanche qui s’installe sur cette jambe.'} },
    { i:'fa-shoe-prints', t:{zh:'腳掌先著地、推地', en:'Ball first, press the floor', fr:'Avant-pied d’abord, pousser le sol'}, p:{zh:'拉丁舞的步伐以前腳掌內側先著地，再放下腳跟，持續把地板往下推。', en:'Latin steps land on the inside of the ball of the foot, then the heel, always pressing into the floor.', fr:'Les pas latins se posent sur l’intérieur de l’avant-pied puis le talon, en poussant constamment dans le sol.'} },
    { i:'fa-grip-lines-vertical', t:{zh:'直膝與線條', en:'Straight legs and lines', fr:'Jambes tendues et lignes'}, p:{zh:'重心腳的膝蓋伸直，腿與手臂延伸出清楚的線條。', en:'The standing knee straightens; legs and arms extend into clear lines.', fr:'Le genou d’appui se tend ; jambes et bras dessinent des lignes nettes.'} },
  ]},
  { type:'h3', t:{zh:'帶領與跟隨', en:'Lead and follow', fr:'Guidage'} },
  { type:'steps', items:[
    { t:{zh:'連結（Connection）', en:'Connection', fr:'Connexion'}, p:{zh:'雙方手臂保持適當張力（像握手時的輕微壓力），訊號才能傳遞。太軟像麵條、太硬像推車都不行。', en:'Both keep gentle tone in the arms, like the pressure of a handshake, so signals can travel. Too soft is a noodle; too stiff is a shopping trolley.', fr:'Les deux gardent un léger tonus dans les bras, comme une poignée de main, pour que les signaux passent. Trop mou, c’est une nouille ; trop raide, un caddie.'} },
    { t:{zh:'帶領從身體出發', en:'Lead from the body', fr:'Guider avec le corps'}, p:{zh:'帶領者先移動自己的重心與軀幹，手只是把訊號傳出去，不是用手拉或推舞伴。', en:'The leader moves their own weight and torso first; the hands transmit, they do not pull or push.', fr:'Le cavalier déplace d’abord son poids et son buste ; les mains transmettent, elles ne tirent ni ne poussent.'} },
    { t:{zh:'跟隨者等待訊號', en:'The follower waits for the lead', fr:'La cavalière attend le signal'}, p:{zh:'不要預測下一步，等訊號到了再動；同時保持自己的平衡與軸心。', en:'Do not anticipate; move when the signal arrives, keeping your own balance and axis.', fr:'Ne pas anticiper : bouger quand le signal arrive, en gardant son propre équilibre et son axe.'} },
    { t:{zh:'準備（Prep）', en:'Preparation', fr:'Préparation'}, p:{zh:'轉圈前，帶領者在前一拍給一個小小的準備動作，讓跟隨者知道「要轉了」。', en:'Before a turn the leader gives a small preparation on the previous beat so the follower knows it is coming.', fr:'Avant un tour, le cavalier donne une petite préparation au temps précédent pour prévenir la cavalière.'} },
  ]},
]},

/* ── 4. Lessons ── */
{ id:'lessons', i:'fa-chalkboard-user', c:P,
  nav:{zh:'基本步教學', en:'Lessons', fr:'Leçons'},
  eyebrow:{zh:'第四章・教學', en:'Chapter 4 · Lessons', fr:'Chapitre 4 · Leçons'},
  h2:{zh:'六支舞的基本步，一拍一拍', en:'Six basic steps, count by count', fr:'Six pas de base, temps par temps'},
  blocks:[
  { type:'dia', k:'box' },
  { type:'counts', t:{zh:'一、華爾滋方步（男步）', en:'1. Waltz box step (leader)', fr:'1. Pas carré de valse (cavalier)'},
    p:{zh:'每拍一步。1 拍腳跟先著地往下（plié），2、3 拍升起到腳掌，3 拍結束時降下，形成「下、上、上、下」的起伏。', en:'One step per beat. Land heel first on 1, lowering; rise onto the balls on 2 and 3, lowering at the end of 3: down, up, up, down.', fr:'Un pas par temps. Talon sur 1 en descendant ; montée sur l’avant-pied en 2 et 3, puis on redescend à la fin du 3 : bas, haut, haut, bas.'},
    items:[
      {n:'1', p:{zh:'左腳前進', en:'Left forward', fr:'Gauche en avant'}},
      {n:'2', p:{zh:'右腳往右旁、升起', en:'Right to the side, rising', fr:'Droit sur le côté, en montant'}},
      {n:'3', p:{zh:'左腳併右腳、降下', en:'Left closes, lowering', fr:'Gauche rejoint, en descendant'}},
      {n:'4', p:{zh:'右腳後退', en:'Right back', fr:'Droit en arrière'}},
      {n:'5', p:{zh:'左腳往左旁、升起', en:'Left to the side, rising', fr:'Gauche sur le côté, en montant'}},
      {n:'6', p:{zh:'右腳併左腳、降下', en:'Right closes, lowering', fr:'Droit rejoint, en descendant'}},
    ]},
  { type:'counts', t:{zh:'二、恰恰基本步（男步，閉式）', en:'2. Cha-cha basic (leader, closed)', fr:'2. Pas de base cha-cha (cavalier, fermé)'},
    p:{zh:'恰恰從第 2 拍開始踏步，「4 & 1」就是「恰恰恰」的三連步（chassé）。初學時第 1 拍可以先做一個準備的側步。', en:'Cha-cha steps start on 2; “4 & 1” is the cha-cha-cha chassé. Beginners can take a preparatory side step on 1.', fr:'Le cha-cha commence sur le 2 ; « 4 et 1 », c’est le chassé « cha-cha-cha ». Au début, faites un pas de côté préparatoire sur le 1.'},
    items:[
      {n:'2', p:{zh:'左腳前進（rock）', en:'Left forward (rock)', fr:'Gauche en avant (rock)'}},
      {n:'3', p:{zh:'重心回右腳', en:'Replace weight on right', fr:'Retour du poids sur le droit'}},
      {n:'4', p:{zh:'左腳往旁', en:'Left to the side', fr:'Gauche sur le côté'}},
      {n:'&', p:{zh:'右腳半併', en:'Right half-closes', fr:'Droit se rapproche'}},
      {n:'1', p:{zh:'左腳往旁', en:'Left to the side', fr:'Gauche sur le côté'}},
      {n:'2', p:{zh:'右腳後退（rock）', en:'Right back (rock)', fr:'Droit en arrière (rock)'}},
      {n:'3', p:{zh:'重心回左腳', en:'Replace on left', fr:'Retour sur le gauche'}},
      {n:'4&1', p:{zh:'往右「恰恰恰」', en:'Cha-cha-cha to the right', fr:'Cha-cha-cha à droite'}},
    ]},
  { type:'counts', t:{zh:'三、倫巴基本步（男步）', en:'3. Rumba basic (leader)', fr:'3. Pas de base rumba (cavalier)'},
    p:{zh:'和恰恰的方向相同，但沒有三連步：第 4 拍踏出、延續到第 1 拍慢慢讓髖部完成動作，所以節奏是「快、快、慢」。', en:'Same pattern as cha-cha without the chassé: step on 4 and let the hip action continue through 1, so the rhythm is quick, quick, slow.', fr:'Même dessin que le cha-cha sans chassé : on pose sur 4 et la hanche termine son action jusqu’au 1 : vite, vite, lent.'},
    items:[
      {n:'2', p:{zh:'左腳前進', en:'Left forward', fr:'Gauche en avant'}},
      {n:'3', p:{zh:'重心回右腳', en:'Replace on right', fr:'Retour sur le droit'}},
      {n:'4–1', p:{zh:'左腳往旁，慢慢完成髖部動作', en:'Left to the side, completing the hip slowly', fr:'Gauche sur le côté, la hanche finit lentement'}},
      {n:'2', p:{zh:'右腳後退', en:'Right back', fr:'Droit en arrière'}},
      {n:'3', p:{zh:'重心回左腳', en:'Replace on left', fr:'Retour sur le gauche'}},
      {n:'4–1', p:{zh:'右腳往旁', en:'Right to the side', fr:'Droit sur le côté'}},
    ]},
  { type:'counts', t:{zh:'四、捷舞基本步（男步，原地換位 fallaway rock）', en:'4. Jive basic (leader, fallaway rock)', fr:'4. Pas de base jive (cavalier, fallaway rock)'},
    p:{zh:'六拍一組：兩個三連步加一個搖滾步。膝蓋保持彈性、腳掌踩地，輕快有彈性。', en:'Six beats: two chassés and a rock step. Springy knees, on the balls of the feet, light and bouncy.', fr:'Six temps : deux chassés et un rock step. Genoux souples, sur l’avant-pied, léger et rebondi.'},
    items:[
      {n:'1&2', p:{zh:'往左三連步：左、右、左', en:'Chassé left: L, R, L', fr:'Chassé à gauche : G, D, G'}},
      {n:'3&4', p:{zh:'往右三連步：右、左、右', en:'Chassé right: R, L, R', fr:'Chassé à droite : D, G, D'}},
      {n:'5', p:{zh:'左腳往後搖（rock back）', en:'Rock back on the left', fr:'Rock arrière sur le gauche'}},
      {n:'6', p:{zh:'重心回右腳', en:'Replace on right', fr:'Retour sur le droit'}},
    ]},
  { type:'counts', t:{zh:'五、Salsa 基本步（on1，男步）', en:'5. Salsa basic (on1, leader)', fr:'5. Pas de base salsa (on1, cavalier)'},
    p:{zh:'第 4、8 拍不踏步，讓身體停頓、重心準備換方向。女生從右腳後退開始做鏡像。', en:'No step on 4 and 8: the body pauses as weight prepares to change direction. The follower mirrors, starting right foot back.', fr:'Pas de pas sur 4 et 8 : le corps marque une pause avant de changer de direction. La cavalière fait l’inverse, départ pied droit en arrière.'},
    items:[
      {n:'1', p:{zh:'左腳前進', en:'Left forward', fr:'Gauche en avant'}},
      {n:'2', p:{zh:'重心回右腳', en:'Replace on right', fr:'Retour sur le droit'}},

      {n:'4', p:{zh:'停（tap 或停住）', en:'Pause', fr:'Pause'}},
      {n:'5', p:{zh:'右腳後退', en:'Right back', fr:'Droit en arrière'}},

      {n:'8', p:{zh:'停', en:'Pause', fr:'Pause'}},
    ]},
  { type:'counts', t:{zh:'六、Bachata 基本步（側步）', en:'6. Bachata basic (side)', fr:'6. Pas de base bachata (latéral)'},
    p:{zh:'每個 tap 時髖部微微往上推（hip pop）。熟練後可以改成前後方向，或加入身體波浪。', en:'On each tap the hip pops slightly up. Once comfortable, try it forward and back or add body waves.', fr:'À chaque tap, la hanche monte légèrement (hip pop). Ensuite, essayez-le avant-arrière ou ajoutez des ondulations.'},
    items:[
      {n:'1', p:{zh:'左腳往左', en:'Left to the left', fr:'Gauche à gauche'}},
      {n:'2', p:{zh:'右腳併左腳', en:'Right closes', fr:'Droit rejoint'}},
      {n:'3', p:{zh:'左腳往左', en:'Left to the left', fr:'Gauche à gauche'}},
      {n:'4', p:{zh:'右腳點地＋髖', en:'Right taps + hip', fr:'Droit tape + hanche'}},
      {n:'5', p:{zh:'右腳往右', en:'Right to the right', fr:'Droit à droite'}},
      {n:'6', p:{zh:'左腳併右腳', en:'Left closes', fr:'Gauche rejoint'}},
      {n:'7', p:{zh:'右腳往右', en:'Right to the right', fr:'Droit à droite'}},
      {n:'8', p:{zh:'左腳點地＋髖', en:'Left taps + hip', fr:'Gauche tape + hanche'}},
    ]},
]},

/* ── 5. Practicalities ── */
{ id:'practical', i:'fa-shoe-prints', c:V,
  nav:{zh:'舞鞋與禮儀', en:'Shoes & etiquette', fr:'Chaussures & étiquette'},
  eyebrow:{zh:'第五章', en:'Chapter 5', fr:'Chapitre 5'},
  h2:{zh:'舞鞋、舞會禮儀與比賽級別', en:'Shoes, social etiquette and competition levels', fr:'Chaussures, étiquette et niveaux de compétition'},
  blocks:[
  { type:'cards', cols:3, items:[
    { i:'fa-shoe-prints', t:{zh:'舞鞋', en:'Shoes', fr:'Chaussures'}, p:{zh:'舞鞋鞋底是麂皮，能在木地板上滑又不會太滑。拉丁女鞋為露趾、跟高 5–7.5 公分；標準舞女鞋為包頭；男鞋拉丁跟較高、標準舞跟較低。初學可先穿低跟的練習鞋。用鋼刷定期刷麂皮，也不要穿舞鞋走到戶外。', en:'Dance shoes have suede soles that slide on wood without being slippery. Women’s Latin shoes are open-toed with 5–7.5 cm heels, Standard shoes closed; men’s Latin heels are higher than Standard. Beginners can start with low-heeled practice shoes. Brush the suede regularly and never wear them outdoors.', fr:'Les chaussures de danse ont une semelle en daim qui glisse sans patiner. Latines femmes : bout ouvert, talon de 5 à 7,5 cm ; standard : bout fermé ; chez les hommes, talon latin plus haut. Au début, des chaussures d’entraînement à talon bas. Brossez le daim et ne sortez jamais avec.'} },
    { i:'fa-handshake', t:{zh:'舞會禮儀', en:'Social etiquette', fr:'Étiquette en soirée'}, p:{zh:'任何人都可以邀舞，被拒絕也沒關係；跳完一首說謝謝。不要在舞池上教別人跳舞。標準舞沿舞程線前進，跳拉丁時待在舞池中央。注意個人衛生與口氣。', en:'Anyone may ask anyone to dance, and a “no” is fine; say thank you after the song. Never teach on the social floor. Standard travels with the line of dance; Latin stays in the middle. Mind hygiene and breath.', fr:'Chacun peut inviter chacun, et un refus n’est pas grave ; on remercie après la danse. On ne donne pas de cours sur la piste. Le standard suit la ligne de danse, les latines restent au centre. Attention à l’hygiène et à l’haleine.'} },
    { i:'fa-medal', t:{zh:'比賽級別', en:'Competition levels', fr:'Niveaux de compétition'}, p:{zh:'常見的業餘分級：新人（Newcomer）→ 銅牌（Bronze）→ 銀牌（Silver）→ 金牌（Gold）→ 公開組（Open），每級規定能用的步法。另有職業組。英國黑池舞蹈節（Blackpool Dance Festival）是全球最著名的國標比賽。', en:'Typical amateur levels: newcomer → bronze → silver → gold → open, each with a syllabus of permitted figures. There are also professional divisions. The Blackpool Dance Festival in England is the world’s most famous ballroom competition.', fr:'Niveaux amateurs courants : débutant → bronze → argent → or → open, chacun avec ses figures autorisées. Il existe aussi des catégories professionnelles. Le festival de Blackpool, en Angleterre, est la compétition la plus célèbre.'} },
  ]},
  { type:'note', p:{
    zh:'雙人舞最常見的困擾是「找不到舞伴」。社交拉丁舞的團體課通常會輪換舞伴，一個人報名完全沒問題；國標舞課程也多半可以單人參加，之後再透過教室或社群配對固定舞伴。',
    en:'The most common worry about partner dance is not having a partner. Social Latin group classes usually rotate partners, so coming alone is completely fine; most ballroom classes accept singles too, and studios or communities help you find a regular partner later.',
    fr:'Le souci le plus fréquent : ne pas avoir de partenaire. En cours collectif de latino social, on change de partenaire, donc venir seul ne pose aucun problème ; la plupart des cours de danse sportive acceptent aussi les inscriptions individuelles, et l’école aide ensuite à trouver un partenaire.'} },
]},
]});
