/* The timing of a pop: tension rises sharply on the beat and releases before the "&". */
function diaPop() {
  const L = {
    title:{zh:'Pop 的時間感：在拍點瞬間收縮，馬上放鬆', en:'Timing a pop: contract sharply on the beat, release at once', fr:'Le timing du pop : contracter net sur le temps, relâcher aussitôt'},
    y:{zh:'肌肉張力', en:'Muscle tension', fr:'Tension'},
  };
  const X0 = 70, W = 800, beats = 8, bw = W / beats, H = 110, base = 170;
  let d = '';
  for (let i = 0; i <= 400; i++) {
    const x = i / 400 * beats;                      /* time in beats */
    const ph = x - Math.floor(x);                   /* phase within the beat */
    const v = Math.exp(-ph * 9) * (ph < 0.02 ? ph / 0.02 : 1);
    d += (i ? ' L' : 'M') + (X0 + x * bw).toFixed(1) + ' ' + (base - v * H).toFixed(1);
  }
  let s = `<text x="0" y="22" class="lab">${t(L.title)}</text>
    <text x="0" y="${base - H / 2}" class="sub">${t(L.y)}</text>
    <line x1="${X0}" y1="${base}" x2="${X0 + W}" y2="${base}" stroke="#475569"/>`;
  for (let b = 0; b < beats; b++) {
    const x = X0 + b * bw;
    s += `<line x1="${x}" y1="${base - H - 6}" x2="${x}" y2="${base + 4}" class="grid"/>`;
    s += `<text x="${x}" y="${base + 22}" text-anchor="middle" class="val">${b + 1}</text>`;
    s += `<text x="${x + bw / 2}" y="${base + 22}" text-anchor="middle" class="sub">&amp;</text>`;
  }
  s += `<path d="${d}" fill="none" stroke="#facc15" stroke-width="3"/>`;
  return `<svg class="dg" viewBox="0 0 900 206" role="img" aria-label="${t(L.title)}">${s}</svg>`;
}

    ['Point', 'Locking', {zh:'手臂伸直、手指指向斜前方，身體同時轉向。', en:'Arm straight, finger pointing to the front diagonal, body turning with it.', fr:'Bras tendu, doigt pointé vers la diagonale, le corps suit.'}],
    ['Wrist roll', 'Locking', {zh:'雙手在身前繞手腕畫圓。', en:'Hands circling at the wrists in front of the body.', fr:'Rotations de poignets devant soi.'}],
    ['Jack', 'House', {zh:'軀幹隨每拍前後或上下起伏，是 House 的「心跳」。', en:'The torso rocks forward-back or up-down on each beat: house’s heartbeat.', fr:'Le buste ondule sur chaque temps : le battement de cœur de la house.'}],
    ['Stomp / Shuffle', 'House', {zh:'一腳踏地另一腳滑出；shuffle 是腳跟腳尖交替的橫移。', en:'Stomp one foot as the other slides; shuffle is a heel-toe travel to the side.', fr:'Un pied frappe, l’autre glisse ; le shuffle se déplace en talon-pointe.'}],
  ]},
]},

/* ── 4. Lessons ── */
{ id:'lessons', i:'fa-chalkboard-user', c:P,
  nav:{zh:'教學', en:'Lessons', fr:'Leçons'},
  eyebrow:{zh:'第四章・教學', en:'Chapter 4 · Lessons', fr:'Chapitre 4 · Leçons'},
  h2:{zh:'六個基本步，一拍一拍拆解', en:'Six foundations, count by count', fr:'Six bases, temps par temps'},
  blocks:[
  { type:'note', p:{
    zh:'所有練習都先在原地做 Down 律動（見舞蹈總覽第五章）4 個八拍熱身。每個動作先用 70–80 BPM 的慢歌練，再換到 90–100 BPM。',
    en:'Warm up every time with four eights of the down groove (see chapter 5 of the overview). Learn each move to a slow 70–80 BPM track, then move up to 90–100 BPM.',
    fr:'Échauffez-vous toujours avec quatre huit de groove « down » (voir le chapitre 5 de la vue d’ensemble). Apprenez chaque pas sur 70–80 BPM, puis passez à 90–100 BPM.'} },
  { type:'counts', t:{zh:'一、Running man（一個八拍，做兩次）', en:'1. Running man (one eight, twice)', fr:'1. Running man (un huit, deux fois)'},
    p:{zh:'重點：落地的腳往後滑時，抬起的腳同時落下，像在跑步機上跑步，身體保持在原地。', en:'Key: as the standing foot slides back, the lifted foot comes down, like running on a treadmill; the body stays in place.', fr:'Clé : quand le pied d’appui glisse en arrière, le pied levé redescend, comme sur un tapis de course ; le corps reste sur place.'},
    items:[
      {n:'&', p:{zh:'右膝抬起', en:'Lift right knee', fr:'Lever le genou droit'}},
      {n:'1', p:{zh:'右腳往前落地，同時左腳往後滑', en:'Right foot down in front as the left slides back', fr:'Pied droit devant au sol, le gauche glisse en arrière'}},
      {n:'&', p:{zh:'左膝抬起，右腳往後滑回中間', en:'Lift left knee, right foot slides back to centre', fr:'Genou gauche levé, pied droit revient au centre'}},
      {n:'2', p:{zh:'左腳往前落地，右腳往後滑', en:'Left foot down in front, right slides back', fr:'Pied gauche devant, le droit glisse en arrière'}},
      {n:'3–4', p:{zh:'重複 1、2', en:'Repeat 1–2', fr:'Répéter 1–2'}},
      {n:'5–6', p:{zh:'重複，手臂前後擺', en:'Repeat, swinging the arms', fr:'Répéter, bras en balancier'}},
      {n:'7', p:{zh:'重複', en:'Repeat', fr:'Répéter'}},
      {n:'8', p:{zh:'雙腳併攏停', en:'Feet together, stop', fr:'Pieds joints, stop'}},
    ]},
  { type:'counts', t:{zh:'二、Six-step（Breaking 地板基本步，每步一拍）', en:'2. Six-step (breaking footwork, one count per step)', fr:'2. Six-step (footwork de breaking, un temps par pas)'},
    p:{zh:'起始姿勢：蹲低、雙手撐地在身體前方，像伏地挺身但臀部抬高。身體以雙手為中心繞一圈，六步後回到原點。先慢慢走，不用跳。', en:'Start crouched with both hands on the floor in front, like a push-up with hips high. The body circles around the hands and returns home after six steps. Walk it slowly at first.', fr:'Départ accroupi, mains au sol devant, comme une pompe fesses hautes. Le corps tourne autour des mains et revient au départ en six pas. Marchez-le lentement d’abord.'},
    items:[
      {n:'1', p:{zh:'右腳跨過左腳前方（交叉）', en:'Right foot crosses in front of the left', fr:'Pied droit croise devant le gauche'}},
      {n:'2', p:{zh:'左腳往後退，右手抬起讓路', en:'Left foot steps back; lift the right hand to let it through', fr:'Pied gauche recule ; la main droite se lève pour le laisser passer'}},
      {n:'3', p:{zh:'右腳往後與左腳並排（像伏地挺身）', en:'Right foot back beside the left (push-up position)', fr:'Pied droit recule à côté du gauche (position de pompe)'}},
      {n:'4', p:{zh:'左腳往前收回，左手抬起讓路', en:'Left foot comes forward; lift the left hand', fr:'Pied gauche revient devant ; la main gauche se lève'}},
      {n:'5', p:{zh:'右腳跨到左腳後方', en:'Right foot steps behind the left', fr:'Pied droit passe derrière le gauche'}},
      {n:'6', p:{zh:'左腳打開回到起始，蹲姿', en:'Left foot opens back to the start, crouched', fr:'Pied gauche s’ouvre, retour au départ, accroupi'}},
      {n:'7–8', p:{zh:'接 baby freeze 或站起來接 toprock', en:'Finish in a baby freeze or stand into toprock', fr:'Finir en baby freeze ou se relever en toprock'}},
    ]},
  { type:'dia', k:'pop' },
  { type:'steps', items:[
    { t:{zh:'三、Pop：分部位練習', en:'3. The pop, part by part', fr:'3. Le pop, partie par partie'}, p:{zh:'前臂：握拳、手肘彎 90°，在每一拍瞬間用力收緊前臂再立刻放鬆。腿：膝蓋微彎，每拍瞬間打直再放鬆。胸：每拍把胸口往前「頂」一下。先各練一個八拍，再三個部位一起，最後配上 Fresno 左右踏步。', en:'Forearms: make fists, elbows at 90°, tense the forearms sharply on each beat and release at once. Legs: knees soft, snap straight on the beat and release. Chest: punch the chest forward on each beat. One eight each, then all three together, then add the side-to-side fresno step.', fr:'Avant-bras : poings fermés, coudes à 90°, contractez net sur chaque temps puis relâchez. Jambes : genoux souples, tendez d’un coup sur le temps puis relâchez. Poitrine : poussez-la vers l’avant à chaque temps. Un huit par partie, puis les trois ensemble, puis ajoutez le fresno.'} },
    { t:{zh:'四、Lock 與 Point 組合', en:'4. Lock and point combo', fr:'4. Combinaison lock et point'}, p:{zh:'1：雙手在胸前握拳往內轉（wrist roll）；2：往前彎腰、雙手停在膝前「鎖」住；3：彈起身、右手指向右上斜前方（point）；4：收回；5–8：換左邊。全程膝蓋保持 Up 律動，表情要開朗。', en:'1: fists roll inwards in front of the chest (wrist roll); 2: bend forward and lock the hands in front of the knees; 3: spring up and point the right hand to the upper right diagonal; 4: recover; 5–8: the left side. Keep an up groove in the knees and a big smile.', fr:'1 : poings qui tournent devant la poitrine (wrist roll) ; 2 : penché en avant, mains verrouillées devant les genoux ; 3 : on se redresse, main droite pointée vers la diagonale haute droite ; 4 : retour ; 5–8 : côté gauche. Gardez un groove « up » et le sourire.'} },
    { t:{zh:'五、House：Jack＋側步', en:'5. House: jack + side walk', fr:'5. House : jack + pas latéral'}, p:{zh:'先在原地做 jack：每拍胸口往前、背往後弓，像波浪一樣連續。穩定後加上側步：1 右腳往右、& 左腳跟上、2 右腳再往右，腳步輕、腳跟腳尖交替轉動。House 的拍子快（約 120–128 BPM），保持放鬆。', en:'Start jacking on the spot: chest forward and back arching on each beat in a continuous wave. Then add a side walk: 1 right foot to the right, & left foot follows, 2 right again, light feet swivelling heel and toe. House is fast (about 120–128 BPM): stay relaxed.', fr:'Jackez sur place : poitrine en avant, dos qui s’arrondit à chaque temps, en vague continue. Puis ajoutez un pas latéral : 1 pied droit à droite, & le gauche suit, 2 encore à droite, pieds légers pivotant talon-pointe. La house est rapide (120–128 BPM) : restez détendu.'} },
    { t:{zh:'六、K-pop 翻跳流程', en:'6. Covering a K-pop routine', fr:'6. Reprendre une choré K-pop'}, p:{zh:'1. 找官方的「鏡像練習影片」（mirrored dance practice）並設 0.75 倍速；2. 把歌分成前奏、主歌、Pre-chorus、副歌、間奏；3. 先學副歌（point choreography），最有成就感；4. 每段先學腳、再學手、最後加頭與表情；5. 錄影與原影片並排比對角度與力度；6. 團體翻跳要對齊隊形與換位路線（formation）。', en:'1. Find the official mirrored dance practice and set 0.75× speed; 2. split the song into intro, verse, pre-chorus, chorus and break; 3. learn the chorus (point choreography) first, the most rewarding part; 4. feet, then arms, then head and face; 5. film yourself and compare side by side for angles and power; 6. in a group, agree formations and traffic paths.', fr:'1. Trouvez la vidéo officielle en miroir (dance practice) à 0,75× ; 2. découpez la chanson : intro, couplet, pré-refrain, refrain, pont ; 3. apprenez d’abord le refrain (point choreography), le plus gratifiant ; 4. pieds, puis bras, puis tête et visage ; 5. filmez-vous et comparez côte à côte angles et énergie ; 6. en groupe, fixez formations et déplacements.'} },
  ]},
  { type:'warn', p:{
    zh:'Breaking 的 freeze、headspin 與 power moves 會把全身重量壓在手腕、肩膀與頸部。先練好手腕與肩膀肌力（伏地挺身、倒立靠牆），在軟墊上、有經驗的人陪同下練；headspin 需要頭套或毛帽。',
    en:'Breaking freezes, headspins and power moves load the whole body onto wrists, shoulders and neck. Build wrist and shoulder strength first (push-ups, wall handstands), practise on mats with an experienced dancer present, and wear a beanie or headspin cap for headspins.',
    fr:'Freezes, headspins et power moves chargent tout le corps sur les poignets, les épaules et la nuque. Renforcez d’abord poignets et épaules (pompes, équilibre contre un mur), travaillez sur tapis avec un danseur expérimenté, et portez un bonnet pour le headspin.'} },
]},

/* ── 5. Culture ── */
{ id:'culture', i:'fa-people-group', c:T,
  nav:{zh:'Cypher 與 Battle', en:'Cyphers & battles', fr:'Cyphers & battles'},
  eyebrow:{zh:'第五章', en:'Chapter 5', fr:'Chapitre 5'},
  h2:{zh:'Cypher、Battle 與街舞禮儀', en:'Cyphers, battles and etiquette', fr:'Cyphers, battles et étiquette'},
  blocks:[
  { type:'cards', cols:3, items:[
    { i:'fa-circle-notch', t:{zh:'Cypher（圍圈即興）', en:'The cypher', fr:'Le cypher'},
      p:{zh:'舞者圍成一圈，輪流進到中間即興。沒有評審，重點是交流與能量。想進場時直接進去，跳完退回圈邊讓下一個人上。', en:'Dancers form a circle and take turns freestyling in the middle. No judges: it is about exchange and energy. Step in when you are ready and step back to the edge when you are done.', fr:'Les danseurs forment un cercle et entrent à tour de rôle improviser au centre. Pas de juges : échange et énergie. Entrez quand vous êtes prêt et reculez au bord une fois fini.'} },
    { i:'fa-trophy', t:{zh:'Battle（對戰）', en:'The battle', fr:'Le battle'},
      p:{zh:'一對一或團體對團體，輪流上場（每輪約 30–60 秒），由評審舉手或投票決定勝負。DJ 臨場放歌，所以考驗的是即興與音樂性。', en:'One-on-one or crew vs crew, taking turns of about 30–60 seconds; judges point or vote for the winner. The DJ chooses the music live, so it tests improvisation and musicality.', fr:'En un contre un ou crew contre crew, des passages de 30 à 60 secondes ; les juges désignent le vainqueur. Le DJ choisit la musique en direct : on teste l’improvisation et la musicalité.'} },
    { i:'fa-gavel', t:{zh:'評審常看的面向', en:'What judges look at', fr:'Ce que regardent les juges'},
      p:{zh:'各比賽標準不同，常見的有：基本功（foundation）、音樂性、技巧與難度、原創性與個人風格、表現力，以及完成度（不失誤）。', en:'It varies by event, but commonly: foundation, musicality, technique and difficulty, originality and personal style, performance, and execution (no mistakes).', fr:'Selon l’événement, souvent : les bases, la musicalité, la technique et la difficulté, l’originalité et le style personnel, la présence, et l’exécution (sans erreur).'} },
  ]},
  { type:'steps', items:[
    { t:{zh:'尊重先驅與文化', en:'Respect the pioneers and the culture', fr:'Respecter les pionniers et la culture'}, p:{zh:'學一個風格時，認識它的創始者與音樂。叫對動作的名字，不要把所有風格都叫做「Hip-hop」。', en:'When you learn a style, learn its creators and its music. Use the right names; not everything is “hip-hop”.', fr:'Apprenez les créateurs et la musique de chaque style. Employez les bons noms : tout n’est pas « hip-hop ».'} },
    { t:{zh:'不要偷招（biting）', en:'Do not bite', fr:'Ne pas copier (biting)'}, p:{zh:'在 battle 中直接照抄別人的招牌動作是大忌。可以學習，但要轉化成自己的版本。', en:'Copying someone’s signature move in a battle is a serious faux pas. Learn from it, then make your own version.', fr:'Reprendre le mouvement signature d’un autre en battle est très mal vu. Inspirez-vous-en, puis créez votre version.'} },
    { t:{zh:'不碰觸對手', en:'No contact', fr:'Pas de contact'}, p:{zh:'挑釁（burn）可以用動作表達，但不能真的碰到對方的身體。', en:'You can “burn” an opponent with gestures but never touch them.', fr:'On peut provoquer (burn) par le geste, jamais toucher l’adversaire.'} },
    { t:{zh:'結束後擁抱或擊掌', en:'Hug or dap afterwards', fr:'Se saluer à la fin'}, p:{zh:'無論輸贏，battle 結束後互相致意。街舞社群很小，今天的對手常是明天的朋友。', en:'Win or lose, acknowledge each other after the battle. The scene is small: today’s opponent is tomorrow’s friend.', fr:'Gagnant ou perdant, on se salue. Le milieu est petit : l’adversaire d’aujourd’hui est l’ami de demain.'} },
  ]},
]},
]});
