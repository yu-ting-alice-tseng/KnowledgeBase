/* The jazz square seen from above: four steps tracing a square, numbered in order. */
function diaSquare() {
  const L = {
    title:{zh:'Jazz square 俯視圖（右腳開始）', en:'The jazz square from above (starting right)', fr:'Le jazz square vu de dessus (départ pied droit)'},
    s:[
      {zh:'1 右腳往前交叉到左腳前', en:'1 right crosses in front of left', fr:'1 droit croise devant le gauche'},
      {zh:'2 左腳往後退', en:'2 left steps back', fr:'2 gauche recule'},
      {zh:'3 右腳往右打開', en:'3 right steps open to the right', fr:'3 droit s’ouvre à droite'},
      {zh:'4 左腳往前回到起點', en:'4 left steps forward to the start', fr:'4 gauche avance au départ'},
    ],
    front:{zh:'↑ 面向觀眾', en:'↑ facing front', fr:'↑ face au public'},
  };
  const pts = [[150, 70, '#fb7185'], [110, 150, '#fcd34d'], [190, 150, '#fb7185'], [110, 70, '#fcd34d']];
  let s = `<text x="0" y="22" class="lab">${t(L.title)}</text>
    <rect x="110" y="70" width="80" height="80" fill="none" stroke="#475569" stroke-dasharray="5 4"/>
    <text x="150" y="52" text-anchor="middle" class="sub">${t(L.front)}</text>`;
  let path = '';
  pts.forEach((p, i) => { path += (i ? ' L' : 'M') + p[0] + ' ' + p[1]; });
  s += `<path d="${path}" fill="none" stroke="#94a3b8" stroke-width="1.5"/>`;
  pts.forEach((p, i) => {
    s += `<ellipse cx="${p[0]}" cy="${p[1]}" rx="11" ry="20" fill="${p[2]}" fill-opacity="0.4" stroke="${p[2]}" stroke-width="2"/>
      <text x="${p[0]}" y="${p[1] + 5}" text-anchor="middle" class="val">${i + 1}</text>`;
    s += `<text x="300" y="${76 + i * 30}" class="val" style="fill:${p[2]}">${t(L.s[i])}</text>`;
  });
  s += `<text x="300" y="${76 + 4 * 30}" class="sub">${t({zh:'粉色＝右腳，黃色＝左腳', en:'Pink = right foot, yellow = left foot', fr:'Rose = pied droit, jaune = pied gauche'})}</text>`;
  return `<svg class="dg" viewBox="0 0 900 210" role="img" aria-label="${t(L.title)}">${s}</svg>`;
}

    { t:{zh:'Pas de bourrée', en:'Pas de bourrée', fr:'Pas de bourrée'}, p:{zh:'1：右腳踏到左腳後方；&：左腳往左旁踏；2：右腳往前踏。數成「1 & 2」，重心在三步間流動，身體保持在同一高度。', en:'1: right steps behind the left; &: left steps to the side; 2: right steps in front. “1 & 2”, the weight flowing through the three steps at an even height.', fr:'1 : droit derrière le gauche ; & : gauche sur le côté ; 2 : droit devant. « 1 et 2 », le poids passant d’un pied à l’autre à hauteur constante.'} },
    { t:{zh:'爵士 Pirouette', en:'Jazz pirouette', fr:'Pirouette jazz'}, p:{zh:'和芭蕾類似，但常用平行 passé（膝蓋朝前）。準備：四位 plié、手在一位與二位；推地 relevé、腳尖拉到膝蓋旁、手收到胸前、頭定點。先練外轉（en dehors，往支撐腳的反方向），再練內轉。', en:'As in ballet, but often in parallel passé (knee forward). Prepare in fourth plié, arms in first and second; push to relevé, toe to the knee, arms close to the chest, spot. Learn outside turns (en dehors) first, then inside.', fr:'Comme en classique, mais souvent en passé parallèle (genou vers l’avant). Préparation en quatrième pliée, bras en première et seconde ; relevé, pointe au genou, bras fermés, repère. Tours en dehors d’abord, puis en dedans.'} },
    { t:{zh:'Chassé 接 Leap', en:'Chassé into a leap', fr:'Chassé et grand saut'}, p:{zh:'沿教室對角線：右腳 chassé（1 & 2）、左腳往前踏、右腳踢出向前大跳，後腳同時往後延伸，左腳落地 plié 緩衝。先求高度與落地安全，劈腿角度慢慢加大。', en:'Along the diagonal: chassé with the right (1 & 2), step forward on the left, throw the right leg forward into the leap while the back leg extends, land on the left in plié. Height and safe landing first; the split will come.', fr:'En diagonale : chassé du droit (1 et 2), pas du gauche, jambe droite lancée dans le saut pendant que l’arrière s’allonge, réception sur le gauche en plié. D’abord la hauteur et une réception sûre ; l’écart viendra.'} },
  ]},
