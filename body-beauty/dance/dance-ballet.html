/* The five positions of the feet seen from above, fully turned out.
   Each foot is drawn from its heel; the front foot is the right one. */
function diaFeet() {
  const L = {
    title:{zh:'腳的五個位置（俯視，完全外開）', en:'The five positions of the feet (from above, fully turned out)', fr:'Les cinq positions des pieds (vue de dessus, en dehors complet)'},
    front:{zh:'前腳＝右腳（粉色）', en:'Front foot = right (pink)', fr:'Pied avant = droit (rose)'},
    n:[
      {zh:'一位：腳跟併攏', en:'1st: heels together', fr:'1re : talons joints'},
      {zh:'二位：腳跟相距一腳', en:'2nd: a foot apart', fr:'2e : un pied d’écart'},
      {zh:'三位：腳跟靠足弓', en:'3rd: heel to arch', fr:'3e : talon au cou-de-pied'},
      {zh:'四位：前後相距一腳', en:'4th: a foot apart, front-back', fr:'4e : un pied d’écart, devant-derrière'},
      {zh:'五位：腳跟對腳尖', en:'5th: heel to toe', fr:'5e : talon contre orteils'},
    ],
  };
  const FL = 54, FW = 20;
  /* foot from heel (x,y) pointing dir (+1 right, -1 left) */
  const foot = (x, y, dir, front) => {
    const cx = x + dir * FL / 2, col = front ? '#f9a8d4' : '#c4b5fd';
    return `<ellipse cx="${cx}" cy="${y}" rx="${FL / 2}" ry="${FW / 2}" fill="${col}" fill-opacity="0.35" stroke="${col}" stroke-width="2"/>
      <circle cx="${x + dir * (FL - 8)}" cy="${y}" r="5" fill="${col}"/>`;
  };
  const cell = (i, inner) => {
    const ox = 10 + i * 178;
    return `<g transform="translate(${ox},40)"><rect width="168" height="170" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(148,163,184,0.2)"/>${inner}
      <text x="84" y="158" text-anchor="middle" class="val">${t(L.n[i])}</text></g>`;
  };
  const c = 84, y = 70;
  let s = `<text x="0" y="22" class="lab">${t(L.title)}</text>`;
  s += cell(0, foot(c - 2, y, -1, false) + foot(c + 2, y, 1, true));
  s += cell(1, foot(c - 18, y, -1, false) + foot(c + 18, y, 1, true));
  s += cell(2, foot(c + 16, y - 12, -1, false) + foot(c + 16 - FL / 2, y + 12, 1, true));
  s += cell(3, foot(c + FL / 2, y - 30, -1, false) + foot(c - FL / 2, y + 32, 1, true));
  s += cell(4, foot(c + FL / 2, y - 12, -1, false) + foot(c - FL / 2, y + 12, 1, true));
  s += `<text x="0" y="236" class="sub">${t(L.front)}</text>`;
  return `<svg class="dg" viewBox="0 0 900 246" role="img" aria-label="${t(L.title)}">${s}</svg>`;
}

    ['Dégagé / Jeté', {zh:'放開／拋出', en:'Disengaged / thrown', fr:'Dégagé / jeté'}, {zh:'如 tendu 但腳尖離地約 5–10 公分，快速而乾淨。', en:'Like a tendu but the toes leave the floor by 5–10 cm, quick and clean.', fr:'Comme un tendu, mais la pointe quitte le sol de 5 à 10 cm, vif et net.'}],
    ['Rond de jambe', {zh:'腿畫圓', en:'Circle of the leg', fr:'Rond de jambe'}, {zh:'腳尖在地面或空中畫半圓，往前畫為 en dehors，往後為 en dedans。', en:'The toe draws a half-circle on the floor or in the air: front to back is en dehors, back to front en dedans.', fr:'La pointe trace un demi-cercle au sol ou en l’air : d’avant en arrière en dehors, l’inverse en dedans.'}],
    ['Fondu', {zh:'融化', en:'Melted', fr:'Fondu'}, {zh:'支撐腿與動作腿同時彎曲再同時伸直，柔軟而連貫。', en:'Supporting and working legs bend together and stretch together, smooth and continuous.', fr:'Jambe d’appui et jambe de travail plient et s’étirent ensemble, fondu et continu.'}],
    ['Frappé', {zh:'敲擊', en:'Struck', fr:'Frappé'}, {zh:'動作腳從腳踝位置（sur le cou-de-pied）快速踢出、腳尖輕擦地板。', en:'The working foot strikes out sharply from the ankle (sur le cou-de-pied), brushing the floor.', fr:'Le pied part vivement du cou-de-pied en frappant le sol.'}],
    ['Développé', {zh:'展開', en:'Unfolded', fr:'Développé'}, {zh:'腳經過 retiré 慢慢展開到空中，考驗控制與高度。', en:'The leg unfolds slowly through retiré into the air; a test of control and height.', fr:'La jambe se déplie lentement en passant par le retiré ; contrôle et hauteur.'}],
    ['Grand battement', {zh:'大踢腿', en:'Big beat', fr:'Grand battement'}, {zh:'腿有力地踢高再控制地放下，上半身保持不動。', en:'The leg is thrown high and lowered with control, the upper body still.', fr:'La jambe est lancée haut puis redescend avec contrôle, buste immobile.'}],
    ['Relevé', {zh:'升起', en:'Raised', fr:'Relevé'}, {zh:'踮起到半腳尖（demi-pointe）或足尖。', en:'Rising to the balls of the feet (demi-pointe) or to pointe.', fr:'Montée sur demi-pointes ou sur pointes.'}],
    ['Retiré / Passé', {zh:'收回／經過', en:'Withdrawn / passed', fr:'Retiré / passé'}, {zh:'動作腳尖貼在支撐腿膝蓋旁，形成三角形，是旋轉的標準姿勢。', en:'The working toe at the side of the supporting knee, forming a triangle: the standard turning position.', fr:'La pointe au niveau du genou d’appui, en triangle : la position de tour.'}],
    ['Pirouette', {zh:'旋轉', en:'Spin', fr:'Pirouette'}, {zh:'單腳以 retiré 姿勢旋轉一圈以上。', en:'Turning one or more times on one leg in retiré.', fr:'Tour sur une jambe en retiré, une fois ou plus.'}],
    ['Arabesque', {zh:'阿拉伯花紋', en:'Arabesque', fr:'Arabesque'}, {zh:'單腳站立，另一腿向後伸直抬起，手臂延伸出一條長線。', en:'Standing on one leg, the other extended straight behind, arms prolonging the line.', fr:'Sur une jambe, l’autre tendue derrière, les bras prolongeant la ligne.'}],
    ['Attitude', {zh:'姿態', en:'Attitude', fr:'Attitude'}, {zh:'類似 arabesque，但抬起的腿膝蓋彎曲約 90°。', en:'Like an arabesque but with the raised knee bent at about 90°.', fr:'Comme une arabesque, genou levé plié à environ 90°.'}],
    ['Sauté / Changement', {zh:'跳／交換', en:'Jumped / change', fr:'Sauté / changement'}, {zh:'雙腳跳起；changement 在空中從五位交換前後腳。', en:'A jump from both feet; changement swaps the front foot in the air from fifth.', fr:'Saut sur deux pieds ; le changement inverse les pieds en l’air depuis la cinquième.'}],
    ['Glissade / Assemblé / Jeté', {zh:'滑／集合／拋', en:'Glide / assembled / thrown', fr:'Glissade / assemblé / jeté'}, {zh:'小跳三兄弟：滑步連接、單腳起雙腳落、單腳起換腳落。', en:'Three small jumps: a gliding link, one foot to two, one foot to the other.', fr:'Trois petits sauts : liaison glissée, d’un pied sur deux, d’un pied sur l’autre.'}],

  ]},

/* ── 5. Class ── */
{ id:'class', i:'fa-list-ol', c:S,

  blocks:[

    zh:'不論在哪個國家、哪個程度，芭蕾課的順序幾乎相同：從小動作到大動作、從慢到快、從扶把桿到離開把桿、從地面到空中。一堂成人課約 75–90 分鐘。',
    en:'In every country and at every level, a ballet class follows almost the same order: small to large, slow to fast, holding the barre to free-standing, ground to air. An adult class lasts about 75–90 minutes.',
    fr:'Partout et à tous les niveaux, le cours suit presque le même ordre : du petit au grand, du lent au rapide, de la barre au milieu, du sol à l’air. Un cours adulte dure environ 75 à 90 minutes.'} },
  { type:'steps', items:[

    { t:{zh:'中間練習（Centre）', en:'Centre', fr:'Milieu'}, p:{zh:'離開把桿重做 tendu 與 adagio，練習 port de bras 與平衡。', en:'Away from the barre: tendus and adagio again, port de bras and balances.', fr:'Sans barre : tendus et adage, ports de bras et équilibres.'} },
    { t:{zh:'旋轉', en:'Turns', fr:'Tours'}, p:{zh:'從 quarter turn、半圈、到單圈與雙圈 pirouette，以及 chaînés 連續轉。', en:'From quarter and half turns to single and double pirouettes, and chaînés.', fr:'Des quarts et demi-tours aux pirouettes simples et doubles, et les chaînés.'} },
    { t:{zh:'小跳（Petit allegro）', en:'Petit allegro', fr:'Petit allegro'}, p:{zh:'sauté、changement、échappé、glissade、assemblé 組合。', en:'Sautés, changements, échappés, glissades and assemblés.', fr:'Sautés, changements, échappés, glissades et assemblés.'} },

    { t:{zh:'謝禮（Révérence）', en:'Révérence', fr:'Révérence'}, p:{zh:'以優雅的行禮向老師與伴奏致謝，結束課程。', en:'A graceful bow to thank the teacher and pianist, closing the class.', fr:'Un salut gracieux pour remercier le professeur et le pianiste.'} },
  ]},

/* ── 6. Lessons ── */
{ id:'lessons', i:'fa-chalkboard-user', c:R,
  nav:{zh:'教學', en:'Lessons', fr:'Leçons'},
  eyebrow:{zh:'第六章・教學', en:'Chapter 6 · Lessons', fr:'Chapitre 6 · Leçons'},
  h2:{zh:'在家可以做的把桿組合與旋轉練習', en:'Barre combinations and turn practice at home', fr:'Enchaînements à la barre et tours à la maison'},
  blocks:[
  { type:'note', p:{
    zh:'用一張穩固的椅背或流理台當把桿，左手輕扶（不要靠上去），先做右腳，再轉身做另一邊。音樂選 3/4 拍的慢華爾滋做 plié，4/4 拍做 tendu。',

    fr:'Une chaise solide ou un plan de travail font office de barre ; main gauche posée sans s’appuyer. Côté droit, puis on se retourne. Une valse lente à 3/4 pour les pliés, du 4/4 pour les tendus.'} },
  { type:'counts', t:{zh:'組合一：一位 Plié（兩個八拍，再於二位重做）', en:'Combination 1: pliés in first (two eights, then repeat in second)', fr:'Enchaînement 1 : pliés en première (deux huit, puis en seconde)'},

    items:[

      {n:'5–6', p:{zh:'Demi-plié 下', en:'Demi-plié down', fr:'Demi-plié, descendre'}},
      {n:'7–8', p:{zh:'伸直上來', en:'Stretch up', fr:'Remonter'}},
      {n:'1–4', p:{zh:'Grand plié 慢慢下', en:'Grand plié, slowly down', fr:'Grand plié, descendre lentement'}},
      {n:'5–8', p:{zh:'經 demi-plié 推地上來', en:'Push up through demi-plié', fr:'Remonter en passant par le demi-plié'}},
      {n:'1–4', p:{zh:'身體往前彎（port de bras forward）', en:'Bend forward (port de bras)', fr:'Port de bras en avant'}},
      {n:'5–8', p:{zh:'回正、relevé 平衡', en:'Return, rise to relevé and balance', fr:'Revenir, relevé et équilibre'}},
    ]},
  { type:'counts', t:{zh:'組合二：五位 Tendu（十字方向，en croix）', en:'Combination 2: tendus from fifth (en croix)', fr:'Enchaînement 2 : tendus en croix depuis la cinquième'},
    p:{zh:'往前、旁、後、旁各兩次，每次 1 拍出、1 拍收。腳尖出去時先經過腳跟、再到腳掌、最後腳尖；收回時順序相反。', en:'Front, side, back, side, twice each, one count out and one in. Going out, peel through heel, ball and toe; coming back, the reverse.', fr:'Devant, côté, derrière, côté, deux fois chacun : 1 temps pour sortir, 1 pour fermer. En sortant, talon, demi-pointe puis pointe ; l’inverse en rentrant.'},
    items:[
      {n:'1', p:{zh:'往前出', en:'Out front', fr:'Devant'}},
      {n:'2', p:{zh:'收五位', en:'Close fifth', fr:'Fermer en 5e'}},
      {n:'3', p:{zh:'往前出', en:'Out front', fr:'Devant'}},
      {n:'4', p:{zh:'收五位', en:'Close', fr:'Fermer'}},
      {n:'5', p:{zh:'往旁出', en:'Out to the side', fr:'À la seconde'}},
      {n:'6', p:{zh:'收後五位', en:'Close fifth behind', fr:'Fermer derrière'}},
      {n:'7', p:{zh:'往旁出', en:'Side', fr:'Seconde'}},
      {n:'8', p:{zh:'收前五位', en:'Close in front', fr:'Fermer devant'}},
    ]},
  { type:'h3', t:{zh:'第一個 Pirouette：分解教學', en:'Your first pirouette, broken down', fr:'Première pirouette, décomposée'} },
  { type:'steps', items:[
    { t:{zh:'練 retiré 平衡', en:'Balance in retiré', fr:'Équilibre en retiré'}, p:{zh:'扶把桿，從五位 relevé 把前腳拉到膝蓋旁，放開手平衡 4 拍。每天練到能穩定 8 拍。', en:'At the barre, rise from fifth and draw the front foot to the knee; let go and balance for 4 counts. Build to a steady 8.', fr:'À la barre, relevé depuis la cinquième et pied avant au genou ; lâchez et tenez 4 temps. Visez 8 temps stables.'} },
    { t:{zh:'準備姿勢：四位 plié', en:'Preparation: fourth position plié', fr:'Préparation : plié en quatrième'}, p:{zh:'右腳在前、左腳在後的四位，兩腳都 plié，重心偏前腳；右手在一位、左手在二位。', en:'Fourth position, right foot front, both knees bent, weight towards the front foot; right arm in first, left in second.', fr:'Quatrième, pied droit devant, les deux genoux pliés, poids vers l’avant ; bras droit en première, gauche en seconde.'} },
    { t:{zh:'練四分之一圈與半圈', en:'Quarter and half turns', fr:'Quarts et demi-tours'}, p:{zh:'從四位推地，後腳直接拉到 retiré、同時 relevé，左手合到一位，轉向右邊 90°，再到 180°。眼睛先盯鏡子，頭最後轉走。', en:'Push off from fourth, draw the back foot straight to retiré as you rise, close the left arm to first and turn 90° to the right, then 180°. Keep the eyes on the mirror; the head goes last.', fr:'Poussez depuis la quatrième, montez le pied arrière en retiré en relevé, fermez le bras gauche en première et tournez de 90° à droite, puis 180°. Le regard reste sur le miroir ; la tête part en dernier.'} },
    { t:{zh:'完整一圈', en:'The full turn', fr:'Le tour complet'}, p:{zh:'同樣準備，轉滿 360°，頭快速甩回盯住同一點。結束時控制地落到後五位或四位 plié，不要「掉」下來。', en:'Same preparation, a full 360°, whipping the head round to the same spot. Finish with control in fifth behind or a fourth-position plié; do not drop out of it.', fr:'Même préparation, 360° complets, la tête revenant vite au même point. Finissez contrôlé en cinquième derrière ou en plié quatrième, sans « tomber ».'} },
  ]},
  { type:'warn', p:{
    zh:'常見錯誤：用腳掌硬轉外開（膝蓋會扭傷）、翹臀或塌腰、在 relevé 時腳踝往外倒（sickling）、聳肩。寧可外開小一點、位置正確。',
    en:'Common mistakes: forcing turnout from the feet (it strains the knees), sticking out the bottom or arching the back, ankles rolling out on relevé (sickling), raised shoulders. Better less turnout and correct placement.',
    fr:'Erreurs courantes : forcer l’en-dehors par les pieds (les genoux en souffrent), fesses sorties ou dos cambré, cheville qui « faucille » en relevé, épaules remontées. Mieux vaut moins d’en-dehors et un bon placement.'} },
]},

  blocks:[
  { type:'lead', p:{
    zh:'足尖鞋不是靠鞋子撐起來，而是靠腳踝、足弓、小腿與核心的力量。兒童通常要接受 3–4 年、每週數堂的訓練，骨骼發育足夠（多在 11–12 歲以後）才開始。成人學員也必須由老師評估，常見的準備測試包括：單腳連續 relevé 16–25 下不掉高度、retiré 平衡穩定、plié 時腳不內倒。',
    en:'Pointe shoes do not hold you up: ankles, arches, calves and core do. Children usually train for 3–4 years, several classes a week, and start once their bones are mature enough (often after 11–12). Adult students also need a teacher’s assessment; common readiness tests include 16–25 single-leg relevés without losing height, a steady retiré balance, and feet that do not roll in during plié.',

    { i:'fa-gifts', t:{zh:'《胡桃鉗》', en:'The Nutcracker', fr:'Casse-Noisette'}, tag:{zh:'柴可夫斯基・1892', en:'Tchaikovsky · 1892', fr:'Tchaïkovski · 1892'}, p:{zh:'聖誕節必演，〈糖梅仙子之舞〉與各國舞蹈組曲是入門最好的作品。', en:'A Christmas staple; the Sugar Plum Fairy and the national dances are the perfect first ballet.', fr:'Incontournable de Noël ; la Fée Dragée et les danses nationales en font le ballet idéal pour commencer.'} },
    { i:'fa-moon', t:{zh:'《吉賽兒》', en:'Giselle', fr:'Giselle'}, tag:{zh:'亞當・1841', en:'Adam · 1841', fr:'Adam · 1841'}, p:{zh:'浪漫芭蕾代表作，第二幕的幽靈群舞（Wilis）展現輕盈與哀傷。', en:'The great Romantic ballet; the ghostly Wilis of Act II embody weightlessness and sorrow.', fr:'Le grand ballet romantique ; les Wilis de l’acte II incarnent légèreté et tristesse.'} },
    { i:'fa-crown', t:{zh:'《睡美人》', en:'The Sleeping Beauty', fr:'La Belle au bois dormant'}, tag:{zh:'柴可夫斯基・1890', en:'Tchaikovsky · 1890', fr:'Tchaïkovski · 1890'}, p:{zh:'古典芭蕾技巧的百科全書，〈玫瑰慢板〉考驗長時間的單腳平衡。', en:'An encyclopaedia of classical technique; the Rose Adagio tests long balances on one leg.', fr:'Une encyclopédie de la technique ; l’Adage à la rose éprouve les longs équilibres.'} },
