/* Doris Humphrey's "arc between two deaths": a pendulum swinging between
   standing still (balance) and lying still (the fall). Drawn as a computed arc. */
function diaArc() {
  const L = {
    title:{zh:'韓福瑞的「兩個死亡之間的弧線」', en:'Humphrey’s “arc between two deaths”', fr:'L’« arc entre deux morts » de Humphrey'},
    a:{zh:'完全平衡：靜止、不動', en:'Perfect balance: stillness', fr:'Équilibre parfait : immobilité'},
    b:{zh:'完全倒下：躺在地上', en:'Complete fall: lying down', fr:'Chute complète : allongé'},
    m:{zh:'舞蹈發生在中間：失衡（fall）→ 懸浮（suspension）→ 恢復（recovery）', en:'Dance happens in between: fall → suspension → recovery', fr:'La danse se joue entre les deux : chute → suspension → rétablissement'},
  };
  const cx = 300, cy = 210, r = 160;
  let d = '';
  for (let i = 0; i <= 60; i++) {
    const a = -Math.PI / 2 + (i / 60) * (Math.PI / 2);   /* from top to right side */
    d += (i ? ' L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);
  }
  const fig = (x, y, ang) => {
    const rad = ang * Math.PI / 180, ex = x + (r - 22) * Math.sin(rad), ey = y - (r - 22) * Math.cos(rad);
    return `<line x1="${x}" y1="${y}" x2="${ex}" y2="${ey}" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/><circle cx="${ex + 9 * Math.sin(rad)}" cy="${ey - 9 * Math.cos(rad)}" r="8" fill="#5eead4"/>`;
  };
  return `<svg class="dg" viewBox="0 0 900 260" role="img" aria-label="${t(L.title)}">
    <text x="0" y="22" class="lab">${t(L.title)}</text>
    <line x1="120" y1="${cy}" x2="560" y2="${cy}" stroke="#475569"/>
    <path d="${d}" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    ${fig(cx, cy, 0)}${fig(cx, cy, 30)}${fig(cx, cy, 60)}
    <line x1="${cx + 10}" y1="${cy - 6}" x2="${cx + r - 14}" y2="${cy - 6}" stroke="#5eead4" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <text x="${cx}" y="${cy - r - 14}" text-anchor="middle" class="val">${t(L.a)}</text>
    <text x="${cx + r + 16}" y="${cy + 4}" class="val">${t(L.b)}</text>
    <text x="0" y="248" class="sub">${t(L.m)}</text></svg>`;
}

  h2:{zh:'脊椎與地板：在家可以做的六個練習', en:'Spine and floor: six exercises for home', fr:'Colonne et sol : six exercices à la maison'},
  blocks:[
  { type:'steps', items:[
    { t:{zh:'建構式休息位（5 分鐘）', en:'Constructive rest (5 min)', fr:'Repos constructif (5 min)'}, p:{zh:'仰躺、雙膝彎曲腳掌踩地、膝蓋互相靠著。閉眼、慢慢吐氣，感覺背部每一節脊椎落到地板上。這是 Release 技巧的起點。', en:'Lie on your back, knees bent, feet on the floor, knees leaning together. Close your eyes, exhale slowly, and feel each vertebra settle onto the floor. The starting point of release technique.', fr:'Allongé sur le dos, genoux pliés, pieds au sol, genoux appuyés l’un contre l’autre. Yeux fermés, expirez lentement et sentez chaque vertèbre se déposer. Le point de départ du release.'} },
    { t:{zh:'站姿捲下與捲上（Roll down / up）', en:'Roll down and roll up', fr:'Enroulé et déroulé'}, p:{zh:'站直、膝蓋放鬆。從頭頂開始，下巴收、頸椎一節一節往下捲，經過胸椎、腰椎，最後掛在髖上像布娃娃（8 拍）。再從尾椎開始一節一節往上疊回來，頭最後抬起（8 拍）。', en:'Stand tall, knees soft. Starting from the crown, tuck the chin and roll down vertebra by vertebra through neck, ribs and lower back until you hang from the hips like a rag doll (8 counts). Then restack from the tailbone up, the head arriving last (8 counts).', fr:'Debout, genoux souples. Depuis le sommet du crâne, rentrez le menton et enroulez vertèbre par vertèbre jusqu’à pendre depuis les hanches comme une poupée de chiffon (8 temps). Puis déroulez depuis le coccyx, la tête arrivant en dernier (8 temps).'} },
    { t:{zh:'坐姿 Graham 收縮', en:'Seated Graham contraction', fr:'Contraction Graham assise'}, p:{zh:'盤腿坐（腳掌相對），背部挺直。吐氣：骨盆往後捲、肚臍往脊椎深深收、背部變成 C 字，視線往下（4 拍）。吸氣：從尾椎開始延伸回到直立（4 拍）。做 8 次，感覺動作從腹部中心發出。', en:'Sit with the soles of the feet together, back tall. Exhale: curl the pelvis back, draw the navel deep to the spine, round into a C, eyes down (4 counts). Inhale: lengthen back up from the tailbone (4 counts). Eight times, feeling the movement start in the centre.', fr:'Assis plantes de pieds jointes, dos droit. Expirez : bassin enroulé, nombril vers la colonne, dos en C, regard bas (4 temps). Inspirez : déroulez depuis le coccyx (4 temps). Huit fois, en sentant le mouvement naître du centre.'} },
    { t:{zh:'側滾（Log roll 到屈膝滾）', en:'Side rolls (log roll to bent-knee roll)', fr:'Roulades latérales (bûche puis genoux pliés)'}, p:{zh:'仰躺、雙手舉過頭，像圓木一樣往一邊滾（4 拍），再滾回（4 拍）。接著屈膝版：雙膝抱胸，從髖帶動往側邊滾到四足跪姿再回來。重點是讓身體柔軟地接觸地板，不要「撞」下去。', en:'Lying with arms overhead, roll to one side like a log (4 counts) and back (4 counts). Then the bent-knee version: knees to chest, let the hips lead the roll onto all fours and back. Meet the floor softly; never drop onto it.', fr:'Allongé bras au-dessus de la tête, roulez comme une bûche d’un côté (4 temps) puis revenez (4 temps). Puis genoux pliés : genoux contre la poitrine, les hanches mènent la roulade jusqu’à quatre pattes et retour. Rencontrez le sol en douceur, sans tomber dessus.'} },
    { t:{zh:'螺旋下地板與起身', en:'Spiral down and up', fr:'Descendre et remonter en spirale'}, p:{zh:'站姿，右腳往左後方交叉，雙膝彎曲，身體向右轉，像螺絲一樣往下旋，臀部外側先著地，順勢側躺（8 拍）。起身時反向：手推地、膝蓋跪、轉回站立（8 拍）。左右各做四次，越熟越不需要用手。', en:'Standing, cross the right foot behind to the left, bend both knees and twist to the right, screwing down until the outer hip touches the floor, then roll onto your side (8 counts). Reverse to get up: push with the hand, come to the knees, spiral back to standing (8 counts). Four each side; with practice the hands matter less.', fr:'Debout, croisez le pied droit derrière à gauche, fléchissez et tournez à droite en vissant vers le bas jusqu’à poser la hanche, puis allongez-vous sur le côté (8 temps). Remontez à l’inverse : main au sol, genoux, spirale jusqu’à debout (8 temps). Quatre de chaque côté ; avec le temps, les mains servent moins.'} },
    { t:{zh:'擺盪（Swing）', en:'Swings', fr:'Swings'}, p:{zh:'雙腳與髖同寬，手臂舉高。吐氣讓手臂與上半身往下掉、膝蓋彎曲（1），利用反彈往上甩到另一側高點並在最高點停留一瞬（2 & 懸浮），再落下。用 3/4 拍音樂做，感受「失衡、懸浮、恢復」。', en:'Feet hip-width, arms high. Exhale and let arms and torso drop as the knees bend (1), use the rebound to swing up to the other high point and hang there for an instant (2 & suspension), then drop again. Do it to 3/4 music and feel fall, suspension, recovery.', fr:'Pieds largeur de hanches, bras en haut. Expirez, laissez tomber bras et buste en fléchissant (1), profitez du rebond pour remonter de l’autre côté et suspendez un instant (2 et suspension), puis retombez. Sur une musique à 3/4 : chute, suspension, rétablissement.'} },
  ]},
  { type:'warn', p:{
    zh:'地板練習時，膝蓋、髖骨與肩膀這些骨頭突出的地方不要直接撞地，要用肌肉較多的部位（臀部外側、大腿外側、背部肌肉）去承接重量。初學者可以戴護膝。',
    en:'On the floor, never land on bony points such as knees, hip bones or shoulders; take the weight on fleshy areas such as the outer hip, outer thigh and back muscles. Beginners can wear knee pads.',
    fr:'Au sol, ne tombez jamais sur les points osseux (genoux, hanches, épaules) ; recevez le poids sur les zones charnues (côté de la hanche, extérieur de la cuisse, muscles du dos). Des genouillères aident au début.'} },
]},

/* ── 5. Improvisation ── */
{ id:'improv', i:'fa-shuffle', c:Y,
  nav:{zh:'即興', en:'Improvisation', fr:'Improvisation'},
  eyebrow:{zh:'第五章・教學', en:'Chapter 5 · Lessons', fr:'Chapitre 5 · Leçons'},
  h2:{zh:'即興練習：找到自己的動作', en:'Improvisation: finding your own movement', fr:'Improvisation : trouver son propre mouvement'},
  blocks:[
  { type:'cards', cols:3, items:[
    { i:'fa-signature', t:{zh:'用身體寫字', en:'Write with your body', fr:'Écrire avec le corps'}, p:{zh:'用右手在空中寫自己的名字，再換成手肘、頭、膝蓋、骨盆來寫。字越大，動作越完整。', en:'Write your name in the air with your right hand, then with an elbow, head, knee, pelvis. The bigger the letters, the fuller the movement.', fr:'Écrivez votre prénom dans l’air avec la main droite, puis le coude, la tête, le genou, le bassin. Plus les lettres sont grandes, plus le mouvement est ample.'} },
    { i:'fa-cubes', t:{zh:'改變力效', en:'Change the Effort', fr:'Changer d’Effort'}, p:{zh:'選一個簡單動作（例如舉手），用八種基本動作的質感各做一次：出拳、漂浮、扭絞……同一個動作會變成完全不同的意思。', en:'Take one simple gesture (raising an arm) and do it in each of the eight actions: punch, float, wring… The same gesture takes on new meanings.', fr:'Prenez un geste simple (lever le bras) et faites-le dans chacune des huit actions : frapper, flotter, tordre… Le même geste change de sens.'} },
    { i:'fa-clone', t:{zh:'鏡像雙人', en:'Mirror duet', fr:'Duo miroir'}, p:{zh:'兩人面對面，一人慢慢動、另一人像鏡子一樣同步。一分鐘後交換，最後試著不決定誰帶領。', en:'Face a partner; one moves slowly while the other mirrors. Swap after a minute, then try with no leader at all.', fr:'Face à face, l’un bouge lentement, l’autre fait miroir. On échange après une minute, puis on essaie sans meneur.'} },
    { i:'fa-weight-hanging', t:{zh:'分享重量', en:'Sharing weight', fr:'Partager le poids'}, p:{zh:'兩人背靠背坐下，慢慢互相推著一起站起來、再坐下。這是接觸即興的第一步。', en:'Sit back to back, then push into each other to stand up together and sit down again. The first step of contact improvisation.', fr:'Assis dos à dos, poussez l’un contre l’autre pour vous lever ensemble puis vous rasseoir. Le premier pas du contact.'} },
    { i:'fa-image', t:{zh:'意象', en:'Imagery', fr:'Images'}, p:{zh:'想像身體裡充滿蜂蜜、空氣或沙子，或地板變成冰、熱沙、彈簧床，讓想像改變動作。', en:'Imagine your body full of honey, air or sand, or the floor turning to ice, hot sand or a trampoline, and let it change how you move.', fr:'Imaginez votre corps rempli de miel, d’air ou de sable, ou le sol devenu glace, sable brûlant ou trampoline, et laissez l’image transformer le mouvement.'} },
    { i:'fa-stopwatch', t:{zh:'限制與規則', en:'Constraints', fr:'Contraintes'}, p:{zh:'規定「只能用一隻手接觸地板」「每 8 拍必須停一次」「只能往後移動」。限制反而會激發新動作。', en:'Set rules: “only one hand may touch the floor”, “stop every 8 counts”, “only travel backwards”. Constraints spark new movement.', fr:'Fixez des règles : « une seule main au sol », « s’arrêter tous les 8 temps », « se déplacer seulement en arrière ». La contrainte stimule l’invention.'} },
  ]},
  { type:'note', p:{
    zh:'怎麼看當代舞作品：不需要「看懂」故事。可以問自己：身體在做什麼（動作）、在哪裡做（空間）、怎麼做（力效）、和誰一起（關係）、讓我感覺到什麼。',
    en:'How to watch a contemporary piece: you do not need to “understand” a story. Ask: what are the bodies doing (action), where (space), how (Effort), with whom (relationship), and what does it make me feel?',
    fr:'Regarder une pièce contemporaine : inutile de « comprendre » une histoire. Demandez-vous ce que font les corps (action), où (espace), comment (Effort), avec qui (relation), et ce que vous ressentez.'} },
]},
]});
